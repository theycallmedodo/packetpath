      "title": "Nie ten kierunek — zależności",
      "skills": [
        "encor.span.case-01",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.case-01.4.card",
      "front_md": "SPAN kopiuje tylko rx z portu serwera, a operator szuka pakietów wysyłanych przez switch do serwera.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Rx i tx w SPAN odnoszą się do kierunku na obserwowanym porcie switcha.\n\n**Rozpoznanie:** Wybrany kierunek mirroringu nie obejmuje badanego ruchu.\n\n**Działanie:** Dobrać tx lub both dla źródła SPAN zgodnie z celem analizy.\n\n**Sprawdzenie:** Przechwycenie zawiera pakiety kierowane do serwera.",
      "example": "Rx i tx w SPAN odnoszą się do kierunku na obserwowanym porcie switcha."
    },
    {
      "revision": 1,
      "title": "Przeciążony destination — zależności",
      "skills": [
        "encor.span.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.case-02.4.card",
      "front_md": "SPAN kopiuje dwa źródła 1 Gb/s na jeden port 1 Gb/s. Pod obciążeniem brakuje pakietów w capture.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "SPAN może gubić kopie bez odpowiadającej temu utraty ruchu produkcyjnego.\n\n**Rozpoznanie:** Port docelowy nie mieści sumy kopiowanego ruchu.\n\n**Działanie:** Ograniczyć źródła lub użyć wydajniejszej drogi przechwytywania.\n\n**Sprawdzenie:** Przy dopasowanym wolumenie znikają straty związane z przepełnieniem mirroringu.",
      "example": "SPAN może gubić kopie bez odpowiadającej temu utraty ruchu produkcyjnego."
    },
    {
      "revision": 1,
      "title": "RSPAN VLAN — zależności",
      "skills": [
        "encor.span.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.case-03.4.card",
      "front_md": "Źródło i odbiorca RSPAN są na różnych switchach, a VLAN RSPAN nie jest dozwolony na pośrednim trunku.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "RSPAN wymaga spójnego transportu dedykowanego VLAN.\n\n**Rozpoznanie:** Transport warstwy drugiej nie przenosi kopii RSPAN.\n\n**Działanie:** Dopuścić właściwy remote-span VLAN na wymaganej trasie.\n\n**Sprawdzenie:** Kopie docierają przez wszystkie pośrednie trunki do sesji docelowej.",
      "example": "RSPAN wymaga spójnego transportu dedykowanego VLAN."
    },
    {
      "revision": 1,
      "title": "ERSPAN routing — zależności",
      "skills": [
        "encor.span.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.case-04.4.card",
      "front_md": "Sesja ERSPAN ma nieosiągalny docelowy adres IP kolektora.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "ERSPAN korzysta z transportu IP, więc wymaga osiągalności końca tunelu.\n\n**Rozpoznanie:** Brakuje routingu transportowego dla kopii ERSPAN.\n\n**Działanie:** Zapewnić trasę i wymagane dopuszczenia do odbiorcy ERSPAN.\n\n**Sprawdzenie:** Pakiety enkapsulowane docierają do poprawnego adresu kolektora.",
      "example": "ERSPAN korzysta z transportu IP, więc wymaga osiągalności końca tunelu."
    },
    {
      "revision": 1,
      "title": "Zły port źródłowy — zależności",
      "skills": [
        "encor.span.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.case-05.4.card",
      "front_md": "Capture działa, ale kopiuje Gi1/0/5; badana usługa przechodzi przez Gi1/0/6.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Poprawna sesja mirroringu nie gwarantuje obserwowania właściwego przepływu.\n\n**Rozpoznanie:** Sesja obserwuje niewłaściwe źródło.\n\n**Działanie:** Zmienić source SPAN na port lub VLAN rzeczywiście niosący usługę.\n\n**Sprawdzenie:** Kontrolny ruch badanej usługi pojawia się w przechwyceniu.",
      "example": "Poprawna sesja mirroringu nie gwarantuje obserwowania właściwego przepływu."
    },
    {
      "revision": 1,
      "title": "Kopia to nie blokada — zależności",
      "skills": [
        "encor.span.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.case-06.4.card",
      "front_md": "Operator dodaje sesję SPAN, aby zatrzymać podejrzany ruch, lecz ruch nadal jest przekazywany.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Monitoring i egzekwowanie polityki bezpieczeństwa mają różne funkcje.\n\n**Rozpoznanie:** SPAN kopiuje ruch do obserwacji, nie jest filtrem blokującym.\n\n**Działanie:** Użyć właściwej polityki bezpieczeństwa do blokady, a SPAN do analizy.\n\n**Sprawdzenie:** Kontrolowany filtr blokuje ruch, niezależnie od obecności sesji mirroringu.",
      "example": "Monitoring i egzekwowanie polityki bezpieczeństwa mają różne funkcje."
    }
  ],
