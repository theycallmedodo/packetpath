    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — rozpoznanie",
      "skills": [
        "encor.span.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nSPAN kopiuje tylko rx z portu serwera, a operator szuka pakietów wysyłanych przez switch do serwera.\n\n**Zgłoszenie II**\n\nSPAN kopiuje dwa źródła 1 Gb/s na jeden port 1 Gb/s. Pod obciążeniem brakuje pakietów w capture.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Wybrany kierunek mirroringu nie obejmuje badanego ruchu. Dobrać tx lub both dla źródła SPAN zgodnie z celem analizy.\n\n**Sprawdzenie I:** Przechwycenie zawiera pakiety kierowane do serwera.\n\n**Zgłoszenie II:** Port docelowy nie mieści sumy kopiowanego ruchu. Ograniczyć źródła lub użyć wydajniejszej drogi przechwytywania.\n\n**Sprawdzenie II:** Przy dopasowanym wolumenie znikają straty związane z przepełnieniem mirroringu.\n\n**Zależności:** Rx i tx w SPAN odnoszą się do kierunku na obserwowanym porcie switcha. SPAN może gubić kopie bez odpowiadającej temu utraty ruchu produkcyjnego.",
      "example": "I — Wybrany kierunek mirroringu nie obejmuje badanego ruchu.\n\nII — Port docelowy nie mieści sumy kopiowanego ruchu."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "encor.span.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nŹródło i odbiorca RSPAN są na różnych switchach, a VLAN RSPAN nie jest dozwolony na pośrednim trunku.\n\n**Zgłoszenie II**\n\nSesja ERSPAN ma nieosiągalny docelowy adres IP kolektora.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Transport warstwy drugiej nie przenosi kopii RSPAN. Dopuścić właściwy remote-span VLAN na wymaganej trasie.\n\n**Sprawdzenie I:** Kopie docierają przez wszystkie pośrednie trunki do sesji docelowej.\n\n**Zgłoszenie II:** Brakuje routingu transportowego dla kopii ERSPAN. Zapewnić trasę i wymagane dopuszczenia do odbiorcy ERSPAN.\n\n**Sprawdzenie II:** Pakiety enkapsulowane docierają do poprawnego adresu kolektora.\n\n**Zależności:** RSPAN wymaga spójnego transportu dedykowanego VLAN. ERSPAN korzysta z transportu IP, więc wymaga osiągalności końca tunelu.",
      "example": "I — Transport warstwy drugiej nie przenosi kopii RSPAN.\n\nII — Brakuje routingu transportowego dla kopii ERSPAN."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "encor.span.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst9600/software/release/17-3/configuration_guide/nmgmt/b_173_nmgmt_9600_cg/configuring_span_and_rspan.html"
        },
        {
          "title": "Dokumentacja Cisco — SPAN, RSPAN i ERSPAN — obserwacja ruchu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/lan-wan/b-lan-wan/m_lnsw-conf-erspan.html"
        }
      ],
      "id": "encor.span.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nCapture działa, ale kopiuje Gi1/0/5; badana usługa przechodzi przez Gi1/0/6.\n\n**Zgłoszenie II**\n\nOperator dodaje sesję SPAN, aby zatrzymać podejrzany ruch, lecz ruch nadal jest przekazywany.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Sesja obserwuje niewłaściwe źródło. Zmienić source SPAN na port lub VLAN rzeczywiście niosący usługę.\n\n**Sprawdzenie I:** Kontrolny ruch badanej usługi pojawia się w przechwyceniu.\n\n**Zgłoszenie II:** SPAN kopiuje ruch do obserwacji, nie jest filtrem blokującym. Użyć właściwej polityki bezpieczeństwa do blokady, a SPAN do analizy.\n\n**Sprawdzenie II:** Kontrolowany filtr blokuje ruch, niezależnie od obecności sesji mirroringu.\n\n**Zależności:** Poprawna sesja mirroringu nie gwarantuje obserwowania właściwego przepływu. Monitoring i egzekwowanie polityki bezpieczeństwa mają różne funkcje.",
      "example": "I — Sesja obserwuje niewłaściwe źródło.\n\nII — SPAN kopiuje ruch do obserwacji, nie jest filtrem blokującym."
    },
