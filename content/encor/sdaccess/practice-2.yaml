      "title": "Control-plane mapping — działanie",
      "skills": [
        "encor.sdaccess.case-01",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.case-01.2.card",
      "front_md": "Endpoint przeniósł się na inny fabric edge, ale badana mapa nadal wskazuje starą lokalizację.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Control-plane fabric wiąże tożsamość endpointu z jego aktualną lokalizacją.\n\n**Rozpoznanie:** Informacja o lokalizacji endpointu jest nieaktualna.\n\n**Działanie:** Sprawdzić rejestrację endpointu i aktualizację mapowania control-plane.\n\n**Sprawdzenie:** Mapa endpointu wskazuje bieżący fabric edge.",
      "example": "Sprawdzić rejestrację endpointu i aktualizację mapowania control-plane."
    },
    {
      "revision": 1,
      "title": "VN isolation — działanie",
      "skills": [
        "encor.sdaccess.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.case-02.2.card",
      "front_md": "Dwa endpointy w różnych virtual networks nie komunikują się, a polityka nie przewiduje połączenia tych VN.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Virtual network wyznacza oddzielny kontekst sieciowy fabric.\n\n**Rozpoznanie:** Działa makrosegmentacja między virtual networks.\n\n**Działanie:** Zweryfikować zamierzoną separację lub zaprojektować kontrolowany dostęp między VN.\n\n**Sprawdzenie:** Niepowiązane VN pozostają izolowane, a ewentualny wyjątek jest jawny.",
      "example": "Zweryfikować zamierzoną separację lub zaprojektować kontrolowany dostęp między VN."
    },
    {
      "revision": 1,
      "title": "SGT policy — działanie",
      "skills": [
        "encor.sdaccess.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.case-03.2.card",
      "front_md": "Endpointy są w tej samej VN, lecz macierz polityk zabrania komunikacji między ich SGT.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Mikrosegmentacja może ograniczać ruch wewnątrz jednej VN.\n\n**Rozpoznanie:** Ruch jest ograniczony polityką grup bezpieczeństwa.\n\n**Działanie:** Sprawdzić przypisanie SGT i regułę między konkretnymi grupami.\n\n**Sprawdzenie:** Dozwolona para działa, a zabroniona pozostaje zablokowana.",
      "example": "Sprawdzić przypisanie SGT i regułę między konkretnymi grupami."
    },
    {
      "revision": 1,
      "title": "Border do zewnątrz — działanie",
      "skills": [
        "encor.sdaccess.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.case-04.2.card",
      "front_md": "Endpoint działa w fabric, ale brak wymaganej trasy z border do zewnętrznej usługi.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Fabric border łączy domenę fabric ze światem zewnętrznym.\n\n**Rozpoznanie:** Nie zapewniono wyjścia z fabric do zewnętrznej sieci.\n\n**Działanie:** Zweryfikować handoff, routing i drogę powrotną na border.\n\n**Sprawdzenie:** Ruch usługi opuszcza fabric przez właściwy border i wraca do endpointu.",
      "example": "Zweryfikować handoff, routing i drogę powrotną na border."
    },
    {
      "revision": 1,
      "title": "Underlay niedostępny — działanie",
      "skills": [
        "encor.sdaccess.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.case-05.2.card",
      "front_md": "Loopback fabric edge nie jest osiągalny w underlay, choć endpoint jest fizycznie podłączony.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Overlay fabric wymaga sprawnego underlay.\n\n**Rozpoznanie:** Transport IP fabric jest uszkodzony.\n\n**Działanie:** Przywrócić osiągalność infrastruktury underlay.\n\n**Sprawdzenie:** Loopbacki infrastruktury są osiągalne i overlay może użyć ścieżki.",
      "example": "Przywrócić osiągalność infrastruktury underlay."
    },
    {
      "revision": 1,
      "title": "Onboarding — działanie",
      "skills": [
        "encor.sdaccess.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.case-06.2.card",
      "front_md": "Port działa, ale endpoint nie otrzymuje zamierzonej tożsamości i polityki po nieudanym uwierzytelnieniu.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Dostęp fizyczny i przypisanie logicznej polityki endpointu to różne etapy.\n\n**Rozpoznanie:** Nie zakończył się proces przypisania endpointu do właściwego profilu dostępu.\n\n**Działanie:** Sprawdzić uwierzytelnienie, autoryzację i wynik przypisania polityki.\n\n**Sprawdzenie:** Endpoint ma oczekiwany profil, VN i SGT zgodnie z projektem.",
      "example": "Sprawdzić uwierzytelnienie, autoryzację i wynik przypisania polityki."
    }
