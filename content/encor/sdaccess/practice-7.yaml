        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nEndpoint przeniósł się na inny fabric edge, ale badana mapa nadal wskazuje starą lokalizację.\n\n**Zgłoszenie II**\n\nDwa endpointy w różnych virtual networks nie komunikują się, a polityka nie przewiduje połączenia tych VN.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Informacja o lokalizacji endpointu jest nieaktualna. Sprawdzić rejestrację endpointu i aktualizację mapowania control-plane.\n\n**Sprawdzenie I:** Mapa endpointu wskazuje bieżący fabric edge.\n\n**Zgłoszenie II:** Działa makrosegmentacja między virtual networks. Zweryfikować zamierzoną separację lub zaprojektować kontrolowany dostęp między VN.\n\n**Sprawdzenie II:** Niepowiązane VN pozostają izolowane, a ewentualny wyjątek jest jawny.\n\n**Zależności:** Control-plane fabric wiąże tożsamość endpointu z jego aktualną lokalizacją. Virtual network wyznacza oddzielny kontekst sieciowy fabric.",
      "example": "I — Mapa endpointu wskazuje bieżący fabric edge.\n\nII — Niepowiązane VN pozostają izolowane, a ewentualny wyjątek jest jawny."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "encor.sdaccess.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nEndpointy są w tej samej VN, lecz macierz polityk zabrania komunikacji między ich SGT.\n\n**Zgłoszenie II**\n\nEndpoint działa w fabric, ale brak wymaganej trasy z border do zewnętrznej usługi.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Ruch jest ograniczony polityką grup bezpieczeństwa. Sprawdzić przypisanie SGT i regułę między konkretnymi grupami.\n\n**Sprawdzenie I:** Dozwolona para działa, a zabroniona pozostaje zablokowana.\n\n**Zgłoszenie II:** Nie zapewniono wyjścia z fabric do zewnętrznej sieci. Zweryfikować handoff, routing i drogę powrotną na border.\n\n**Sprawdzenie II:** Ruch usługi opuszcza fabric przez właściwy border i wraca do endpointu.\n\n**Zależności:** Mikrosegmentacja może ograniczać ruch wewnątrz jednej VN. Fabric border łączy domenę fabric ze światem zewnętrznym.",
      "example": "I — Dozwolona para działa, a zabroniona pozostaje zablokowana.\n\nII — Ruch usługi opuszcza fabric przez właściwy border i wraca do endpointu."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "encor.sdaccess.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-sda-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-Access — fabric, segmentacja i dostęp zewnętrzny",
          "url": "https://www.cisco.com/c/en/us/td/docs/cloud-systems-management/network-automation-and-management/catalyst-center/cisco-validated-solution-profiles/validated-profile-manufacturing-sd-access.html"
        }
      ],
      "id": "encor.sdaccess.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nLoopback fabric edge nie jest osiągalny w underlay, choć endpoint jest fizycznie podłączony.\n\n**Zgłoszenie II**\n\nPort działa, ale endpoint nie otrzymuje zamierzonej tożsamości i polityki po nieudanym uwierzytelnieniu.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Transport IP fabric jest uszkodzony. Przywrócić osiągalność infrastruktury underlay.\n\n**Sprawdzenie I:** Loopbacki infrastruktury są osiągalne i overlay może użyć ścieżki.\n\n**Zgłoszenie II:** Nie zakończył się proces przypisania endpointu do właściwego profilu dostępu. Sprawdzić uwierzytelnienie, autoryzację i wynik przypisania polityki.\n\n**Sprawdzenie II:** Endpoint ma oczekiwany profil, VN i SGT zgodnie z projektem.\n\n**Zależności:** Overlay fabric wymaga sprawnego underlay. Dostęp fizyczny i przypisanie logicznej polityki endpointu to różne etapy.",
      "example": "I — Loopbacki infrastruktury są osiągalne i overlay może użyć ścieżki.\n\nII — Endpoint ma oczekiwany profil, VN i SGT zgodnie z projektem."
    },
