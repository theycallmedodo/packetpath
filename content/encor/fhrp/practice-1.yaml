          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/fhrp/fhrp-configuration-guide/vrrp.html"
        }
      ],
      "id": "encor.fhrp.practice.case-04.1.card",
      "front_md": "Router VRRP jest właścicielem adresu wirtualnego i ma priority 255.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "W VRRP priorytet 255 jest związany z właścicielem adresu.\n\n**Rozpoznanie:** Właściciel adresu ma specjalny najwyższy priorytet VRRP.\n\n**Działanie:** Uwzględnić rolę owner przy analizie wyboru Master.\n\n**Sprawdzenie:** Stan i priorytet odpowiadają routerowi posiadającemu adres VIP.",
      "example": "Właściciel adresu ma specjalny najwyższy priorytet VRRP."
    },
