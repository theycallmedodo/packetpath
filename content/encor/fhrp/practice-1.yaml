        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fhp-hsrp-0.html"
        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/fhrp/fhrp-configuration-guide/vrrp.html"
        }
      ],
      "id": "encor.fhrp.practice.case-03.1.card",
      "front_md": "Na wspólnym LAN R1 używa HSRPv1, R2 HSRPv2 dla zamierzonej pary.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Wersja protokołu jest częścią zgodności konfiguracji FHRP.\n\n**Rozpoznanie:** Routery używają niezgodnych wersji protokołu grupy.\n\n**Działanie:** Ujednolicić wersję i parametry grupy na obu końcach.\n\n**Sprawdzenie:** Routery widzą się w tej samej grupie i uzgadniają role.",
      "example": "Routery używają niezgodnych wersji protokołu grupy."
    },
