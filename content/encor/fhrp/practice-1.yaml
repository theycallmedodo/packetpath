      "id": "encor.fhrp.practice.case-01.1.card",
      "front_md": "R1 priority 120, R2 priority 100 z preempt. Awaria track na R1 odejmuje tylko 10.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Tracking musi zmienić relację priorytetów, nie tylko obniżyć liczbę.\n\n**Rozpoznanie:** R1 nadal ma priorytet 110, większy od R2.\n\n**Działanie:** Dobrać decrement tak, by po awarii R1 miał priorytet mniejszy niż 100.\n\n**Sprawdzenie:** Po awarii zdrowy R2 przejmuje rolę Active.",
      "example": "R1 nadal ma priorytet 110, większy od R2."
    },
