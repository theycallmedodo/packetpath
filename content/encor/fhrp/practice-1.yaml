      "id": "encor.fhrp.practice.case-06.1.card",
      "front_md": "ACL blokuje komunikaty HSRP między routerami, choć zwykły unicast między ich IP działa.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Test unicast nie potwierdza przejścia multicastowego ruchu kontrolnego FHRP.\n\n**Rozpoznanie:** Polityka filtruje ruch protokołu redundancji.\n\n**Działanie:** Dopuścić wymagane komunikaty HSRP między uprawnionymi członkami.\n\n**Sprawdzenie:** Hello są odbierane i grupa utrzymuje właściwe role.",
      "example": "Polityka filtruje ruch protokołu redundancji."
    }
