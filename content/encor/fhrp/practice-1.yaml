      "id": "encor.fhrp.practice.case-02.1.card",
      "front_md": "Po restarcie router przejmuje VIP przed odbudową potrzebnych tras, powodując krótką przerwę.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Gotowość interfejsu LAN nie oznacza gotowości całej ścieżki przekazywania.\n\n**Rozpoznanie:** Przejęcie roli następuje przed gotowością routingu.\n\n**Działanie:** Zastosować uzasadnione opóźnienie preempt i kontrolę dostępności.\n\n**Sprawdzenie:** Router przejmuje rolę dopiero po ustabilizowaniu wymaganych zależności.",
      "example": "Przejęcie roli następuje przed gotowością routingu."
    },
