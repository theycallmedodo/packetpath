      "id": "encor.fhrp.practice.case-05.1.card",
      "front_md": "R1 jest Active grupy 10, R2 grupy 20; hosty rozdzielono między dwa VIP.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "HSRP może rozdzielać aktywne role między grupami, nie równoważy automatycznie każdego pakietu jednego VIP.\n\n**Rozpoznanie:** Obciążenie jest dzielone przez różne grupy wirtualnych bram.\n\n**Działanie:** Sprawdzać każdą grupę i jej awaryjne przejęcie niezależnie.\n\n**Sprawdzenie:** Każdy VIP ma właściwy aktywny router i działający backup.",
      "example": "Obciążenie jest dzielone przez różne grupy wirtualnych bram."
    },
