          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fhp-hsrp-0.html"
        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/fhrp/fhrp-configuration-guide/vrrp.html"
        }
      ],
      "id": "encor.fhrp.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nR1 priority 120, R2 priority 100 z preempt. Awaria track na R1 odejmuje tylko 10.\n\n**Zgłoszenie II**\n\nPo restarcie router przejmuje VIP przed odbudową potrzebnych tras, powodując krótką przerwę.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** R1 nadal ma priorytet 110, większy od R2. Dobrać decrement tak, by po awarii R1 miał priorytet mniejszy niż 100.\n\n**Sprawdzenie I:** Po awarii zdrowy R2 przejmuje rolę Active.\n\n**Zgłoszenie II:** Przejęcie roli następuje przed gotowością routingu. Zastosować uzasadnione opóźnienie preempt i kontrolę dostępności.\n\n**Sprawdzenie II:** Router przejmuje rolę dopiero po ustabilizowaniu wymaganych zależności.\n\n**Zależności:** Tracking musi zmienić relację priorytetów, nie tylko obniżyć liczbę. Gotowość interfejsu LAN nie oznacza gotowości całej ścieżki przekazywania.",
      "example": "I — R1 nadal ma priorytet 110, większy od R2.\n\nII — Przejęcie roli następuje przed gotowością routingu."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "encor.fhrp.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fhp-hsrp-0.html"
        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/fhrp/fhrp-configuration-guide/vrrp.html"
        }
      ],
      "id": "encor.fhrp.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nNa wspólnym LAN R1 używa HSRPv1, R2 HSRPv2 dla zamierzonej pary.\n\n**Zgłoszenie II**\n\nRouter VRRP jest właścicielem adresu wirtualnego i ma priority 255.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Routery używają niezgodnych wersji protokołu grupy. Ujednolicić wersję i parametry grupy na obu końcach.\n\n**Sprawdzenie I:** Routery widzą się w tej samej grupie i uzgadniają role.\n\n**Zgłoszenie II:** Właściciel adresu ma specjalny najwyższy priorytet VRRP. Uwzględnić rolę owner przy analizie wyboru Master.\n\n**Sprawdzenie II:** Stan i priorytet odpowiadają routerowi posiadającemu adres VIP.\n\n**Zależności:** Wersja protokołu jest częścią zgodności konfiguracji FHRP. W VRRP priorytet 255 jest związany z właścicielem adresu.",
      "example": "I — Routery używają niezgodnych wersji protokołu grupy.\n\nII — Właściciel adresu ma specjalny najwyższy priorytet VRRP."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "encor.fhrp.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fhp-hsrp-0.html"
        },
        {
          "title": "Dokumentacja Cisco — HSRP i VRRP — wybór bramy i awarie",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/fhrp/fhrp-configuration-guide/vrrp.html"
        }
      ],
      "id": "encor.fhrp.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nR1 jest Active grupy 10, R2 grupy 20; hosty rozdzielono między dwa VIP.\n\n**Zgłoszenie II**\n\nACL blokuje komunikaty HSRP między routerami, choć zwykły unicast między ich IP działa.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Obciążenie jest dzielone przez różne grupy wirtualnych bram. Sprawdzać każdą grupę i jej awaryjne przejęcie niezależnie.\n\n**Sprawdzenie I:** Każdy VIP ma właściwy aktywny router i działający backup.\n\n**Zgłoszenie II:** Polityka filtruje ruch protokołu redundancji. Dopuścić wymagane komunikaty HSRP między uprawnionymi członkami.\n\n**Sprawdzenie II:** Hello są odbierane i grupa utrzymuje właściwe role.\n\n**Zależności:** HSRP może rozdzielać aktywne role między grupami, nie równoważy automatycznie każdego pakietu jednego VIP. Test unicast nie potwierdza przejścia multicastowego ruchu kontrolnego FHRP.",
      "example": "I — Obciążenie jest dzielone przez różne grupy wirtualnych bram.\n\nII — Polityka filtruje ruch protokołu redundancji."
    },
