      "title": "Dwa zgłoszenia 1 — weryfikacja",
      "skills": [
        "encor.eem.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nApplet oczekuje konkretnego wzorca syslog, ale rzeczywisty komunikat ma inną treść.\n\n**Zgłoszenie II**\n\nApplet jest wyzwalany, lecz wykonanie komendy CLI kończy się odmową AAA.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Warunek zdarzenia nie dopasowuje rzeczywistego logu. Dopasować wzorzec do zweryfikowanego komunikatu bez nadmiernego rozszerzenia.\n\n**Sprawdzenie I:** Kontrolny pasujący log uruchamia applet, a niepowiązany go nie uruchamia.\n\n**Zgłoszenie II:** Kontekst wykonania nie ma wymaganej autoryzacji. Zapewnić właściwą tożsamość i minimalne potrzebne uprawnienia dla polityki.\n\n**Sprawdzenie II:** Log wykonania potwierdza ukończenie dozwolonej komendy.\n\n**Zależności:** EEM reaguje na skonfigurowany detektor, nie na ogólny zamiar administratora. Automatyzacja zdarzeń podlega mechanizmom uprawnień urządzenia.",
      "example": "I — Kontrolny pasujący log uruchamia applet, a niepowiązany go nie uruchamia.\n\nII — Log wykonania potwierdza ukończenie dozwolonej komendy."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "encor.eem.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nApplet reaguje na log o zmianie interfejsu, sam zmienia ten interfejs i generuje kolejny pasujący log.\n\n**Zgłoszenie II**\n\nAkcja zbierania danych przekracza dozwolony czas wykonania i jest przerywana.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Akcja ponownie wyzwala własny warunek. Dodać kontrolę stanu, ograniczenie wyzwalania lub zmienić projekt reakcji.\n\n**Sprawdzenie I:** Jedno zdarzenie nie tworzy nieograniczonej serii kolejnych wykonań.\n\n**Zgłoszenie II:** Czas operacji przekracza limit wykonania polityki. Ograniczyć akcje lub świadomie dostosować limit do uzasadnionego czasu.\n\n**Sprawdzenie II:** Pełny zaplanowany zbiór danych jest zapisany bez przerwania z powodu czasu.\n\n**Zależności:** Automatyczna reakcja powinna być odporna na samowyzwalanie. Limit czasu chroni zasoby, ale musi odpowiadać rzeczywistemu zakresowi automatyzacji.",
      "example": "I — Jedno zdarzenie nie tworzy nieograniczonej serii kolejnych wykonań.\n\nII — Pełny zaplanowany zbiór danych jest zapisany bez przerwania z powodu czasu."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "encor.eem.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nApplet próbuje użyć komendy konfiguracji przed wejściem w config mode.\n\n**Zgłoszenie II**\n\nPo flapie operator ręcznie sprawdza liczniki zbyt późno; EEM może zachować dane przy zdarzeniu.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Sekwencja akcji nie zapewnia właściwego trybu CLI. Uporządkować akcje i przejścia trybów przed komendą zmieniającą stan.\n\n**Sprawdzenie I:** Wykonanie potwierdza poprawny tryb i brak błędu składni w tym kroku.\n\n**Zgłoszenie II:** Brakuje danych z momentu wystąpienia incydentu. Skonfigurować ograniczone zbieranie diagnostyki wyzwalane właściwym zdarzeniem.\n\n**Sprawdzenie II:** Artefakt diagnostyczny ma czas zgodny z incydentem i wymagane wyniki show.\n\n**Zależności:** Automatyzowane CLI nadal wymaga poprawnego kontekstu komend. Automatyzacja może utrwalać ulotny stan bez automatycznej zmiany konfiguracji.",
      "example": "I — Wykonanie potwierdza poprawny tryb i brak błędu składni w tym kroku.\n\nII — Artefakt diagnostyczny ma czas zgodny z incydentem i wymagane wyniki show."
    },
