    {
      "revision": 1,
      "title": "Niepasujący event — działanie",
      "skills": [
        "encor.eem.case-01",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.case-01.2.card",
      "front_md": "Applet oczekuje konkretnego wzorca syslog, ale rzeczywisty komunikat ma inną treść.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "EEM reaguje na skonfigurowany detektor, nie na ogólny zamiar administratora.\n\n**Rozpoznanie:** Warunek zdarzenia nie dopasowuje rzeczywistego logu.\n\n**Działanie:** Dopasować wzorzec do zweryfikowanego komunikatu bez nadmiernego rozszerzenia.\n\n**Sprawdzenie:** Kontrolny pasujący log uruchamia applet, a niepowiązany go nie uruchamia.",
      "example": "Dopasować wzorzec do zweryfikowanego komunikatu bez nadmiernego rozszerzenia."
    },
    {
      "revision": 1,
      "title": "Brak uprawnień — działanie",
      "skills": [
        "encor.eem.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.case-02.2.card",
      "front_md": "Applet jest wyzwalany, lecz wykonanie komendy CLI kończy się odmową AAA.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Automatyzacja zdarzeń podlega mechanizmom uprawnień urządzenia.\n\n**Rozpoznanie:** Kontekst wykonania nie ma wymaganej autoryzacji.\n\n**Działanie:** Zapewnić właściwą tożsamość i minimalne potrzebne uprawnienia dla polityki.\n\n**Sprawdzenie:** Log wykonania potwierdza ukończenie dozwolonej komendy.",
      "example": "Zapewnić właściwą tożsamość i minimalne potrzebne uprawnienia dla polityki."
    },
    {
      "revision": 1,
      "title": "Pętla zdarzeń — działanie",
      "skills": [
        "encor.eem.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.case-03.2.card",
      "front_md": "Applet reaguje na log o zmianie interfejsu, sam zmienia ten interfejs i generuje kolejny pasujący log.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Automatyczna reakcja powinna być odporna na samowyzwalanie.\n\n**Rozpoznanie:** Akcja ponownie wyzwala własny warunek.\n\n**Działanie:** Dodać kontrolę stanu, ograniczenie wyzwalania lub zmienić projekt reakcji.\n\n**Sprawdzenie:** Jedno zdarzenie nie tworzy nieograniczonej serii kolejnych wykonań.",
      "example": "Dodać kontrolę stanu, ograniczenie wyzwalania lub zmienić projekt reakcji."
    },
    {
      "revision": 1,
      "title": "Za długi applet — działanie",
      "skills": [
        "encor.eem.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.case-04.2.card",
      "front_md": "Akcja zbierania danych przekracza dozwolony czas wykonania i jest przerywana.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Limit czasu chroni zasoby, ale musi odpowiadać rzeczywistemu zakresowi automatyzacji.\n\n**Rozpoznanie:** Czas operacji przekracza limit wykonania polityki.\n\n**Działanie:** Ograniczyć akcje lub świadomie dostosować limit do uzasadnionego czasu.\n\n**Sprawdzenie:** Pełny zaplanowany zbiór danych jest zapisany bez przerwania z powodu czasu.",
      "example": "Ograniczyć akcje lub świadomie dostosować limit do uzasadnionego czasu."
    },
    {
      "revision": 1,
      "title": "Zła kolejność CLI — działanie",
      "skills": [
        "encor.eem.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.case-05.2.card",
      "front_md": "Applet próbuje użyć komendy konfiguracji przed wejściem w config mode.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Automatyzowane CLI nadal wymaga poprawnego kontekstu komend.\n\n**Rozpoznanie:** Sekwencja akcji nie zapewnia właściwego trybu CLI.\n\n**Działanie:** Uporządkować akcje i przejścia trybów przed komendą zmieniającą stan.\n\n**Sprawdzenie:** Wykonanie potwierdza poprawny tryb i brak błędu składni w tym kroku.",
      "example": "Uporządkować akcje i przejścia trybów przed komendą zmieniającą stan."
    },
    {
      "revision": 1,
      "title": "Zbieranie po awarii — działanie",
      "skills": [
        "encor.eem.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/eem/configuration/15-s/eem-15-s-book/eem-policy-cli.html"
        },
        {
          "title": "Dokumentacja Cisco — EEM — automatyzacja zdarzeń i zbieranie danych",
          "url": "https://sec.cloudapps.cisco.com/security/center/resources/embedded_event_manager_security_context.html"
        }
      ],
      "id": "encor.eem.practice.case-06.2.card",
      "front_md": "Po flapie operator ręcznie sprawdza liczniki zbyt późno; EEM może zachować dane przy zdarzeniu.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Automatyzacja może utrwalać ulotny stan bez automatycznej zmiany konfiguracji.\n\n**Rozpoznanie:** Brakuje danych z momentu wystąpienia incydentu.\n\n**Działanie:** Skonfigurować ograniczone zbieranie diagnostyki wyzwalane właściwym zdarzeniem.\n\n**Sprawdzenie:** Artefakt diagnostyczny ma czas zgodny z incydentem i wymagane wyniki show.",
      "example": "Skonfigurować ograniczone zbieranie diagnostyki wyzwalane właściwym zdarzeniem."
    }
  ],
