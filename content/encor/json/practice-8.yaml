    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "encor.json.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nPayload ma postać {'enabled': true}. Parser JSON odrzuca go.\n\n**Zgłoszenie II**\n\nPayload zawiera \"enabled\": \"false\", a model oczekuje wartości logicznej.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Nazwy pól JSON nie są zapisane w podwójnych cudzysłowach. Zapisać klucz jako \"enabled\" w poprawnym dokumencie JSON.\n\n**Sprawdzenie I:** Standardowy parser JSON przyjmuje dokument.\n\n**Zgłoszenie II:** Przekazano string zamiast boolean. Użyć wartości false bez cudzysłowów.\n\n**Sprawdzenie II:** Po parsowaniu enabled jest wartością logiczną, nie tekstem.\n\n**Zależności:** Składnia literału słownika Pythona i składnia JSON nie są identyczne. Boolean false i string \"false\" mają różne typy i znaczenie.",
      "example": "I — Składnia literału słownika Pythona i składnia JSON nie są identyczne.\n\nII — Boolean false i string \"false\" mają różne typy i znaczenie."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "encor.json.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nDokument kończy obiekt zapisem \"mtu\": 1500, przed zamykającym nawiasem.\n\n**Zgłoszenie II**\n\nPole interfaces zawiera trzy obiekty w tablicy; operator szuka pojedynczego pola name bez wyboru elementu.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Standardowy JSON nie dopuszcza końcowego przecinka. Usunąć przecinek po ostatnim polu.\n\n**Sprawdzenie I:** Dokument przechodzi walidację składni standardowego JSON.\n\n**Zgłoszenie II:** Pole jest kolekcją rekordów, nie pojedynczym obiektem interfejsu. Wybrać lub przefiltrować właściwy element tablicy.\n\n**Sprawdzenie II:** Odczyt dotyczy dokładnie rekordu interfejsu o żądanej nazwie.\n\n**Zależności:** JSON ma ścisłą składnię niezależną od tolerancji niektórych edytorów. Nawiasy kwadratowe reprezentują tablicę, a klamrowe obiekt.",
      "example": "I — JSON ma ścisłą składnię niezależną od tolerancji niektórych edytorów.\n\nII — Nawiasy kwadratowe reprezentują tablicę, a klamrowe obiekt."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "encor.json.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nJeden dokument ma \"description\": null, drugi nie ma pola description. API rozróżnia te przypadki.\n\n**Zgłoszenie II**\n\nModel oczekuje integer mtu, lecz payload zawiera \"mtu\": \"1500\".\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Jawne null nie jest tym samym co pominięty klucz. Zastosować znaczenie null i braku pola określone przez model API.\n\n**Sprawdzenie I:** Wysłany payload wyraża zamierzoną operację zgodnie z dokumentacją API.\n\n**Zgłoszenie II:** Wartość ma typ tekstowy zamiast liczbowego. Przekazać 1500 jako liczbę zgodnie z modelem.\n\n**Sprawdzenie II:** Walidator typu akceptuje liczbową wartość mtu.\n\n**Zależności:** JSON reprezentuje null, ale semantykę braku lub wyzerowania pola określa API. Poprawny składniowo JSON może nadal mieć niewłaściwe typy dla modelu.",
      "example": "I — JSON reprezentuje null, ale semantykę braku lub wyzerowania pola określa API.\n\nII — Poprawny składniowo JSON może nadal mieć niewłaściwe typy dla modelu."
    },
