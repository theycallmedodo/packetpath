      ],
      "id": "encor.json.practice.case-03.1.card",
      "front_md": "Dokument kończy obiekt zapisem \"mtu\": 1500, przed zamykającym nawiasem.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "JSON ma ścisłą składnię niezależną od tolerancji niektórych edytorów.\n\n**Rozpoznanie:** Standardowy JSON nie dopuszcza końcowego przecinka.\n\n**Działanie:** Usunąć przecinek po ostatnim polu.\n\n**Sprawdzenie:** Dokument przechodzi walidację składni standardowego JSON.",
      "example": "Standardowy JSON nie dopuszcza końcowego przecinka."
    },
    {
      "revision": 1,
      "title": "Tablica rekordów — rozpoznanie",
      "skills": [
