      "id": "encor.json.practice.case-01.3.card",
      "front_md": "Payload ma postać {'enabled': true}. Parser JSON odrzuca go.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Składnia literału słownika Pythona i składnia JSON nie są identyczne.\n\n**Rozpoznanie:** Nazwy pól JSON nie są zapisane w podwójnych cudzysłowach.\n\n**Działanie:** Zapisać klucz jako \"enabled\" w poprawnym dokumencie JSON.\n\n**Sprawdzenie:** Standardowy parser JSON przyjmuje dokument.",
      "example": "Standardowy parser JSON przyjmuje dokument."
    },
    {
      "revision": 1,
      "title": "Bool jako tekst — weryfikacja",
      "skills": [
        "encor.json.case-02",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.case-02.3.card",
      "front_md": "Payload zawiera \"enabled\": \"false\", a model oczekuje wartości logicznej.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Boolean false i string \"false\" mają różne typy i znaczenie.\n\n**Rozpoznanie:** Przekazano string zamiast boolean.\n\n**Działanie:** Użyć wartości false bez cudzysłowów.\n\n**Sprawdzenie:** Po parsowaniu enabled jest wartością logiczną, nie tekstem.",
      "example": "Po parsowaniu enabled jest wartością logiczną, nie tekstem."
    },
    {
      "revision": 1,
      "title": "Przecinek końcowy — weryfikacja",
      "skills": [
        "encor.json.case-03",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.case-03.3.card",
      "front_md": "Dokument kończy obiekt zapisem \"mtu\": 1500, przed zamykającym nawiasem.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "JSON ma ścisłą składnię niezależną od tolerancji niektórych edytorów.\n\n**Rozpoznanie:** Standardowy JSON nie dopuszcza końcowego przecinka.\n\n**Działanie:** Usunąć przecinek po ostatnim polu.\n\n**Sprawdzenie:** Dokument przechodzi walidację składni standardowego JSON.",
      "example": "Dokument przechodzi walidację składni standardowego JSON."
    },
    {
      "revision": 1,
      "title": "Tablica rekordów — weryfikacja",
      "skills": [
        "encor.json.case-04",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.case-04.3.card",
      "front_md": "Pole interfaces zawiera trzy obiekty w tablicy; operator szuka pojedynczego pola name bez wyboru elementu.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Nawiasy kwadratowe reprezentują tablicę, a klamrowe obiekt.\n\n**Rozpoznanie:** Pole jest kolekcją rekordów, nie pojedynczym obiektem interfejsu.\n\n**Działanie:** Wybrać lub przefiltrować właściwy element tablicy.\n\n**Sprawdzenie:** Odczyt dotyczy dokładnie rekordu interfejsu o żądanej nazwie.",
      "example": "Odczyt dotyczy dokładnie rekordu interfejsu o żądanej nazwie."
    },
    {
      "revision": 1,
      "title": "Null a brak — weryfikacja",
      "skills": [
        "encor.json.case-05",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.case-05.3.card",
      "front_md": "Jeden dokument ma \"description\": null, drugi nie ma pola description. API rozróżnia te przypadki.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "JSON reprezentuje null, ale semantykę braku lub wyzerowania pola określa API.\n\n**Rozpoznanie:** Jawne null nie jest tym samym co pominięty klucz.\n\n**Działanie:** Zastosować znaczenie null i braku pola określone przez model API.\n\n**Sprawdzenie:** Wysłany payload wyraża zamierzoną operację zgodnie z dokumentacją API.",
      "example": "Wysłany payload wyraża zamierzoną operację zgodnie z dokumentacją API."
    },
    {
      "revision": 1,
      "title": "Liczba z cudzysłowem — weryfikacja",
      "skills": [
        "encor.json.case-06",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Dokumentacja Cisco — JSON — poprawny zapis i struktury danych",
          "url": "https://blogs.cisco.com/developer/intro-to-programmability-3"
        },
        {
          "title": "JSON — RFC 8259",
          "url": "https://www.rfc-editor.org/rfc/rfc8259"
        }
      ],
      "id": "encor.json.practice.case-06.3.card",
      "front_md": "Model oczekuje integer mtu, lecz payload zawiera \"mtu\": \"1500\".\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Poprawny składniowo JSON może nadal mieć niewłaściwe typy dla modelu.\n\n**Rozpoznanie:** Wartość ma typ tekstowy zamiast liczbowego.\n\n**Działanie:** Przekazać 1500 jako liczbę zgodnie z modelem.\n\n**Sprawdzenie:** Walidator typu akceptuje liczbową wartość mtu.",
      "example": "Walidator typu akceptuje liczbową wartość mtu."
    }
