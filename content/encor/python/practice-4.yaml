      ],
      "id": "encor.python.practice.case-01.4.card",
      "front_md": "Skrypt otrzymuje JSON z licznikiem zapisanym jako string '10' i próbuje dodać do niego liczbę 1.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Typy danych decydują o semantyce operacji w Pythonie.\n\n**Rozpoznanie:** Typ string nie jest liczbą całkowitą dla operatora dodawania.\n\n**Działanie:** Zweryfikować dane i jawnie przekształcić poprawny string na int przed obliczeniem.\n\n**Sprawdzenie:** Wynik liczbowy wynosi 11, a błędne dane mają obsłużony błąd konwersji.",
      "example": "Typy danych decydują o semantyce operacji w Pythonie."
    },
    {
      "revision": 1,
      "title": "Brak klucza — zależności",
      "skills": [
        "encor.python.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Python — odczyt skryptów sieciowych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Python — tutorial",
          "url": "https://docs.python.org/3/tutorial/"
        }
      ],
      "id": "encor.python.practice.case-02.4.card",
      "front_md": "Kod używa response['interfaces'], ale odpowiedź błędu zawiera tylko pole error.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Struktura odpowiedzi błędnej może różnić się od poprawnych danych.\n\n**Rozpoznanie:** Skrypt zakłada obecność klucza, którego nie ma w tej odpowiedzi.\n\n**Działanie:** Sprawdzić status i strukturę odpowiedzi przed odczytem interfaces.\n\n**Sprawdzenie:** Odpowiedź błędu jest obsłużona bez niekontrolowanego KeyError.",
      "example": "Struktura odpowiedzi błędnej może różnić się od poprawnych danych."
    },
    {
      "revision": 1,
      "title": "Lista a słownik — zależności",
      "skills": [
        "encor.python.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Python — odczyt skryptów sieciowych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Python — tutorial",
          "url": "https://docs.python.org/3/tutorial/"
        }
      ],
      "id": "encor.python.practice.case-03.4.card",
      "front_md": "API zwraca listę słowników interfejsów, a kod próbuje odczytać ją przez data['name'].\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Lista rekordów i pojedynczy rekord mają odmienne sposoby dostępu.\n\n**Rozpoznanie:** Listy indeksuje się pozycją, nie nazwą pola słownika.\n\n**Działanie:** Iterować po elementach listy i odczytywać name z właściwego słownika.\n\n**Sprawdzenie:** Każdy element jest przetwarzany jako osobny rekord interfejsu.",
      "example": "Lista rekordów i pojedynczy rekord mają odmienne sposoby dostępu."
    },
    {
      "revision": 1,
      "title": "Brak timeout — zależności",
      "skills": [
        "encor.python.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Python — odczyt skryptów sieciowych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Python — tutorial",
          "url": "https://docs.python.org/3/tutorial/"
        }
      ],
      "id": "encor.python.practice.case-04.4.card",
      "front_md": "Żądanie HTTP nie ma timeout i po awarii endpointu skrypt długo blokuje kolejne urządzenia.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Automatyzacja sieciowa wymaga jawnej obsługi opóźnień i niedostępności.\n\n**Rozpoznanie:** Brak ograniczenia oczekiwania utrudnia kontrolę awarii.\n\n**Działanie:** Ustawić rozsądny timeout i obsłużyć jego wyjątek.\n\n**Sprawdzenie:** Niedostępne urządzenie kończy próbę w kontrolowanym czasie, a raport zawiera błąd.",
      "example": "Automatyzacja sieciowa wymaga jawnej obsługi opóźnień i niedostępności."
    },
    {
      "revision": 1,
      "title": "Porównanie liter — zależności",
      "skills": [
        "encor.python.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Python — odczyt skryptów sieciowych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Python — tutorial",
          "url": "https://docs.python.org/3/tutorial/"
        }
      ],
      "id": "encor.python.practice.case-05.4.card",
      "front_md": "Stan z API to 'UP', a skrypt porównuje go do 'up' i uznaje port za nieaktywny.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Normalizacja musi odpowiadać znaczeniu danych, a nie być ślepo stosowana do wszystkiego.\n\n**Rozpoznanie:** Porównanie stringów rozróżnia wielkość liter.\n\n**Działanie:** Normalizować pole tylko wtedy, gdy semantyka API pozwala ignorować wielkość liter.\n\n**Sprawdzenie:** Wartości UP i up są poprawnie interpretowane bez zmiany pól wrażliwych na litery.",
      "example": "Normalizacja musi odpowiadać znaczeniu danych, a nie być ślepo stosowana do wszystkiego."
    },
    {
      "revision": 1,
      "title": "Wyjątek połknięty — zależności",
      "skills": [
        "encor.python.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Python — odczyt skryptów sieciowych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Python — tutorial",
          "url": "https://docs.python.org/3/tutorial/"
        }
      ],
      "id": "encor.python.practice.case-06.4.card",
      "front_md": "Pętla używa except: pass, więc nieudane połączenia z routerami znikają z raportu.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Brak wyjątku na ekranie nie jest dowodem powodzenia automatyzacji.\n\n**Rozpoznanie:** Obsługa wyjątków ukrywa błędy zamiast je raportować.\n\n**Działanie:** Łapać konkretne wyjątki i zapisywać wynik błędu dla urządzenia.\n\n**Sprawdzenie:** Raport zawiera zarówno sukcesy, jak i jawne niepowodzenia.",
      "example": "Brak wyjątku na ekranie nie jest dowodem powodzenia automatyzacji."
    }
