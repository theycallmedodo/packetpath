      "id": "encor.python.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nSkrypt otrzymuje JSON z licznikiem zapisanym jako string '10' i próbuje dodać do niego liczbę 1.\n\n**Zgłoszenie II**\n\nKod używa response['interfaces'], ale odpowiedź błędu zawiera tylko pole error.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Typ string nie jest liczbą całkowitą dla operatora dodawania. Zweryfikować dane i jawnie przekształcić poprawny string na int przed obliczeniem.\n\n**Sprawdzenie I:** Wynik liczbowy wynosi 11, a błędne dane mają obsłużony błąd konwersji.\n\n**Zgłoszenie II:** Skrypt zakłada obecność klucza, którego nie ma w tej odpowiedzi. Sprawdzić status i strukturę odpowiedzi przed odczytem interfaces.\n\n**Sprawdzenie II:** Odpowiedź błędu jest obsłużona bez niekontrolowanego KeyError.\n\n**Zależności:** Typy danych decydują o semantyce operacji w Pythonie. Struktura odpowiedzi błędnej może różnić się od poprawnych danych.",
      "example": "I — Zweryfikować dane i jawnie przekształcić poprawny string na int przed obliczeniem.\n\nII — Sprawdzić status i strukturę odpowiedzi przed odczytem interfaces."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "encor.python.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Python — odczyt skryptów sieciowych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Python — tutorial",
          "url": "https://docs.python.org/3/tutorial/"
        }
      ],
      "id": "encor.python.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nAPI zwraca listę słowników interfejsów, a kod próbuje odczytać ją przez data['name'].\n\n**Zgłoszenie II**\n\nŻądanie HTTP nie ma timeout i po awarii endpointu skrypt długo blokuje kolejne urządzenia.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Listy indeksuje się pozycją, nie nazwą pola słownika. Iterować po elementach listy i odczytywać name z właściwego słownika.\n\n**Sprawdzenie I:** Każdy element jest przetwarzany jako osobny rekord interfejsu.\n\n**Zgłoszenie II:** Brak ograniczenia oczekiwania utrudnia kontrolę awarii. Ustawić rozsądny timeout i obsłużyć jego wyjątek.\n\n**Sprawdzenie II:** Niedostępne urządzenie kończy próbę w kontrolowanym czasie, a raport zawiera błąd.\n\n**Zależności:** Lista rekordów i pojedynczy rekord mają odmienne sposoby dostępu. Automatyzacja sieciowa wymaga jawnej obsługi opóźnień i niedostępności.",
      "example": "I — Iterować po elementach listy i odczytywać name z właściwego słownika.\n\nII — Ustawić rozsądny timeout i obsłużyć jego wyjątek."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
      "skills": [
        "encor.python.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Python — odczyt skryptów sieciowych",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "Python — tutorial",
          "url": "https://docs.python.org/3/tutorial/"
        }
      ],
      "id": "encor.python.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nStan z API to 'UP', a skrypt porównuje go do 'up' i uznaje port za nieaktywny.\n\n**Zgłoszenie II**\n\nPętla używa except: pass, więc nieudane połączenia z routerami znikają z raportu.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Porównanie stringów rozróżnia wielkość liter. Normalizować pole tylko wtedy, gdy semantyka API pozwala ignorować wielkość liter.\n\n**Sprawdzenie I:** Wartości UP i up są poprawnie interpretowane bez zmiany pól wrażliwych na litery.\n\n**Zgłoszenie II:** Obsługa wyjątków ukrywa błędy zamiast je raportować. Łapać konkretne wyjątki i zapisywać wynik błędu dla urządzenia.\n\n**Sprawdzenie II:** Raport zawiera zarówno sukcesy, jak i jawne niepowodzenia.\n\n**Zależności:** Normalizacja musi odpowiadać znaczeniu danych, a nie być ślepo stosowana do wszystkiego. Brak wyjątku na ekranie nie jest dowodem powodzenia automatyzacji.",
      "example": "I — Normalizować pole tylko wtedy, gdy semantyka API pozwala ignorować wielkość liter.\n\nII — Łapać konkretne wyjątki i zapisywać wynik błędu dla urządzenia."
    },
