      "title": "SNMP w drop class — zależności",
      "skills": [
        "encor.copp.case-01",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.case-01.4.card",
      "front_md": "Zapytania NMS trafiają do klasy CoPP z conform drop i exceed drop; liczniki tej klasy rosną.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Conform-action drop oznacza odrzucenie nawet ruchu mieszczącego się w limicie.\n\n**Rozpoznanie:** Polityka control-plane odrzuca także zgodny z profilem SNMP.\n\n**Działanie:** Skorygować klasyfikację zaufanego NMS i zaplanowane akcje właściwej klasy.\n\n**Sprawdzenie:** Zaufany SNMP trafia do dopuszczonej klasy i monitoring działa.",
      "example": "Conform-action drop oznacza odrzucenie nawet ruchu mieszczącego się w limicie."
    },
    {
      "revision": 1,
      "title": "Za niski policer — zależności",
      "skills": [
        "encor.copp.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.case-02.4.card",
      "front_md": "SNMP chwilowo działa, ale podczas intensywnego pollingu rośnie exceed-drop w jego klasie CoPP.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "CoPP wymaga wymiarowania do legalnego ruchu, nie tylko minimalnej liczby bit/s.\n\n**Rozpoznanie:** Polling przekracza dopuszczony profil control-plane.\n\n**Działanie:** Dopasować polling i uzasadniony limit, zachowując ochronę CPU.\n\n**Sprawdzenie:** Normalny cykl monitoringu nie generuje utraty odczytów przez exceed-drop.",
      "example": "CoPP wymaga wymiarowania do legalnego ruchu, nie tylko minimalnej liczby bit/s."
    },
    {
      "revision": 1,
      "title": "Tranzyt kontra CPU — zależności",
      "skills": [
        "encor.copp.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.case-03.4.card",
      "front_md": "Zwykły ruch klientów przechodzi sprzętowo, ale ping do adresu samego routera jest ograniczany przez CoPP.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "CoPP chroni control-plane, nie jest automatycznie polityką wszystkich pakietów tranzytowych.\n\n**Rozpoznanie:** Ruch do urządzenia i tranzyt przechodzą różne ścieżki przetwarzania.\n\n**Działanie:** Analizować osobno klasę control-plane i jakość tranzytu.\n\n**Sprawdzenie:** Tranzyt działa niezależnie od limitu kontrolnego ICMP do routera.",
      "example": "CoPP chroni control-plane, nie jest automatycznie polityką wszystkich pakietów tranzytowych."
    },
    {
      "revision": 1,
      "title": "Zbyt szeroka klasa — zależności",
      "skills": [
        "encor.copp.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.case-04.4.card",
      "front_md": "Wcześniejsza klasa CoPP dopasowuje cały UDP, więc późniejsza klasa SNMP nie dostaje pakietów.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Kolejność i zakres dopasowań są istotne również w polityce control-plane.\n\n**Rozpoznanie:** Ogólna klasyfikacja przechwytuje ruch przed klasą szczegółową.\n\n**Działanie:** Uzgodnić kolejność i warunki klas tak, aby SNMP trafiał do właściwej.\n\n**Sprawdzenie:** Kontrolny SNMP zwiększa licznik klasy szczegółowej.",
      "example": "Kolejność i zakres dopasowań są istotne również w polityce control-plane."
    },
    {
      "revision": 1,
      "title": "BGP pod obciążeniem — zależności",
      "skills": [
        "encor.copp.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.case-05.4.card",
      "front_md": "Pod atakiem na CPU rosną dropy klasy obejmującej TCP 179 i sesje BGP tracą keepalive.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Ochrona CPU musi równocześnie zachować działanie niezbędnych protokołów.\n\n**Rozpoznanie:** Legalny ruch routingu konkuruje w źle dobranej klasie ochronnej.\n\n**Działanie:** Oddzielić i wymiarować wymagany ruch kontrolny zgodnie z polityką.\n\n**Sprawdzenie:** BGP zachowuje stabilność przy ograniczonym ruchu atakującym.",
      "example": "Ochrona CPU musi równocześnie zachować działanie niezbędnych protokołów."
    },
    {
      "revision": 1,
      "title": "Licznik od startu — zależności",
      "skills": [
        "encor.copp.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.case-06.4.card",
      "front_md": "Klasa CoPP ma milion drops od wielu dni, ale podczas obecnego incydentu licznik nie rośnie.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Korelacja czasu i przyrostów jest potrzebna do przypisania winy polityce.\n\n**Rozpoznanie:** Historyczna suma nie dowodzi przyczyny bieżącej awarii.\n\n**Działanie:** Porównać przyrost w czasie konkretnego kontrolowanego testu.\n\n**Sprawdzenie:** Test ma oznaczony interwał i wykazuje lub wyklucza nowe dropy danej klasy.",
      "example": "Korelacja czasu i przyrostów jest potrzebna do przypisania winy polityce."
    }
  ],
