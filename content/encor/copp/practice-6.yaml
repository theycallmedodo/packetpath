      "title": "Dwa zgłoszenia 1 — działanie",
      "skills": [
        "encor.copp.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nZapytania NMS trafiają do klasy CoPP z conform drop i exceed drop; liczniki tej klasy rosną.\n\n**Zgłoszenie II**\n\nSNMP chwilowo działa, ale podczas intensywnego pollingu rośnie exceed-drop w jego klasie CoPP.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Polityka control-plane odrzuca także zgodny z profilem SNMP. Skorygować klasyfikację zaufanego NMS i zaplanowane akcje właściwej klasy.\n\n**Sprawdzenie I:** Zaufany SNMP trafia do dopuszczonej klasy i monitoring działa.\n\n**Zgłoszenie II:** Polling przekracza dopuszczony profil control-plane. Dopasować polling i uzasadniony limit, zachowując ochronę CPU.\n\n**Sprawdzenie II:** Normalny cykl monitoringu nie generuje utraty odczytów przez exceed-drop.\n\n**Zależności:** Conform-action drop oznacza odrzucenie nawet ruchu mieszczącego się w limicie. CoPP wymaga wymiarowania do legalnego ruchu, nie tylko minimalnej liczby bit/s.",
      "example": "I — Skorygować klasyfikację zaufanego NMS i zaplanowane akcje właściwej klasy.\n\nII — Dopasować polling i uzasadniony limit, zachowując ochronę CPU."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "encor.copp.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nZwykły ruch klientów przechodzi sprzętowo, ale ping do adresu samego routera jest ograniczany przez CoPP.\n\n**Zgłoszenie II**\n\nWcześniejsza klasa CoPP dopasowuje cały UDP, więc późniejsza klasa SNMP nie dostaje pakietów.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Ruch do urządzenia i tranzyt przechodzą różne ścieżki przetwarzania. Analizować osobno klasę control-plane i jakość tranzytu.\n\n**Sprawdzenie I:** Tranzyt działa niezależnie od limitu kontrolnego ICMP do routera.\n\n**Zgłoszenie II:** Ogólna klasyfikacja przechwytuje ruch przed klasą szczegółową. Uzgodnić kolejność i warunki klas tak, aby SNMP trafiał do właściwej.\n\n**Sprawdzenie II:** Kontrolny SNMP zwiększa licznik klasy szczegółowej.\n\n**Zależności:** CoPP chroni control-plane, nie jest automatycznie polityką wszystkich pakietów tranzytowych. Kolejność i zakres dopasowań są istotne również w polityce control-plane.",
      "example": "I — Analizować osobno klasę control-plane i jakość tranzytu.\n\nII — Uzgodnić kolejność i warunki klas tak, aby SNMP trafiał do właściwej."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
      "skills": [
        "encor.copp.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16-11/qos-plcshp-xe-16-11-book/qos-plcshp-ctrl-pln-plc.html"
        },
        {
          "title": "Dokumentacja Cisco — CoPP — ochrona CPU i diagnostyka SNMP",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/quality-of-service/quality-of-service/m_qos-plcshp-ctrl-pln-plc-0.html"
        }
      ],
      "id": "encor.copp.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nPod atakiem na CPU rosną dropy klasy obejmującej TCP 179 i sesje BGP tracą keepalive.\n\n**Zgłoszenie II**\n\nKlasa CoPP ma milion drops od wielu dni, ale podczas obecnego incydentu licznik nie rośnie.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Legalny ruch routingu konkuruje w źle dobranej klasie ochronnej. Oddzielić i wymiarować wymagany ruch kontrolny zgodnie z polityką.\n\n**Sprawdzenie I:** BGP zachowuje stabilność przy ograniczonym ruchu atakującym.\n\n**Zgłoszenie II:** Historyczna suma nie dowodzi przyczyny bieżącej awarii. Porównać przyrost w czasie konkretnego kontrolowanego testu.\n\n**Sprawdzenie II:** Test ma oznaczony interwał i wykazuje lub wyklucza nowe dropy danej klasy.\n\n**Zależności:** Ochrona CPU musi równocześnie zachować działanie niezbędnych protokołów. Korelacja czasu i przyrostów jest potrzebna do przypisania winy polityce.",
      "example": "I — Oddzielić i wymiarować wymagany ruch kontrolny zgodnie z polityką.\n\nII — Porównać przyrost w czasie konkretnego kontrolowanego testu."
    },
