  "tasks": [
    {
      "id": "encor.ospf-multi.13",
      "revision": 1,
      "title": "Diagnoza 2-WAY",
      "skills": [
        "ospf-multi.diagnoza-2-way"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "350-401",
          "version": "1.2",
          "objective": "3.2.b"
        }
      ],
      "difficulty": 3,
      "prompt_md": "```text\nNeighbor ID     Pri State       Interface\n2.2.2.2           1 2WAY/DROTHER GigabitEthernet0/0\n3.3.3.3           1 FULL/DR      GigabitEthernet0/0\n4.4.4.4           1 FULL/BDR     GigabitEthernet0/0\n```\n\nSkrócony przykład do analizy. W sieci broadcast dwa routery DROTHER widzą się w stanie 2-WAY; oba mają FULL z DR i BDR. Jak to ocenić?",
      "hints": [
        "Przeanalizuj warunki scenariusza; odpowiedź dotyczy wyłącznie podanych założeń."
      ],
      "explanation_md": "DROTHER nie tworzą pełnej adjacencji między sobą w sieci broadcast. FULL jest wymagane z DR/BDR.",
      "card_id": "encor.ospf-multi.13.theory",
      "type": "single_choice",
      "options": [
        {
          "text_md": "To zawsze awaria MTU",
          "feedback_md": "DROTHER nie tworzą pełnej adjacencji między sobą w sieci broadcast. FULL jest wymagane z DR/BDR.",
          "id": "A"
        },
        {
          "text_md": "Należy ustawić wszystkim priorytet 255",
          "feedback_md": "DROTHER nie tworzą pełnej adjacencji między sobą w sieci broadcast. FULL jest wymagane z DR/BDR.",
          "id": "B"
        },
        {
          "text_md": "To prawidłowe zachowanie",
          "feedback_md": "DROTHER nie tworzą pełnej adjacencji między sobą w sieci broadcast. FULL jest wymagane z DR/BDR.",
          "id": "C"
        },
        {
          "text_md": "OSPF nie obsługuje trzech routerów w LAN",
          "feedback_md": "DROTHER nie tworzą pełnej adjacencji między sobą w sieci broadcast. FULL jest wymagane z DR/BDR.",
          "id": "D"
        }
      ],
      "correct_option_id": "C"
    },
