    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "encor.ospf-multi.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nRouter łączy area 10 i 20, ale projekt nie zapewnia im wymaganej drogi przez backbone area 0.\n\n**Zgłoszenie II**\n\nRouter w area 20 widzi prefiks z area 10 jako O IA, reklamowany przez ABR.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Projekt narusza hierarchię routingu międzyobszarowego OSPF. Zapewnić poprawne połączenie obszarów z backbone zgodnie z projektem.\n\n**Sprawdzenie I:** LSDB i trasy międzyobszarowe odpowiadają poprawnie połączonej hierarchii.\n\n**Zgłoszenie II:** Prefiks jest informacją międzyobszarową. Analizować odpowiednie summary LSA typu 3 oraz osiągalność ABR.\n\n**Sprawdzenie II:** Show ip ospf database summary zawiera informację dla badanego prefiksu.\n\n**Zależności:** Normalna wymiana między obszarami opiera się na backbone area 0. ABR przekazuje informację o sieciach innych obszarów przez LSA typu 3.",
      "example": "I — Normalna wymiana między obszarami opiera się na backbone area 0.\n\nII — ABR przekazuje informację o sieciach innych obszarów przez LSA typu 3."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "encor.ospf-multi.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nW area stub nie widać LSA typu 5, ale ABR dostarcza trasę domyślną.\n\n**Zgłoszenie II**\n\nASBR w NSSA redystrybuuje prefiks. W tym obszarze pojawia się LSA typu 7.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Stub ogranicza zalewanie zewnętrznych LSA. Ocenić dostęp do celów zewnętrznych przez domyślną trasę obszaru.\n\n**Sprawdzenie I:** LSDB nie zawiera typu 5, a odpowiedni default jest obecny.\n\n**Zgłoszenie II:** NSSA używa typu 7 dla lokalnie wprowadzonych tras zewnętrznych. Sprawdzić reklamę typu 7 oraz jej translację na granicy zgodnie z regułami NSSA.\n\n**Sprawdzenie II:** Odpowiednie LSA typu 7 istnieje w NSSA, a uprawniony translator udostępnia trasę dalej.\n\n**Zależności:** Brak external LSA w stub może być zamierzonym działaniem projektu. NSSA pozwala na lokalną redystrybucję bez zwykłego zalewania typu 5 w obszarze.",
      "example": "I — Brak external LSA w stub może być zamierzonym działaniem projektu.\n\nII — NSSA pozwala na lokalną redystrybucję bez zwykłego zalewania typu 5 w obszarze."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "encor.ospf-multi.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nDwie drogi do zewnętrznego prefiksu E1 mają ten sam koszt zewnętrzny, ale różny koszt dojścia do ASBR.\n\n**Zgłoszenie II**\n\nSąsiedztwo utknęło w ExStart/Exchange. Pakiety DBD ujawniają MTU 1500 i 1400 po przeciwnych stronach.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Metryka E1 uwzględnia również koszt wewnętrzny. Porównać sumę kosztu zewnętrznego i wewnętrznej drogi.\n\n**Sprawdzenie I:** Wybrana droga E1 ma mniejszy łączny koszt.\n\n**Zgłoszenie II:** Wymiana bazy napotyka niezgodność MTU. Uzgodnić rzeczywiste MTU obu końców zamiast tylko maskować kontrolę.\n\n**Sprawdzenie II:** Po korekcie sąsiedztwo osiąga Full i test dużych pakietów odpowiada projektowi.\n\n**Zależności:** E1 i E2 inaczej wykorzystują koszt wewnętrzny przy wyborze ścieżki. Zgodność Hello nie dowodzi, że wymiana DBD i danych zakończy się poprawnie.",
      "example": "I — E1 i E2 inaczej wykorzystują koszt wewnętrzny przy wyborze ścieżki.\n\nII — Zgodność Hello nie dowodzi, że wymiana DBD i danych zakończy się poprawnie."
    },
