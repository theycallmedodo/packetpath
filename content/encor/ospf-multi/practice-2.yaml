    {
      "revision": 1,
      "title": "ABR bez backbone — działanie",
      "skills": [
        "encor.ospf-multi.case-01",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.case-01.2.card",
      "front_md": "Router łączy area 10 i 20, ale projekt nie zapewnia im wymaganej drogi przez backbone area 0.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Normalna wymiana między obszarami opiera się na backbone area 0.\n\n**Rozpoznanie:** Projekt narusza hierarchię routingu międzyobszarowego OSPF.\n\n**Działanie:** Zapewnić poprawne połączenie obszarów z backbone zgodnie z projektem.\n\n**Sprawdzenie:** LSDB i trasy międzyobszarowe odpowiadają poprawnie połączonej hierarchii.",
      "example": "Zapewnić poprawne połączenie obszarów z backbone zgodnie z projektem."
    },
    {
      "revision": 1,
      "title": "LSA typu 3 — działanie",
      "skills": [
        "encor.ospf-multi.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.case-02.2.card",
      "front_md": "Router w area 20 widzi prefiks z area 10 jako O IA, reklamowany przez ABR.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "ABR przekazuje informację o sieciach innych obszarów przez LSA typu 3.\n\n**Rozpoznanie:** Prefiks jest informacją międzyobszarową.\n\n**Działanie:** Analizować odpowiednie summary LSA typu 3 oraz osiągalność ABR.\n\n**Sprawdzenie:** Show ip ospf database summary zawiera informację dla badanego prefiksu.",
      "example": "Analizować odpowiednie summary LSA typu 3 oraz osiągalność ABR."
    },
    {
      "revision": 1,
      "title": "Stub i external — działanie",
      "skills": [
        "encor.ospf-multi.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.case-03.2.card",
      "front_md": "W area stub nie widać LSA typu 5, ale ABR dostarcza trasę domyślną.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Brak external LSA w stub może być zamierzonym działaniem projektu.\n\n**Rozpoznanie:** Stub ogranicza zalewanie zewnętrznych LSA.\n\n**Działanie:** Ocenić dostęp do celów zewnętrznych przez domyślną trasę obszaru.\n\n**Sprawdzenie:** LSDB nie zawiera typu 5, a odpowiedni default jest obecny.",
      "example": "Ocenić dostęp do celów zewnętrznych przez domyślną trasę obszaru."
    },
    {
      "revision": 1,
      "title": "NSSA redystrybucja — działanie",
      "skills": [
        "encor.ospf-multi.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.case-04.2.card",
      "front_md": "ASBR w NSSA redystrybuuje prefiks. W tym obszarze pojawia się LSA typu 7.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "NSSA pozwala na lokalną redystrybucję bez zwykłego zalewania typu 5 w obszarze.\n\n**Rozpoznanie:** NSSA używa typu 7 dla lokalnie wprowadzonych tras zewnętrznych.\n\n**Działanie:** Sprawdzić reklamę typu 7 oraz jej translację na granicy zgodnie z regułami NSSA.\n\n**Sprawdzenie:** Odpowiednie LSA typu 7 istnieje w NSSA, a uprawniony translator udostępnia trasę dalej.",
      "example": "Sprawdzić reklamę typu 7 oraz jej translację na granicy zgodnie z regułami NSSA."
    },
    {
      "revision": 1,
      "title": "E1 czy E2 — działanie",
      "skills": [
        "encor.ospf-multi.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.case-05.2.card",
      "front_md": "Dwie drogi do zewnętrznego prefiksu E1 mają ten sam koszt zewnętrzny, ale różny koszt dojścia do ASBR.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "E1 i E2 inaczej wykorzystują koszt wewnętrzny przy wyborze ścieżki.\n\n**Rozpoznanie:** Metryka E1 uwzględnia również koszt wewnętrzny.\n\n**Działanie:** Porównać sumę kosztu zewnętrznego i wewnętrznej drogi.\n\n**Sprawdzenie:** Wybrana droga E1 ma mniejszy łączny koszt.",
      "example": "Porównać sumę kosztu zewnętrznego i wewnętrznej drogi."
    },
    {
      "revision": 1,
      "title": "MTU w ExStart — działanie",
      "skills": [
        "encor.ospf-multi.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — OSPF — obszary, agregacja i OSPFv3",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.ospf-multi.practice.case-06.2.card",
      "front_md": "Sąsiedztwo utknęło w ExStart/Exchange. Pakiety DBD ujawniają MTU 1500 i 1400 po przeciwnych stronach.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Zgodność Hello nie dowodzi, że wymiana DBD i danych zakończy się poprawnie.\n\n**Rozpoznanie:** Wymiana bazy napotyka niezgodność MTU.\n\n**Działanie:** Uzgodnić rzeczywiste MTU obu końców zamiast tylko maskować kontrolę.\n\n**Sprawdzenie:** Po korekcie sąsiedztwo osiąga Full i test dużych pakietów odpowiada projektowi.",
      "example": "Uzgodnić rzeczywiste MTU obu końców zamiast tylko maskować kontrolę."
    }
  ],
