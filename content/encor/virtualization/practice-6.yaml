          "url": "https://developer.cisco.com/docs/sonic/vxlan-evpn/"
        },
        {
          "title": "Dokumentacja Cisco — wirtualizacja",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_irl-overview.html"
        }
      ],
      "id": "encor.virtualization.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nDwa VTEP mają transport IP, ale hosty mają różne L2 VNI, choć projekt zakłada wspólny segment.\n\n**Zgłoszenie II**\n\nMałe pakiety overlay działają, większe giną na underlay bez zapasu na enkapsulację.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Hosty należą do różnych segmentów overlay. Uzgodnić właściwe mapowanie VLAN–VNI zgodnie z projektem.\n\n**Sprawdzenie I:** Oba końce używają oczekiwanego VNI i uzyskują właściwą łączność L2.\n\n**Zgłoszenie II:** MTU transportu nie uwzględnia narzutu VXLAN. Zapewnić spójne MTU underlay wystarczające dla używanego payloadu i enkapsulacji.\n\n**Sprawdzenie II:** Test dużych pakietów overlay przechodzi na całej drodze między VTEP.\n\n**Zależności:** VNI identyfikuje segment overlay; samo IP między VTEP nie łączy segmentów. Overlay zależy od parametrów sieci transportowej.",
      "example": "I — Uzgodnić właściwe mapowanie VLAN–VNI zgodnie z projektem.\n\nII — Zapewnić spójne MTU underlay wystarczające dla używanego payloadu i enkapsulacji."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
