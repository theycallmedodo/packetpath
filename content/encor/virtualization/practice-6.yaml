      "id": "encor.virtualization.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nVM ma poprawny IP, lecz jej port group należy do innego VLAN niż sieć bramy.\n\n**Zgłoszenie II**\n\nWiele VM współdzieli przeciążone CPU hosta, a wirtualny router ma opóźnienia mimo wolnego portu fizycznego.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Wirtualna karta jest przyłączona do niewłaściwego segmentu. Poprawić przypisanie port group i transport VLAN na uplinku hypervisora.\n\n**Sprawdzenie I:** VM osiąga bramę swojego VLAN i jej MAC pojawia się we właściwym segmencie.\n\n**Zgłoszenie II:** Wąskim gardłem są zasoby obliczeniowe hosta. Zmniejszyć konkurencję zasobów lub przydzielić wymagane zasoby routerowi.\n\n**Sprawdzenie II:** Maleje oczekiwanie na CPU i poprawia się opóźnienie przy porównywalnym ruchu.\n\n**Zależności:** Wirtualny switch nadal podlega regułom segmentacji L2. Wydajność wirtualnego urządzenia zależy od hypervisora i dostępnych zasobów.",
      "example": "I — Poprawić przypisanie port group i transport VLAN na uplinku hypervisora.\n\nII — Zmniejszyć konkurencję zasobów lub przydzielić wymagane zasoby routerowi."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
