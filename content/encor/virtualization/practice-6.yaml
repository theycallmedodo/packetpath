        },
        {
          "title": "Dokumentacja Cisco — wirtualizacja",
          "url": "https://www.cisco.com/c/en/us/td/docs/voice_ip_comm/uc_system/virtualization/virtualization-qos-designs-considerations.html"
        },
        {
          "title": "Dokumentacja Cisco — wirtualizacja",
          "url": "https://developer.cisco.com/docs/sonic/vxlan-evpn/"
        },
        {
          "title": "Dokumentacja Cisco — wirtualizacja",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_irl-overview.html"
        }
      ],
      "id": "encor.virtualization.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nHost zachowuje EID po zmianie miejsca, ale jego bieżąca lokalizacja jest opisana innym RLOC.\n\n**Zgłoszenie II**\n\nOperator traktuje snapshot VM na tym samym uszkodzonym datastore jako jedyną kopię awaryjną.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Tożsamość endpointu jest rozdzielona od lokalizacji routowanej. Sprawdzić aktualne mapowanie EID do właściwego RLOC.\n\n**Sprawdzenie I:** Mapa wskazuje nową lokalizację, zachowując identyfikator endpointu.\n\n**Zgłoszenie II:** Snapshot współdzieli domenę awarii z oryginalnymi danymi. Zapewnić niezależny backup i przetestować odtworzenie.\n\n**Sprawdzenie II:** Odtworzenie działa także po utracie pierwotnego datastore.\n\n**Zależności:** LISP rozdziela identyfikację endpointu i lokalizację w sieci. Snapshot nie zastępuje niezależnej kopii i planu odzyskiwania.",
      "example": "I — Sprawdzić aktualne mapowanie EID do właściwego RLOC.\n\nII — Zapewnić niezależny backup i przetestować odtworzenie."
    },
