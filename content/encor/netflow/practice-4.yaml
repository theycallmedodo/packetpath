        }
      ],
      "id": "encor.netflow.practice.case-01.4.card",
      "front_md": "Record i exporter istnieją, ale żaden interfejs nie ma przypisanego flow monitor.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Definicje obiektów NetFlow nie oznaczają jeszcze zbierania danych.\n\n**Rozpoznanie:** Nie aktywowano obserwacji przepływów w punkcie ruchu.\n\n**Działanie:** Przypiąć monitor we wspieranym kierunku na właściwym interfejsie.\n\n**Sprawdzenie:** Ruch testowy tworzy wpisy w cache monitora.",
      "example": "Definicje obiektów NetFlow nie oznaczają jeszcze zbierania danych."
    },
    {
      "revision": 1,
      "title": "Zły port eksportu — zależności",
      "skills": [
        "encor.netflow.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-fnetflow.html"
        },
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-ipv4-uni.html"
        }
      ],
      "id": "encor.netflow.practice.case-02.4.card",
      "front_md": "Exporter wysyła UDP do 2055, a kolektor nasłuchuje na 9995.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Parametry transportowe eksportera muszą odpowiadać konfiguracji kolektora.\n\n**Rozpoznanie:** Nadawca i odbiorca używają różnych portów eksportu.\n\n**Działanie:** Uzgodnić port i politykę transportu eksportu.\n\n**Sprawdzenie:** Kolektor odbiera datagramy na skonfigurowanym porcie.",
      "example": "Parametry transportowe eksportera muszą odpowiadać konfiguracji kolektora."
    },
    {
      "revision": 1,
      "title": "Brak template — zależności",
      "skills": [
        "encor.netflow.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-fnetflow.html"
        },
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-ipv4-uni.html"
        }
      ],
      "id": "encor.netflow.practice.case-03.4.card",
      "front_md": "Kolektor otrzymuje dane NetFlow v9, lecz nie ma odpowiadającego im template.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Protokoły szablonowe wymagają metadanych opisujących układ danych.\n\n**Rozpoznanie:** Kolektor nie zna struktury pól rekordów.\n\n**Działanie:** Zapewnić odbiór i odświeżanie odpowiednich templates.\n\n**Sprawdzenie:** Po odebraniu template kolektor poprawnie dekoduje rekordy.",
      "example": "Protokoły szablonowe wymagają metadanych opisujących układ danych."
    },
    {
      "revision": 1,
      "title": "Zbyt mało kluczy — zależności",
      "skills": [
        "encor.netflow.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-fnetflow.html"
        },
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-ipv4-uni.html"
        }
      ],
      "id": "encor.netflow.practice.case-04.4.card",
      "front_md": "Record nie ma portów transportowych jako match, więc przepływy o tych samych adresach łączą się w jeden wpis.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Pola match określają tożsamość przepływu, collect zbiera dodatkowe informacje.\n\n**Rozpoznanie:** Klucz agregacji nie rozróżnia wymaganych sesji.\n\n**Działanie:** Dodać wspierane pola match potrzebne do rozdzielenia przepływów.\n\n**Sprawdzenie:** Cache pokazuje osobne rekordy dla różnych portów zgodnie z nowym kluczem.",
      "example": "Pola match określają tożsamość przepływu, collect zbiera dodatkowe informacje."
    },
    {
      "revision": 1,
      "title": "Active timeout — zależności",
      "skills": [
        "encor.netflow.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-fnetflow.html"
        },
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-ipv4-uni.html"
        }
      ],
      "id": "encor.netflow.practice.case-05.4.card",
      "front_md": "Długa sesja nie pojawia się szybko na kolektorze, bo aktywny timeout jest duży; cache zawiera ruch.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Cache i kolektor mogą pokazywać dane z różnym opóźnieniem.\n\n**Rozpoznanie:** Eksport czeka na warunek czasowy dla długiego przepływu.\n\n**Działanie:** Dobrać active timeout do wymaganego opóźnienia raportowania.\n\n**Sprawdzenie:** Długa sesja jest raportowana okresowo w oczekiwanym czasie.",
      "example": "Cache i kolektor mogą pokazywać dane z różnym opóźnieniem."
    },
    {
      "revision": 1,
      "title": "Sampling — zależności",
      "skills": [
        "encor.netflow.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-fnetflow.html"
        },
        {
          "title": "Dokumentacja Cisco — Flexible NetFlow — rekord, monitor i eksport",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ntw-servs/b-network-services/m_fnf-ipv4-uni.html"
        }
      ],
      "id": "encor.netflow.practice.case-06.4.card",
      "front_md": "Monitor próbuje co setny pakiet, a operator traktuje zebrane rekordy jako pełny capture.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "NetFlow i sampling służą charakterystyce ruchu, nie zastępują pełnego przechwycenia.\n\n**Rozpoznanie:** Dane są próbkowane, nie kompletne.\n\n**Działanie:** Interpretować wyniki z uwzględnieniem algorytmu i współczynnika próbkowania.\n\n**Sprawdzenie:** Raport oznacza sampling i nie deklaruje kompletnej listy wszystkich pakietów.",
      "example": "NetFlow i sampling służą charakterystyce ruchu, nie zastępują pełnego przechwycenia."
    }
