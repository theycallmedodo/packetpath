      "id": "encor.netconf.practice.case-06.3.card",
      "front_md": "Edit-config do candidate zakończyło się sukcesem, lecz running nie zmieniło się; commit nie wysłano.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Edycja candidate nie jest sama w sobie zatwierdzeniem do running.\n\n**Rozpoznanie:** Zmiana pozostaje w candidate datastore.\n\n**Działanie:** Po walidacji wykonać commit zgodnie ze wspieranymi capabilities.\n\n**Sprawdzenie:** Odczyt running potwierdza zatwierdzoną konfigurację.",
      "example": "Odczyt running potwierdza zatwierdzoną konfigurację."
    }
