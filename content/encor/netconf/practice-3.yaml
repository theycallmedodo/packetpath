      ],
      "id": "encor.netconf.practice.case-01.3.card",
      "front_md": "Klient próbuje NETCONF over SSH na nieaktywnym porcie 22; urządzenie udostępnia subsystem na 830.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Dostęp do zwykłego SSH CLI nie jest tożsamy z sesją NETCONF.\n\n**Rozpoznanie:** Klient nie trafia do skonfigurowanego endpointu NETCONF.\n\n**Działanie:** Połączyć się z właściwym portem i subsystemem NETCONF.\n\n**Sprawdzenie:** Sesja wymienia komunikaty hello NETCONF.",
      "example": "Sesja wymienia komunikaty hello NETCONF."
    },
    {
      "revision": 1,
      "title": "Brak capability — weryfikacja",
      "skills": [
        "encor.netconf.case-02",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://developer.cisco.com/docs/ios-xe-voip/getting-started/"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/26x/26x-programmability-cg/netconf_protocol.html"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "NETCONF — RFC 6241",
          "url": "https://www.rfc-editor.org/rfc/rfc6241"
        }
      ],
      "id": "encor.netconf.practice.case-02.3.card",
      "front_md": "Serwer w hello nie ogłasza candidate, a klient próbuje edytować candidate datastore.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Hello określa możliwości sesji; klient nie powinien ich zgadywać.\n\n**Rozpoznanie:** Klient zakłada niewspieraną capability.\n\n**Działanie:** Dobrać operację i datastore do faktycznie ogłoszonych capabilities.\n\n**Sprawdzenie:** Wybrany datastore jest wspierany i operacja nie kończy się błędem braku capability.",
      "example": "Wybrany datastore jest wspierany i operacja nie kończy się błędem braku capability."
    },
    {
      "revision": 1,
      "title": "Lock zajęty — weryfikacja",
      "skills": [
        "encor.netconf.case-03",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://developer.cisco.com/docs/ios-xe-voip/getting-started/"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/26x/26x-programmability-cg/netconf_protocol.html"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "NETCONF — RFC 6241",
          "url": "https://www.rfc-editor.org/rfc/rfc6241"
        }
      ],
      "id": "encor.netconf.practice.case-03.3.card",
      "front_md": "Lock datastore zwraca lock-denied, bo inna sesja trzyma blokadę.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Blokada koordynuje współbieżne modyfikacje konfiguracji.\n\n**Rozpoznanie:** Datastore jest zablokowany przez innego klienta.\n\n**Działanie:** Ustalić właściciela i skoordynować zwolnienie blokady bez ślepego nadpisywania.\n\n**Sprawdzenie:** Po legalnym zwolnieniu lock klient uzyskuje własną blokadę.",
      "example": "Po legalnym zwolnieniu lock klient uzyskuje własną blokadę."
    },
    {
      "revision": 1,
      "title": "RPC error — weryfikacja",
      "skills": [
        "encor.netconf.case-04",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://developer.cisco.com/docs/ios-xe-voip/getting-started/"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/26x/26x-programmability-cg/netconf_protocol.html"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "NETCONF — RFC 6241",
          "url": "https://www.rfc-editor.org/rfc/rfc6241"
        }
      ],
      "id": "encor.netconf.practice.case-04.3.card",
      "front_md": "Transport SSH działa, ale edit-config zwraca rpc-error z bad-element.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Sukces transportu nie oznacza poprawności operacji modelowanej.\n\n**Rozpoznanie:** Serwer odrzucił treść operacji zgodnie z modelem.\n\n**Działanie:** Sprawdzić error-path, namespace i strukturę elementu względem modelu.\n\n**Sprawdzenie:** Poprawiony RPC kończy się sukcesem i odczyt potwierdza zamierzoną zmianę.",
      "example": "Poprawiony RPC kończy się sukcesem i odczyt potwierdza zamierzoną zmianę."
    },
    {
      "revision": 1,
      "title": "Get-config a get — weryfikacja",
      "skills": [
        "encor.netconf.case-05",
        "practice.3"
      ],
      "sources": [
        {
