          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/26x/26x-programmability-cg/netconf_protocol.html"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "NETCONF — RFC 6241",
          "url": "https://www.rfc-editor.org/rfc/rfc6241"
        }
      ],
      "id": "encor.netconf.practice.case-05.3.card",
      "front_md": "Operator potrzebuje także danych operacyjnych, lecz używa wyłącznie get-config.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "NETCONF rozróżnia zakres odczytu konfiguracji i danych operacyjnych.\n\n**Rozpoznanie:** Wybrano operację ograniczoną do konfiguracji.\n\n**Działanie:** Użyć wspieranej operacji odczytu obejmującej wymagany stan operacyjny.\n\n**Sprawdzenie:** Odpowiedź zawiera żądane dane stanu, nie tylko konfigurację.",
      "example": "Odpowiedź zawiera żądane dane stanu, nie tylko konfigurację."
    },
