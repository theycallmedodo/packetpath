      "title": "Dwa zgłoszenia 1 — rozpoznanie",
      "skills": [
        "encor.netconf.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://developer.cisco.com/docs/ios-xe-voip/getting-started/"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/26x/26x-programmability-cg/netconf_protocol.html"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "NETCONF — RFC 6241",
          "url": "https://www.rfc-editor.org/rfc/rfc6241"
        }
      ],
      "id": "encor.netconf.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nKlient próbuje NETCONF over SSH na nieaktywnym porcie 22; urządzenie udostępnia subsystem na 830.\n\n**Zgłoszenie II**\n\nSerwer w hello nie ogłasza candidate, a klient próbuje edytować candidate datastore.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Klient nie trafia do skonfigurowanego endpointu NETCONF. Połączyć się z właściwym portem i subsystemem NETCONF.\n\n**Sprawdzenie I:** Sesja wymienia komunikaty hello NETCONF.\n\n**Zgłoszenie II:** Klient zakłada niewspieraną capability. Dobrać operację i datastore do faktycznie ogłoszonych capabilities.\n\n**Sprawdzenie II:** Wybrany datastore jest wspierany i operacja nie kończy się błędem braku capability.\n\n**Zależności:** Dostęp do zwykłego SSH CLI nie jest tożsamy z sesją NETCONF. Hello określa możliwości sesji; klient nie powinien ich zgadywać.",
      "example": "I — Klient nie trafia do skonfigurowanego endpointu NETCONF.\n\nII — Klient zakłada niewspieraną capability."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "encor.netconf.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://developer.cisco.com/docs/ios-xe-voip/getting-started/"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/26x/26x-programmability-cg/netconf_protocol.html"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "NETCONF — RFC 6241",
          "url": "https://www.rfc-editor.org/rfc/rfc6241"
        }
      ],
      "id": "encor.netconf.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nLock datastore zwraca lock-denied, bo inna sesja trzyma blokadę.\n\n**Zgłoszenie II**\n\nTransport SSH działa, ale edit-config zwraca rpc-error z bad-element.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Datastore jest zablokowany przez innego klienta. Ustalić właściciela i skoordynować zwolnienie blokady bez ślepego nadpisywania.\n\n**Sprawdzenie I:** Po legalnym zwolnieniu lock klient uzyskuje własną blokadę.\n\n**Zgłoszenie II:** Serwer odrzucił treść operacji zgodnie z modelem. Sprawdzić error-path, namespace i strukturę elementu względem modelu.\n\n**Sprawdzenie II:** Poprawiony RPC kończy się sukcesem i odczyt potwierdza zamierzoną zmianę.\n\n**Zależności:** Blokada koordynuje współbieżne modyfikacje konfiguracji. Sukces transportu nie oznacza poprawności operacji modelowanej.",
      "example": "I — Datastore jest zablokowany przez innego klienta.\n\nII — Serwer odrzucił treść operacji zgodnie z modelem."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "encor.netconf.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://developer.cisco.com/docs/ios-xe-voip/getting-started/"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/26x/26x-programmability-cg/netconf_protocol.html"
        },
        {
          "title": "Dokumentacja Cisco — NETCONF — sesje, możliwości i operacje",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "NETCONF — RFC 6241",
          "url": "https://www.rfc-editor.org/rfc/rfc6241"
        }
      ],
      "id": "encor.netconf.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nOperator potrzebuje także danych operacyjnych, lecz używa wyłącznie get-config.\n\n**Zgłoszenie II**\n\nEdit-config do candidate zakończyło się sukcesem, lecz running nie zmieniło się; commit nie wysłano.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Wybrano operację ograniczoną do konfiguracji. Użyć wspieranej operacji odczytu obejmującej wymagany stan operacyjny.\n\n**Sprawdzenie I:** Odpowiedź zawiera żądane dane stanu, nie tylko konfigurację.\n\n**Zgłoszenie II:** Zmiana pozostaje w candidate datastore. Po walidacji wykonać commit zgodnie ze wspieranymi capabilities.\n\n**Sprawdzenie II:** Odczyt running potwierdza zatwierdzoną konfigurację.\n\n**Zależności:** NETCONF rozróżnia zakres odczytu konfiguracji i danych operacyjnych. Edycja candidate nie jest sama w sobie zatwierdzeniem do running.",
      "example": "I — Wybrano operację ograniczoną do konfiguracji.\n\nII — Zmiana pozostaje w candidate datastore."
    },
