      "front_md": "Lokalny AS 65001 otrzymuje reklamę z AS_PATH zawierającym 65001. Nie skonfigurowano wyjątków.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Wykrycie własnego AS w AS_PATH zapobiega przyjmowaniu typowej pętli między AS.\n\n**Rozpoznanie:** Zadziałała standardowa ochrona przed pętlą AS.\n\n**Działanie:** Sprawdzić przyczynę powrotu reklamy i projekt zamiast automatycznie wyłączać ochronę.\n\n**Sprawdzenie:** Prawidłowa ścieżka nie zawiera niezamierzonego powrotu lokalnego AS.",
