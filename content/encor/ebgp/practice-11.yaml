      "front_md": "Sesja działa i przyjęto 0.0.0.0/0, ale operator szuka pełnej tablicy Internetu, której nie zamówiono.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Liczba prefiksów sama nie ocenia poprawności bez znajomości kontraktu routingu.\n\n**Rozpoznanie:** Sąsiad zgodnie z usługą dostarcza tylko trasę domyślną.\n\n**Działanie:** Ocenić działanie default i uzgodniony zakres reklam.\n\n**Sprawdzenie:** Prefix count odpowiada zamówionej usłudze, a default prowadzi do ISP.",
