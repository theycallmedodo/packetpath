        "encor.ebgp.case-13",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — eBGP — sąsiedztwo i wybór trasy",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/13753-25.html"
        },
        {
          "title": "Cisco — BGP case studies",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/26634-bgp-toc.html"
        },
        {
          "title": "Cisco — BGP command reference",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/iproute_bgp/command/reference/irg_book/irg_bgp3.html"
        }
      ],
      "id": "encor.ebgp.practice.case-13.4.card",
      "front_md": "Dwie poprawne ścieżki: A weight 200 i local-pref 100, B weight 0 i local-pref 300. Inne warunki nie dyskwalifikują ścieżek.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Weight jest porównywany przed local preference i ma lokalny zasięg.\n\n**Rozpoznanie:** Cisco preferuje A przez wyższy weight.\n\n**Działanie:** Oczekiwać wyboru A na tym routerze albo świadomie ujednolicić weight przed oceną LP.\n\n**Sprawdzenie:** Best-path wskazuje A mimo wyższego local-pref B.",
      "example": "Weight jest porównywany przed local preference i ma lokalny zasięg."
    },
    {
      "revision": 1,
      "title": "LP przed długością — zależności",
      "skills": [
        "encor.ebgp.case-14",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — eBGP — sąsiedztwo i wybór trasy",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/13753-25.html"
        },
        {
          "title": "Cisco — BGP case studies",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/26634-bgp-toc.html"
        },
        {
          "title": "Cisco — BGP command reference",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/iproute_bgp/command/reference/irg_book/irg_bgp3.html"
        }
      ],
      "id": "encor.ebgp.practice.case-14.4.card",
      "front_md": "Obie poprawne ścieżki mają weight 0 i nie są lokalne. A ma LP 200 oraz cztery AS, B LP 100 oraz jeden AS.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Local preference ma pierwszeństwo przed długością AS_PATH.\n\n**Rozpoznanie:** Wyższy local-pref A rozstrzyga przed długością AS_PATH.\n\n**Działanie:** Jeśli projekt preferuje A, zachować tę politykę.\n\n**Sprawdzenie:** A jest best-path dla tego prefiksu.",
      "example": "Local preference ma pierwszeństwo przed długością AS_PATH."
    },
