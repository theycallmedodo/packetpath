      "id": "encor.ebgp.practice.case-17.4.card",
      "front_md": "Dwie poprawne ścieżki od tego samego sąsiedniego AS mają równe wcześniejsze kryteria; MED A=50, B=100.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "MED preferuje mniejszą wartość, gdy ścieżki podlegają jego porównaniu.\n\n**Rozpoznanie:** Niższy MED A rozstrzyga dla porównywalnych ścieżek.\n\n**Działanie:** Oczekiwać wyboru A w tym konkretnym porównaniu.\n\n**Sprawdzenie:** Best-path wskazuje ścieżkę z MED 50.",
      "example": "MED preferuje mniejszą wartość, gdy ścieżki podlegają jego porównaniu."
