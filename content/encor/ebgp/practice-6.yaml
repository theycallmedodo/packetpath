      "id": "encor.ebgp.practice.case-30.2.card",
      "front_md": "Route-map eksportu ma jedną permit sequence matchującą tylko /24. Inne wymagane prefiksy nie pasują do żadnej sekwencji.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Polityka eksportu wymaga świadomego określenia także losu niedopasowanych tras.\n\n**Rozpoznanie:** Niedopasowane reklamy są odrzucane przez politykę.\n\n**Działanie:** Dodać jawne, ograniczone dopuszczenia wymaganych prefiksów.\n\n**Sprawdzenie:** Advertised-routes zawiera zatwierdzony zestaw bez niezamierzonych reklam.",
      "example": "Dodać jawne, ograniczone dopuszczenia wymaganych prefiksów."
