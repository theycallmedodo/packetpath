      ],
      "id": "encor.ebgp.practice.case-25.2.card",
      "front_md": "RIB ma /16 przez ISP-A i /24 przez ISP-B. Host należy do obu, a A ma atrakcyjniejsze atrybuty dla /16.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Atrybuty BGP porównują ścieżki danego prefiksu, nie zastępują longest prefix match.\n\n**Rozpoznanie:** Dłuższy prefiks /24 decyduje o przekazywaniu do hosta.\n\n**Działanie:** Analizować wybór ścieżki oddzielnie dla każdego prefiksu.\n\n**Sprawdzenie:** Lookup hosta wskazuje /24 przez B.",
      "example": "Analizować wybór ścieżki oddzielnie dla każdego prefiksu."
    },
