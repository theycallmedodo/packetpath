      "id": "encor.ebgp.practice.case-32.2.card",
      "front_md": "BGP i RIB zawierają poprawną trasę, ale firewall dalej odrzuca dane użytkownika.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Obecność trasy nie jest pełnym testem działania usługi.\n\n**Rozpoznanie:** Control-plane działa, natomiast problem leży na ścieżce danych.\n\n**Działanie:** Sprawdzić liczniki ACL, forwarding i drogę powrotną dla konkretnego przepływu.\n\n**Sprawdzenie:** Pakiety użytkownika przechodzą po poprawieniu właściwej polityki danych.",
