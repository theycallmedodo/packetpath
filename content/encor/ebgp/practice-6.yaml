      "front_md": "CE wysyła ruch przez poprawny default BGP, ale jego LAN nie jest ogłaszany ani tłumaczony; ISP nie ma drogi do źródła.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
