      "front_md": "Route-map z prepend przypięto inbound, ale celem było wydłużenie własnej reklamy wysyłanej do ISP.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "In i out w BGP odnoszą się do kierunku przetwarzania reklam względem routera.\n\n**Rozpoznanie:** Polityka jest zastosowana w kierunku niezgodnym z zamiarem eksportu.\n\n**Działanie:** Zastosować właściwą politykę do reklam outbound zgodnie z projektem.\n\n**Sprawdzenie:** Po stronie odbiorcy widoczny jest zamierzony prepend własnego prefiksu.",
      "example": "Zastosować właściwą politykę do reklam outbound zgodnie z projektem."
