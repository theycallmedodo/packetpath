      "id": "encor.ebgp.practice.case-29.2.card",
      "front_md": "Sesja jest Established i ma 0 prefiksów. Nie uzgodniono jeszcze, czy peer ma cokolwiek ogłaszać.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Established nie gwarantuje obecności prefiksów i zero nie dowodzi awarii TCP.\n\n**Rozpoznanie:** Stan transportu jest poprawny, a zero reklam wymaga oceny polityki i źródeł tras.\n\n**Działanie:** Sprawdzić AF, lokalne źródła reklam oraz filtry obu stron.\n\n**Sprawdzenie:** Oczekiwany testowy prefiks pojawia się po zapewnieniu wszystkich warunków reklamy.",
      "example": "Sprawdzić AF, lokalne źródła reklam oraz filtry obu stron."
    },
