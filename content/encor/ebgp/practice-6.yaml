      ],
      "id": "encor.ebgp.practice.case-26.2.card",
      "front_md": "Po wzroście liczby reklam do skonfigurowanego limitu maximum-prefix sesja została wyłączona ochronnie.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Maximum-prefix chroni przed nieoczekiwanym zakresem reklam i wymaga świadomej oceny incydentu.\n\n**Rozpoznanie:** Zadziałała ochrona przed nadmierną liczbą prefiksów.\n\n**Działanie:** Zweryfikować zakres reklam i uzasadniony limit przed przywróceniem sesji.\n\n**Sprawdzenie:** Po korekcie sesja działa w zatwierdzonym limicie.",
      "example": "Zweryfikować zakres reklam i uzasadniony limit przed przywróceniem sesji."
    },
    {
      "revision": 1,
      "title": "Soft refresh — działanie",
