      "sources": [
        {
          "title": "Dokumentacja Cisco — eBGP — sąsiedztwo i wybór trasy",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/13753-25.html"
        },
        {
          "title": "Cisco — BGP case studies",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/border-gateway-protocol-bgp/26634-bgp-toc.html"
        },
        {
          "title": "Cisco — BGP command reference",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/iproute_bgp/command/reference/irg_book/irg_bgp3.html"
        }
      ],
      "id": "encor.ebgp.practice.case-27.2.card",
      "front_md": "Zmieniono filtr inbound. Peer wspiera route refresh, a operator chce ponownie przetworzyć reklamy bez twardego resetu.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Route refresh pozwala ponowić reklamy bez pełnego restartu sąsiedztwa.\n\n**Rozpoznanie:** Potrzebne jest odświeżenie wejściowych reklam zgodnie z nową polityką.\n\n**Działanie:** Użyć właściwego soft inbound refresh dla wskazanego peera.\n\n**Sprawdzenie:** Nowa polityka jest zastosowana bez zerwania transportowej sesji BGP.",
      "example": "Użyć właściwego soft inbound refresh dla wskazanego peera."
    },
