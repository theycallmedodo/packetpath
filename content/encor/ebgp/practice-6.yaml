        {
          "title": "Cisco — BGP command reference",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/iproute_bgp/command/reference/irg_book/irg_bgp3.html"
        }
      ],
      "id": "encor.ebgp.practice.case-28.2.card",
      "front_md": "Router przestał otrzymywać wiadomości utrzymujące sesję. Po wygaśnięciu hold time usuwa sąsiedztwo.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Hold timer wykrywa brak aktywności protokołu; nie wskazuje sam źródła utraty wiadomości.\n\n**Rozpoznanie:** Wygasł uzgodniony czas oczekiwania na wiadomości BGP.\n\n**Działanie:** Sprawdzić utraty transportu i obciążenie control-plane w czasie awarii.\n\n**Sprawdzenie:** Wiadomości wracają w wymaganym czasie i sesja pozostaje stabilna.",
      "example": "Sprawdzić utraty transportu i obciążenie control-plane w czasie awarii."
    },
