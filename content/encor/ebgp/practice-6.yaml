      "id": "encor.ebgp.practice.case-33.2.card",
      "front_md": "Ogłaszany network /24 miał dokładną trasę connected. Po awarii interfejsu trasa znika i nie ma zastępstwa.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Originowanie network zależy od aktualnej obecności dokładnej trasy w RIB.\n\n**Rozpoznanie:** Zniknął warunek originowania prefiksu przez network.\n\n**Działanie:** Naprawić właściwy LAN zamiast maskować awarię nieuzasadnioną trasą statyczną.\n\n**Sprawdzenie:** Po powrocie rzeczywistej trasy /24 reklama wraca do BGP.",
