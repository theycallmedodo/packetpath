      "id": "encor.ebgp.practice.case-20.3.card",
      "front_md": "Administrator zwiększa local-pref importowanej trasy, aby wymusić wejście ruchu z Internetu przez konkretnego ISP.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Local preference wyraża wewnętrzną preferencję wyjścia z AS.\n\n**Rozpoznanie:** Zmiana steruje wyborem wyjścia lokalnego AS, nie bezpośrednio wyborem obcych AS.\n\n**Działanie:** Rozdzielić politykę ruchu wychodzącego od ogłaszanych wskazówek dla ruchu przychodzącego.\n\n**Sprawdzenie:** Zmiana LP wpływa na wyjście z AS, bez gwarancji zmiany wejścia od ISP.",
      "example": "Zmiana LP wpływa na wyjście z AS, bez gwarancji zmiany wejścia od ISP."
    },
