      ],
      "id": "encor.ebgp.practice.case-21.3.card",
      "front_md": "Dodano prepend na zapasowym ISP, lecz część Internetu nadal wybiera tę drogę przez własny wyższy local-pref.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Prepend jest wskazówką wpływającą na wybór innych AS, a nie nakazem.\n\n**Rozpoznanie:** Zewnętrzna polityka może przeważyć nad długością AS_PATH.\n\n**Działanie:** Zweryfikować reklamy i politykę operatora, nie traktować prepend jako gwarancji.\n\n**Sprawdzenie:** Zdalny wybór jest wyjaśniony wcześniejszym atrybutem mimo wydłużonego AS_PATH.",
      "example": "Zdalny wybór jest wyjaśniony wcześniejszym atrybutem mimo wydłużonego AS_PATH."
