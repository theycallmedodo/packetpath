      "id": "encor.ebgp.practice.case-17.3.card",
      "front_md": "Dwie poprawne ścieżki od tego samego sąsiedniego AS mają równe wcześniejsze kryteria; MED A=50, B=100.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "MED preferuje mniejszą wartość, gdy ścieżki podlegają jego porównaniu.\n\n**Rozpoznanie:** Niższy MED A rozstrzyga dla porównywalnych ścieżek.\n\n**Działanie:** Oczekiwać wyboru A w tym konkretnym porównaniu.\n\n**Sprawdzenie:** Best-path wskazuje ścieżkę z MED 50.",
      "example": "Best-path wskazuje ścieżkę z MED 50."
    },
