      "id": "encor.ebgp.practice.case-23.3.card",
      "front_md": "BGP wybrało najlepszą ścieżkę do /24, ale w RIB jest statyczna do tego samego /24 z niższym AD.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Najlepsza ścieżka w BGP nie zawsze jest aktywną trasą systemowej tablicy routingu.\n\n**Rozpoznanie:** BGP best-path przegrało instalację z innym źródłem trasy.\n\n**Działanie:** Porównać źródła RIB i ich AD dla dokładnie tego prefiksu.\n\n**Sprawdzenie:** RIB wskazuje statyczną, a status BGP wyjaśnia brak instalacji.",
