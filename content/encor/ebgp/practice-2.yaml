      "id": "encor.ebgp.practice.case-19.1.card",
      "front_md": "R1 ustawia weight 500 na trasie i wysyła ją do R2. Operator oczekuje, że R2 też zobaczy weight 500.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Weight jest lokalnym parametrem wyboru Cisco, nie atrybutem propagowanym do peerów.\n\n**Rozpoznanie:** Weight nie jest przenoszonym między routerami atrybutem BGP.\n\n**Działanie:** Dla polityki obejmującej AS użyć właściwego mechanizmu, np. local preference w obrębie AS.\n\n**Sprawdzenie:** R2 nie dziedziczy lokalnego weight R1.",
      "example": "Weight nie jest przenoszonym między routerami atrybutem BGP."
