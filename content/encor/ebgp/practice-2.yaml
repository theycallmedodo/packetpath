        {
          "title": "Cisco — BGP command reference",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/iproute_bgp/command/reference/irg_book/irg_bgp3.html"
        }
      ],
      "id": "encor.ebgp.practice.case-15.1.card",
      "front_md": "Dwie poprawne nielokalne ścieżki mają równe weight i LP. A AS_PATH 65010 65020, B 65030 65040 65050. Nie wyłączono porównania długości.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Długość AS_PATH rozstrzyga dopiero po wcześniejszych kryteriach.\n\n**Rozpoznanie:** A ma krótszy AS_PATH.\n\n**Działanie:** Oczekiwać wyboru A przy podanych równych wcześniejszych kryteriach.\n\n**Sprawdzenie:** Best-path wskazuje ścieżkę z dwoma AS.",
      "example": "A ma krótszy AS_PATH."
    },
