      ],
      "id": "encor.ebgp.practice.case-13.1.card",
      "front_md": "Dwie poprawne ścieżki: A weight 200 i local-pref 100, B weight 0 i local-pref 300. Inne warunki nie dyskwalifikują ścieżek.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Weight jest porównywany przed local preference i ma lokalny zasięg.\n\n**Rozpoznanie:** Cisco preferuje A przez wyższy weight.\n\n**Działanie:** Oczekiwać wyboru A na tym routerze albo świadomie ujednolicić weight przed oceną LP.\n\n**Sprawdzenie:** Best-path wskazuje A mimo wyższego local-pref B.",
      "example": "Cisco preferuje A przez wyższy weight."
    },
    {
      "revision": 1,
      "title": "LP przed długością — rozpoznanie",
      "skills": [
        "encor.ebgp.case-14",
