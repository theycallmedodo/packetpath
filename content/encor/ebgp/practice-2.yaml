      "id": "encor.ebgp.practice.case-16.1.card",
      "front_md": "Równe wcześniejsze atrybuty i długość AS_PATH; A ma origin IGP, B incomplete.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Kod origin opisuje pochodzenie reklamy, nie aktualny protokół transportujący pakiety.\n\n**Rozpoznanie:** Origin IGP jest preferowany przed incomplete.\n\n**Działanie:** Oczekiwać wyboru A, jeśli wszystkie wcześniejsze warunki są równe.\n\n**Sprawdzenie:** Ścieżka z kodem i jest preferowana względem ? w tym porównaniu.",
      "example": "Origin IGP jest preferowany przed incomplete."
    },
