      "id": "encor.ebgp.practice.case-18.1.card",
      "front_md": "A i B pochodzą z różnych sąsiednich AS. Operator zakłada, że przy domyślnych ustawieniach zawsze wygra niższy MED.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Zakres porównywania atrybutu jest równie ważny jak jego wartość.\n\n**Rozpoznanie:** Domyślnie MED nie musi być porównywany między różnymi sąsiednimi AS.\n\n**Działanie:** Sprawdzić reguły porównywania MED i pozostałe atrybuty przed wskazaniem zwycięzcy.\n\n**Sprawdzenie:** Analiza nie wybiera ścieżki wyłącznie z dwóch wartości MED z różnych AS.",
      "example": "Domyślnie MED nie musi być porównywany między różnymi sąsiednimi AS."
