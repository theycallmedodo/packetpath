    {
      "revision": 1,
      "title": "AD między protokołami — zależności",
      "skills": [
        "encor.routing-compare.case-01",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.case-01.4.card",
      "front_md": "Ten sam /24 jest poprawnie dostępny z wewnętrznego EIGRP AD 90 i OSPF AD 110 przy domyślnych wartościach.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "AD porównuje źródła tras do tego samego prefiksu, nie ich metryki w różnych jednostkach.\n\n**Rozpoznanie:** RIB preferuje źródło z niższym AD.\n\n**Działanie:** Oczekiwać instalacji trasy EIGRP dla tego samego prefiksu.\n\n**Sprawdzenie:** Show ip route wskazuje EIGRP jako aktywne źródło /24.",
      "example": "AD porównuje źródła tras do tego samego prefiksu, nie ich metryki w różnych jednostkach."
    },
    {
      "revision": 1,
      "title": "Nieporównywalne metryki — zależności",
      "skills": [
        "encor.routing-compare.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.case-02.4.card",
      "front_md": "Operator porównuje koszt OSPF 20 z metryką EIGRP 256000 i twierdzi, że OSPF zawsze wygra.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Liczby metryk OSPF i EIGRP nie służą do bezpośredniego porównania między nimi.\n\n**Rozpoznanie:** Metryki różnych protokołów nie mają wspólnej skali.\n\n**Działanie:** Rozdzielić wybór w protokole od wyboru źródła trasy przez AD.\n\n**Sprawdzenie:** Analiza wskazuje AD jako kryterium między protokołami dla identycznego prefiksu.",
      "example": "Liczby metryk OSPF i EIGRP nie służą do bezpośredniego porównania między nimi."
    },
    {
      "revision": 1,
      "title": "Feasible successor — zależności",
      "skills": [
        "encor.routing-compare.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.case-03.4.card",
      "front_md": "EIGRP ma successor i kandydata z reported distance mniejszym od bieżącej feasible distance.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Warunek feasibility zapewnia lokalnie rozpoznawalną bezpętlową alternatywę.\n\n**Rozpoznanie:** Kandydat spełnia warunek feasibility.\n\n**Działanie:** Sprawdzić topology table i możliwość użycia kandydata jako feasible successor.\n\n**Sprawdzenie:** RD kandydata jest ściśle mniejsze od FD.",
      "example": "Warunek feasibility zapewnia lokalnie rozpoznawalną bezpętlową alternatywę."
    },
    {
      "revision": 1,
      "title": "Brak feasible successor — zależności",
      "skills": [
        "encor.routing-compare.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.case-04.4.card",
      "front_md": "Po utracie successor nie ma kandydata spełniającego feasibility, choć w sieci może istnieć droga.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Brak feasible successor nie oznacza automatycznie, że żadna droga nie istnieje.\n\n**Rozpoznanie:** Router nie ma gotowej lokalnie potwierdzonej alternatywy.\n\n**Działanie:** Analizować przejście DUAL w active i wymianę query/reply.\n\n**Sprawdzenie:** Po zakończeniu obliczenia trasa wraca do passive z poprawnym wynikiem.",
      "example": "Brak feasible successor nie oznacza automatycznie, że żadna droga nie istnieje."
    },
    {
      "revision": 1,
      "title": "OSPF LSDB — zależności",
      "skills": [
        "encor.routing-compare.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.case-05.4.card",
      "front_md": "Dwa routery w tym samym obszarze mają zsynchronizowaną LSDB, lecz inne najlepsze drogi do prefiksu.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Wspólna baza topologii nie oznacza identycznych tablic routingu.\n\n**Rozpoznanie:** Każdy router liczy SPF z własnego położenia.\n\n**Działanie:** Porównać koszty od każdego routera zamiast oczekiwać identycznego next hop.\n\n**Sprawdzenie:** Wybrane drogi odpowiadają lokalnym drzewom najkrótszych ścieżek.",
      "example": "Wspólna baza topologii nie oznacza identycznych tablic routingu."
    },
    {
      "revision": 1,
      "title": "Prefiks przed AD — zależności",
      "skills": [
        "encor.routing-compare.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.case-06.4.card",
      "front_md": "OSPF oferuje /24, a EIGRP /16 obejmujące ten sam host. Obie trasy są w RIB.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Longest prefix match dotyczy przekazywania, a AD wyboru źródła dla konkretnego prefiksu.\n\n**Rozpoznanie:** Do pakietu pasuje bardziej szczegółowe /24.\n\n**Działanie:** Przekazać pakiet według /24 niezależnie od niższego AD trasy /16.\n\n**Sprawdzenie:** Lookup adresu hosta wskazuje /24 OSPF.",
      "example": "Longest prefix match dotyczy przekazywania, a AD wyboru źródła dla konkretnego prefiksu."
    }
  ],
