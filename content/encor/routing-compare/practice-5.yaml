    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — rozpoznanie",
      "skills": [
        "encor.routing-compare.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nTen sam /24 jest poprawnie dostępny z wewnętrznego EIGRP AD 90 i OSPF AD 110 przy domyślnych wartościach.\n\n**Zgłoszenie II**\n\nOperator porównuje koszt OSPF 20 z metryką EIGRP 256000 i twierdzi, że OSPF zawsze wygra.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** RIB preferuje źródło z niższym AD. Oczekiwać instalacji trasy EIGRP dla tego samego prefiksu.\n\n**Sprawdzenie I:** Show ip route wskazuje EIGRP jako aktywne źródło /24.\n\n**Zgłoszenie II:** Metryki różnych protokołów nie mają wspólnej skali. Rozdzielić wybór w protokole od wyboru źródła trasy przez AD.\n\n**Sprawdzenie II:** Analiza wskazuje AD jako kryterium między protokołami dla identycznego prefiksu.\n\n**Zależności:** AD porównuje źródła tras do tego samego prefiksu, nie ich metryki w różnych jednostkach. Liczby metryk OSPF i EIGRP nie służą do bezpośredniego porównania między nimi.",
      "example": "I — RIB preferuje źródło z niższym AD.\n\nII — Metryki różnych protokołów nie mają wspólnej skali."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "encor.routing-compare.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nEIGRP ma successor i kandydata z reported distance mniejszym od bieżącej feasible distance.\n\n**Zgłoszenie II**\n\nPo utracie successor nie ma kandydata spełniającego feasibility, choć w sieci może istnieć droga.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Kandydat spełnia warunek feasibility. Sprawdzić topology table i możliwość użycia kandydata jako feasible successor.\n\n**Sprawdzenie I:** RD kandydata jest ściśle mniejsze od FD.\n\n**Zgłoszenie II:** Router nie ma gotowej lokalnie potwierdzonej alternatywy. Analizować przejście DUAL w active i wymianę query/reply.\n\n**Sprawdzenie II:** Po zakończeniu obliczenia trasa wraca do passive z poprawnym wynikiem.\n\n**Zależności:** Warunek feasibility zapewnia lokalnie rozpoznawalną bezpętlową alternatywę. Brak feasible successor nie oznacza automatycznie, że żadna droga nie istnieje.",
      "example": "I — Kandydat spełnia warunek feasibility.\n\nII — Router nie ma gotowej lokalnie potwierdzonej alternatywy."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "encor.routing-compare.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/enhanced-interior-gateway-routing-protocol-eigrp/16406-eigrp-toc.html"
        },
        {
          "title": "Dokumentacja Cisco — EIGRP a OSPF — metryki i zbieżność",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        }
      ],
      "id": "encor.routing-compare.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nDwa routery w tym samym obszarze mają zsynchronizowaną LSDB, lecz inne najlepsze drogi do prefiksu.\n\n**Zgłoszenie II**\n\nOSPF oferuje /24, a EIGRP /16 obejmujące ten sam host. Obie trasy są w RIB.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Każdy router liczy SPF z własnego położenia. Porównać koszty od każdego routera zamiast oczekiwać identycznego next hop.\n\n**Sprawdzenie I:** Wybrane drogi odpowiadają lokalnym drzewom najkrótszych ścieżek.\n\n**Zgłoszenie II:** Do pakietu pasuje bardziej szczegółowe /24. Przekazać pakiet według /24 niezależnie od niższego AD trasy /16.\n\n**Sprawdzenie II:** Lookup adresu hosta wskazuje /24 OSPF.\n\n**Zależności:** Wspólna baza topologii nie oznacza identycznych tablic routingu. Longest prefix match dotyczy przekazywania, a AD wyboru źródła dla konkretnego prefiksu.",
      "example": "I — Każdy router liczy SPF z własnego położenia.\n\nII — Do pakietu pasuje bardziej szczegółowe /24."
    },
