    {
      "revision": 1,
      "title": "Brak schedule — zależności",
      "skills": [
        "encor.ip-sla.case-01",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.case-01.4.card",
      "front_md": "Operacja IP SLA istnieje, lecz nie jest uruchomiona harmonogramem i nie generuje pomiarów.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Definicja operacji i harmonogram jej wykonywania są oddzielne.\n\n**Rozpoznanie:** Zdefiniowany pomiar nie został aktywowany.\n\n**Działanie:** Uruchomić właściwą operację przez ip sla schedule.\n\n**Sprawdzenie:** Show ip sla statistics pokazuje aktualne wykonania i wyniki.",
      "example": "Definicja operacji i harmonogram jej wykonywania są oddzielne."
    },
    {
      "revision": 1,
      "title": "Złe źródło — zależności",
      "skills": [
        "encor.ip-sla.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.case-02.4.card",
      "front_md": "Probe wychodzi z adresu, dla którego cel nie ma drogi powrotnej. Usługa z właściwego LAN działa.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Wynik IP SLA zależy od adresu źródłowego i jego routingu.\n\n**Rozpoznanie:** Test mierzy inny przepływ niż zamierzona usługa.\n\n**Działanie:** Ustawić odpowiednie source-interface lub źródło operacji.\n\n**Sprawdzenie:** Odpowiedzi wracają do oczekiwanego źródła pomiaru.",
      "example": "Wynik IP SLA zależy od adresu źródłowego i jego routingu."
    },
    {
      "revision": 1,
      "title": "ICMP a HTTPS — zależności",
      "skills": [
        "encor.ip-sla.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.case-03.4.card",
      "front_md": "Echo do serwera odpowiada, lecz usługa HTTPS nie nasłuchuje.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Rodzaj sondy określa, co rzeczywiście mierzymy.\n\n**Rozpoznanie:** Dostępność IP nie potwierdza dostępności aplikacji.\n\n**Działanie:** Dobrać pomiar testujący wymagany transport lub usługę.\n\n**Sprawdzenie:** Test portu lub aplikacji wykrywa awarię mimo sukcesu ICMP.",
      "example": "Rodzaj sondy określa, co rzeczywiście mierzymy."
    },
    {
      "revision": 1,
      "title": "Track bez trasy — zależności",
      "skills": [
        "encor.ip-sla.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.case-04.4.card",
      "front_md": "IP SLA pokazuje timeout i track jest Down, lecz statyczna trasa nie odnosi się do tego track.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Pomiar, obiekt track i konsument track to osobne elementy konfiguracji.\n\n**Rozpoznanie:** Wynik pomiaru nie steruje analizowaną trasą.\n\n**Działanie:** Powiązać właściwy obiekt track z trasą zgodnie z projektem failover.\n\n**Sprawdzenie:** Zmiana stanu track usuwa lub przywraca tę konkretną trasę.",
      "example": "Pomiar, obiekt track i konsument track to osobne elementy konfiguracji."
    },
    {
      "revision": 1,
      "title": "Flapping — zależności",
      "skills": [
        "encor.ip-sla.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.case-05.4.card",
      "front_md": "Pojedyncze utracone probe powodują ciągłe przełączanie tras.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Histereza równoważy szybkość detekcji i stabilność przełączeń.\n\n**Rozpoznanie:** Reakcja jest zbyt czuła względem zakłóceń pomiaru.\n\n**Działanie:** Dobrać opóźnienia track i parametry sond zgodnie z wymaganiami dostępności.\n\n**Sprawdzenie:** Krótkie zakłócenie nie przełącza trasy, a trwała awaria nadal jest wykrywana.",
      "example": "Histereza równoważy szybkość detekcji i stabilność przełączeń."
    },
    {
      "revision": 1,
      "title": "Cel osiągalny przez backup — zależności",
      "skills": [
        "encor.ip-sla.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.case-06.4.card",
      "front_md": "Sonda primary po awarii zaczyna docierać przez backup i ponownie uznaje primary za zdrowe.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Pomiar stanu konkretnego łącza musi rzeczywiście korzystać z tego łącza.\n\n**Rozpoznanie:** Test nie jest ograniczony do badanej ścieżki.\n\n**Działanie:** Zapewnić sondzie drogę przez właściwe łącze i odpowiednie źródło.\n\n**Sprawdzenie:** Sonda primary pozostaje nieudana, gdy tylko primary jest uszkodzone.",
      "example": "Pomiar stanu konkretnego łącza musi rzeczywiście korzystać z tego łącza."
    }
  ],
