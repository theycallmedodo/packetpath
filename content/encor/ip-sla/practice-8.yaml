      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "encor.ip-sla.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nOperacja IP SLA istnieje, lecz nie jest uruchomiona harmonogramem i nie generuje pomiarów.\n\n**Zgłoszenie II**\n\nProbe wychodzi z adresu, dla którego cel nie ma drogi powrotnej. Usługa z właściwego LAN działa.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Zdefiniowany pomiar nie został aktywowany. Uruchomić właściwą operację przez ip sla schedule.\n\n**Sprawdzenie I:** Show ip sla statistics pokazuje aktualne wykonania i wyniki.\n\n**Zgłoszenie II:** Test mierzy inny przepływ niż zamierzona usługa. Ustawić odpowiednie source-interface lub źródło operacji.\n\n**Sprawdzenie II:** Odpowiedzi wracają do oczekiwanego źródła pomiaru.\n\n**Zależności:** Definicja operacji i harmonogram jej wykonywania są oddzielne. Wynik IP SLA zależy od adresu źródłowego i jego routingu.",
      "example": "I — Definicja operacji i harmonogram jej wykonywania są oddzielne.\n\nII — Wynik IP SLA zależy od adresu źródłowego i jego routingu."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "encor.ip-sla.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nEcho do serwera odpowiada, lecz usługa HTTPS nie nasłuchuje.\n\n**Zgłoszenie II**\n\nIP SLA pokazuje timeout i track jest Down, lecz statyczna trasa nie odnosi się do tego track.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Dostępność IP nie potwierdza dostępności aplikacji. Dobrać pomiar testujący wymagany transport lub usługę.\n\n**Sprawdzenie I:** Test portu lub aplikacji wykrywa awarię mimo sukcesu ICMP.\n\n**Zgłoszenie II:** Wynik pomiaru nie steruje analizowaną trasą. Powiązać właściwy obiekt track z trasą zgodnie z projektem failover.\n\n**Sprawdzenie II:** Zmiana stanu track usuwa lub przywraca tę konkretną trasę.\n\n**Zależności:** Rodzaj sondy określa, co rzeczywiście mierzymy. Pomiar, obiekt track i konsument track to osobne elementy konfiguracji.",
      "example": "I — Rodzaj sondy określa, co rzeczywiście mierzymy.\n\nII — Pomiar, obiekt track i konsument track to osobne elementy konfiguracji."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "encor.ip-sla.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — IP SLA — pomiary i diagnoza dostępności",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_sla_icmp_echo.html"
        }
      ],
      "id": "encor.ip-sla.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nPojedyncze utracone probe powodują ciągłe przełączanie tras.\n\n**Zgłoszenie II**\n\nSonda primary po awarii zaczyna docierać przez backup i ponownie uznaje primary za zdrowe.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Reakcja jest zbyt czuła względem zakłóceń pomiaru. Dobrać opóźnienia track i parametry sond zgodnie z wymaganiami dostępności.\n\n**Sprawdzenie I:** Krótkie zakłócenie nie przełącza trasy, a trwała awaria nadal jest wykrywana.\n\n**Zgłoszenie II:** Test nie jest ograniczony do badanej ścieżki. Zapewnić sondzie drogę przez właściwe łącze i odpowiednie źródło.\n\n**Sprawdzenie II:** Sonda primary pozostaje nieudana, gdy tylko primary jest uszkodzone.\n\n**Zależności:** Histereza równoważy szybkość detekcji i stabilność przełączeń. Pomiar stanu konkretnego łącza musi rzeczywiście korzystać z tego łącza.",
      "example": "I — Histereza równoważy szybkość detekcji i stabilność przełączeń.\n\nII — Pomiar stanu konkretnego łącza musi rzeczywiście korzystać z tego łącza."
    },
