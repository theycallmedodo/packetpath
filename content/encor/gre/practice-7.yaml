  "cards": [
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — weryfikacja",
      "skills": [
        "encor.gre.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nAdres tunnel destination nie jest osiągalny przez sieć transportową.\n\n**Zgłoszenie II**\n\nTrasa do tunnel destination wskazuje sam Tunnel0 zamiast underlay.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Brakuje osiągalności underlay dla końca tunelu. Przywrócić trasę transportową do tunnel destination.\n\n**Sprawdzenie I:** Cel tunelu jest osiągalny poza tunelem przez fizyczny transport.\n\n**Zgłoszenie II:** Tunel próbuje osiągnąć własny koniec przez siebie. Ustawić stabilną drogę do końca tunelu przez sieć transportową.\n\n**Sprawdzenie II:** Lookup destination nie wskazuje Tunnel0, a znikają objawy recursive routing.\n\n**Zależności:** Tunel GRE zależy od routingu jego zewnętrznych adresów. Droga zewnętrznej enkapsulacji nie może zależeć od tego samego tunelu.",
      "example": "I — Cel tunelu jest osiągalny poza tunelem przez fizyczny transport.\n\nII — Lookup destination nie wskazuje Tunnel0, a znikają objawy recursive routing."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "encor.gre.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nICMP między końcami działa, ale firewall odrzuca IP protocol 47.\n\n**Zgłoszenie II**\n\nMały ping przez GRE działa, duże pakiety z DF nie. Droga transportowa ma MTU 1500, a enkapsulacja dodaje narzut.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Filtr blokuje protokół GRE mimo dostępności ping. Dopuścić wymagany GRE między zatwierdzonymi końcami.\n\n**Sprawdzenie I:** Pakiety IP protocol 47 docierają w obu kierunkach.\n\n**Zgłoszenie II:** Rozmiar po enkapsulacji przekracza MTU transportu. Dopasować MTU tunelu i obsługę PMTUD, ewentualnie TCP MSS zgodnie z ruchem.\n\n**Sprawdzenie II:** Test rozmiaru z DF określa działający limit i aplikacje nie zawieszają się na dużych segmentach.\n\n**Zależności:** GRE to protokół IP 47, a nie port TCP lub UDP 47. Enkapsulacja zmniejsza przestrzeń dostępną dla pakietu wewnętrznego.",
      "example": "I — Pakiety IP protocol 47 docierają w obu kierunkach.\n\nII — Test rozmiaru z DF określa działający limit i aplikacje nie zawieszają się na dużych segmentach."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "encor.gre.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nPrzechwycenie underlay ujawnia treść pakietów wewnątrz zwykłego GRE.\n\n**Zgłoszenie II**\n\nTunnel0 pokazuje up/up bez keepalive, lecz zdalny endpoint został wyłączony.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Sam GRE nie zapewnia poufności danych. Dodać odpowiednią ochronę kryptograficzną, jeśli wymaga tego polityka.\n\n**Sprawdzenie I:** Przechwycenie transportu nie ujawnia jawnego payloadu chronionej komunikacji.\n\n**Zgłoszenie II:** Lokalny stan tunelu nie potwierdza pełnej dostępności zdalnego końca. Wykonać test tunelu i sprawdzić transport oraz zdalną konfigurację.\n\n**Sprawdzenie II:** Rzeczywisty test ruchu potwierdza lub wyklucza łączność przez tunel.\n\n**Zależności:** Enkapsulacja i szyfrowanie to odrębne funkcje. Stan interfejsu GRE bez mechanizmu kontroli nie jest dowodem end-to-end.",
      "example": "I — Przechwycenie transportu nie ujawnia jawnego payloadu chronionej komunikacji.\n\nII — Rzeczywisty test ruchu potwierdza lub wyklucza łączność przez tunel."
    },
