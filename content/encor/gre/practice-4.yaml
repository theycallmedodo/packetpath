    {
      "revision": 1,
      "title": "Underlay — zależności",
      "skills": [
        "encor.gre.case-01",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-01.4.card",
      "front_md": "Adres tunnel destination nie jest osiągalny przez sieć transportową.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Tunel GRE zależy od routingu jego zewnętrznych adresów.\n\n**Rozpoznanie:** Brakuje osiągalności underlay dla końca tunelu.\n\n**Działanie:** Przywrócić trasę transportową do tunnel destination.\n\n**Sprawdzenie:** Cel tunelu jest osiągalny poza tunelem przez fizyczny transport.",
      "example": "Tunel GRE zależy od routingu jego zewnętrznych adresów."
    },
    {
      "revision": 1,
      "title": "Rekursja — zależności",
      "skills": [
        "encor.gre.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-02.4.card",
      "front_md": "Trasa do tunnel destination wskazuje sam Tunnel0 zamiast underlay.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Droga zewnętrznej enkapsulacji nie może zależeć od tego samego tunelu.\n\n**Rozpoznanie:** Tunel próbuje osiągnąć własny koniec przez siebie.\n\n**Działanie:** Ustawić stabilną drogę do końca tunelu przez sieć transportową.\n\n**Sprawdzenie:** Lookup destination nie wskazuje Tunnel0, a znikają objawy recursive routing.",
      "example": "Droga zewnętrznej enkapsulacji nie może zależeć od tego samego tunelu."
    },
    {
      "revision": 1,
      "title": "GRE blokowane — zależności",
      "skills": [
        "encor.gre.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-03.4.card",
      "front_md": "ICMP między końcami działa, ale firewall odrzuca IP protocol 47.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "GRE to protokół IP 47, a nie port TCP lub UDP 47.\n\n**Rozpoznanie:** Filtr blokuje protokół GRE mimo dostępności ping.\n\n**Działanie:** Dopuścić wymagany GRE między zatwierdzonymi końcami.\n\n**Sprawdzenie:** Pakiety IP protocol 47 docierają w obu kierunkach.",
      "example": "GRE to protokół IP 47, a nie port TCP lub UDP 47."
    },
    {
      "revision": 1,
      "title": "Duże pakiety — zależności",
      "skills": [
        "encor.gre.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-04.4.card",
      "front_md": "Mały ping przez GRE działa, duże pakiety z DF nie. Droga transportowa ma MTU 1500, a enkapsulacja dodaje narzut.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Enkapsulacja zmniejsza przestrzeń dostępną dla pakietu wewnętrznego.\n\n**Rozpoznanie:** Rozmiar po enkapsulacji przekracza MTU transportu.\n\n**Działanie:** Dopasować MTU tunelu i obsługę PMTUD, ewentualnie TCP MSS zgodnie z ruchem.\n\n**Sprawdzenie:** Test rozmiaru z DF określa działający limit i aplikacje nie zawieszają się na dużych segmentach.",
      "example": "Enkapsulacja zmniejsza przestrzeń dostępną dla pakietu wewnętrznego."
    },
    {
      "revision": 1,
      "title": "Brak szyfrowania — zależności",
      "skills": [
        "encor.gre.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-05.4.card",
      "front_md": "Przechwycenie underlay ujawnia treść pakietów wewnątrz zwykłego GRE.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Enkapsulacja i szyfrowanie to odrębne funkcje.\n\n**Rozpoznanie:** Sam GRE nie zapewnia poufności danych.\n\n**Działanie:** Dodać odpowiednią ochronę kryptograficzną, jeśli wymaga tego polityka.\n\n**Sprawdzenie:** Przechwycenie transportu nie ujawnia jawnego payloadu chronionej komunikacji.",
      "example": "Enkapsulacja i szyfrowanie to odrębne funkcje."
    },
    {
      "revision": 1,
      "title": "Up bez keepalive — zależności",
      "skills": [
        "encor.gre.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-06.4.card",
      "front_md": "Tunnel0 pokazuje up/up bez keepalive, lecz zdalny endpoint został wyłączony.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Stan interfejsu GRE bez mechanizmu kontroli nie jest dowodem end-to-end.\n\n**Rozpoznanie:** Lokalny stan tunelu nie potwierdza pełnej dostępności zdalnego końca.\n\n**Działanie:** Wykonać test tunelu i sprawdzić transport oraz zdalną konfigurację.\n\n**Sprawdzenie:** Rzeczywisty test ruchu potwierdza lub wyklucza łączność przez tunel.",
      "example": "Stan interfejsu GRE bez mechanizmu kontroli nie jest dowodem end-to-end."
    }
  ],
