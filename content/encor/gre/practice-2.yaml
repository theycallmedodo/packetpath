      "revision": 1,
      "title": "Underlay — działanie",
      "skills": [
        "encor.gre.case-01",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-01.2.card",
      "front_md": "Adres tunnel destination nie jest osiągalny przez sieć transportową.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Tunel GRE zależy od routingu jego zewnętrznych adresów.\n\n**Rozpoznanie:** Brakuje osiągalności underlay dla końca tunelu.\n\n**Działanie:** Przywrócić trasę transportową do tunnel destination.\n\n**Sprawdzenie:** Cel tunelu jest osiągalny poza tunelem przez fizyczny transport.",
      "example": "Przywrócić trasę transportową do tunnel destination."
    },
    {
      "revision": 1,
      "title": "Rekursja — działanie",
      "skills": [
        "encor.gre.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-02.2.card",
      "front_md": "Trasa do tunnel destination wskazuje sam Tunnel0 zamiast underlay.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Droga zewnętrznej enkapsulacji nie może zależeć od tego samego tunelu.\n\n**Rozpoznanie:** Tunel próbuje osiągnąć własny koniec przez siebie.\n\n**Działanie:** Ustawić stabilną drogę do końca tunelu przez sieć transportową.\n\n**Sprawdzenie:** Lookup destination nie wskazuje Tunnel0, a znikają objawy recursive routing.",
      "example": "Ustawić stabilną drogę do końca tunelu przez sieć transportową."
    },
    {
      "revision": 1,
      "title": "GRE blokowane — działanie",
      "skills": [
        "encor.gre.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-03.2.card",
      "front_md": "ICMP między końcami działa, ale firewall odrzuca IP protocol 47.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "GRE to protokół IP 47, a nie port TCP lub UDP 47.\n\n**Rozpoznanie:** Filtr blokuje protokół GRE mimo dostępności ping.\n\n**Działanie:** Dopuścić wymagany GRE między zatwierdzonymi końcami.\n\n**Sprawdzenie:** Pakiety IP protocol 47 docierają w obu kierunkach.",
      "example": "Dopuścić wymagany GRE między zatwierdzonymi końcami."
    },
    {
      "revision": 1,
      "title": "Duże pakiety — działanie",
      "skills": [
        "encor.gre.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-04.2.card",
      "front_md": "Mały ping przez GRE działa, duże pakiety z DF nie. Droga transportowa ma MTU 1500, a enkapsulacja dodaje narzut.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Enkapsulacja zmniejsza przestrzeń dostępną dla pakietu wewnętrznego.\n\n**Rozpoznanie:** Rozmiar po enkapsulacji przekracza MTU transportu.\n\n**Działanie:** Dopasować MTU tunelu i obsługę PMTUD, ewentualnie TCP MSS zgodnie z ruchem.\n\n**Sprawdzenie:** Test rozmiaru z DF określa działający limit i aplikacje nie zawieszają się na dużych segmentach.",
      "example": "Dopasować MTU tunelu i obsługę PMTUD, ewentualnie TCP MSS zgodnie z ruchem."
    },
    {
      "revision": 1,
      "title": "Brak szyfrowania — działanie",
      "skills": [
        "encor.gre.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-05.2.card",
      "front_md": "Przechwycenie underlay ujawnia treść pakietów wewnątrz zwykłego GRE.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Enkapsulacja i szyfrowanie to odrębne funkcje.\n\n**Rozpoznanie:** Sam GRE nie zapewnia poufności danych.\n\n**Działanie:** Dodać odpowiednią ochronę kryptograficzną, jeśli wymaga tego polityka.\n\n**Sprawdzenie:** Przechwycenie transportu nie ujawnia jawnego payloadu chronionej komunikacji.",
      "example": "Dodać odpowiednią ochronę kryptograficzną, jeśli wymaga tego polityka."
    },
    {
      "revision": 1,
      "title": "Up bez keepalive — działanie",
      "skills": [
        "encor.gre.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — GRE — tunele i zależność od underlay",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-impl-tun-xe.html"
        }
      ],
      "id": "encor.gre.practice.case-06.2.card",
      "front_md": "Tunnel0 pokazuje up/up bez keepalive, lecz zdalny endpoint został wyłączony.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Stan interfejsu GRE bez mechanizmu kontroli nie jest dowodem end-to-end.\n\n**Rozpoznanie:** Lokalny stan tunelu nie potwierdza pełnej dostępności zdalnego końca.\n\n**Działanie:** Wykonać test tunelu i sprawdzić transport oraz zdalną konfigurację.\n\n**Sprawdzenie:** Rzeczywisty test ruchu potwierdza lub wyklucza łączność przez tunel.",
      "example": "Wykonać test tunelu i sprawdzić transport oraz zdalną konfigurację."
    }
  ],
