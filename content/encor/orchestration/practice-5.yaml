      "id": "encor.orchestration.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nNarzędzie łączy się do urządzeń przez SSH lub API bez instalowania na nich własnego agenta.\n\n**Zgłoszenie II**\n\nStan urządzenia różni się od zatwierdzonego stanu docelowego po ręcznej zmianie.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Model działania jest agentless. Zapewnić właściwy transport, konto i uprawnienia zamiast instalować niepotrzebny agent.\n\n**Sprawdzenie I:** Urządzenie jest zarządzane przez wspierany zdalny interfejs.\n\n**Zgłoszenie II:** Wystąpił configuration drift. Porównać diff, ustalić intencję i kontrolowanie przywrócić lub zatwierdzić zmianę.\n\n**Sprawdzenie II:** Stan rzeczywisty i zatwierdzony ponownie są zgodne.\n\n**Zależności:** Agentless przenosi logikę wykonania poza urządzenie, korzystając z istniejących interfejsów. Deklaratywne zarządzanie wymaga obserwacji rozbieżności i świadomej konwergencji.",
      "example": "I — Model działania jest agentless.\n\nII — Wystąpił configuration drift."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "encor.orchestration.contrast",
