        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/agent-based-management/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nPlaybook dla laboratoriów obejmuje przez pomyłkę grupę produkcyjną.\n\n**Zgłoszenie II**\n\nNowy szablon ma objąć sto routerów, ale nie był testowany na żadnym reprezentatywnym urządzeniu.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Zakres wykonania nie odpowiada zamierzonemu środowisku. Zweryfikować inventory i ograniczyć cel przed wykonaniem.\n\n**Sprawdzenie I:** Plan wykonania wymienia wyłącznie zatwierdzone urządzenia.\n\n**Zgłoszenie II:** Brakuje ograniczonej próby przed zmianą masową. Wdrożyć na małej reprezentatywnej grupie i sprawdzić warunki sukcesu.\n\n**Sprawdzenie II:** Test canary potwierdza zgodność i usługi przed rozszerzeniem zakresu.\n\n**Zależności:** Poprawna komenda na niewłaściwym urządzeniu nadal jest błędną zmianą. Etapowe wdrożenie ogranicza zasięg potencjalnego błędu.",
      "example": "I — Zakres wykonania nie odpowiada zamierzonemu środowisku.\n\nII — Brakuje ograniczonej próby przed zmianą masową."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "encor.orchestration.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/configuration-management-and-automation-introduction/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/agent-based-management/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nZmiana udała się na 8 z 10 urządzeń. Narzędzie zgłasza globalny sukces bez wskazania pozostałych.\n\n**Zgłoszenie II**\n\nPlan zmiany zawiera backup, ale brak procedury i warunków odtworzenia.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Raport ukrywa częściową niezgodność stanu. Zapisać status per urządzenie i zaplanować kontrolowaną naprawę dwóch niepowodzeń.\n\n**Sprawdzenie I:** Raport jednoznacznie rozróżnia 8 sukcesów i 2 błędy.\n\n**Zgłoszenie II:** Kopia konfiguracji nie jest jeszcze zweryfikowanym planem wycofania. Przygotować i sprawdzić rollback oraz kryteria jego uruchomienia.\n\n**Sprawdzenie II:** Odtworzenie przywraca działający stan i wymagane usługi.\n\n**Zależności:** Orkiestracja musi uwzględniać częściowe wykonanie, nie tylko jedną flagę całości. Bezpieczne wycofanie wymaga procedury, dostępu i weryfikacji efektu.",
      "example": "I — Raport ukrywa częściową niezgodność stanu.\n\nII — Kopia konfiguracji nie jest jeszcze zweryfikowanym planem wycofania."
    },
