        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/agent-based-management/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.case-04.1.card",
      "front_md": "Nowy szablon ma objąć sto routerów, ale nie był testowany na żadnym reprezentatywnym urządzeniu.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Etapowe wdrożenie ogranicza zasięg potencjalnego błędu.\n\n**Rozpoznanie:** Brakuje ograniczonej próby przed zmianą masową.\n\n**Działanie:** Wdrożyć na małej reprezentatywnej grupie i sprawdzić warunki sukcesu.\n\n**Sprawdzenie:** Test canary potwierdza zgodność i usługi przed rozszerzeniem zakresu.",
      "example": "Brakuje ograniczonej próby przed zmianą masową."
    },
    {
      "revision": 1,
      "title": "Częściowy sukces — rozpoznanie",
      "skills": [
        "encor.orchestration.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/configuration-management-and-automation-introduction/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/agent-based-management/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.case-05.1.card",
      "front_md": "Zmiana udała się na 8 z 10 urządzeń. Narzędzie zgłasza globalny sukces bez wskazania pozostałych.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Orkiestracja musi uwzględniać częściowe wykonanie, nie tylko jedną flagę całości.\n\n**Rozpoznanie:** Raport ukrywa częściową niezgodność stanu.\n\n**Działanie:** Zapisać status per urządzenie i zaplanować kontrolowaną naprawę dwóch niepowodzeń.\n\n**Sprawdzenie:** Raport jednoznacznie rozróżnia 8 sukcesów i 2 błędy.",
      "example": "Raport ukrywa częściową niezgodność stanu."
    },
