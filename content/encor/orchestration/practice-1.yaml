      "sources": [
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/configuration-management-and-automation-introduction/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/agent-based-management/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.case-06.1.card",
      "front_md": "Plan zmiany zawiera backup, ale brak procedury i warunków odtworzenia.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Bezpieczne wycofanie wymaga procedury, dostępu i weryfikacji efektu.\n\n**Rozpoznanie:** Kopia konfiguracji nie jest jeszcze zweryfikowanym planem wycofania.\n\n**Działanie:** Przygotować i sprawdzić rollback oraz kryteria jego uruchomienia.\n\n**Sprawdzenie:** Odtworzenie przywraca działający stan i wymagane usługi.",
      "example": "Kopia konfiguracji nie jest jeszcze zweryfikowanym planem wycofania."
    }
