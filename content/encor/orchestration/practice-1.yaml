          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.case-01.1.card",
      "front_md": "Narzędzie łączy się do urządzeń przez SSH lub API bez instalowania na nich własnego agenta.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Agentless przenosi logikę wykonania poza urządzenie, korzystając z istniejących interfejsów.\n\n**Rozpoznanie:** Model działania jest agentless.\n\n**Działanie:** Zapewnić właściwy transport, konto i uprawnienia zamiast instalować niepotrzebny agent.\n\n**Sprawdzenie:** Urządzenie jest zarządzane przez wspierany zdalny interfejs.",
      "example": "Model działania jest agentless."
    },
    {
      "revision": 1,
      "title": "Drift — rozpoznanie",
      "skills": [
        "encor.orchestration.case-02",
