        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/agent-based-management/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.case-02.1.card",
      "front_md": "Stan urządzenia różni się od zatwierdzonego stanu docelowego po ręcznej zmianie.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Deklaratywne zarządzanie wymaga obserwacji rozbieżności i świadomej konwergencji.\n\n**Rozpoznanie:** Wystąpił configuration drift.\n\n**Działanie:** Porównać diff, ustalić intencję i kontrolowanie przywrócić lub zatwierdzić zmianę.\n\n**Sprawdzenie:** Stan rzeczywisty i zatwierdzony ponownie są zgodne.",
      "example": "Wystąpił configuration drift."
    },
    {
      "revision": 1,
      "title": "Zła grupa inventory — rozpoznanie",
      "skills": [
        "encor.orchestration.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/configuration-management-and-automation-introduction/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://developer.cisco.com/docs/nx-os/agent-based-management/"
        },
        {
          "title": "Dokumentacja Cisco — Automatyzacja — agent, agentless i kontrola zmian",
          "url": "https://www.cisco.com/c/en/us/solutions/collateral/data-center-virtualization/application-centric-infrastructure/dc-automation-red-hat-ansible-wp.html"
        }
      ],
      "id": "encor.orchestration.practice.case-03.1.card",
      "front_md": "Playbook dla laboratoriów obejmuje przez pomyłkę grupę produkcyjną.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Poprawna komenda na niewłaściwym urządzeniu nadal jest błędną zmianą.\n\n**Rozpoznanie:** Zakres wykonania nie odpowiada zamierzonemu środowisku.\n\n**Działanie:** Zweryfikować inventory i ograniczyć cel przed wykonaniem.\n\n**Sprawdzenie:** Plan wykonania wymienia wyłącznie zatwierdzone urządzenia.",
      "example": "Zakres wykonania nie odpowiada zamierzonemu środowisku."
    },
