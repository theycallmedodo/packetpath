    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — weryfikacja",
      "skills": [
        "encor.restconf.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — RESTCONF — HTTP, modele i diagnostyka API",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1713/b_1713_programmability_cg/m_1713_prog_restconf.html"
        },
        {
          "title": "Dokumentacja Cisco — RESTCONF — HTTP, modele i diagnostyka API",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "RESTCONF — RFC 8040",
          "url": "https://www.rfc-editor.org/rfc/rfc8040"
        }
      ],
      "id": "encor.restconf.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nRESTCONF zwraca 401 dla zapytania, a TLS działa.\n\n**Zgłoszenie II**\n\nPoprawnie zalogowane konto dostaje 403 przy próbie zmiany zasobu.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Żądanie nie ma skutecznego uwierzytelnienia. Zweryfikować metodę i dane uwierzytelniania klienta.\n\n**Sprawdzenie I:** Poprawnie uwierzytelnione żądanie przechodzi do kontroli dostępu do zasobu.\n\n**Zgłoszenie II:** Tożsamość nie ma uprawnienia do operacji. Zweryfikować autoryzację dla tego zasobu i metody.\n\n**Sprawdzenie II:** Uprawniona operacja jest dopuszczona bez rozszerzania praw na zbędne zasoby.\n\n**Zależności:** 401 wskazuje problem uwierzytelnienia, nie brak modelu YANG. 403 rozróżnia brak autoryzacji od błędnych danych logowania.",
      "example": "I — Poprawnie uwierzytelnione żądanie przechodzi do kontroli dostępu do zasobu.\n\nII — Uprawniona operacja jest dopuszczona bez rozszerzania praw na zbędne zasoby."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "encor.restconf.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — RESTCONF — HTTP, modele i diagnostyka API",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1713/b_1713_programmability_cg/m_1713_prog_restconf.html"
        },
        {
          "title": "Dokumentacja Cisco — RESTCONF — HTTP, modele i diagnostyka API",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "RESTCONF — RFC 8040",
          "url": "https://www.rfc-editor.org/rfc/rfc8040"
        }
      ],
      "id": "encor.restconf.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nSerwer działa, ale GET używa błędnej ścieżki modelu i zwraca 404.\n\n**Zgłoszenie II**\n\nPATCH zawiera JSON z przecinkiem po ostatnim polu; serwer odrzuca treść.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Wskazany zasób nie jest znaleziony pod tą ścieżką. Zweryfikować URI, namespace modelu i klucze list.\n\n**Sprawdzenie I:** Poprawny URI zwraca oczekiwany istniejący zasób.\n\n**Zgłoszenie II:** Payload nie jest poprawnym dokumentem JSON. Poprawić składnię i zweryfikować payload przed wysłaniem.\n\n**Sprawdzenie II:** Parser JSON przyjmuje dokument, a serwer może zweryfikować go względem modelu.\n\n**Zależności:** Ścieżki RESTCONF wynikają z modelu danych, nie z nazw komend CLI. Poprawność składni serializacji poprzedza walidację modelu.",
      "example": "I — Poprawny URI zwraca oczekiwany istniejący zasób.\n\nII — Parser JSON przyjmuje dokument, a serwer może zweryfikować go względem modelu."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "encor.restconf.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — RESTCONF — HTTP, modele i diagnostyka API",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1713/b_1713_programmability_cg/m_1713_prog_restconf.html"
        },
        {
          "title": "Dokumentacja Cisco — RESTCONF — HTTP, modele i diagnostyka API",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/prog/configuration/1716/b_1716_programmability_cg/netconf-and-restconf-service-level-acls.html"
        },
        {
          "title": "RESTCONF — RFC 8040",
          "url": "https://www.rfc-editor.org/rfc/rfc8040"
        }
      ],
      "id": "encor.restconf.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nOperator użył PUT dla całego zasobu, przesyłając tylko część jego konfiguracji i nie uwzględniając semantyki zastąpienia.\n\n**Zgłoszenie II**\n\nKlient odrzuca HTTPS, bo nazwa serwera nie pasuje do certyfikatu.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Wybrano zastąpienie zasobu zamiast zamierzonej częściowej zmiany. Dobrać wspieraną operację częściowej zmiany lub pełny poprawny payload PUT.\n\n**Sprawdzenie I:** Odczyt po zmianie zachowuje wymagane pola poza zmienianym zakresem.\n\n**Zgłoszenie II:** Nie powiodła się weryfikacja tożsamości TLS. Użyć poprawnej nazwy i certyfikatu z zaufanego łańcucha.\n\n**Sprawdzenie II:** Połączenie HTTPS działa z włączoną weryfikacją certyfikatu.\n\n**Zależności:** PUT i PATCH mają różną semantykę, której nie można sprowadzić do samego zapisu danych. Wyłączenie weryfikacji nie naprawia tożsamości endpointu.",
      "example": "I — Odczyt po zmianie zachowuje wymagane pola poza zmienianym zakresem.\n\nII — Połączenie HTTPS działa z włączoną weryfikacją certyfikatu."
    },
