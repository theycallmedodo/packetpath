    {
      "revision": 1,
      "title": "Ping w main — rozpoznanie",
      "skills": [
        "encor.vrf.case-01",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.case-01.1.card",
      "front_md": "Cel istnieje tylko w VRF BLUE. Zwykły ping z tablicy globalnej nie działa.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "VRF izoluje wyszukiwanie tras; narzędzia diagnostyczne muszą wskazać właściwy kontekst.\n\n**Rozpoznanie:** Test używa innego kontekstu routingu niż usługa.\n\n**Działanie:** Wykonać ping w VRF BLUE z odpowiednim źródłem.\n\n**Sprawdzenie:** Test w BLUE używa tras BLUE i osiąga zamierzony cel.",
      "example": "Test używa innego kontekstu routingu niż usługa."
    },
    {
      "revision": 1,
      "title": "Nakładające adresy — rozpoznanie",
      "skills": [
        "encor.vrf.case-02",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.case-02.1.card",
      "front_md": "BLUE i RED mają hosty 10.0.0.10, lecz w oddzielnych VRF i segmentach.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Ten sam prefiks może być używany przez różne izolowane VRF.\n\n**Rozpoznanie:** Adresy są rozdzielone przez niezależne tablice routingu.\n\n**Działanie:** Diagnozować każdą usługę z jawnym wskazaniem jej VRF.\n\n**Sprawdzenie:** Lookup 10.0.0.10 w każdej VRF prowadzi do jej własnego klienta.",
      "example": "Adresy są rozdzielone przez niezależne tablice routingu."
    },
    {
      "revision": 1,
      "title": "Default tylko globalny — rozpoznanie",
      "skills": [
        "encor.vrf.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.case-03.1.card",
      "front_md": "VRF BLUE nie ma default, natomiast tablica globalna ma działające 0.0.0.0/0.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Każdy kontekst potrzebuje własnej osiągalności lub jawnego mechanizmu wymiany tras.\n\n**Rozpoznanie:** Trasa globalna nie jest automatycznie dostępna wewnątrz BLUE.\n\n**Działanie:** Zapewnić zaplanowaną trasę lub kontrolowane połączenie VRF z wyjściem.\n\n**Sprawdzenie:** Lookup w BLUE wskazuje właściwą drogę dla celu zewnętrznego.",
      "example": "Trasa globalna nie jest automatycznie dostępna wewnątrz BLUE."
    },
    {
      "revision": 1,
      "title": "Zły interfejs VRF — rozpoznanie",
      "skills": [
        "encor.vrf.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.case-04.1.card",
      "front_md": "Port klienta należy do RED, choć projekt i adresacja przewidują BLUE.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Przynależność interfejsu określa kontekst routingu ruchu przychodzącego.\n\n**Rozpoznanie:** Interfejs wprowadza ruch do niewłaściwej tablicy.\n\n**Działanie:** Przepiąć logicznie interfejs do BLUE z kontrolą adresacji i skutków zmiany.\n\n**Sprawdzenie:** Interfejs oraz jego trasa connected występują w BLUE.",
      "example": "Interfejs wprowadza ruch do niewłaściwej tablicy."
    },
    {
      "revision": 1,
      "title": "Brak leak — rozpoznanie",
      "skills": [
        "encor.vrf.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.case-05.1.card",
      "front_md": "Dwie VRF działają lokalnie, ale mają celowo rozdzielone trasy i nie ma route leaking. Operator oczekuje komunikacji między nimi.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Route leaking musi być świadomą decyzją, a nie domyślną własnością VRF.\n\n**Rozpoznanie:** Izolacja VRF nie została jawnie przełamana.\n\n**Działanie:** Zaprojektować kontrolowaną wymianę wybranych tras i odpowiednią politykę dostępu.\n\n**Sprawdzenie:** Wymienione są tylko zamierzone prefiksy i działa droga powrotna.",
      "example": "Izolacja VRF nie została jawnie przełamana."
    },
    {
      "revision": 1,
      "title": "Source interface — rozpoznanie",
      "skills": [
        "encor.vrf.case-06",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.case-06.1.card",
      "front_md": "Ping w BLUE wybiera źródło, do którego zdalna sieć nie ma trasy. Docelowy next hop jest prawidłowy.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Diagnostyka VRF wymaga kontroli tablicy, celu i adresu źródłowego.\n\n**Rozpoznanie:** Wybrany adres źródłowy nie ma drogi powrotnej.\n\n**Działanie:** Użyć poprawnego źródła usługi lub zapewnić routing powrotny do tego źródła.\n\n**Sprawdzenie:** Odpowiedź wraca do jawnie wskazanego adresu w BLUE.",
      "example": "Wybrany adres źródłowy nie ma drogi powrotnej."
    }
  ],
