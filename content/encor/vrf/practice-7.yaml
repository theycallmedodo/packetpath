    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — weryfikacja",
      "skills": [
        "encor.vrf.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nCel istnieje tylko w VRF BLUE. Zwykły ping z tablicy globalnej nie działa.\n\n**Zgłoszenie II**\n\nBLUE i RED mają hosty 10.0.0.10, lecz w oddzielnych VRF i segmentach.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Test używa innego kontekstu routingu niż usługa. Wykonać ping w VRF BLUE z odpowiednim źródłem.\n\n**Sprawdzenie I:** Test w BLUE używa tras BLUE i osiąga zamierzony cel.\n\n**Zgłoszenie II:** Adresy są rozdzielone przez niezależne tablice routingu. Diagnozować każdą usługę z jawnym wskazaniem jej VRF.\n\n**Sprawdzenie II:** Lookup 10.0.0.10 w każdej VRF prowadzi do jej własnego klienta.\n\n**Zależności:** VRF izoluje wyszukiwanie tras; narzędzia diagnostyczne muszą wskazać właściwy kontekst. Ten sam prefiks może być używany przez różne izolowane VRF.",
      "example": "I — Test w BLUE używa tras BLUE i osiąga zamierzony cel.\n\nII — Lookup 10.0.0.10 w każdej VRF prowadzi do jej własnego klienta."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "encor.vrf.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nVRF BLUE nie ma default, natomiast tablica globalna ma działające 0.0.0.0/0.\n\n**Zgłoszenie II**\n\nPort klienta należy do RED, choć projekt i adresacja przewidują BLUE.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Trasa globalna nie jest automatycznie dostępna wewnątrz BLUE. Zapewnić zaplanowaną trasę lub kontrolowane połączenie VRF z wyjściem.\n\n**Sprawdzenie I:** Lookup w BLUE wskazuje właściwą drogę dla celu zewnętrznego.\n\n**Zgłoszenie II:** Interfejs wprowadza ruch do niewłaściwej tablicy. Przepiąć logicznie interfejs do BLUE z kontrolą adresacji i skutków zmiany.\n\n**Sprawdzenie II:** Interfejs oraz jego trasa connected występują w BLUE.\n\n**Zależności:** Każdy kontekst potrzebuje własnej osiągalności lub jawnego mechanizmu wymiany tras. Przynależność interfejsu określa kontekst routingu ruchu przychodzącego.",
      "example": "I — Lookup w BLUE wskazuje właściwą drogę dla celu zewnętrznego.\n\nII — Interfejs oraz jego trasa connected występują w BLUE."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "encor.vrf.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — VRF — oddzielne tablice routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_ir-vrf-tunnels.html"
        }
      ],
      "id": "encor.vrf.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nDwie VRF działają lokalnie, ale mają celowo rozdzielone trasy i nie ma route leaking. Operator oczekuje komunikacji między nimi.\n\n**Zgłoszenie II**\n\nPing w BLUE wybiera źródło, do którego zdalna sieć nie ma trasy. Docelowy next hop jest prawidłowy.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Izolacja VRF nie została jawnie przełamana. Zaprojektować kontrolowaną wymianę wybranych tras i odpowiednią politykę dostępu.\n\n**Sprawdzenie I:** Wymienione są tylko zamierzone prefiksy i działa droga powrotna.\n\n**Zgłoszenie II:** Wybrany adres źródłowy nie ma drogi powrotnej. Użyć poprawnego źródła usługi lub zapewnić routing powrotny do tego źródła.\n\n**Sprawdzenie II:** Odpowiedź wraca do jawnie wskazanego adresu w BLUE.\n\n**Zależności:** Route leaking musi być świadomą decyzją, a nie domyślną własnością VRF. Diagnostyka VRF wymaga kontroli tablicy, celu i adresu źródłowego.",
      "example": "I — Wymienione są tylko zamierzone prefiksy i działa droga powrotna.\n\nII — Odpowiedź wraca do jawnie wskazanego adresu w BLUE."
    },
