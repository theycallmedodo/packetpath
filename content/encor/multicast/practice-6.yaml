          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nPakiet multicast od źródła S przychodzi na Gi2, lecz najlepsza droga unicast do S wskazuje Gi1.\n\n**Zgłoszenie II**\n\nW LAN nie ma zgłoszenia członkostwa dla grupy G, a router nie ma powodu wysyłać tam ruchu G.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Pakiet nie spełnia kontroli Reverse Path Forwarding. Uzgodnić drogę źródłową i oczekiwany interfejs RPF zgodnie z topologią.\n\n**Sprawdzenie I:** Show ip rpf S wskazuje interfejs, którym faktycznie przychodzi poprawny ruch.\n\n**Zgłoszenie II:** Nie wykryto zainteresowanego odbiorcy grupy. Sprawdzić IGMP klienta i przekazywanie jego raportów.\n\n**Sprawdzenie II:** Tabela członkostwa zawiera grupę G na właściwym LAN.\n\n**Zależności:** RPF sprawdza drogę w stronę źródła, nie odbiorcy multicast. Dystrybucja multicast opiera się na sygnalizacji zainteresowania odbiorców.",
      "example": "I — Uzgodnić drogę źródłową i oczekiwany interfejs RPF zgodnie z topologią.\n\nII — Sprawdzić IGMP klienta i przekazywanie jego raportów."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "encor.multicast.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nPIM-SM dla grupy ASM nie ma poprawnego mapowania RP.\n\n**Zgłoszenie II**\n\nOdbiorca SSM potrzebuje konkretnej pary S,G, ale zgłasza tylko ogólne zainteresowanie grupą bez źródła.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Brakuje punktu spotkania dla drzewa współdzielonego ASM. Zapewnić zgodne mapowanie RP i jego osiągalność.\n\n**Sprawdzenie I:** Routery wskazują ten sam właściwy RP dla grupy ASM.\n\n**Zgłoszenie II:** Brakuje źródłowo specyficznego zgłoszenia odbiorcy. Zapewnić obsługę IGMPv3 i właściwego zgłoszenia INCLUDE dla S,G.\n\n**Sprawdzenie II:** Router tworzy stan dla oczekiwanego źródła i grupy.\n\n**Zależności:** W ASM PIM-SM RP pełni rolę w tworzeniu początkowego drzewa dystrybucji. SSM identyfikuje kanał przez parę źródło–grupa, nie wyłącznie adres grupy.",
      "example": "I — Zapewnić zgodne mapowanie RP i jego osiągalność.\n\nII — Zapewnić obsługę IGMPv3 i właściwego zgłoszenia INCLUDE dla S,G."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
      "skills": [
        "encor.multicast.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nRouting unicast działa, lecz jeden interfejs router–router nie ma PIM i nie tworzy sąsiedztwa multicast.\n\n**Zgłoszenie II**\n\nŹródło wysyła multicast z TTL 1, a odbiorca znajduje się za routerem.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Łącze transportowe nie uczestniczy w wymaganym protokole multicast. Włączyć właściwy tryb PIM na zamierzonym interfejsie.\n\n**Sprawdzenie I:** Pojawia się sąsiad PIM i właściwy stan drzewa przez to łącze.\n\n**Zgłoszenie II:** Pakiet nie ma wystarczającego TTL do przekroczenia granicy routowanej. Ustawić w aplikacji źródłowej TTL odpowiedni dla zamierzonego zasięgu.\n\n**Sprawdzenie II:** Pakiety docierają przez wymagane skoki bez wygaśnięcia TTL.\n\n**Zależności:** Działający unicast jest potrzebny, ale nie zastępuje konfiguracji multicast. TTL ogranicza zasięg także dla pakietów multicast.",
      "example": "I — Włączyć właściwy tryb PIM na zamierzonym interfejsie.\n\nII — Ustawić w aplikacji źródłowej TTL odpowiedni dla zamierzonego zasięgu."
    },
