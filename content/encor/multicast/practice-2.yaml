      "revision": 1,
      "title": "TTL multicast — działanie",
      "skills": [
        "encor.multicast.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.case-06.2.card",
      "front_md": "Źródło wysyła multicast z TTL 1, a odbiorca znajduje się za routerem.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "TTL ogranicza zasięg także dla pakietów multicast.\n\n**Rozpoznanie:** Pakiet nie ma wystarczającego TTL do przekroczenia granicy routowanej.\n\n**Działanie:** Ustawić w aplikacji źródłowej TTL odpowiedni dla zamierzonego zasięgu.\n\n**Sprawdzenie:** Pakiety docierają przez wymagane skoki bez wygaśnięcia TTL.",
      "example": "Ustawić w aplikacji źródłowej TTL odpowiedni dla zamierzonego zasięgu."
    }
