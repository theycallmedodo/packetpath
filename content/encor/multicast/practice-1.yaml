      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.case-01.1.card",
      "front_md": "Pakiet multicast od źródła S przychodzi na Gi2, lecz najlepsza droga unicast do S wskazuje Gi1.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "RPF sprawdza drogę w stronę źródła, nie odbiorcy multicast.\n\n**Rozpoznanie:** Pakiet nie spełnia kontroli Reverse Path Forwarding.\n\n**Działanie:** Uzgodnić drogę źródłową i oczekiwany interfejs RPF zgodnie z topologią.\n\n**Sprawdzenie:** Show ip rpf S wskazuje interfejs, którym faktycznie przychodzi poprawny ruch.",
      "example": "Pakiet nie spełnia kontroli Reverse Path Forwarding."
    },
    {
      "revision": 1,
      "title": "Brak membership — rozpoznanie",
      "skills": [
        "encor.multicast.case-02",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.case-02.1.card",
      "front_md": "W LAN nie ma zgłoszenia członkostwa dla grupy G, a router nie ma powodu wysyłać tam ruchu G.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Dystrybucja multicast opiera się na sygnalizacji zainteresowania odbiorców.\n\n**Rozpoznanie:** Nie wykryto zainteresowanego odbiorcy grupy.\n\n**Działanie:** Sprawdzić IGMP klienta i przekazywanie jego raportów.\n\n**Sprawdzenie:** Tabela członkostwa zawiera grupę G na właściwym LAN.",
      "example": "Nie wykryto zainteresowanego odbiorcy grupy."
    },
    {
      "revision": 1,
      "title": "Brak RP ASM — rozpoznanie",
      "skills": [
        "encor.multicast.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.case-03.1.card",
      "front_md": "PIM-SM dla grupy ASM nie ma poprawnego mapowania RP.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "W ASM PIM-SM RP pełni rolę w tworzeniu początkowego drzewa dystrybucji.\n\n**Rozpoznanie:** Brakuje punktu spotkania dla drzewa współdzielonego ASM.\n\n**Działanie:** Zapewnić zgodne mapowanie RP i jego osiągalność.\n\n**Sprawdzenie:** Routery wskazują ten sam właściwy RP dla grupy ASM.",
      "example": "Brakuje punktu spotkania dla drzewa współdzielonego ASM."
    },
    {
      "revision": 1,
      "title": "SSM i źródło — rozpoznanie",
      "skills": [
        "encor.multicast.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.case-04.1.card",
      "front_md": "Odbiorca SSM potrzebuje konkretnej pary S,G, ale zgłasza tylko ogólne zainteresowanie grupą bez źródła.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "SSM identyfikuje kanał przez parę źródło–grupa, nie wyłącznie adres grupy.\n\n**Rozpoznanie:** Brakuje źródłowo specyficznego zgłoszenia odbiorcy.\n\n**Działanie:** Zapewnić obsługę IGMPv3 i właściwego zgłoszenia INCLUDE dla S,G.\n\n**Sprawdzenie:** Router tworzy stan dla oczekiwanego źródła i grupy.",
      "example": "Brakuje źródłowo specyficznego zgłoszenia odbiorcy."
    },
    {
      "revision": 1,
      "title": "Brak PIM na tranzycie — rozpoznanie",
      "skills": [
        "encor.multicast.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-multicast/ip-multicast/m_imc_basic_cfg-0.html"
        },
        {
          "title": "Dokumentacja Cisco — Multicast — RPF, PIM, IGMP i SSM",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipmulti_pim/configuration/15-s/imc-pim-15-s-book/imc_cfg_ssm.html"
        }
      ],
      "id": "encor.multicast.practice.case-05.1.card",
      "front_md": "Routing unicast działa, lecz jeden interfejs router–router nie ma PIM i nie tworzy sąsiedztwa multicast.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Działający unicast jest potrzebny, ale nie zastępuje konfiguracji multicast.\n\n**Rozpoznanie:** Łącze transportowe nie uczestniczy w wymaganym protokole multicast.\n\n**Działanie:** Włączyć właściwy tryb PIM na zamierzonym interfejsie.\n\n**Sprawdzenie:** Pojawia się sąsiad PIM i właściwy stan drzewa przez to łącze.",
      "example": "Łącze transportowe nie uczestniczy w wymaganym protokole multicast."
    },
