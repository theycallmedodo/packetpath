      "id": "encor.yang.practice.case-01.2.card",
      "front_md": "Model określa MTU jako uint16 z range 1280..9216. Payload zawiera 1000.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Typ bazowy i dodatkowe ograniczenia YANG wspólnie definiują poprawne wartości.\n\n**Rozpoznanie:** Wartość jest poza dopuszczonym zakresem modelu.\n\n**Działanie:** Wybrać wartość zgodną jednocześnie z modelem i platformą.\n\n**Sprawdzenie:** Walidacja range przechodzi dla zatwierdzonego MTU.",
      "example": "Wybrać wartość zgodną jednocześnie z modelem i platformą."
    },
    {
      "revision": 1,
      "title": "List key — działanie",
      "skills": [
        "encor.yang.case-02",
