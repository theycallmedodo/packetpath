        },
        {
          "title": "YANG 1.1 — RFC 7950",
          "url": "https://www.rfc-editor.org/rfc/rfc7950"
        }
      ],
      "id": "encor.yang.practice.case-02.2.card",
      "front_md": "Lista interfejsów ma klucz name, a żądanie stworzenia elementu pomija name.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Klucze list YANG identyfikują ich elementy.\n\n**Rozpoznanie:** Brakuje identyfikatora elementu listy.\n\n**Działanie:** Podać wymagany klucz name dla tworzonego interfejsu.\n\n**Sprawdzenie:** Element można jednoznacznie wskazać przez jego klucz.",
      "example": "Podać wymagany klucz name dla tworzonego interfejsu."
    },
    {
      "revision": 1,
      "title": "Config false — działanie",
      "skills": [
        "encor.yang.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — YANG — model danych i walidacja",
          "url": "https://nso-docs.cisco.com/guides/development/introduction-to-automation/basic-automation-with-python"
        },
        {
          "title": "Dokumentacja Cisco — YANG — model danych i walidacja",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "YANG 1.1 — RFC 7950",
          "url": "https://www.rfc-editor.org/rfc/rfc7950"
        }
      ],
      "id": "encor.yang.practice.case-03.2.card",
      "front_md": "Klient próbuje zapisać licznik pakietów oznaczony config false.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Config false rozróżnia dane stanu od konfiguracji zarządzanej przez klienta.\n\n**Rozpoznanie:** Pole reprezentuje stan operacyjny tylko do odczytu.\n\n**Działanie:** Odczytywać licznik zamiast próbować modyfikować go jak konfigurację.\n\n**Sprawdzenie:** Zapisy dotyczą wyłącznie konfigurowalnych węzłów modelu.",
      "example": "Odczytywać licznik zamiast próbować modyfikować go jak konfigurację."
    },
    {
      "revision": 1,
      "title": "Namespace — działanie",
      "skills": [
        "encor.yang.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — YANG — model danych i walidacja",
          "url": "https://nso-docs.cisco.com/guides/development/introduction-to-automation/basic-automation-with-python"
        },
        {
          "title": "Dokumentacja Cisco — YANG — model danych i walidacja",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "YANG 1.1 — RFC 7950",
          "url": "https://www.rfc-editor.org/rfc/rfc7950"
        }
      ],
      "id": "encor.yang.practice.case-04.2.card",
      "front_md": "Payload używa poprawnej nazwy liścia z niewłaściwej przestrzeni nazw modułu.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Sama lokalna nazwa pola nie wystarcza do jednoznacznego wskazania modelu.\n\n**Rozpoznanie:** Element wskazuje inny model niż oczekiwany.\n\n**Działanie:** Użyć namespace i prefiksu odpowiadającego właściwemu modułowi.\n\n**Sprawdzenie:** Serwer rozpoznaje element w zamierzonym module YANG.",
      "example": "Użyć namespace i prefiksu odpowiadającego właściwemu modułowi."
    },
    {
      "revision": 1,
      "title": "Must constraint — działanie",
      "skills": [
        "encor.yang.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — YANG — model danych i walidacja",
          "url": "https://nso-docs.cisco.com/guides/development/introduction-to-automation/basic-automation-with-python"
        },
        {
          "title": "Dokumentacja Cisco — YANG — model danych i walidacja",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "YANG 1.1 — RFC 7950",
          "url": "https://www.rfc-editor.org/rfc/rfc7950"
        }
      ],
      "id": "encor.yang.practice.case-05.2.card",
      "front_md": "Dwa pola osobno mają poprawne typy, lecz ich kombinacja łamie wyrażenie must w modelu.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "YANG może ograniczać relacje między polami, nie wyłącznie ich typy.\n\n**Rozpoznanie:** Naruszono zależność logiczną między wartościami.\n\n**Działanie:** Poprawić kombinację zgodnie z ograniczeniem must.\n\n**Sprawdzenie:** Walidacja całego obiektu przechodzi, nie tylko pojedynczych typów.",
      "example": "Poprawić kombinację zgodnie z ograniczeniem must."
    },
    {
      "revision": 1,
      "title": "Unsupported feature — działanie",
      "skills": [
        "encor.yang.case-06",
