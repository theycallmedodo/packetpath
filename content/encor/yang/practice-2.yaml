        },
        {
          "title": "Dokumentacja Cisco — YANG — model danych i walidacja",
          "url": "https://developer.cisco.com/codeexchange/github/repo/CiscoDevNet/netprog_basics"
        },
        {
          "title": "YANG 1.1 — RFC 7950",
          "url": "https://www.rfc-editor.org/rfc/rfc7950"
        }
      ],
      "id": "encor.yang.practice.case-06.2.card",
      "front_md": "Węzeł jest warunkowany if-feature, którego serwer nie ogłasza.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Obecność w definicji modułu nie gwarantuje aktywności wszystkich jego funkcji.\n\n**Rozpoznanie:** Funkcja modelu nie jest dostępna w tej implementacji.\n\n**Działanie:** Sprawdzić ogłoszone features i użyć wspieranego zakresu modelu.\n\n**Sprawdzenie:** Klient nie wysyła węzłów zależnych od nieobsługiwanej funkcji.",
      "example": "Sprawdzić ogłoszone features i użyć wspieranego zakresu modelu."
    }
