      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "encor.pbr.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nRoute-map jest poprawna, lecz brak ip policy route-map na interfejsie wejściowym klientów.\n\n**Zgłoszenie II**\n\nACL użyta przez match ip address odrzuca badany pakiet, a operator uważa, że PBR go filtruje.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Polityka PBR nie jest stosowana do tego ruchu. Przypiąć właściwą politykę do właściwego interfejsu wejściowego.\n\n**Sprawdzenie I:** Ruch klienta zwiększa licznik właściwej sekwencji route-map.\n\n**Zgłoszenie II:** Pakiet nie pasuje do tej sekwencji PBR. Sprawdzić dalsze sekwencje i zwykły routing zamiast traktować match ACL jako filtr portu.\n\n**Sprawdzenie II:** Pakiet jest obsłużony przez dalszą pasującą politykę lub standardowy routing.\n\n**Zależności:** Definicja polityki nie jest równoznaczna z jej zastosowaniem. Deny w ACL dopasowania nie jest automatycznie odrzuceniem pakietu przez interfejs.",
      "example": "I — Definicja polityki nie jest równoznaczna z jej zastosowaniem.\n\nII — Deny w ACL dopasowania nie jest automatycznie odrzuceniem pakietu przez interfejs."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "encor.pbr.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nPBR działa dla klientów na wejściu Gi0/0, ale ping generowany przez router używa zwykłego routingu.\n\n**Zgłoszenie II**\n\nSekwencja 10 permit matchuje całe /24 i ustawia A. Późniejsza sekwencja 20 miała skierować hosta z tego /24 przez B.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Ruch lokalny nie wchodzi przez interfejs objęty tą polityką. Testować rzeczywisty ruch klientów lub osobno zaprojektować local policy.\n\n**Sprawdzenie I:** Pakiety klientów i lokalny test są oceniane w ich właściwych kontekstach.\n\n**Zgłoszenie II:** Ogólna sekwencja przechwytuje hosta przed wyjątkiem. Umieścić wyjątek hosta przed ogólną regułą, zachowując zakres reszty.\n\n**Sprawdzenie II:** Host używa B, a pozostałe adresy /24 nadal A.\n\n**Zależności:** Interface PBR i lokalna polityka dla ruchu routera są różnymi zakresami. Kolejność sekwencji route-map wpływa na zastosowaną politykę.",
      "example": "I — Interface PBR i lokalna polityka dla ruchu routera są różnymi zakresami.\n\nII — Kolejność sekwencji route-map wpływa na zastosowaną politykę."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "encor.pbr.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nPBR kieruje ruch przez zapasowego operatora, ale ten nie ma drogi powrotnej do źródła.\n\n**Zgłoszenie II**\n\nNext hop odpowiada lokalnie, ale usługa za nim jest niedostępna; polityka nie sprawdza dalszej ścieżki.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Zmiana wyjścia nie zapewniła spójnej komunikacji dwukierunkowej. Zapewnić właściwy routing powrotny i zgodną translację lub ogłaszanie.\n\n**Sprawdzenie I:** Odpowiedzi wracają do klienta dla przepływu skierowanego polityką.\n\n**Zgłoszenie II:** Lokalna osiągalność next hop nie potwierdza dostępności usługi. Powiązać wybór z właściwą weryfikacją dostępności zgodnie z możliwościami platformy.\n\n**Sprawdzenie II:** Awaria badanej dalszej ścieżki zmienia decyzję polityki zgodnie z projektem.\n\n**Zależności:** PBR wpływa na wybrany kierunek i nie konfiguruje automatycznie odpowiedzi. Zakres testu dostępności musi odpowiadać temu, co polityka ma chronić.",
      "example": "I — PBR wpływa na wybrany kierunek i nie konfiguruje automatycznie odpowiedzi.\n\nII — Zakres testu dostępności musi odpowiadać temu, co polityka ma chronić."
    },
