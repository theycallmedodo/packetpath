    {
      "revision": 1,
      "title": "Policy nieprzypięta — działanie",
      "skills": [
        "encor.pbr.case-01",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.case-01.2.card",
      "front_md": "Route-map jest poprawna, lecz brak ip policy route-map na interfejsie wejściowym klientów.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Definicja polityki nie jest równoznaczna z jej zastosowaniem.\n\n**Rozpoznanie:** Polityka PBR nie jest stosowana do tego ruchu.\n\n**Działanie:** Przypiąć właściwą politykę do właściwego interfejsu wejściowego.\n\n**Sprawdzenie:** Ruch klienta zwiększa licznik właściwej sekwencji route-map.",
      "example": "Przypiąć właściwą politykę do właściwego interfejsu wejściowego."
    },
    {
      "revision": 1,
      "title": "Deny w match ACL — działanie",
      "skills": [
        "encor.pbr.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.case-02.2.card",
      "front_md": "ACL użyta przez match ip address odrzuca badany pakiet, a operator uważa, że PBR go filtruje.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Deny w ACL dopasowania nie jest automatycznie odrzuceniem pakietu przez interfejs.\n\n**Rozpoznanie:** Pakiet nie pasuje do tej sekwencji PBR.\n\n**Działanie:** Sprawdzić dalsze sekwencje i zwykły routing zamiast traktować match ACL jako filtr portu.\n\n**Sprawdzenie:** Pakiet jest obsłużony przez dalszą pasującą politykę lub standardowy routing.",
      "example": "Sprawdzić dalsze sekwencje i zwykły routing zamiast traktować match ACL jako filtr portu."
    },
    {
      "revision": 1,
      "title": "Lokalny ping — działanie",
      "skills": [
        "encor.pbr.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.case-03.2.card",
      "front_md": "PBR działa dla klientów na wejściu Gi0/0, ale ping generowany przez router używa zwykłego routingu.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Interface PBR i lokalna polityka dla ruchu routera są różnymi zakresami.\n\n**Rozpoznanie:** Ruch lokalny nie wchodzi przez interfejs objęty tą polityką.\n\n**Działanie:** Testować rzeczywisty ruch klientów lub osobno zaprojektować local policy.\n\n**Sprawdzenie:** Pakiety klientów i lokalny test są oceniane w ich właściwych kontekstach.",
      "example": "Testować rzeczywisty ruch klientów lub osobno zaprojektować local policy."
    },
    {
      "revision": 1,
      "title": "Pierwszy match — działanie",
      "skills": [
        "encor.pbr.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.case-04.2.card",
      "front_md": "Sekwencja 10 permit matchuje całe /24 i ustawia A. Późniejsza sekwencja 20 miała skierować hosta z tego /24 przez B.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Kolejność sekwencji route-map wpływa na zastosowaną politykę.\n\n**Rozpoznanie:** Ogólna sekwencja przechwytuje hosta przed wyjątkiem.\n\n**Działanie:** Umieścić wyjątek hosta przed ogólną regułą, zachowując zakres reszty.\n\n**Sprawdzenie:** Host używa B, a pozostałe adresy /24 nadal A.",
      "example": "Umieścić wyjątek hosta przed ogólną regułą, zachowując zakres reszty."
    },
    {
      "revision": 1,
      "title": "Brak return path — działanie",
      "skills": [
        "encor.pbr.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.case-05.2.card",
      "front_md": "PBR kieruje ruch przez zapasowego operatora, ale ten nie ma drogi powrotnej do źródła.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "PBR wpływa na wybrany kierunek i nie konfiguruje automatycznie odpowiedzi.\n\n**Rozpoznanie:** Zmiana wyjścia nie zapewniła spójnej komunikacji dwukierunkowej.\n\n**Działanie:** Zapewnić właściwy routing powrotny i zgodną translację lub ogłaszanie.\n\n**Sprawdzenie:** Odpowiedzi wracają do klienta dla przepływu skierowanego polityką.",
      "example": "Zapewnić właściwy routing powrotny i zgodną translację lub ogłaszanie."
    },
    {
      "revision": 1,
      "title": "Tracking next hop — działanie",
      "skills": [
        "encor.pbr.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-pbr.html"
        },
        {
          "title": "Dokumentacja Cisco — PBR — interpretacja polityk routingu",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-pbr-default-nexthop-route.html"
        }
      ],
      "id": "encor.pbr.practice.case-06.2.card",
      "front_md": "Next hop odpowiada lokalnie, ale usługa za nim jest niedostępna; polityka nie sprawdza dalszej ścieżki.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Zakres testu dostępności musi odpowiadać temu, co polityka ma chronić.\n\n**Rozpoznanie:** Lokalna osiągalność next hop nie potwierdza dostępności usługi.\n\n**Działanie:** Powiązać wybór z właściwą weryfikacją dostępności zgodnie z możliwościami platformy.\n\n**Sprawdzenie:** Awaria badanej dalszej ścieżki zmienia decyzję polityki zgodnie z projektem.",
      "example": "Powiązać wybór z właściwą weryfikacją dostępności zgodnie z możliwościami platformy."
    }
  ],
