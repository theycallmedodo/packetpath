    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — rozpoznanie",
      "skills": [
        "encor.qos-interpret.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — QoS — czytanie konfiguracji i liczników",
          "url": "https://www.cisco.com/c/en/us/support/docs/quality-of-service-qos/qos-packet-marking/10103-dscpvalues.html"
        },
        {
          "title": "Dokumentacja Cisco — QoS — czytanie konfiguracji i liczników",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/qos/b-quality-of-service/m_qos-mrkg.html"
        }
      ],
      "id": "encor.qos-interpret.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nW klasie rośnie exceed-drop, a conform-transmit nadal przepuszcza część ruchu.\n\n**Zgłoszenie II**\n\nKolejka osiąga limit i rośnie total drops podczas burstów; policer nie jest skonfigurowany.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Część ruchu przekracza profil policera. Porównać oferowane tempo i burst z CIR oraz parametrami policera.\n\n**Sprawdzenie I:** Przy ruchu zgodnym z profilem ustaje przyrost exceed-drop.\n\n**Zgłoszenie II:** Bufor kolejki nie mieści nadmiaru ruchu. Ocenić przeciążenie, profil źródła i właściwy rozmiar kolejki.\n\n**Sprawdzenie II:** Przy kontrolowanym ruchu kolejka nie przepełnia się lub drop odpowiada zaplanowanej polityce.\n\n**Zależności:** Drop policera ma inne znaczenie niż drop pełnej kolejki. Tail drop występuje przy braku miejsca w kolejce.",
      "example": "I — Część ruchu przekracza profil policera.\n\nII — Bufor kolejki nie mieści nadmiaru ruchu."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "encor.qos-interpret.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — QoS — czytanie konfiguracji i liczników",
          "url": "https://www.cisco.com/c/en/us/support/docs/quality-of-service-qos/qos-packet-marking/10103-dscpvalues.html"
        },
        {
          "title": "Dokumentacja Cisco — QoS — czytanie konfiguracji i liczników",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/qos/b-quality-of-service/m_qos-mrkg.html"
        }
      ],
      "id": "encor.qos-interpret.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nKlasa priorytetowa przekracza swój skonfigurowany limit w czasie przeciążenia i część pakietów jest odrzucana.\n\n**Zgłoszenie II**\n\nRuch ma oczekiwany DSCP, ale licznik jego klasy stoi, a class-default rośnie; class-map dopasowuje inny DSCP.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Priorytet nie oznacza nieograniczonego pasma. Zweryfikować klasyfikację i wymiarowanie klasy priorytetowej.\n\n**Sprawdzenie I:** Legalny ruch czasu rzeczywistego mieści się w zaprojektowanym budżecie.\n\n**Zgłoszenie II:** Pakiety nie pasują do warunku klasy. Poprawić match zgodnie z rzeczywistym i zatwierdzonym oznaczeniem ruchu.\n\n**Sprawdzenie II:** Ruch testowy zwiększa licznik właściwej klasy zamiast class-default.\n\n**Zależności:** Ograniczenie LLQ chroni inne klasy przed zagłodzeniem. Przed analizą kolejkowania trzeba potwierdzić klasyfikację.",
      "example": "I — Priorytet nie oznacza nieograniczonego pasma.\n\nII — Pakiety nie pasują do warunku klasy."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "encor.qos-interpret.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — QoS — czytanie konfiguracji i liczników",
          "url": "https://www.cisco.com/c/en/us/support/docs/quality-of-service-qos/qos-packet-marking/10103-dscpvalues.html"
        },
        {
          "title": "Dokumentacja Cisco — QoS — czytanie konfiguracji i liczników",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/qos/b-quality-of-service/m_qos-mrkg.html"
        }
      ],
      "id": "encor.qos-interpret.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nPolicy child ma kolejki usług, ale parent ogranicza cały ruch do 50 Mb/s.\n\n**Zgłoszenie II**\n\nAF31 i AF33 należą do tej samej klasy AF3, ale mają różne drop precedence.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Łączny limit wynika z polityki nadrzędnej. Analizować hierarchię parent/child i łączny budżet klas.\n\n**Sprawdzenie I:** Łączne wyjście nie przekracza tempa parent mimo większych możliwości fizycznego portu.\n\n**Zgłoszenie II:** AF33 ma wyższy priorytet odrzucania niż AF31 w odpowiedniej polityce. Sprawdzić mapowanie AF3 i mechanizm odrzucania respektujący drop precedence.\n\n**Sprawdzenie II:** Przy właściwej polityce przeciążenia AF33 jest bardziej podatne na odrzucenie.\n\n**Zależności:** W HQoS polityka nadrzędna ogranicza zasoby dostępne politykom podrzędnym. Druga cyfra AF określa podatność na drop, nie gwarantowaną prędkość transmisji.",
      "example": "I — Łączny limit wynika z polityki nadrzędnej.\n\nII — AF33 ma wyższy priorytet odrzucania niż AF31 w odpowiedniej polityce."
    },
