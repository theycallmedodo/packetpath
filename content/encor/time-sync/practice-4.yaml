      ],
      "id": "encor.time-sync.practice.case-02.4.card",
      "front_md": "Urządzenie raportuje stratum 16 i brak wybranego źródła.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Stratum 16 oznacza stan niesynchronizowany, nie bardzo dokładny zegar.\n\n**Rozpoznanie:** Urządzenie jest niesynchronizowane w rozumieniu NTP.\n\n**Działanie:** Przywrócić dostępne i wiarygodne źródło czasu.\n\n**Sprawdzenie:** Status wskazuje synchronizację z wybranym peerem i poprawne stratum.",
      "example": "Stratum 16 oznacza stan niesynchronizowany, nie bardzo dokładny zegar."
    },
