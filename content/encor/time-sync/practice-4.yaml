      "id": "encor.time-sync.practice.case-01.4.card",
      "front_md": "NTP reach pozostaje 0, a przechwycenie nie pokazuje odpowiedzi serwera.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Reach opisuje historię odpowiedzi, nie bezpośrednio dokładność zegara.\n\n**Rozpoznanie:** Brak udanych ostatnich odpowiedzi NTP.\n\n**Działanie:** Sprawdzić transport, źródło i politykę dostępu do wybranego serwera.\n\n**Sprawdzenie:** Reach zaczyna rejestrować udane odpowiedzi, a peer może zostać oceniony.",
      "example": "Reach opisuje historię odpowiedzi, nie bezpośrednio dokładność zegara."
    },
