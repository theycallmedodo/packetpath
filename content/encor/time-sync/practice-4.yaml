      "id": "encor.time-sync.practice.case-06.4.card",
      "front_md": "Główny grandmaster PTP znika, a projekt przewiduje zapasowy o gorszym priorytecie.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Redundancja źródła czasu wymaga zarówno zapasu, jak i zgodnych reguł wyboru.\n\n**Rozpoznanie:** Potrzebny jest wybór zapasowego źródła według mechanizmu PTP.\n\n**Działanie:** Sprawdzić wybór mastera i parametry zapasowego zegara.\n\n**Sprawdzenie:** Urządzenia przechodzą na przewidziany zapasowy grandmaster.",
      "example": "Redundancja źródła czasu wymaga zarówno zapasu, jak i zgodnych reguł wyboru."
