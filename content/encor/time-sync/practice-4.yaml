          "title": "Dokumentacja Cisco — NTP i PTP — interpretacja synchronizacji",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-time-protocol-ntp/116161-trouble-ntp-00.html"
        },
        {
          "title": "Dokumentacja Cisco — NTP i PTP — interpretacja synchronizacji",
          "url": "https://www.cisco.com/c/en/us/support/docs/ios-nx-os-software/ios-xr-software/217579-configure-ptp-and-synce-basics-with-cisc.html"
        }
      ],
      "id": "encor.time-sync.practice.case-03.4.card",
      "front_md": "Dwa urządzenia mają zgodny czas UTC, ale różne ustawienia strefy wyświetlania.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Synchronizacja zegara i lokalna strefa prezentacji to odrębne ustawienia.\n\n**Rozpoznanie:** Różnica prezentacji czasu nie musi oznaczać błędu synchronizacji.\n\n**Działanie:** Porównać UTC i konfigurację strefy zamiast przesuwać źródło NTP.\n\n**Sprawdzenie:** Po wspólnym przeliczeniu znaczniki wskazują tę samą chwilę.",
      "example": "Synchronizacja zegara i lokalna strefa prezentacji to odrębne ustawienia."
    },
