      "id": "encor.time-sync.practice.case-04.4.card",
      "front_md": "Dwa urządzenia PTP korzystają z niezgodnych profili i domen, mimo sprawnego transportu.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "W PTP zgodność profilu i domeny jest istotna obok fizycznej łączności.\n\n**Rozpoznanie:** Nie uczestniczą w zgodnym kontekście synchronizacji PTP.\n\n**Działanie:** Uzgodnić profil, domain i wymagany transport wdrożenia.\n\n**Sprawdzenie:** Urządzenia widzą właściwego mastera i osiągają zamierzony stan synchronizacji.",
      "example": "W PTP zgodność profilu i domeny jest istotna obok fizycznej łączności."
    },
