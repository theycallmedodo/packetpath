      ],
      "id": "encor.time-sync.practice.case-05.4.card",
      "front_md": "PTP działa, ale opóźnienie w jednym kierunku jest znacznie większe niż w przeciwnym.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Założenia o opóźnieniu dwukierunkowym wpływają na dokładność synchronizacji.\n\n**Rozpoznanie:** Asymetria drogi może wprowadzić błąd estymacji offsetu.\n\n**Działanie:** Ocenić transport i kompensację asymetrii właściwą dla projektu.\n\n**Sprawdzenie:** Pomiar niezależny potwierdza dokładność po ograniczeniu lub kompensacji asymetrii.",
      "example": "Założenia o opóźnieniu dwukierunkowym wpływają na dokładność synchronizacji."
    },
