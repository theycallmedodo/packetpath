      ],
      "id": "encor.sdwan.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nEdge ma działające połączenia kontrolne, ale tunel danych nie przechodzi testu BFD.\n\n**Zgłoszenie II**\n\nEdge zna prefiks OMP, lecz wskazany TLOC jest nieosiągalny.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Dostępność control-plane nie potwierdza ścieżki danych. Diagnozować transport i sesje BFD dla konkretnego tunelu.\n\n**Sprawdzenie I:** BFD oraz rzeczywisty ruch potwierdzają działanie wybranej ścieżki danych.\n\n**Zgłoszenie II:** Informacja o prefiksie nie ma używalnej lokalizacji transportowej. Sprawdzić dostępność TLOC i powiązany tunel.\n\n**Sprawdzenie II:** Prefiks ma aktywną ścieżkę przez osiągalny TLOC.\n\n**Zależności:** Płaszczyzny sterowania i przekazywania mają odrębne warunki sprawności. Trasa overlay wymaga dostępnego transportowego punktu końcowego.",
      "example": "I — BFD oraz rzeczywisty ruch potwierdzają działanie wybranej ścieżki danych.\n\nII — Prefiks ma aktywną ścieżkę przez osiągalny TLOC."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "encor.sdwan.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-WAN — płaszczyzny, OMP i jakość łączy",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/SDWAN/cisco-sdwan-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-WAN — płaszczyzny, OMP i jakość łączy",
          "url": "https://www.cisco.com/c/en/us/support/docs/routers/sd-wan/222302-troubleshoot-common-sd-wan-control-and-d.html"
        }
      ],
      "id": "encor.sdwan.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nOba transporty są up, ale tylko jeden spełnia limit jitter dla głosu.\n\n**Zgłoszenie II**\n\nDwa oddziały mają podobne adresy, ale należą do różnych service VPN i nie ma wymiany tras.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Dostępność łącza nie oznacza spełnienia wymagań jakości. Zastosować politykę aplikacyjną uwzględniającą mierzone SLA.\n\n**Sprawdzenie I:** Głos wybiera ścieżkę spełniającą skonfigurowane kryteria.\n\n**Zgłoszenie II:** Ruch jest rozdzielony przez segmentację usługi. Zweryfikować właściwy VPN i wyłącznie zamierzone połączenia między segmentami.\n\n**Sprawdzenie II:** Komunikacja występuje tylko w zgodnym segmencie lub przez zaplanowaną politykę.\n\n**Zależności:** App-aware routing może wybierać na podstawie jakości, a nie tylko stanu up/down. Segment usługowy SD-WAN izoluje trasy i ruch użytkowników.",
      "example": "I — Głos wybiera ścieżkę spełniającą skonfigurowane kryteria.\n\nII — Komunikacja występuje tylko w zgodnym segmencie lub przez zaplanowaną politykę."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "encor.sdwan.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — SD-WAN — płaszczyzny, OMP i jakość łączy",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/SDWAN/cisco-sdwan-design-guide.html"
        },
        {
          "title": "Dokumentacja Cisco — SD-WAN — płaszczyzny, OMP i jakość łączy",
          "url": "https://www.cisco.com/c/en/us/support/docs/routers/sd-wan/222302-troubleshoot-common-sd-wan-control-and-d.html"
        }
      ],
      "id": "encor.sdwan.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nPrefiks nie jest przyjmowany w jednym oddziale, choć transport działa; centralna polityka wyraźnie go odrzuca.\n\n**Zgłoszenie II**\n\nEdge za NAT ma problem z budową tunelu mimo działającego Internetu dla zwykłego HTTPS.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Polityka sterująca filtruje reklamę do tego miejsca. Sprawdzić dopasowanie i kierunek właściwej centralnej polityki.\n\n**Sprawdzenie I:** Po zatwierdzonej korekcie właściwy oddział otrzymuje zamierzony prefiks.\n\n**Zgłoszenie II:** Łączność aplikacyjna do Internetu nie dowodzi przejścia transportu SD-WAN. Sprawdzić wymagania NAT, firewalla i ustanawiania tunelu dla wdrożenia.\n\n**Sprawdzenie II:** Właściwe sesje transportowe powstają i przechodzą testy danych.\n\n**Zależności:** Dystrybucja tras overlay może być ograniczana centralną polityką. Tunel wymaga odpowiednich zachowań transportu niezależnie od przeglądania stron.",
      "example": "I — Po zatwierdzonej korekcie właściwy oddział otrzymuje zamierzony prefiks.\n\nII — Właściwe sesje transportowe powstają i przechodzą testy danych."
    },
