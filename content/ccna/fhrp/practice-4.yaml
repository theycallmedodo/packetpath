        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.case-05.4.card",
      "front_md": "R1 i R2 utraciły wzajemne Hello przez uszkodzony trunk. Oba widzą swoje lokalne hosty i stają się Active.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Brak Hello może oznaczać awarię transportu między członkami, nie tylko awarię routera.\n\n**Rozpoznanie:** Podział domeny L2 uniemożliwia wymianę komunikatów HSRP.\n\n**Działanie:** Przywrócić transport właściwego VLAN i komunikatów grupy między routerami.\n\n**Sprawdzenie:** Po połączeniu domeny routery znów uzgadniają pojedynczą rolę Active.",
      "example": "Brak Hello może oznaczać awarię transportu między członkami, nie tylko awarię routera."
    },
    {
      "revision": 1,
      "title": "Stały VIP — zależności",
      "skills": [
        "ccna.fhrp.case-06",
