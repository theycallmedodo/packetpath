        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.case-06.4.card",
      "front_md": "Po prawidłowym przełączeniu Active adres wirtualny nie zmienił się, choć fizyczny router jest inny.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Adres wirtualny uniezależnia konfigurację klienta od aktualnego routera obsługującego bramę.\n\n**Rozpoznanie:** FHRP zachowuje tożsamość wirtualnej bramy.\n\n**Działanie:** Sprawdzić rolę nowego Active i ruch przez VIP bez zmiany adresacji hostów.\n\n**Sprawdzenie:** Hosty nadal wysyłają do dotychczasowego VIP przez nowy aktywny router.",
      "example": "Adres wirtualny uniezależnia konfigurację klienta od aktualnego routera obsługującego bramę."
    }
  ],
