        }
      ],
      "id": "ccna.fhrp.practice.case-01.4.card",
      "front_md": "Host wskazuje fizyczny adres R1 zamiast VIP grupy HSRP. Po awarii R1 nie korzysta z działającego R2.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Korzyść FHRP wymaga użycia adresu wirtualnego przez klientów.\n\n**Rozpoznanie:** Host omija wirtualną bramę redundancji.\n\n**Działanie:** Ustawić na hoście lub w DHCP adres wirtualny grupy.\n\n**Sprawdzenie:** Po wyłączeniu R1 host nadal używa tego samego VIP i uzyskuje łączność przez R2.",
      "example": "Korzyść FHRP wymaga użycia adresu wirtualnego przez klientów."
    },
    {
      "revision": 1,
      "title": "Brak preempt — zależności",
      "skills": [
        "ccna.fhrp.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipapp_fhrp/configuration/xe-16-12/fhp-xe-16-12-book/fhp-hsrp.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.case-02.4.card",
      "front_md": "R1 o wyższym priorytecie wrócił po awarii, lecz aktywnym pozostaje R2. Preempt jest wyłączone.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Priorytet i możliwość przejęcia działającej roli to różne ustawienia HSRP.\n\n**Rozpoznanie:** Wyższy priorytet nie powoduje automatycznego odebrania aktywnej roli bez preempt.\n\n**Działanie:** Włączyć preempt z odpowiednią zwłoką, jeżeli projekt wymaga powrotu roli do R1.\n\n**Sprawdzenie:** Po spełnieniu warunków preempt R1 odzyskuje rolę Active.",
      "example": "Priorytet i możliwość przejęcia działającej roli to różne ustawienia HSRP."
    },
    {
      "revision": 1,
      "title": "Brak track — zależności",
      "skills": [
        "ccna.fhrp.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipapp_fhrp/configuration/xe-16-12/fhp-xe-16-12-book/fhp-hsrp.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.case-03.4.card",
      "front_md": "R1 nadal jest Active po utracie WAN, bo jego interfejs LAN pozostaje up i nie ma trackingu.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "FHRP samo w sobie nie sprawdza całej drogi do usług zewnętrznych.\n\n**Rozpoznanie:** Grupa nie obserwuje awarii ścieżki poza LAN.\n\n**Działanie:** Powiązać właściwy obiekt track ze spadkiem priorytetu wystarczającym do przełączenia.\n\n**Sprawdzenie:** Awaria WAN obniża efektywny priorytet i zdrowy router przejmuje rolę zgodnie z preempt.",
      "example": "FHRP samo w sobie nie sprawdza całej drogi do usług zewnętrznych."
    },
    {
      "revision": 1,
      "title": "Różne grupy — zależności",
      "skills": [
        "ccna.fhrp.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipapp_fhrp/configuration/xe-16-12/fhp-xe-16-12-book/fhp-hsrp.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.case-04.4.card",
      "front_md": "R1 działa w HSRP group 10, R2 w group 20; projekt zakłada jedną grupę i wspólny VIP.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Wspólna usługa wirtualnej bramy wymaga zgodnego członkostwa grupy.\n\n**Rozpoznanie:** Routery nie uczestniczą w tej samej grupie redundancji.\n\n**Działanie:** Ujednolicić grupę, VIP i pozostałe parametry na wspólnym LAN.\n\n**Sprawdzenie:** Show standby pokazuje jedną parę Active/Standby dla zamierzonej grupy.",
      "example": "Wspólna usługa wirtualnej bramy wymaga zgodnego członkostwa grupy."
    },
    {
      "revision": 1,
      "title": "Podział LAN — zależności",
      "skills": [
        "ccna.fhrp.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
