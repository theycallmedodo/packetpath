      "revision": 1,
      "title": "Dwa zgłoszenia 1 — działanie",
      "skills": [
        "ccna.fhrp.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipapp_fhrp/configuration/xe-16-12/fhp-xe-16-12-book/fhp-hsrp.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nHost wskazuje fizyczny adres R1 zamiast VIP grupy HSRP. Po awarii R1 nie korzysta z działającego R2.\n\n**Zgłoszenie II**\n\nR1 o wyższym priorytecie wrócił po awarii, lecz aktywnym pozostaje R2. Preempt jest wyłączone.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Host omija wirtualną bramę redundancji. Ustawić na hoście lub w DHCP adres wirtualny grupy.\n\n**Sprawdzenie I:** Po wyłączeniu R1 host nadal używa tego samego VIP i uzyskuje łączność przez R2.\n\n**Zgłoszenie II:** Wyższy priorytet nie powoduje automatycznego odebrania aktywnej roli bez preempt. Włączyć preempt z odpowiednią zwłoką, jeżeli projekt wymaga powrotu roli do R1.\n\n**Sprawdzenie II:** Po spełnieniu warunków preempt R1 odzyskuje rolę Active.\n\n**Zależności:** Korzyść FHRP wymaga użycia adresu wirtualnego przez klientów. Priorytet i możliwość przejęcia działającej roli to różne ustawienia HSRP.",
      "example": "I — Ustawić na hoście lub w DHCP adres wirtualny grupy.\n\nII — Włączyć preempt z odpowiednią zwłoką, jeżeli projekt wymaga powrotu roli do R1."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "ccna.fhrp.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipapp_fhrp/configuration/xe-16-12/fhp-xe-16-12-book/fhp-hsrp.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nR1 nadal jest Active po utracie WAN, bo jego interfejs LAN pozostaje up i nie ma trackingu.\n\n**Zgłoszenie II**\n\nR1 działa w HSRP group 10, R2 w group 20; projekt zakłada jedną grupę i wspólny VIP.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Grupa nie obserwuje awarii ścieżki poza LAN. Powiązać właściwy obiekt track ze spadkiem priorytetu wystarczającym do przełączenia.\n\n**Sprawdzenie I:** Awaria WAN obniża efektywny priorytet i zdrowy router przejmuje rolę zgodnie z preempt.\n\n**Zgłoszenie II:** Routery nie uczestniczą w tej samej grupie redundancji. Ujednolicić grupę, VIP i pozostałe parametry na wspólnym LAN.\n\n**Sprawdzenie II:** Show standby pokazuje jedną parę Active/Standby dla zamierzonej grupy.\n\n**Zależności:** FHRP samo w sobie nie sprawdza całej drogi do usług zewnętrznych. Wspólna usługa wirtualnej bramy wymaga zgodnego członkostwa grupy.",
      "example": "I — Powiązać właściwy obiekt track ze spadkiem priorytetu wystarczającym do przełączenia.\n\nII — Ujednolicić grupę, VIP i pozostałe parametry na wspólnym LAN."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
      "skills": [
        "ccna.fhrp.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipapp_fhrp/configuration/xe-16-12/fhp-xe-16-12-book/fhp-hsrp.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/13780-6.html"
        },
        {
          "title": "Dokumentacja Cisco — Redundancja bramy — HSRP",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/hot-standby-router-protocol-hsrp/9234-hsrpguidetoc.html"
        }
      ],
      "id": "ccna.fhrp.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nR1 i R2 utraciły wzajemne Hello przez uszkodzony trunk. Oba widzą swoje lokalne hosty i stają się Active.\n\n**Zgłoszenie II**\n\nPo prawidłowym przełączeniu Active adres wirtualny nie zmienił się, choć fizyczny router jest inny.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Podział domeny L2 uniemożliwia wymianę komunikatów HSRP. Przywrócić transport właściwego VLAN i komunikatów grupy między routerami.\n\n**Sprawdzenie I:** Po połączeniu domeny routery znów uzgadniają pojedynczą rolę Active.\n\n**Zgłoszenie II:** FHRP zachowuje tożsamość wirtualnej bramy. Sprawdzić rolę nowego Active i ruch przez VIP bez zmiany adresacji hostów.\n\n**Sprawdzenie II:** Hosty nadal wysyłają do dotychczasowego VIP przez nowy aktywny router.\n\n**Zależności:** Brak Hello może oznaczać awarię transportu między członkami, nie tylko awarię routera. Adres wirtualny uniezależnia konfigurację klienta od aktualnego routera obsługującego bramę.",
      "example": "I — Przywrócić transport właściwego VLAN i komunikatów grupy między routerami.\n\nII — Sprawdzić rolę nowego Active i ruch przez VIP bez zmiany adresacji hostów."
    },
