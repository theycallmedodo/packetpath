      "blanks": [
        {
          "id": "prefix",
          "label": "Prefiks celu",
          "answer_type": "ipv6_prefix",
          "accepted": [
            "2001:db8:80::/64"
          ],
          "width": 19,
          "common_errors": {}
        },
        {
          "id": "interface",
          "label": "Interfejs wyjściowy",
          "answer_type": "keyword",
          "accepted": [
            "GigabitEthernet0/1"
          ],
          "width": 21,
          "common_errors": {}
        },
        {
          "id": "next",
          "label": "Link-local sąsiada",
          "answer_type": "ipv6",
          "accepted": [
            "fe80::2"
          ],
          "width": 10,
          "common_errors": {}
        }
      ]
