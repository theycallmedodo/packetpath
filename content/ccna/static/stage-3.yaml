  "tasks": [
    {
      "id": "ccna.static.13",
      "revision": 1,
      "title": "Wciąż osiągalny sąsiad zapasu",
      "skills": [
        "static.failure-detection"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "3.3"
        }
      ],
      "difficulty": 3,
      "prompt_md": "Podstawowy next-hop statycznego default nadal jest osiągalny, ale operator ma awarię dalej w sieci. Czy samo floating static musi przełączyć ruch na backup?",
      "hints": [
        "Rozróżnij awarię sąsiada od awarii za nim."
      ],
      "explanation_md": "Floating static przejmuje rolę po utracie preferowanej trasy, nie po każdej możliwej awarii. IP SLA/track jest osobnym mechanizmem.",
      "card_id": "ccna.static.13.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Tak, bo statyczna trasa automatycznie testuje dowolny serwer.",
          "feedback_md": "Statyczna trasa bez track nie testuje automatycznie odległej usługi."
        },
        {
          "id": "B",
          "text_md": "Tak, bo wyższe AD zawsze wykrywa awarię aplikacji.",
          "feedback_md": "AD jest preferencją, nie testem aplikacyjnym."
        },
        {
          "id": "C",
          "text_md": "Tak, jeśli interfejs ma adres publiczny.",
          "feedback_md": "Rodzaj adresu interfejsu nie rozwiązuje tego problemu."
        },
        {
          "id": "D",
          "text_md": "Nie; potrzebne może być dodatkowe śledzenie osiągalności.",
          "feedback_md": "Sama osiągalność next-hopu może utrzymać trasę mimo awarii dalej."
        }
      ],
      "correct_option_id": "D"
    },
    {
      "id": "ccna.static.14",
      "revision": 1,
      "title": "Primary i backup default",
      "skills": [
        "static.dual-default"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "3.3"
        }
      ],
      "difficulty": 3,
      "prompt_md": "Dodaj primary default przez 192.0.2.1 z domyślnym AD oraz backup przez 198.51.100.1 z AD 200. Oba next-hopy są osiągalne.",
      "hints": [
        "Nie ustawiaj AD 200 na podstawowej trasie."
      ],
      "explanation_md": "Obie trasy dotyczą tego samego prefiksu /0, więc AD określa preferencję źródła.",
      "card_id": "ccna.static.14.theory",
      "type": "cli_fill_blank",
      "platform": "Cisco IOS / IOS XE — składnia wskazana w zadaniu",
      "template": "R1(config)# ip route 0.0.0.0 0.0.0.0 {{primary}}\nR1(config)# ip route 0.0.0.0 0.0.0.0 {{backup}} {{ad}}",
      "blanks": [
        {
          "id": "primary",
          "label": "Podstawowy next-hop",
          "answer_type": "ipv4",
          "accepted": [
            "192.0.2.1"
          ],
          "width": 12,
          "common_errors": {}
        },
        {
          "id": "backup",
          "label": "Zapasowy next-hop",
          "answer_type": "ipv4",
          "accepted": [
            "198.51.100.1"
          ],
          "width": 15,
          "common_errors": {}
        },
        {
          "id": "ad",
          "label": "AD backupu",
          "answer_type": "integer",
          "accepted": [
            "200"
          ],
          "width": 6,
          "common_errors": {}
        }
      ]
    },
    {
