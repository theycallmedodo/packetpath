    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — rozpoznanie",
      "skills": [
        "ccna.static.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nRIB zawiera 10.0.0.0/8 przez A i 10.2.0.0/16 przez B. Pakiet jest do 10.2.3.4.\n\n**Zgłoszenie II**\n\nOSPF i statyczna dotyczą dokładnie 10.8.0.0/16. Statyczna AD 200 nie jest aktywna, gdy poprawna OSPF AD 110 działa.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Do celu pasuje bardziej szczegółowa trasa /16. Zachować przekazywanie przez B, jeśli obie trasy odpowiadają projektowi.\n\n**Sprawdzenie I:** Lookup dla 10.2.3.4 wskazuje 10.2.0.0/16 przez B.\n\n**Zgłoszenie II:** Trasa zapasowa ma celowo wyższy administrative distance. Pozostawić AD 200 i przetestować zniknięcie trasy OSPF.\n\n**Sprawdzenie II:** Po wycofaniu OSPF aktywuje się statyczna, o ile jej next hop pozostaje osiągalny.\n\n**Zależności:** W przekazywaniu wygrywa najdłuższy pasujący prefiks, przed porównywaniem różnych długości przez AD. Floating static czeka na brak lepiej preferowanej trasy do tego samego prefiksu.",
      "example": "I — Do celu pasuje bardziej szczegółowa trasa /16.\n\nII — Trasa zapasowa ma celowo wyższy administrative distance."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "ccna.static.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nStatyczna do 192.0.2.0/24 wskazuje 10.99.99.1, dla którego brak poprawnej rekursywnej drogi.\n\n**Zgłoszenie II**\n\nR1 ma trasę do LAN R2 i request dochodzi do celu. R2 nie ma trasy do źródłowego LAN R1.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Router nie potrafi rozwiązać next hop trasy. Poprawić next hop lub jego osiągalność zgodnie z rzeczywistym łączem.\n\n**Sprawdzenie I:** Lookup next hop prowadzi do działającego interfejsu, a statyczna jest instalowana.\n\n**Zgłoszenie II:** Brakuje routingu powrotnego. Dodać na R2 właściwą trasę do sieci źródłowej.\n\n**Sprawdzenie II:** Odpowiedź wraca do źródła przez oczekiwany next hop.\n\n**Zależności:** Konfiguracja trasy nie gwarantuje jej używalności bez rozwiązania następnego skoku. Test dwukierunkowy wymaga tras w obu kierunkach.",
      "example": "I — Router nie potrafi rozwiązać next hop trasy.\n\nII — Brakuje routingu powrotnego."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "ccna.static.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nRouter zna tylko LAN i WAN. Potrzebuje trasy dla wszystkich pozostałych celów przez 192.0.2.1.\n\n**Zgłoszenie II**\n\nSumaryczna trasa 10.0.0.0/8 wskazuje Null0. Dla 10.9.1.1 nie ma bardziej szczegółowej trasy.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Nie ma trasy ostatniej szansy do nieznanych prefiksów. Skonfigurować 0.0.0.0/0 przez osiągalne 192.0.2.1.\n\n**Sprawdzenie I:** Gateway of last resort wskazuje 192.0.2.1.\n\n**Zgłoszenie II:** Pakiet pasuje wyłącznie do trasy odrzucającej Null0. Jeśli 10.9.0.0/16 jest aktywną siecią, przywrócić jej poprawną trasę szczegółową.\n\n**Sprawdzenie II:** Lookup dla 10.9.1.1 wybiera przywróconą /16 zamiast Null0 /8.\n\n**Zależności:** Default jest używany, gdy nie ma bardziej szczegółowej pasującej trasy. Trasa sumaryczna do Null0 odrzuca ruch do nieznanych składowych agregatu.",
      "example": "I — Nie ma trasy ostatniej szansy do nieznanych prefiksów.\n\nII — Pakiet pasuje wyłącznie do trasy odrzucającej Null0."
    },
