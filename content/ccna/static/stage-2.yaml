      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "3.3"
        }
      ],
      "difficulty": 2,
      "prompt_md": "OSPF dostarcza 10.20.0.0/16 z AD 110. Która AD statycznej do tego samego prefiksu sprawi, że będzie zapasowa, przy osiągalnym next-hopie?",
      "hints": [
        "Wybierz wartość większą od 110."
      ],
      "explanation_md": "Floating static ma AD większe niż preferowane źródło do tego samego prefiksu. Musi nadal spełniać warunki instalacji.",
      "card_id": "ccna.static.07.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "1",
          "feedback_md": "1 spowoduje preferowanie static nad OSPF."
        },
        {
          "id": "B",
          "text_md": "90",
          "feedback_md": "90 jest niższe od 110."
        },
        {
          "id": "C",
          "text_md": "200",
          "feedback_md": "200 jest większe od 110, więc OSPF pozostaje preferowany."
        },
        {
          "id": "D",
          "text_md": "100",
          "feedback_md": "100 jest niższe od 110."
        }
      ],
      "correct_option_id": "C"
    },
