      "prompt_md": "Default static ma AD 1, a trasa OSPF 10.10.10.0/24 ma AD 110. Obie są w tablicy. Gdzie trafi pakiet do 10.10.10.8?",
      "hints": [
        "Porównujesz dwie różne długości prefiksu."
      ],
      "explanation_md": "Oddziel wybór tras do RIB od wyszukiwania prefiksu dla pakietu. LPM decyduje między /24 a /0.",
      "card_id": "ccna.static.10.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Zawsze default, bo ma niższe AD.",
          "feedback_md": "AD nie zastępuje longest prefix match między różnymi prefiksami."
        },
        {
          "id": "B",
          "text_md": "Przez trasę OSPF /24, bo jest bardziej szczegółowa.",
          "feedback_md": "/24 wygrywa dopasowanie z /0."
        },
        {
          "id": "C",
          "text_md": "Do obu tras po połowie, bo obie pasują.",
          "feedback_md": "To nie jest przypadek równych ścieżek do tego samego prefiksu."
        },
        {
          "id": "D",
          "text_md": "Zostanie odrzucony przez konflikt AD.",
          "feedback_md": "Dwie takie trasy mogą poprawnie współistnieć."
        }
      ],
      "correct_option_id": "B"
    },
