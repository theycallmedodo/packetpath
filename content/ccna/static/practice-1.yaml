  "cards": [
    {
      "revision": 1,
      "title": "Dłuższy prefiks — rozpoznanie",
      "skills": [
        "ccna.static.case-01",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.case-01.1.card",
      "front_md": "RIB zawiera 10.0.0.0/8 przez A i 10.2.0.0/16 przez B. Pakiet jest do 10.2.3.4.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "W przekazywaniu wygrywa najdłuższy pasujący prefiks, przed porównywaniem różnych długości przez AD.\n\n**Rozpoznanie:** Do celu pasuje bardziej szczegółowa trasa /16.\n\n**Działanie:** Zachować przekazywanie przez B, jeśli obie trasy odpowiadają projektowi.\n\n**Sprawdzenie:** Lookup dla 10.2.3.4 wskazuje 10.2.0.0/16 przez B.",
      "example": "Do celu pasuje bardziej szczegółowa trasa /16."
    },
    {
      "revision": 1,
      "title": "Floating static — rozpoznanie",
      "skills": [
        "ccna.static.case-02",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.case-02.1.card",
      "front_md": "OSPF i statyczna dotyczą dokładnie 10.8.0.0/16. Statyczna AD 200 nie jest aktywna, gdy poprawna OSPF AD 110 działa.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Floating static czeka na brak lepiej preferowanej trasy do tego samego prefiksu.\n\n**Rozpoznanie:** Trasa zapasowa ma celowo wyższy administrative distance.\n\n**Działanie:** Pozostawić AD 200 i przetestować zniknięcie trasy OSPF.\n\n**Sprawdzenie:** Po wycofaniu OSPF aktywuje się statyczna, o ile jej next hop pozostaje osiągalny.",
      "example": "Trasa zapasowa ma celowo wyższy administrative distance."
    },
    {
      "revision": 1,
      "title": "Nieosiągalny next hop — rozpoznanie",
      "skills": [
        "ccna.static.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.case-03.1.card",
      "front_md": "Statyczna do 192.0.2.0/24 wskazuje 10.99.99.1, dla którego brak poprawnej rekursywnej drogi.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Konfiguracja trasy nie gwarantuje jej używalności bez rozwiązania następnego skoku.\n\n**Rozpoznanie:** Router nie potrafi rozwiązać next hop trasy.\n\n**Działanie:** Poprawić next hop lub jego osiągalność zgodnie z rzeczywistym łączem.\n\n**Sprawdzenie:** Lookup next hop prowadzi do działającego interfejsu, a statyczna jest instalowana.",
      "example": "Router nie potrafi rozwiązać next hop trasy."
    },
    {
      "revision": 1,
      "title": "Droga powrotna — rozpoznanie",
      "skills": [
        "ccna.static.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.case-04.1.card",
      "front_md": "R1 ma trasę do LAN R2 i request dochodzi do celu. R2 nie ma trasy do źródłowego LAN R1.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Test dwukierunkowy wymaga tras w obu kierunkach.\n\n**Rozpoznanie:** Brakuje routingu powrotnego.\n\n**Działanie:** Dodać na R2 właściwą trasę do sieci źródłowej.\n\n**Sprawdzenie:** Odpowiedź wraca do źródła przez oczekiwany next hop.",
      "example": "Brakuje routingu powrotnego."
    },
    {
      "revision": 1,
      "title": "Default route — rozpoznanie",
      "skills": [
        "ccna.static.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.case-05.1.card",
      "front_md": "Router zna tylko LAN i WAN. Potrzebuje trasy dla wszystkich pozostałych celów przez 192.0.2.1.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Default jest używany, gdy nie ma bardziej szczegółowej pasującej trasy.\n\n**Rozpoznanie:** Nie ma trasy ostatniej szansy do nieznanych prefiksów.\n\n**Działanie:** Skonfigurować 0.0.0.0/0 przez osiągalne 192.0.2.1.\n\n**Sprawdzenie:** Gateway of last resort wskazuje 192.0.2.1.",
      "example": "Nie ma trasy ostatniej szansy do nieznanych prefiksów."
    },
    {
      "revision": 1,
      "title": "Czarna dziura — rozpoznanie",
      "skills": [
        "ccna.static.case-06",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — Routing statyczny",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-routing/b-ip-routing/m_iri-ip-prot-indep-0.html"
        }
      ],
      "id": "ccna.static.practice.case-06.1.card",
      "front_md": "Sumaryczna trasa 10.0.0.0/8 wskazuje Null0. Dla 10.9.1.1 nie ma bardziej szczegółowej trasy.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Trasa sumaryczna do Null0 odrzuca ruch do nieznanych składowych agregatu.\n\n**Rozpoznanie:** Pakiet pasuje wyłącznie do trasy odrzucającej Null0.\n\n**Działanie:** Jeśli 10.9.0.0/16 jest aktywną siecią, przywrócić jej poprawną trasę szczegółową.\n\n**Sprawdzenie:** Lookup dla 10.9.1.1 wybiera przywróconą /16 zamiast Null0 /8.",
      "example": "Pakiet pasuje wyłącznie do trasy odrzucającej Null0."
    }
  ],
