    {
      "revision": 1,
      "title": "Statyczna drukarka — rozpoznanie",
      "skills": [
        "ccna.dai.case-01",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.case-01.1.card",
      "front_md": "DAI odrzuca ARP statycznej drukarki na untrusted; brak jej bindingu DHCP i brak pasującej ARP ACL.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Hosty statyczne wymagają zaplanowanego źródła zaufanych mapowań dla DAI.\n\n**Rozpoznanie:** DAI nie ma zatwierdzonego mapowania IP–MAC drukarki.\n\n**Działanie:** Dodać precyzyjny wyjątek ARP ACL lub wspierane statyczne mapowanie zgodne z platformą.\n\n**Sprawdzenie:** ARP drukarki przechodzi, a próba podszycia z innym MAC nadal jest blokowana.",
      "example": "DAI nie ma zatwierdzonego mapowania IP–MAC drukarki."
    },
    {
      "revision": 1,
      "title": "Spoofing bramy — rozpoznanie",
      "skills": [
        "ccna.dai.case-02",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.case-02.1.card",
      "front_md": "Na porcie klienta pojawia się ARP z IP bramy i obcym MAC; DAI zwiększa drop counter.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "DAI porównuje treść ARP z dopuszczonymi wiązaniami.\n\n**Rozpoznanie:** Klient próbuje ogłosić niezgodne powiązanie IP–MAC.\n\n**Działanie:** Pozostawić ochronę i zidentyfikować źródło podszywania.\n\n**Sprawdzenie:** Poprawny MAC bramy pozostaje w tabelach klientów, fałszywy ARP jest odrzucany.",
      "example": "Klient próbuje ogłosić niezgodne powiązanie IP–MAC."
    },
    {
      "revision": 1,
      "title": "Brak binding po restarcie — rozpoznanie",
      "skills": [
        "ccna.dai.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.case-03.1.card",
      "front_md": "Po restarcie switcha utracono dynamiczne bindingi snooping. Klienci zachowali dzierżawy, a DAI odrzuca ich ARP.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Ciągłość bazy snooping wpływa na działanie ochrony ARP.\n\n**Rozpoznanie:** Zniknęła baza, na której DAI opiera walidację klientów.\n\n**Działanie:** Odtworzyć wiązania kontrolowanym odnowieniem DHCP i wdrożyć wspierane utrwalanie bazy.\n\n**Sprawdzenie:** Wiązania wracają, a legalny ARP klientów przestaje być odrzucany.",
      "example": "Zniknęła baza, na której DAI opiera walidację klientów."
    },
    {
      "revision": 1,
      "title": "Zbyt szerokie trust — rozpoznanie",
      "skills": [
        "ccna.dai.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.case-04.1.card",
      "front_md": "Wszystkie porty klientów oznaczono ip arp inspection trust. Fałszywe ARP przechodzą.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Trusted w DAI jest granicą pominięcia kontroli, nie ogólnym sposobem naprawy dostępu.\n\n**Rozpoznanie:** Zaufane porty omijają inspekcję DAI.\n\n**Działanie:** Przywrócić untrusted na portach klientów i pozostawić tylko uzasadnione zaufanie infrastruktury.\n\n**Sprawdzenie:** ARP spoofing z portu klienta znów podlega walidacji i odrzuceniu.",
      "example": "Zaufane porty omijają inspekcję DAI."
    },
    {
      "revision": 1,
      "title": "DAI poza VLAN — rozpoznanie",
      "skills": [
        "ccna.dai.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.case-05.1.card",
      "front_md": "DAI działa dla VLAN 10, a incydent jest w VLAN 20, którego nie wpisano do konfiguracji inspekcji.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Zasięg ochrony ARP jest konfigurowany dla konkretnych VLAN.\n\n**Rozpoznanie:** VLAN incydentu nie jest objęty DAI.\n\n**Działanie:** Włączyć inspekcję dla VLAN 20 po przygotowaniu prawidłowych bindingów.\n\n**Sprawdzenie:** Show ip arp inspection potwierdza aktywną inspekcję VLAN 20.",
      "example": "VLAN incydentu nie jest objęty DAI."
    },
    {
      "revision": 1,
      "title": "ARP rate limit — rozpoznanie",
      "skills": [
        "ccna.dai.case-06",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.case-06.1.card",
      "front_md": "Na porcie z DAI nastąpiła lawina ARP i zadziałał limit; log wskazuje arp-inspection jako powód err-disable.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Przekroczenie limitu ARP i niezgodność IP–MAC to różne przyczyny odrzucania.\n\n**Rozpoznanie:** Ochrona przed nadmiernym ARP wyłączyła port.\n\n**Działanie:** Usunąć źródło lawiny, ocenić limit i przywrócić port.\n\n**Sprawdzenie:** Tempo ARP pozostaje w uzasadnionym limicie bez ponownego err-disable.",
      "example": "Ochrona przed nadmiernym ARP wyłączyła port."
    }
  ],
