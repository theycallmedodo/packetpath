      "difficulty": 3,
      "prompt_md": "Po restarcie switcha baza snooping jest pusta, a klienci mają ważne dzierżawy. DAI odrzuca ich ARP. Co sprawdzić?",
      "hints": [
        "Trwałość i odbudowa bazy to element projektu ochrony, nie tylko same komendy włączające."
      ],
      "explanation_md": "Trwałość i odbudowa bazy to element projektu ochrony, nie tylko same komendy włączające.",
      "card_id": "ccna.dai.13.theory",
      "type": "single_choice",
      "options": [
        {
          "text_md": "Wyłącznie priorytet STP",
          "feedback_md": "STP nie odtwarza powiązań dzierżaw.",
          "id": "A"
        },
        {
          "text_md": "Czy ARP działa na TCP 443",
          "feedback_md": "ARP nie korzysta z portów TCP.",
          "id": "B"
        },
        {
          "text_md": "Odtwarzanie bazy snooping i sposób ponownego nauczenia legalnych dzierżaw",
          "feedback_md": "Trwałość i odbudowa bazy to element projektu ochrony, nie tylko same komendy włączające.",
          "id": "C"
        },
        {
          "text_md": "Czy nazwa VLAN ma duże litery",
          "feedback_md": "Nazwa nie odtwarza bindingów.",
          "id": "D"
        }
      ],
      "correct_option_id": "C"
    },
