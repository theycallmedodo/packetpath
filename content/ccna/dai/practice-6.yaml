    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — działanie",
      "skills": [
        "ccna.dai.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nDAI odrzuca ARP statycznej drukarki na untrusted; brak jej bindingu DHCP i brak pasującej ARP ACL.\n\n**Zgłoszenie II**\n\nNa porcie klienta pojawia się ARP z IP bramy i obcym MAC; DAI zwiększa drop counter.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** DAI nie ma zatwierdzonego mapowania IP–MAC drukarki. Dodać precyzyjny wyjątek ARP ACL lub wspierane statyczne mapowanie zgodne z platformą.\n\n**Sprawdzenie I:** ARP drukarki przechodzi, a próba podszycia z innym MAC nadal jest blokowana.\n\n**Zgłoszenie II:** Klient próbuje ogłosić niezgodne powiązanie IP–MAC. Pozostawić ochronę i zidentyfikować źródło podszywania.\n\n**Sprawdzenie II:** Poprawny MAC bramy pozostaje w tabelach klientów, fałszywy ARP jest odrzucany.\n\n**Zależności:** Hosty statyczne wymagają zaplanowanego źródła zaufanych mapowań dla DAI. DAI porównuje treść ARP z dopuszczonymi wiązaniami.",
      "example": "I — Dodać precyzyjny wyjątek ARP ACL lub wspierane statyczne mapowanie zgodne z platformą.\n\nII — Pozostawić ochronę i zidentyfikować źródło podszywania."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "ccna.dai.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nPo restarcie switcha utracono dynamiczne bindingi snooping. Klienci zachowali dzierżawy, a DAI odrzuca ich ARP.\n\n**Zgłoszenie II**\n\nWszystkie porty klientów oznaczono ip arp inspection trust. Fałszywe ARP przechodzą.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Zniknęła baza, na której DAI opiera walidację klientów. Odtworzyć wiązania kontrolowanym odnowieniem DHCP i wdrożyć wspierane utrwalanie bazy.\n\n**Sprawdzenie I:** Wiązania wracają, a legalny ARP klientów przestaje być odrzucany.\n\n**Zgłoszenie II:** Zaufane porty omijają inspekcję DAI. Przywrócić untrusted na portach klientów i pozostawić tylko uzasadnione zaufanie infrastruktury.\n\n**Sprawdzenie II:** ARP spoofing z portu klienta znów podlega walidacji i odrzuceniu.\n\n**Zależności:** Ciągłość bazy snooping wpływa na działanie ochrony ARP. Trusted w DAI jest granicą pominięcia kontroli, nie ogólnym sposobem naprawy dostępu.",
      "example": "I — Odtworzyć wiązania kontrolowanym odnowieniem DHCP i wdrożyć wspierane utrwalanie bazy.\n\nII — Przywrócić untrusted na portach klientów i pozostawić tylko uzasadnione zaufanie infrastruktury."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
      "skills": [
        "ccna.dai.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3650/software/release/16-12/configuration_guide/sec/b_1612_sec_3650_cg/configuring_dynamic_arp_inspection.html"
        },
        {
          "title": "Dokumentacja Cisco — Dynamic ARP Inspection",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/lan-switch-software/222274-troubleshoot-dynamic-arp-inspection-dai.html"
        }
      ],
      "id": "ccna.dai.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nDAI działa dla VLAN 10, a incydent jest w VLAN 20, którego nie wpisano do konfiguracji inspekcji.\n\n**Zgłoszenie II**\n\nNa porcie z DAI nastąpiła lawina ARP i zadziałał limit; log wskazuje arp-inspection jako powód err-disable.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** VLAN incydentu nie jest objęty DAI. Włączyć inspekcję dla VLAN 20 po przygotowaniu prawidłowych bindingów.\n\n**Sprawdzenie I:** Show ip arp inspection potwierdza aktywną inspekcję VLAN 20.\n\n**Zgłoszenie II:** Ochrona przed nadmiernym ARP wyłączyła port. Usunąć źródło lawiny, ocenić limit i przywrócić port.\n\n**Sprawdzenie II:** Tempo ARP pozostaje w uzasadnionym limicie bez ponownego err-disable.\n\n**Zależności:** Zasięg ochrony ARP jest konfigurowany dla konkretnych VLAN. Przekroczenie limitu ARP i niezgodność IP–MAC to różne przyczyny odrzucania.",
      "example": "I — Włączyć inspekcję dla VLAN 20 po przygotowaniu prawidłowych bindingów.\n\nII — Usunąć źródło lawiny, ocenić limit i przywrócić port."
    },
