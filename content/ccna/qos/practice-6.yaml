      "id": "ccna.qos.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nNa łączu nie ma kolejek ani przeciążenia. Dodanie priorytetu nie poprawiło opóźnienia geograficznego.\n\n**Zgłoszenie II**\n\nKomputer sam oznacza pobieranie plików jako EF, a sieć ufa oznaczeniom wszystkich hostów.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Kolejkowanie nie jest źródłem obserwowanego opóźnienia. Zmierzyć składowe opóźnienia i szukać problemu poza konkurencją kolejki.\n\n**Sprawdzenie I:** Pomiar pokazuje brak wzrostu queue delay przy utrzymanym opóźnieniu propagacji.\n\n**Zgłoszenie II:** Granica zaufania pozwala użytkownikowi nadużyć klasy priorytetowej. Klasyfikować i oznaczać ruch na kontrolowanej granicy zamiast ufać dowolnemu hostowi.\n\n**Sprawdzenie II:** Ruch plikowy nie trafia do kolejki głosowej tylko z powodu oznaczenia klienta.\n\n**Zależności:** QoS zarządza konkurencją zasobów, ale nie usuwa odległości ani czasu propagacji. Znaczenie DSCP zależy od polityki zaufania i klasyfikacji.",
      "example": "I — Zmierzyć składowe opóźnienia i szukać problemu poza konkurencją kolejki.\n\nII — Klasyfikować i oznaczać ruch na kontrolowanej granicy zamiast ufać dowolnemu hostowi."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "ccna.qos.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — QoS — klasyfikacja i kolejki",
