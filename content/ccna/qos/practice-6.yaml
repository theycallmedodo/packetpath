        },
        {
          "title": "Dokumentacja Cisco — QoS — klasyfikacja i kolejki",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_dfsrv/configuration/15-mt/qos-dfsrv-15-mt-book/qos-dfsrv.html"
        },
        {
          "title": "Dokumentacja Cisco — QoS — klasyfikacja i kolejki",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16/qos-plcshp-xe-16-book.pdf"
        }
      ],
      "id": "ccna.qos.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nRuch ponad CIR jest odrzucany od razu, bez buforowania nadmiaru; tak ustawiono akcję exceed.\n\n**Zgłoszenie II**\n\nPo wdrożeniu shaping burst jest wysyłany wolniej i pojawia się dodatkowe opóźnienie kolejki.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Działa policing z odrzucaniem nadmiaru. Jeśli wymagane jest wygładzanie zamiast drop, rozważyć właściwy shaper.\n\n**Sprawdzenie I:** Nowa polityka buforuje przejściowy nadmiar zgodnie z limitem i pojemnością kolejki.\n\n**Zgłoszenie II:** Nadmiar jest czasowo buforowany w celu ograniczenia tempa. Ocenić bufor, tempo i wymagania opóźnienia dla tej klasy.\n\n**Sprawdzenie II:** Tempo wyjściowe jest ograniczone, a opóźnienie odpowiada buforowaniu burstów.\n\n**Zależności:** Policing i shaping różnią się sposobem obsługi ruchu ponad profil. Shaping wygładza tempo kosztem możliwego opóźnienia.",
      "example": "I — Jeśli wymagane jest wygładzanie zamiast drop, rozważyć właściwy shaper.\n\nII — Ocenić bufor, tempo i wymagania opóźnienia dla tej klasy."
    },
