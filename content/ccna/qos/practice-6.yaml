      ],
      "id": "ccna.qos.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nPakiety mają DSCP EF, ale egress traktuje wszystkie identycznie w FIFO.\n\n**Zgłoszenie II**\n\nInterfejs CE ma 1 Gb/s, ale usługa operatora 100 Mb/s. Lokalne kolejki są puste, a operator odrzuca nadmiar.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Samo oznaczenie nie utworzyło preferencyjnej obsługi. Skonfigurować wspieraną politykę egress mapującą klasę na odpowiednią kolejkę.\n\n**Sprawdzenie I:** Pod obciążeniem liczniki pokazują obsługę EF w zaplanowanej klasie.\n\n**Zgłoszenie II:** Przeciążenie występuje za szybkim interfejsem, na limicie usługi. Dopasować shaping CE do uzgodnionego profilu usługi z uwzględnieniem narzutu.\n\n**Sprawdzenie II:** Przeciążenie jest kontrolowane lokalnie, a nieplanowane dropy operatora maleją.\n\n**Zależności:** Marking opisuje pakiet; scheduling określa jego obsługę na wyjściu. Polityka QoS powinna uwzględniać rzeczywistą przepustowość usługi, nie tylko prędkość portu.",
      "example": "I — Skonfigurować wspieraną politykę egress mapującą klasę na odpowiednią kolejkę.\n\nII — Dopasować shaping CE do uzgodnionego profilu usługi z uwzględnieniem narzutu."
    },
