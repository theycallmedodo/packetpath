      "id": "ccna.qos.practice.case-01.2.card",
      "front_md": "Na łączu nie ma kolejek ani przeciążenia. Dodanie priorytetu nie poprawiło opóźnienia geograficznego.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "QoS zarządza konkurencją zasobów, ale nie usuwa odległości ani czasu propagacji.\n\n**Rozpoznanie:** Kolejkowanie nie jest źródłem obserwowanego opóźnienia.\n\n**Działanie:** Zmierzyć składowe opóźnienia i szukać problemu poza konkurencją kolejki.\n\n**Sprawdzenie:** Pomiar pokazuje brak wzrostu queue delay przy utrzymanym opóźnieniu propagacji.",
      "example": "Zmierzyć składowe opóźnienia i szukać problemu poza konkurencją kolejki."
    },
