      ],
      "id": "ccna.qos.practice.case-02.2.card",
      "front_md": "Komputer sam oznacza pobieranie plików jako EF, a sieć ufa oznaczeniom wszystkich hostów.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Znaczenie DSCP zależy od polityki zaufania i klasyfikacji.\n\n**Rozpoznanie:** Granica zaufania pozwala użytkownikowi nadużyć klasy priorytetowej.\n\n**Działanie:** Klasyfikować i oznaczać ruch na kontrolowanej granicy zamiast ufać dowolnemu hostowi.\n\n**Sprawdzenie:** Ruch plikowy nie trafia do kolejki głosowej tylko z powodu oznaczenia klienta.",
      "example": "Klasyfikować i oznaczać ruch na kontrolowanej granicy zamiast ufać dowolnemu hostowi."
    },
