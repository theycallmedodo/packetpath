          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16/qos-plcshp-xe-16-book.pdf"
        }
      ],
      "id": "ccna.qos.practice.case-05.2.card",
      "front_md": "Pakiety mają DSCP EF, ale egress traktuje wszystkie identycznie w FIFO.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Marking opisuje pakiet; scheduling określa jego obsługę na wyjściu.\n\n**Rozpoznanie:** Samo oznaczenie nie utworzyło preferencyjnej obsługi.\n\n**Działanie:** Skonfigurować wspieraną politykę egress mapującą klasę na odpowiednią kolejkę.\n\n**Sprawdzenie:** Pod obciążeniem liczniki pokazują obsługę EF w zaplanowanej klasie.",
      "example": "Skonfigurować wspieraną politykę egress mapującą klasę na odpowiednią kolejkę."
    },
