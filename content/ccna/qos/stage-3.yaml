      "difficulty": 3,
      "prompt_md": "Na wyjście 10 Mb/s stale napływa 14 Mb/s. Czy skończony bufor shapera zapobiegnie utracie danych bez końca?",
      "hints": [
        "Krótkie bursty można wygładzać, ale stały nadmiar wymaga ograniczenia ruchu lub większej przepustowości."
      ],
      "explanation_md": "Krótkie bursty można wygładzać, ale stały nadmiar wymaga ograniczenia ruchu lub większej przepustowości.",
      "card_id": "ccna.qos.13.theory",
      "type": "single_choice",
      "options": [
        {
          "text_md": "Tak, bufor tworzy dodatkowe pasmo",
          "feedback_md": "Bufor przechowuje dane, nie zwiększa szybkości wyjścia.",
          "id": "A"
        },
        {
          "text_md": "Tak, jeśli DSCP wynosi 46",
          "feedback_md": "Oznaczenie nie usuwa ograniczeń pojemności.",
          "id": "B"
        },
        {
          "text_md": "Nie, długotrwały nadmiar w końcu wyczerpie bufor",
          "feedback_md": "Krótkie bursty można wygładzać, ale stały nadmiar wymaga ograniczenia ruchu lub większej przepustowości.",
          "id": "C"
        },
        {
          "text_md": "Tak, 14 jest zawsze mniejsze od 10",
          "feedback_md": "Podane wartości przeczą temu założeniu.",
          "id": "D"
        }
      ],
      "correct_option_id": "C"
    },
