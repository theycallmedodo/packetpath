          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_dfsrv/configuration/15-mt/qos-dfsrv-15-mt-book/qos-dfsrv.html"
        },
        {
          "title": "Dokumentacja Cisco — QoS — klasyfikacja i kolejki",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16/qos-plcshp-xe-16-book.pdf"
        }
      ],
      "id": "ccna.qos.practice.case-03.1.card",
      "front_md": "Ruch ponad CIR jest odrzucany od razu, bez buforowania nadmiaru; tak ustawiono akcję exceed.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Policing i shaping różnią się sposobem obsługi ruchu ponad profil.\n\n**Rozpoznanie:** Działa policing z odrzucaniem nadmiaru.\n\n**Działanie:** Jeśli wymagane jest wygładzanie zamiast drop, rozważyć właściwy shaper.\n\n**Sprawdzenie:** Nowa polityka buforuje przejściowy nadmiar zgodnie z limitem i pojemnością kolejki.",
      "example": "Działa policing z odrzucaniem nadmiaru."
    },
