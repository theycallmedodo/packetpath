      ],
      "id": "ccna.qos.practice.case-04.1.card",
      "front_md": "Po wdrożeniu shaping burst jest wysyłany wolniej i pojawia się dodatkowe opóźnienie kolejki.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Shaping wygładza tempo kosztem możliwego opóźnienia.\n\n**Rozpoznanie:** Nadmiar jest czasowo buforowany w celu ograniczenia tempa.\n\n**Działanie:** Ocenić bufor, tempo i wymagania opóźnienia dla tej klasy.\n\n**Sprawdzenie:** Tempo wyjściowe jest ograniczone, a opóźnienie odpowiada buforowaniu burstów.",
      "example": "Nadmiar jest czasowo buforowany w celu ograniczenia tempa."
    },
