        {
          "title": "Dokumentacja Cisco — QoS — klasyfikacja i kolejki",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/qos_plcshp/configuration/xe-16/qos-plcshp-xe-16-book.pdf"
        }
      ],
      "id": "ccna.qos.practice.case-06.1.card",
      "front_md": "Interfejs CE ma 1 Gb/s, ale usługa operatora 100 Mb/s. Lokalne kolejki są puste, a operator odrzuca nadmiar.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Polityka QoS powinna uwzględniać rzeczywistą przepustowość usługi, nie tylko prędkość portu.\n\n**Rozpoznanie:** Przeciążenie występuje za szybkim interfejsem, na limicie usługi.\n\n**Działanie:** Dopasować shaping CE do uzgodnionego profilu usługi z uwzględnieniem narzutu.\n\n**Sprawdzenie:** Przeciążenie jest kontrolowane lokalnie, a nieplanowane dropy operatora maleją.",
      "example": "Przeciążenie występuje za szybkim interfejsem, na limicie usługi."
    }
