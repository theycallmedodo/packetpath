      "title": "LLDP wyłączony — zależności",
      "skills": [
        "ccna.discovery.case-01",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.case-01.4.card",
      "front_md": "Urządzenia różnych producentów są połączone, ale LLDP jest wyłączony. Ruch użytkowy działa.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Działanie transmisji danych nie wymaga LLDP, ale odkrywanie sąsiada już tak.\n\n**Rozpoznanie:** Brakuje aktywnego wspólnego protokołu discovery.\n\n**Działanie:** Włączyć LLDP na uprawnionym łączu i sprawdzić oba końce.\n\n**Sprawdzenie:** Tabela LLDP zawiera oczekiwanego sąsiada oraz port zdalny.",
      "example": "Działanie transmisji danych nie wymaga LLDP, ale odkrywanie sąsiada już tak."
    },
    {
      "revision": 1,
      "title": "Brak CDP na porcie — zależności",
      "skills": [
        "ccna.discovery.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.case-02.4.card",
      "front_md": "CDP działa globalnie, lecz na analizowanym porcie skonfigurowano no cdp enable.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Stan globalny i stan per interfejs wspólnie decydują o działaniu CDP.\n\n**Rozpoznanie:** CDP został wyłączony lokalnie dla interfejsu.\n\n**Działanie:** Włączyć CDP na tym zaufanym porcie, jeśli wymaga tego polityka.\n\n**Sprawdzenie:** Show cdp neighbors detail pokazuje sąsiada tego interfejsu.",
      "example": "Stan globalny i stan per interfejs wspólnie decydują o działaniu CDP."
    },
    {
      "revision": 1,
      "title": "Adres management — zależności",
      "skills": [
        "ccna.discovery.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.case-03.4.card",
      "front_md": "CDP pokazuje adres zarządzania sąsiada, ale brak trasy do jego podsieci.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Adres w reklamie discovery jest informacją, a nie automatycznie osiągalnym next hop.\n\n**Rozpoznanie:** Odkrycie sąsiada L2 nie zapewnia routingu do management.\n\n**Działanie:** Zweryfikować trasę i politykę dostępu do ogłoszonego adresu.\n\n**Sprawdzenie:** Test IP do management działa dopiero po zapewnieniu właściwej drogi.",
      "example": "Adres w reklamie discovery jest informacją, a nie automatycznie osiągalnym next hop."
    },
    {
      "revision": 1,
      "title": "Nie ten port — zależności",
      "skills": [
        "ccna.discovery.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.case-04.4.card",
      "front_md": "LLDP wskazuje Local Gi1/0/5 i Port ID Gi1/0/24 sąsiada. Dokumentacja błędnie przypisuje kabel do Gi1/0/23.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Local Interface i Port ID opisują różne końce tego samego połączenia.\n\n**Rozpoznanie:** Opis połączenia nie zgadza się z informacją o porcie zdalnym.\n\n**Działanie:** Zweryfikować fizyczny kabel i poprawić dokumentację pary portów.\n\n**Sprawdzenie:** Oba końce potwierdzają parę Gi1/0/5–Gi1/0/24.",
      "example": "Local Interface i Port ID opisują różne końce tego samego połączenia."
    },
    {
      "revision": 1,
      "title": "Stary wpis — zależności",
      "skills": [
        "ccna.discovery.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.case-05.4.card",
      "front_md": "Kabel odłączono przed chwilą, lecz wpis LLDP pozostaje do wygaśnięcia TTL.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Informacja discovery może przez krótki czas przeżyć fizyczne odłączenie.\n\n**Rozpoznanie:** Tabela zawiera jeszcze nieprzeterminowaną reklamę.\n\n**Działanie:** Uwzględnić TTL oraz stan linku, zamiast zakładać aktywność tylko z wpisu.\n\n**Sprawdzenie:** Po wygaśnięciu TTL bez nowych reklam wpis znika.",
      "example": "Informacja discovery może przez krótki czas przeżyć fizyczne odłączenie."
    },
