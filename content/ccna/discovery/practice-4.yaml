      "revision": 1,
      "title": "Granica zaufania — zależności",
      "skills": [
        "ccna.discovery.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.case-06.4.card",
      "front_md": "CDP ujawnia model i wersję urządzenia na porcie do niezaufanego odbiorcy.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Zakres discovery powinien odpowiadać potrzebom operacyjnym i granicom zaufania.\n\n**Rozpoznanie:** Discovery ujawnia informacje o infrastrukturze poza zamierzoną granicą.\n\n**Działanie:** Wyłączyć niepotrzebne discovery na tym zewnętrznym porcie.\n\n**Sprawdzenie:** Na wskazanym porcie nie są wysyłane reklamy, a wewnętrzne discovery nadal działa.",
      "example": "Zakres discovery powinien odpowiadać potrzebom operacyjnym i granicom zaufania."
    }
