      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "ccna.discovery.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nUrządzenia różnych producentów są połączone, ale LLDP jest wyłączony. Ruch użytkowy działa.\n\n**Zgłoszenie II**\n\nCDP działa globalnie, lecz na analizowanym porcie skonfigurowano no cdp enable.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Brakuje aktywnego wspólnego protokołu discovery. Włączyć LLDP na uprawnionym łączu i sprawdzić oba końce.\n\n**Sprawdzenie I:** Tabela LLDP zawiera oczekiwanego sąsiada oraz port zdalny.\n\n**Zgłoszenie II:** CDP został wyłączony lokalnie dla interfejsu. Włączyć CDP na tym zaufanym porcie, jeśli wymaga tego polityka.\n\n**Sprawdzenie II:** Show cdp neighbors detail pokazuje sąsiada tego interfejsu.\n\n**Zależności:** Działanie transmisji danych nie wymaga LLDP, ale odkrywanie sąsiada już tak. Stan globalny i stan per interfejs wspólnie decydują o działaniu CDP.",
      "example": "I — Działanie transmisji danych nie wymaga LLDP, ale odkrywanie sąsiada już tak.\n\nII — Stan globalny i stan per interfejs wspólnie decydują o działaniu CDP."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.discovery.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nCDP pokazuje adres zarządzania sąsiada, ale brak trasy do jego podsieci.\n\n**Zgłoszenie II**\n\nLLDP wskazuje Local Gi1/0/5 i Port ID Gi1/0/24 sąsiada. Dokumentacja błędnie przypisuje kabel do Gi1/0/23.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Odkrycie sąsiada L2 nie zapewnia routingu do management. Zweryfikować trasę i politykę dostępu do ogłoszonego adresu.\n\n**Sprawdzenie I:** Test IP do management działa dopiero po zapewnieniu właściwej drogi.\n\n**Zgłoszenie II:** Opis połączenia nie zgadza się z informacją o porcie zdalnym. Zweryfikować fizyczny kabel i poprawić dokumentację pary portów.\n\n**Sprawdzenie II:** Oba końce potwierdzają parę Gi1/0/5–Gi1/0/24.\n\n**Zależności:** Adres w reklamie discovery jest informacją, a nie automatycznie osiągalnym next hop. Local Interface i Port ID opisują różne końce tego samego połączenia.",
      "example": "I — Adres w reklamie discovery jest informacją, a nie automatycznie osiągalnym next hop.\n\nII — Local Interface i Port ID opisują różne końce tego samego połączenia."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "ccna.discovery.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-cdp.html"
        },
        {
          "title": "Cisco — CDP i LLDP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/cdp-lldp-mac-udld/cdp-lldp-mac-udld-configuration-guide/c-configure-lldp.html"
        }
      ],
      "id": "ccna.discovery.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nKabel odłączono przed chwilą, lecz wpis LLDP pozostaje do wygaśnięcia TTL.\n\n**Zgłoszenie II**\n\nCDP ujawnia model i wersję urządzenia na porcie do niezaufanego odbiorcy.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Tabela zawiera jeszcze nieprzeterminowaną reklamę. Uwzględnić TTL oraz stan linku, zamiast zakładać aktywność tylko z wpisu.\n\n**Sprawdzenie I:** Po wygaśnięciu TTL bez nowych reklam wpis znika.\n\n**Zgłoszenie II:** Discovery ujawnia informacje o infrastrukturze poza zamierzoną granicą. Wyłączyć niepotrzebne discovery na tym zewnętrznym porcie.\n\n**Sprawdzenie II:** Na wskazanym porcie nie są wysyłane reklamy, a wewnętrzne discovery nadal działa.\n\n**Zależności:** Informacja discovery może przez krótki czas przeżyć fizyczne odłączenie. Zakres discovery powinien odpowiadać potrzebom operacyjnym i granicom zaufania.",
      "example": "I — Informacja discovery może przez krótki czas przeżyć fizyczne odłączenie.\n\nII — Zakres discovery powinien odpowiadać potrzebom operacyjnym i granicom zaufania."
    },
