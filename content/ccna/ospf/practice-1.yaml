        {
          "title": "Cisco IOS XE 17 — Default Passive Interfaces",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-default-passive-interface.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13684-12.html"
        }
      ],
      "id": "ccna.ospf.practice.case-04.1.card",
      "front_md": "W działającym segmencie broadcast dwa routery DROTHER widzą się w 2-Way. Oba mają Full z DR i BDR.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "W sieci broadcast nie każda para sąsiadów przechodzi do Full.\n\n**Rozpoznanie:** Dwa DROTHER nie muszą tworzyć między sobą pełnej adjacency.\n\n**Działanie:** Pozostawić działającą relację i ocenić sąsiedztwa z DR/BDR.\n\n**Sprawdzenie:** Pełne relacje do DR/BDR istnieją, a oczekiwane trasy są obecne.",
      "example": "Dwa DROTHER nie muszą tworzyć między sobą pełnej adjacency."
    },
