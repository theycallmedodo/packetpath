      "id": "ccna.ospf.practice.case-01.1.card",
      "front_md": "Adresacja i area są zgodne. Gi0/0 między R1 i R2 jest passive w OSPF; brak wysyłanych Hello.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Interfejs passive może ogłaszać sieć, ale nie zestawia na niej sąsiedztw.\n\n**Rozpoznanie:** Passive-interface zatrzymuje Hello na łączu między routerami.\n\n**Działanie:** Wyłączyć passive tylko na tym interfejsie tranzytowym.\n\n**Sprawdzenie:** Na Gi0/0 pojawiają się Hello i oczekiwane sąsiedztwo OSPF.",
      "example": "Passive-interface zatrzymuje Hello na łączu między routerami."
    },
