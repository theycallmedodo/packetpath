        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13684-12.html"
        }
      ],
      "id": "ccna.ospf.practice.case-06.1.card",
      "front_md": "R1 ma Full z R2. LAN 10.20.0.0/24 działa lokalnie, ale jego interfejs nie jest objęty OSPF ani redystrybucją.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Trzeba osobno zapewnić uczestnictwo właściwych interfejsów i ochronę LAN przed zbędnymi Hello.\n\n**Rozpoznanie:** Działające sąsiedztwo nie oznacza automatycznego ogłoszenia każdego LAN.\n\n**Działanie:** Włączyć OSPF dla interfejsu LAN we właściwej area i pozostawić go passive.\n\n**Sprawdzenie:** R2 instaluje oczekiwaną trasę OSPF do 10.20.0.0/24.",
      "example": "Działające sąsiedztwo nie oznacza automatycznego ogłoszenia każdego LAN."
    }
