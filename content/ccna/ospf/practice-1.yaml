      ],
      "id": "ccna.ospf.practice.case-02.1.card",
      "front_md": "R1 ma Gi0/0 w area 0, R2 ten sam segment w area 10. Maska, timery i uwierzytelnianie są zgodne.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Sąsiedzi OSPF na wspólnym łączu muszą uzgodnić obszar.\n\n**Rozpoznanie:** Routery przypisały wspólny segment do różnych obszarów.\n\n**Działanie:** Ujednolicić area wspólnego segmentu zgodnie z projektem.\n\n**Sprawdzenie:** Oba końce pokazują tę samą area i tworzą sąsiedztwo.",
      "example": "Routery przypisały wspólny segment do różnych obszarów."
    },
    {
      "revision": 1,
      "title": "Różne Hello — rozpoznanie",
      "skills": [
        "ccna.ospf.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco IOS XE 17 — OSPF Configuration Guide",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/ospf/ospf-configuration-guide/ospf.html"
