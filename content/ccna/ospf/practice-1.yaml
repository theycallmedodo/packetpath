        {
          "title": "Cisco IOS XE 17 — Default Passive Interfaces",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-default-passive-interface.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13684-12.html"
        }
      ],
      "id": "ccna.ospf.practice.case-03.1.card",
      "front_md": "Na wspólnym Ethernet R1 wysyła Hello co 10 s z dead 40 s, a R2 ma 30/120. Pozostałe parametry pasują.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Timery są elementem zgodności sąsiadów OSPF.\n\n**Rozpoznanie:** Niezgodne timery Hello i Dead uniemożliwiają sąsiedztwo.\n\n**Działanie:** Ustawić zgodne timery na obu końcach segmentu.\n\n**Sprawdzenie:** Show ip ospf interface pokazuje zgodne Hello/Dead i sąsiedztwo powstaje.",
      "example": "Niezgodne timery Hello i Dead uniemożliwiają sąsiedztwo."
    },
    {
      "revision": 1,
      "title": "Normalne 2-Way — rozpoznanie",
      "skills": [
        "ccna.ospf.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco IOS XE 17 — OSPF Configuration Guide",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/ospf/ospf-configuration-guide/ospf.html"
