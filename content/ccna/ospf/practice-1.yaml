        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13684-12.html"
        }
      ],
      "id": "ccna.ospf.practice.case-05.1.card",
      "front_md": "Dwa routery w domenie mają router-id 1.1.1.1, a log wskazuje duplicate router ID.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Router-id identyfikuje źródło informacji w OSPF i powinien być unikalny.\n\n**Rozpoznanie:** Identyfikator routera OSPF nie jest unikalny.\n\n**Działanie:** Zaplanować zmianę router-id jednego routera i wymagane odświeżenie procesu.\n\n**Sprawdzenie:** Po zastosowaniu zmiany routery mają różne RID i znika komunikat o duplikacie.",
      "example": "Identyfikator routera OSPF nie jest unikalny."
    },
