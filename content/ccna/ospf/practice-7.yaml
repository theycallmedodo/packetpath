      ],
      "id": "ccna.ospf.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nAdresacja i area są zgodne. Gi0/0 między R1 i R2 jest passive w OSPF; brak wysyłanych Hello.\n\n**Zgłoszenie II**\n\nR1 ma Gi0/0 w area 0, R2 ten sam segment w area 10. Maska, timery i uwierzytelnianie są zgodne.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Passive-interface zatrzymuje Hello na łączu między routerami. Wyłączyć passive tylko na tym interfejsie tranzytowym.\n\n**Sprawdzenie I:** Na Gi0/0 pojawiają się Hello i oczekiwane sąsiedztwo OSPF.\n\n**Zgłoszenie II:** Routery przypisały wspólny segment do różnych obszarów. Ujednolicić area wspólnego segmentu zgodnie z projektem.\n\n**Sprawdzenie II:** Oba końce pokazują tę samą area i tworzą sąsiedztwo.\n\n**Zależności:** Interfejs passive może ogłaszać sieć, ale nie zestawia na niej sąsiedztw. Sąsiedzi OSPF na wspólnym łączu muszą uzgodnić obszar.",
      "example": "I — Na Gi0/0 pojawiają się Hello i oczekiwane sąsiedztwo OSPF.\n\nII — Oba końce pokazują tę samą area i tworzą sąsiedztwo."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
