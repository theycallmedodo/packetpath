        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13684-12.html"
        }
      ],
      "id": "ccna.ospf.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nNa wspólnym Ethernet R1 wysyła Hello co 10 s z dead 40 s, a R2 ma 30/120. Pozostałe parametry pasują.\n\n**Zgłoszenie II**\n\nW działającym segmencie broadcast dwa routery DROTHER widzą się w 2-Way. Oba mają Full z DR i BDR.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Niezgodne timery Hello i Dead uniemożliwiają sąsiedztwo. Ustawić zgodne timery na obu końcach segmentu.\n\n**Sprawdzenie I:** Show ip ospf interface pokazuje zgodne Hello/Dead i sąsiedztwo powstaje.\n\n**Zgłoszenie II:** Dwa DROTHER nie muszą tworzyć między sobą pełnej adjacency. Pozostawić działającą relację i ocenić sąsiedztwa z DR/BDR.\n\n**Sprawdzenie II:** Pełne relacje do DR/BDR istnieją, a oczekiwane trasy są obecne.\n\n**Zależności:** Timery są elementem zgodności sąsiadów OSPF. W sieci broadcast nie każda para sąsiadów przechodzi do Full.",
      "example": "I — Show ip ospf interface pokazuje zgodne Hello/Dead i sąsiedztwo powstaje.\n\nII — Pełne relacje do DR/BDR istnieją, a oczekiwane trasy są obecne."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "ccna.ospf.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco IOS XE 17 — OSPF Configuration Guide",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr3-fwd/ospf/ospf-configuration-guide/ospf.html"
        },
        {
          "title": "Cisco IOS XE 17 — Default Passive Interfaces",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-routing/b-ip-routing/m_iri-default-passive-interface.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/9237-9.html"
        },
        {
          "title": "Dokumentacja Cisco — OSPF — sąsiedztwo i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/open-shortest-path-first-ospf/13684-12.html"
        }
      ],
      "id": "ccna.ospf.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nDwa routery w domenie mają router-id 1.1.1.1, a log wskazuje duplicate router ID.\n\n**Zgłoszenie II**\n\nR1 ma Full z R2. LAN 10.20.0.0/24 działa lokalnie, ale jego interfejs nie jest objęty OSPF ani redystrybucją.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Identyfikator routera OSPF nie jest unikalny. Zaplanować zmianę router-id jednego routera i wymagane odświeżenie procesu.\n\n**Sprawdzenie I:** Po zastosowaniu zmiany routery mają różne RID i znika komunikat o duplikacie.\n\n**Zgłoszenie II:** Działające sąsiedztwo nie oznacza automatycznego ogłoszenia każdego LAN. Włączyć OSPF dla interfejsu LAN we właściwej area i pozostawić go passive.\n\n**Sprawdzenie II:** R2 instaluje oczekiwaną trasę OSPF do 10.20.0.0/24.\n\n**Zależności:** Router-id identyfikuje źródło informacji w OSPF i powinien być unikalny. Trzeba osobno zapewnić uczestnictwo właściwych interfejsów i ochronę LAN przed zbędnymi Hello.",
      "example": "I — Po zastosowaniu zmiany routery mają różne RID i znika komunikat o duplikacie.\n\nII — R2 instaluje oczekiwaną trasę OSPF do 10.20.0.0/24."
    },
