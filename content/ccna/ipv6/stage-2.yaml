    {
      "id": "ccna.ipv6.07",
      "revision": 1,
      "title": "Neighbor Discovery",
      "skills": [
        "ipv6.nd"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
