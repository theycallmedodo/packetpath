      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "1.8"
        }
      ],
      "difficulty": 2,
      "prompt_md": "Który mechanizm odpowiada w IPv6 za odkrywanie adresu warstwy 2 sąsiada?",
      "hints": [
        "Pomyśl o NS i NA."
      ],
      "explanation_md": "ND pełni kilka funkcji, w tym rozwiązywanie sąsiadów i sprawdzanie osiągalności. Nie należy bez analizy blokować całego ICMPv6.",
      "card_id": "ccna.ipv6.07.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "ARP bez zmian względem IPv4.",
          "feedback_md": "ARP jest mechanizmem IPv4; IPv6 korzysta z ND."
        },
        {
          "id": "B",
          "text_md": "DHCPv6 przy każdym pakiecie.",
          "feedback_md": "DHCPv6 nie zastępuje rozwiązywania sąsiadów na łączu."
        },
        {
          "id": "C",
          "text_md": "Neighbor Discovery wykorzystujące ICMPv6.",
          "feedback_md": "ND używa m.in. Neighbor Solicitation i Neighbor Advertisement."
        },
        {
          "id": "D",
          "text_md": "Wyłącznie protokół routingu OSPFv3.",
          "feedback_md": "ND działa niezależnie od wyboru protokołu routingu."
        }
      ],
      "correct_option_id": "C"
    },
