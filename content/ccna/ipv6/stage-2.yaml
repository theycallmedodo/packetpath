      "prompt_md": "Które stwierdzenie o IPv6 jest prawdziwe?",
      "hints": [
        "Przypomnij sobie grupy all-nodes i solicited-node."
      ],
      "explanation_md": "IPv6 rozróżnia unicast, multicast i anycast. Rozgłaszanie do określonej grupy nie jest tym samym co broadcast IPv4.",
      "card_id": "ccna.ipv6.10.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "IPv6 ma broadcast identyczny z IPv4.",
          "feedback_md": "IPv6 nie definiuje broadcastu tak jak IPv4."
        },
        {
          "id": "B",
          "text_md": "Każdy multicast jest wysyłany do wszystkich hostów w Internecie.",
          "feedback_md": "Multicast ma grupy i określony zasięg."
        },
        {
          "id": "C",
          "text_md": "Multicast jest wyłącznie adresem routera domyślnego.",
          "feedback_md": "Multicast obejmuje wiele grup, nie jedną funkcję."
        },
        {
          "id": "D",
          "text_md": "IPv6 nie używa broadcastu; odpowiednie funkcje realizuje m.in. multicast.",
          "feedback_md": "Mechanizmy odkrywania korzystają z odpowiednich grup multicast."
        }
      ],
      "correct_option_id": "D"
    },
