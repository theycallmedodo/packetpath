      "revision": 1,
      "title": "Dwa zgłoszenia 1 — rozpoznanie",
      "skills": [
        "ccna.ipv6.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nAdministrator próbuje osiągnąć fe80::2 przez kilka routerów. Adres działa tylko na wspólnym łączu.\n\n**Zgłoszenie II**\n\nHost ma SLAAC, lecz router nie wysyła RA. Link jest sprawny i host posiada tylko link-local.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Adres link-local ma zasięg jednego łącza. Użyć routowalnego adresu IPv6 celu dla komunikacji między podsieciami.\n\n**Sprawdzenie I:** Komunikacja między segmentami korzysta z adresu globalnego lub właściwie routowanego ULA.\n\n**Zgłoszenie II:** Host nie otrzymuje prefiksu i informacji o routerze przez RA. Przywrócić poprawne Router Advertisements na tym LAN.\n\n**Sprawdzenie II:** Host otrzymuje oczekiwany prefiks /64 i trasę domyślną wskazującą router.\n\n**Zależności:** Routery nie przekazują pakietów o źródle lub celu link-local na inne łącze. SLAAC korzysta z RA, a sama obecność link-local nie zapewnia dostępu poza LAN.",
      "example": "I — Adres link-local ma zasięg jednego łącza.\n\nII — Host nie otrzymuje prefiksu i informacji o routerze przez RA."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "ccna.ipv6.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nNowy statyczny adres IPv6 pozostaje duplicate po wykryciu innego urządzenia z tym adresem.\n\n**Zgłoszenie II**\n\nRouter ma adresy na dwóch interfejsach, ale ipv6 unicast-routing jest wyłączone. Komunikuje się lokalnie, nie przekazuje między LAN-ami.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Duplicate Address Detection wykrył konflikt IPv6. Usunąć konflikt i przydzielić unikalny adres stacji.\n\n**Sprawdzenie I:** Adres przechodzi do stanu używalnego i nie występuje ponowny konflikt DAD.\n\n**Zgłoszenie II:** Wyłączono funkcję przekazywania unicast IPv6. Włączyć ipv6 unicast-routing i zweryfikować tablicę IPv6.\n\n**Sprawdzenie II:** Dwa hosty z różnych bezpośrednich podsieci komunikują się przez router.\n\n**Zależności:** DAD sprawdza unikalność adresu przed jego normalnym użyciem. Adresacja interfejsów i globalne włączenie routingu IPv6 to osobne elementy.",
      "example": "I — Duplicate Address Detection wykrył konflikt IPv6.\n\nII — Wyłączono funkcję przekazywania unicast IPv6."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "ccna.ipv6.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nStatyczna trasa ma używać fe80::1 jako next hop. Taki sam link-local może istnieć na różnych interfejsach routera.\n\n**Zgłoszenie II**\n\nFiltr na LAN odrzuca Neighbor Solicitation i Advertisement. Hosty nie poznają swoich adresów warstwy drugiej.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Sam adres link-local nie określa jednoznacznie łącza wyjściowego. Podać w trasie właściwy interfejs wyjściowy razem z fe80::1.\n\n**Sprawdzenie I:** Trasa wskazuje zaplanowany interfejs, a ND rozwiązuje sąsiada na tym łączu.\n\n**Zgłoszenie II:** Zablokowano podstawowy mechanizm Neighbor Discovery. Dopuścić wymagane komunikaty ICMPv6 ND w polityce LAN.\n\n**Sprawdzenie II:** Tabela sąsiadów zawiera poprawne mapowania IPv6–MAC.\n\n**Zależności:** Next hop link-local wymaga wskazania jego strefy, czyli lokalnego interfejsu. ICMPv6 obsługuje podstawowe funkcje IPv6, więc nie należy traktować go tylko jako ping.",
      "example": "I — Sam adres link-local nie określa jednoznacznie łącza wyjściowego.\n\nII — Zablokowano podstawowy mechanizm Neighbor Discovery."
    },
