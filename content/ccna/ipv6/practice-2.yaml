  "cards": [
    {
      "revision": 1,
      "title": "Link-local poza LAN — działanie",
      "skills": [
        "ccna.ipv6.case-01",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.case-01.2.card",
      "front_md": "Administrator próbuje osiągnąć fe80::2 przez kilka routerów. Adres działa tylko na wspólnym łączu.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Routery nie przekazują pakietów o źródle lub celu link-local na inne łącze.\n\n**Rozpoznanie:** Adres link-local ma zasięg jednego łącza.\n\n**Działanie:** Użyć routowalnego adresu IPv6 celu dla komunikacji między podsieciami.\n\n**Sprawdzenie:** Komunikacja między segmentami korzysta z adresu globalnego lub właściwie routowanego ULA.",
      "example": "Użyć routowalnego adresu IPv6 celu dla komunikacji między podsieciami."
    },
    {
      "revision": 1,
      "title": "Brak RA — działanie",
      "skills": [
        "ccna.ipv6.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.case-02.2.card",
      "front_md": "Host ma SLAAC, lecz router nie wysyła RA. Link jest sprawny i host posiada tylko link-local.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "SLAAC korzysta z RA, a sama obecność link-local nie zapewnia dostępu poza LAN.\n\n**Rozpoznanie:** Host nie otrzymuje prefiksu i informacji o routerze przez RA.\n\n**Działanie:** Przywrócić poprawne Router Advertisements na tym LAN.\n\n**Sprawdzenie:** Host otrzymuje oczekiwany prefiks /64 i trasę domyślną wskazującą router.",
      "example": "Przywrócić poprawne Router Advertisements na tym LAN."
    },
    {
      "revision": 1,
      "title": "DAD — działanie",
      "skills": [
        "ccna.ipv6.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.case-03.2.card",
      "front_md": "Nowy statyczny adres IPv6 pozostaje duplicate po wykryciu innego urządzenia z tym adresem.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "DAD sprawdza unikalność adresu przed jego normalnym użyciem.\n\n**Rozpoznanie:** Duplicate Address Detection wykrył konflikt IPv6.\n\n**Działanie:** Usunąć konflikt i przydzielić unikalny adres stacji.\n\n**Sprawdzenie:** Adres przechodzi do stanu używalnego i nie występuje ponowny konflikt DAD.",
      "example": "Usunąć konflikt i przydzielić unikalny adres stacji."
    },
    {
      "revision": 1,
      "title": "Brak routingu IPv6 — działanie",
      "skills": [
        "ccna.ipv6.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.case-04.2.card",
      "front_md": "Router ma adresy na dwóch interfejsach, ale ipv6 unicast-routing jest wyłączone. Komunikuje się lokalnie, nie przekazuje między LAN-ami.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Adresacja interfejsów i globalne włączenie routingu IPv6 to osobne elementy.\n\n**Rozpoznanie:** Wyłączono funkcję przekazywania unicast IPv6.\n\n**Działanie:** Włączyć ipv6 unicast-routing i zweryfikować tablicę IPv6.\n\n**Sprawdzenie:** Dwa hosty z różnych bezpośrednich podsieci komunikują się przez router.",
      "example": "Włączyć ipv6 unicast-routing i zweryfikować tablicę IPv6."
    },
    {
      "revision": 1,
      "title": "Link-local next hop — działanie",
      "skills": [
        "ccna.ipv6.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.case-05.2.card",
      "front_md": "Statyczna trasa ma używać fe80::1 jako next hop. Taki sam link-local może istnieć na różnych interfejsach routera.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Next hop link-local wymaga wskazania jego strefy, czyli lokalnego interfejsu.\n\n**Rozpoznanie:** Sam adres link-local nie określa jednoznacznie łącza wyjściowego.\n\n**Działanie:** Podać w trasie właściwy interfejs wyjściowy razem z fe80::1.\n\n**Sprawdzenie:** Trasa wskazuje zaplanowany interfejs, a ND rozwiązuje sąsiada na tym łączu.",
      "example": "Podać w trasie właściwy interfejs wyjściowy razem z fe80::1."
    },
    {
      "revision": 1,
      "title": "Blokada ND — działanie",
      "skills": [
        "ccna.ipv6.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — IPv6: adresacja i sąsiedzi",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/ipv6/configuration/guide/xe-17/ipv6-xe-17-book-cat8000/m_ip6-addrg-bsc-con.html"
        }
      ],
      "id": "ccna.ipv6.practice.case-06.2.card",
      "front_md": "Filtr na LAN odrzuca Neighbor Solicitation i Advertisement. Hosty nie poznają swoich adresów warstwy drugiej.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "ICMPv6 obsługuje podstawowe funkcje IPv6, więc nie należy traktować go tylko jako ping.\n\n**Rozpoznanie:** Zablokowano podstawowy mechanizm Neighbor Discovery.\n\n**Działanie:** Dopuścić wymagane komunikaty ICMPv6 ND w polityce LAN.\n\n**Sprawdzenie:** Tabela sąsiadów zawiera poprawne mapowania IPv6–MAC.",
      "example": "Dopuścić wymagane komunikaty ICMPv6 ND w polityce LAN."
    }
  ],
