      "difficulty": 3,
      "prompt_md": "Dlaczego szerokie odrzucenie całego ICMPv6 może zepsuć nawet lokalną łączność?",
      "hints": [
        "Filtrowanie ICMPv6 musi uwzględniać typy niezbędne do poprawnego działania stosu."
      ],
      "explanation_md": "Filtrowanie ICMPv6 musi uwzględniać typy niezbędne do poprawnego działania stosu.",
      "card_id": "ccna.ipv6.ext.13.theory",
      "type": "single_choice",
      "options": [
        {
          "text_md": "Ponieważ IPv6 jest szyfrowane przez ICMPv6",
          "feedback_md": "ICMPv6 nie zapewnia takiego szyfrowania.",
          "id": "A"
        },
        {
          "text_md": "Ponieważ każdy HTTP jest pakietem ICMPv6",
          "feedback_md": "HTTP korzysta z odpowiedniego transportu, nie jest ND.",
          "id": "B"
        },
        {
          "text_md": "ICMPv6 obsługuje ważne funkcje ND i komunikaty kontrolne",
          "feedback_md": "Filtrowanie ICMPv6 musi uwzględniać typy niezbędne do poprawnego działania stosu.",
          "id": "C"
        },
        {
          "text_md": "Ponieważ ARP używa portu ICMPv6",
          "feedback_md": "IPv6 nie używa ARP.",
          "id": "D"
        }
      ],
      "correct_option_id": "C"
    },
