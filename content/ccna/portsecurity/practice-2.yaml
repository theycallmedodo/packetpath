      "revision": 1,
      "title": "Limit jednego MAC — działanie",
      "skills": [
        "ccna.portsecurity.case-01",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.case-01.2.card",
      "front_md": "Port z maximum 1 obsługuje telefon i komputer, które wysyłają dwa różne MAC. Polityka dopuszcza oba urządzenia.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Limit port-security musi odzwierciedlać rzeczywistą liczbę urządzeń za portem.\n\n**Rozpoznanie:** Limit secure MAC jest mniejszy niż liczba uprawnionych urządzeń.\n\n**Działanie:** Dostosować limit i przypisania secure MAC do telefonu oraz komputera.\n\n**Sprawdzenie:** Oba uprawnione MAC są akceptowane bez nowych violations.",
      "example": "Dostosować limit i przypisania secure MAC do telefonu oraz komputera."
    },
    {
      "revision": 1,
      "title": "Restrict — działanie",
      "skills": [
        "ccna.portsecurity.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.case-02.2.card",
      "front_md": "Po pojawieniu się obcego MAC rośnie licznik violations; port pozostaje up i ruch legalnego MAC działa. Ustawiono restrict.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Restrict różni się od shutdown zakresem reakcji, zachowując port aktywny.\n\n**Rozpoznanie:** Tryb restrict odrzuca nieuprawnione źródło bez wyłączenia portu.\n\n**Działanie:** Usunąć lub autoryzować nowe urządzenie według polityki.\n\n**Sprawdzenie:** Legalny MAC nadal działa, a po usunięciu obcego ustaje przyrost violations.",
      "example": "Usunąć lub autoryzować nowe urządzenie według polityki."
    },
    {
      "revision": 1,
      "title": "Shutdown — działanie",
      "skills": [
        "ccna.portsecurity.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.case-03.2.card",
      "front_md": "Port-security w trybie shutdown wykryło naruszenie, a port ma secure-shutdown.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Samo podniesienie portu bez usunięcia przyczyny może odtworzyć awarię.\n\n**Rozpoznanie:** Naruszenie bezpieczeństwa wyłączyło port.\n\n**Działanie:** Usunąć przyczynę, a potem przywrócić port zgodnie z procedurą.\n\n**Sprawdzenie:** Port wraca do pracy bez natychmiastowego ponownego naruszenia.",
      "example": "Usunąć przyczynę, a potem przywrócić port zgodnie z procedurą."
    },
    {
      "revision": 1,
      "title": "Sticky po wymianie PC — działanie",
      "skills": [
        "ccna.portsecurity.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.case-04.2.card",
      "front_md": "Port pamięta sticky MAC starego komputera. Nowy autoryzowany komputer ma inny MAC i jest odrzucany.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Sticky utrwala poznane MAC; wymiana urządzenia wymaga kontrolowanej aktualizacji.\n\n**Rozpoznanie:** Stary wpis sticky nie odpowiada nowemu urządzeniu.\n\n**Działanie:** Usunąć właściwy stary wpis i bezpiecznie nauczyć autoryzowany nowy MAC.\n\n**Sprawdzenie:** Tabela secure MAC wskazuje nowy komputer, bez nieplanowanego rozszerzenia dostępu.",
      "example": "Usunąć właściwy stary wpis i bezpiecznie nauczyć autoryzowany nowy MAC."
    },
    {
      "revision": 1,
      "title": "Protect — działanie",
      "skills": [
        "ccna.portsecurity.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.case-05.2.card",
      "front_md": "Port działa w protect. Obce źródła są odrzucane bez sygnalizacji charakterystycznej dla restrict.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Tryby naruszeń różnią się także widocznością operacyjną.\n\n**Rozpoznanie:** Cisza w logach nie wyklucza odrzucania przez protect.\n\n**Działanie:** Sprawdzić tryb i secure MAC oraz użyć odpowiednich testów ruchu.\n\n**Sprawdzenie:** Legalne źródło przechodzi, a nieautoryzowane nie, przy aktywnym porcie.",
      "example": "Sprawdzić tryb i secure MAC oraz użyć odpowiednich testów ruchu."
    },
    {
      "revision": 1,
      "title": "Nietrwałe sticky — działanie",
      "skills": [
        "ccna.portsecurity.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.case-06.2.card",
      "front_md": "Po nauczeniu sticky MAC administrator nie zapisał konfiguracji; po restarcie wpis nie jest zachowany.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Uczenie sticky i trwały zapis konfiguracji to osobne kroki.\n\n**Rozpoznanie:** Nauczona konfiguracja nie trafiła do startup-config.\n\n**Działanie:** Po weryfikacji autoryzowanych wpisów zapisać konfigurację.\n\n**Sprawdzenie:** Zatwierdzone wpisy są obecne w startup-config i przetrwają restart.",
      "example": "Po weryfikacji autoryzowanych wpisów zapisać konfigurację."
    }
  ],
