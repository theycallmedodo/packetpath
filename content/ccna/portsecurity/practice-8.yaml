    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "ccna.portsecurity.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nPort z maximum 1 obsługuje telefon i komputer, które wysyłają dwa różne MAC. Polityka dopuszcza oba urządzenia.\n\n**Zgłoszenie II**\n\nPo pojawieniu się obcego MAC rośnie licznik violations; port pozostaje up i ruch legalnego MAC działa. Ustawiono restrict.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Limit secure MAC jest mniejszy niż liczba uprawnionych urządzeń. Dostosować limit i przypisania secure MAC do telefonu oraz komputera.\n\n**Sprawdzenie I:** Oba uprawnione MAC są akceptowane bez nowych violations.\n\n**Zgłoszenie II:** Tryb restrict odrzuca nieuprawnione źródło bez wyłączenia portu. Usunąć lub autoryzować nowe urządzenie według polityki.\n\n**Sprawdzenie II:** Legalny MAC nadal działa, a po usunięciu obcego ustaje przyrost violations.\n\n**Zależności:** Limit port-security musi odzwierciedlać rzeczywistą liczbę urządzeń za portem. Restrict różni się od shutdown zakresem reakcji, zachowując port aktywny.",
      "example": "I — Limit port-security musi odzwierciedlać rzeczywistą liczbę urządzeń za portem.\n\nII — Restrict różni się od shutdown zakresem reakcji, zachowując port aktywny."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.portsecurity.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nPort-security w trybie shutdown wykryło naruszenie, a port ma secure-shutdown.\n\n**Zgłoszenie II**\n\nPort pamięta sticky MAC starego komputera. Nowy autoryzowany komputer ma inny MAC i jest odrzucany.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Naruszenie bezpieczeństwa wyłączyło port. Usunąć przyczynę, a potem przywrócić port zgodnie z procedurą.\n\n**Sprawdzenie I:** Port wraca do pracy bez natychmiastowego ponownego naruszenia.\n\n**Zgłoszenie II:** Stary wpis sticky nie odpowiada nowemu urządzeniu. Usunąć właściwy stary wpis i bezpiecznie nauczyć autoryzowany nowy MAC.\n\n**Sprawdzenie II:** Tabela secure MAC wskazuje nowy komputer, bez nieplanowanego rozszerzenia dostępu.\n\n**Zależności:** Samo podniesienie portu bez usunięcia przyczyny może odtworzyć awarię. Sticky utrwala poznane MAC; wymiana urządzenia wymaga kontrolowanej aktualizacji.",
      "example": "I — Samo podniesienie portu bez usunięcia przyczyny może odtworzyć awarię.\n\nII — Sticky utrwala poznane MAC; wymiana urządzenia wymaga kontrolowanej aktualizacji."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "ccna.portsecurity.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960l/software/15-2_7_e/configuration_guide/sec/b_1527e_security_2960l_cg/port_security.html"
        },
        {
          "title": "Cisco — Port Security",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/security/s1/sec-s1-cr-book/sec-cr-s6.html"
        }
      ],
      "id": "ccna.portsecurity.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nPort działa w protect. Obce źródła są odrzucane bez sygnalizacji charakterystycznej dla restrict.\n\n**Zgłoszenie II**\n\nPo nauczeniu sticky MAC administrator nie zapisał konfiguracji; po restarcie wpis nie jest zachowany.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Cisza w logach nie wyklucza odrzucania przez protect. Sprawdzić tryb i secure MAC oraz użyć odpowiednich testów ruchu.\n\n**Sprawdzenie I:** Legalne źródło przechodzi, a nieautoryzowane nie, przy aktywnym porcie.\n\n**Zgłoszenie II:** Nauczona konfiguracja nie trafiła do startup-config. Po weryfikacji autoryzowanych wpisów zapisać konfigurację.\n\n**Sprawdzenie II:** Zatwierdzone wpisy są obecne w startup-config i przetrwają restart.\n\n**Zależności:** Tryby naruszeń różnią się także widocznością operacyjną. Uczenie sticky i trwały zapis konfiguracji to osobne kroki.",
      "example": "I — Tryby naruszeń różnią się także widocznością operacyjną.\n\nII — Uczenie sticky i trwały zapis konfiguracji to osobne kroki."
    },
