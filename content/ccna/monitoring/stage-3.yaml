    {
      "id": "ccna.monitoring.13",
      "revision": 1,
      "title": "SNMPv3 authPriv",
      "skills": [
        "monitoring.snmpv3-level"
      ],
      "sources": [
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "4.4"
        }
      ],
      "difficulty": 3,
      "prompt_md": "Co zapewnia poziom bezpieczeństwa authPriv w SNMPv3?",
      "hints": [
        "Rozdziel dwa człony nazwy."
      ],
      "explanation_md": "Poziomy SNMPv3 odróżniają brak ochrony, uwierzytelnienie oraz uwierzytelnienie z prywatnością. Same nazwy użytkowników nie gwarantują authPriv.",
      "card_id": "ccna.monitoring.13.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Brak uwierzytelnienia i brak szyfrowania.",
          "feedback_md": "To nie jest authPriv."
        },
        {
          "id": "B",
          "text_md": "Wyłącznie nazwę community.",
          "feedback_md": "SNMPv3 nie opiera tego poziomu na community v2c."
        },
        {
          "id": "C",
          "text_md": "Samo uwierzytelnienie bez poufności.",
          "feedback_md": "To odpowiada idei authNoPriv."
        },
        {
          "id": "D",
          "text_md": "Uwierzytelnienie i ochronę poufności danych.",
          "feedback_md": "Auth dotyczy uwierzytelnienia, priv poufności."
        }
      ],
      "correct_option_id": "D"
    },
