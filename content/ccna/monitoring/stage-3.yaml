    {
      "id": "ccna.monitoring.16",
      "revision": 1,
      "title": "Dlaczego brak informational?",
      "skills": [
        "monitoring.logging-diagnosis"
      ],
      "sources": [
        {
          "title": "Cisco — System Message Logging",
