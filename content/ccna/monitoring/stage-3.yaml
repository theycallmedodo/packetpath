      ],
      "difficulty": 3,
      "prompt_md": "Syslog dociera do serwera, ale urządzenie ma logging trap warnings. Dlaczego nie widać wiadomości severity 6?",
      "hints": [
        "Porównaj wartość progu z numerem wiadomości."
      ],
      "explanation_md": "Brak konkretnej klasy logów może wynikać z progu, nawet gdy transport do serwera działa.",
      "card_id": "ccna.monitoring.16.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Poziom 6 jest poniżej wymaganego progu pilności i nie jest wysyłany.",
          "feedback_md": "Próg 4 obejmuje 0–4, więc 6 jest wykluczone."
        },
        {
          "id": "B",
          "text_md": "Każda wiadomość 6 oznacza błąd hasła community.",
          "feedback_md": "Severity syslog nie definiuje takiej przyczyny SNMP."
        },
        {
          "id": "C",
          "text_md": "Severity 6 jest zawsze wysyłane tylko przez konsolę szeregową.",
          "feedback_md": "Można wysyłać 6 zdalnie po dobraniu progu."
        },
        {
          "id": "D",
          "text_md": "NTP usuwa wiadomości severity 6.",
          "feedback_md": "NTP nie filtruje wiadomości po severity."
        }
      ],
      "correct_option_id": "A"
    },
