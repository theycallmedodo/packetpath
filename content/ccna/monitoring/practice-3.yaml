        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.case-01.3.card",
      "front_md": "Logi dwóch routerów dotyczą tej samej awarii, ale znaczniki różnią się o kilkanaście minut; jeden router nie jest zsynchronizowany.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Monitoring wymaga wiarygodnego czasu, nie tylko poprawnego odbioru logów.\n\n**Rozpoznanie:** Niespójny czas utrudnia korelację zdarzeń.\n\n**Działanie:** Przywrócić synchronizację z zatwierdzonym źródłem NTP.\n\n**Sprawdzenie:** Status NTP potwierdza synchronizację, a porównane zdarzenia mają spójne czasy.",
      "example": "Status NTP potwierdza synchronizację, a porównane zdarzenia mają spójne czasy."
    },
    {
      "revision": 1,
      "title": "Poziom syslog — weryfikacja",
      "skills": [
        "ccna.monitoring.case-02",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.case-02.3.card",
      "front_md": "Urządzenie wysyła do kolektora tylko severity 0–4. Poszukiwany komunikat ma poziom 6.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Niższy numer syslog oznacza większą pilność; próg obejmuje poziomy do wskazanego numeru.\n\n**Rozpoznanie:** Próg wysyłania wyklucza komunikat informational.\n\n**Działanie:** Dostosować próg logging trap do wymaganego poziomu i obciążenia.\n\n**Sprawdzenie:** Kolektor odbiera kontrolny komunikat severity 6.",
      "example": "Kolektor odbiera kontrolny komunikat severity 6."
    },
    {
      "revision": 1,
      "title": "Zły adres kolektora — weryfikacja",
      "skills": [
        "ccna.monitoring.case-03",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.case-03.3.card",
      "front_md": "Lokalny bufor zawiera zdarzenia, ale logging host wskazuje stary adres kolektora.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Działający bufor lokalny nie potwierdza poprawnego eksportu logów.\n\n**Rozpoznanie:** Logi są kierowane do niewłaściwego odbiorcy.\n\n**Działanie:** Ustawić aktualny zatwierdzony adres serwera syslog.\n\n**Sprawdzenie:** Kontrolne zdarzenie pojawia się na nowym kolektorze z poprawnym źródłem.",
      "example": "Kontrolne zdarzenie pojawia się na nowym kolektorze z poprawnym źródłem."
    },
    {
      "revision": 1,
      "title": "SNMP ACL — weryfikacja",
      "skills": [
        "ccna.monitoring.case-04",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.case-04.3.card",
      "front_md": "Zapytania SNMP z NMS są widoczne na routerze, ale ACL przypisana do community nie obejmuje adresu NMS.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Dostęp SNMP zależy także od ograniczeń źródłowych, nie tylko poprawnej community.\n\n**Rozpoznanie:** Polityka community odrzuca źródło zapytań.\n\n**Działanie:** Dodać właściwy adres NMS do dedykowanej listy dopuszczonych źródeł.\n\n**Sprawdzenie:** Kontrolny odczyt SNMP z NMS zwraca oczekiwaną wartość.",
      "example": "Kontrolny odczyt SNMP z NMS zwraca oczekiwaną wartość."
    },
    {
      "revision": 1,
      "title": "Licznik narastający — weryfikacja",
      "skills": [
        "ccna.monitoring.case-05",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.case-05.3.card",
      "front_md": "Interfejs ma 100000 błędów, lecz w ciągu kontrolowanych 10 minut licznik nie wzrósł.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Liczniki narastające interpretuje się przez różnicę w określonym interwale.\n\n**Rozpoznanie:** Suma historyczna nie dowodzi bieżącego wzrostu błędów.\n\n**Działanie:** Porównać przyrosty i czasy pomiarów przy rzeczywistym ruchu.\n\n**Sprawdzenie:** Dwa kolejne odczyty z czasem pozwalają wyliczyć tempo nowych błędów.",
      "example": "Dwa kolejne odczyty z czasem pozwalają wyliczyć tempo nowych błędów."
    },
    {
      "revision": 1,
      "title": "Zła skala wykresu — weryfikacja",
      "skills": [
        "ccna.monitoring.case-06",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.case-06.3.card",
      "front_md": "Przyrost licznika octets wynosi 1250000 przez sekundę, a wykres opisuje tę liczbę jako bit/s.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Octet to osiem bitów; jednostka i interwał są częścią poprawnego pomiaru.\n\n**Rozpoznanie:** Nie przeliczono bajtów na bity.\n\n**Działanie:** Pomnożyć tempo octets/s przez 8 dla wykresu bit/s.\n\n**Sprawdzenie:** Wartość odpowiada 10000000 bit/s, czyli 10 Mb/s.",
      "example": "Wartość odpowiada 10000000 bit/s, czyli 10 Mb/s."
    }
  ],
