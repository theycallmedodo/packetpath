      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "ccna.monitoring.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nLogi dwóch routerów dotyczą tej samej awarii, ale znaczniki różnią się o kilkanaście minut; jeden router nie jest zsynchronizowany.\n\n**Zgłoszenie II**\n\nUrządzenie wysyła do kolektora tylko severity 0–4. Poszukiwany komunikat ma poziom 6.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Niespójny czas utrudnia korelację zdarzeń. Przywrócić synchronizację z zatwierdzonym źródłem NTP.\n\n**Sprawdzenie I:** Status NTP potwierdza synchronizację, a porównane zdarzenia mają spójne czasy.\n\n**Zgłoszenie II:** Próg wysyłania wyklucza komunikat informational. Dostosować próg logging trap do wymaganego poziomu i obciążenia.\n\n**Sprawdzenie II:** Kolektor odbiera kontrolny komunikat severity 6.\n\n**Zależności:** Monitoring wymaga wiarygodnego czasu, nie tylko poprawnego odbioru logów. Niższy numer syslog oznacza większą pilność; próg obejmuje poziomy do wskazanego numeru.",
      "example": "I — Monitoring wymaga wiarygodnego czasu, nie tylko poprawnego odbioru logów.\n\nII — Niższy numer syslog oznacza większą pilność; próg obejmuje poziomy do wskazanego numeru."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.monitoring.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nLokalny bufor zawiera zdarzenia, ale logging host wskazuje stary adres kolektora.\n\n**Zgłoszenie II**\n\nZapytania SNMP z NMS są widoczne na routerze, ale ACL przypisana do community nie obejmuje adresu NMS.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Logi są kierowane do niewłaściwego odbiorcy. Ustawić aktualny zatwierdzony adres serwera syslog.\n\n**Sprawdzenie I:** Kontrolne zdarzenie pojawia się na nowym kolektorze z poprawnym źródłem.\n\n**Zgłoszenie II:** Polityka community odrzuca źródło zapytań. Dodać właściwy adres NMS do dedykowanej listy dopuszczonych źródeł.\n\n**Sprawdzenie II:** Kontrolny odczyt SNMP z NMS zwraca oczekiwaną wartość.\n\n**Zależności:** Działający bufor lokalny nie potwierdza poprawnego eksportu logów. Dostęp SNMP zależy także od ograniczeń źródłowych, nie tylko poprawnej community.",
      "example": "I — Działający bufor lokalny nie potwierdza poprawnego eksportu logów.\n\nII — Dostęp SNMP zależy także od ograniczeń źródłowych, nie tylko poprawnej community."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "ccna.monitoring.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — NTP",
          "url": "https://www.cisco.com/c/en/us/support/docs/technical-details/220303-verify-ntp-status-with-the-show-ntp-asso.html"
        },
        {
          "title": "Cisco — System Message Logging",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/access/wireless/software/guide/SysMsgLogging.html"
        },
        {
          "title": "Cisco — SNMP configuration",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/snmp/configuration/15-mt/snmp-15-mt-book/nm-snmp-cfg-snmp-support.html"
        }
      ],
      "id": "ccna.monitoring.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nInterfejs ma 100000 błędów, lecz w ciągu kontrolowanych 10 minut licznik nie wzrósł.\n\n**Zgłoszenie II**\n\nPrzyrost licznika octets wynosi 1250000 przez sekundę, a wykres opisuje tę liczbę jako bit/s.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Suma historyczna nie dowodzi bieżącego wzrostu błędów. Porównać przyrosty i czasy pomiarów przy rzeczywistym ruchu.\n\n**Sprawdzenie I:** Dwa kolejne odczyty z czasem pozwalają wyliczyć tempo nowych błędów.\n\n**Zgłoszenie II:** Nie przeliczono bajtów na bity. Pomnożyć tempo octets/s przez 8 dla wykresu bit/s.\n\n**Sprawdzenie II:** Wartość odpowiada 10000000 bit/s, czyli 10 Mb/s.\n\n**Zależności:** Liczniki narastające interpretuje się przez różnicę w określonym interwale. Octet to osiem bitów; jednostka i interwał są częścią poprawnego pomiaru.",
      "example": "I — Liczniki narastające interpretuje się przez różnicę w określonym interwale.\n\nII — Octet to osiem bitów; jednostka i interwał są częścią poprawnego pomiaru."
    },
