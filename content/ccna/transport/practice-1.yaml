        }
      ],
      "id": "ccna.transport.practice.case-03.1.card",
      "front_md": "Aplikacja wysyła datagram UDP i nie widzi potwierdzenia transportowego, choć pakiet dotarł.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Dostarczenie datagramu UDP i potwierdzenie aplikacyjne to osobne kwestie.\n\n**Rozpoznanie:** UDP nie definiuje potwierdzeń i retransmisji takich jak TCP.\n\n**Działanie:** Weryfikować odpowiedź aplikacji albo przechwycenie odbiorcy.\n\n**Sprawdzenie:** Odbiorca widzi datagram, niezależnie od braku ACK transportowego.",
      "example": "UDP nie definiuje potwierdzeń i retransmisji takich jak TCP."
    },
