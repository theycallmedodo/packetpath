      "id": "ccna.transport.practice.case-06.1.card",
      "front_md": "Odbiorca TCP ogłasza window 0, a łącze ma wolną przepustowość.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Flow control chroni odbiorcę i nie jest tym samym co congestion control sieci.\n\n**Rozpoznanie:** Odbiorca chwilowo nie udostępnia miejsca w buforze odbiorczym.\n\n**Działanie:** Sprawdzić wydajność aplikacji odbiorczej i opróżnianie bufora.\n\n**Sprawdzenie:** Odbiorca ogłasza dodatnie okno i transmisja danych wraca.",
      "example": "Odbiorca chwilowo nie udostępnia miejsca w buforze odbiorczym."
