          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.transport.practice.case-02.2.card",
      "front_md": "SYN dochodzi do hosta, a host odpowiada RST. Polityka nie generuje pośrednich resetów.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "RST różni się od cichego dropu i wskazuje aktywne odrzucenie sesji.\n\n**Rozpoznanie:** Host aktywnie odrzucił próbę sesji TCP.\n\n**Działanie:** Sprawdzić, czy usługa nasłuchuje na właściwym adresie i porcie.\n\n**Sprawdzenie:** Po uruchomieniu właściwej usługi serwer odpowiada SYN-ACK.",
      "example": "Sprawdzić, czy usługa nasłuchuje na właściwym adresie i porcie."
    },
