      "id": "ccna.transport.practice.case-05.2.card",
      "front_md": "W przechwyceniu TCP ponownie wysyła zakres bajtów, którego nie potwierdzono.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "TCP zapewnia niezawodność przez numery sekwencji, potwierdzenia i retransmisje.\n\n**Rozpoznanie:** Nadawca próbuje odzyskać dane uznane za utracone.\n\n**Działanie:** Sprawdzić utraty, opóźnienia ACK i drogę w obu kierunkach.\n\n**Sprawdzenie:** Po usunięciu problemu maleje liczba retransmisji przy podobnym obciążeniu.",
      "example": "Sprawdzić utraty, opóźnienia ACK i drogę w obu kierunkach."
