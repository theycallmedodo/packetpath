      ],
      "id": "ccna.transport.practice.case-01.2.card",
      "front_md": "Klient powtarza SYN, ale nie otrzymuje SYN-ACK ani RST. Nie znamy jeszcze miejsca zaniku.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Brak odpowiedzi na SYN nie rozstrzyga sam, czy winny jest serwer, ACL czy droga powrotna.\n\n**Rozpoznanie:** Handshake TCP nie został ukończony.\n\n**Działanie:** Śledzić SYN i odpowiedź w obu kierunkach, zaczynając od drogi i filtrów.\n\n**Sprawdzenie:** Przechwycenie wskazuje konkretny punkt utraty albo pojawia się pełny handshake.",
      "example": "Śledzić SYN i odpowiedź w obu kierunkach, zaczynając od drogi i filtrów."
    },
