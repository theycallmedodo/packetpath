      ],
      "id": "ccna.transport.practice.case-04.2.card",
      "front_md": "Klient otwiera HTTPS z 10.0.0.5:53000 do 192.0.2.10:443.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Kierunek odpowiedzi zamienia role adresów i portów w przepływie.\n\n**Rozpoznanie:** Port klienta identyfikuje konkretną lokalną sesję.\n\n**Działanie:** Dla odpowiedzi oczekiwać źródła 443 i celu 53000 z odwróconymi adresami.\n\n**Sprawdzenie:** Pakiet odpowiedzi ma 192.0.2.10:443 → 10.0.0.5:53000.",
      "example": "Dla odpowiedzi oczekiwać źródła 443 i celu 53000 z odwróconymi adresami."
    },
