    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — rozpoznanie",
      "skills": [
        "ccna.transport.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — TCP i UDP — sesje i diagnostyka",
          "url": "https://www.cisco.com/en/US/docs/ios-xml/ios/ipapp/configuration/15-1sy/iap-tcp.html"
        },
        {
          "title": "Dokumentacja Cisco — TCP i UDP — sesje i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.transport.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nKlient powtarza SYN, ale nie otrzymuje SYN-ACK ani RST. Nie znamy jeszcze miejsca zaniku.\n\n**Zgłoszenie II**\n\nSYN dochodzi do hosta, a host odpowiada RST. Polityka nie generuje pośrednich resetów.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Handshake TCP nie został ukończony. Śledzić SYN i odpowiedź w obu kierunkach, zaczynając od drogi i filtrów.\n\n**Sprawdzenie I:** Przechwycenie wskazuje konkretny punkt utraty albo pojawia się pełny handshake.\n\n**Zgłoszenie II:** Host aktywnie odrzucił próbę sesji TCP. Sprawdzić, czy usługa nasłuchuje na właściwym adresie i porcie.\n\n**Sprawdzenie II:** Po uruchomieniu właściwej usługi serwer odpowiada SYN-ACK.\n\n**Zależności:** Brak odpowiedzi na SYN nie rozstrzyga sam, czy winny jest serwer, ACL czy droga powrotna. RST różni się od cichego dropu i wskazuje aktywne odrzucenie sesji.",
      "example": "I — Handshake TCP nie został ukończony.\n\nII — Host aktywnie odrzucił próbę sesji TCP."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — rozpoznanie",
      "skills": [
        "ccna.transport.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — TCP i UDP — sesje i diagnostyka",
          "url": "https://www.cisco.com/en/US/docs/ios-xml/ios/ipapp/configuration/15-1sy/iap-tcp.html"
        },
        {
          "title": "Dokumentacja Cisco — TCP i UDP — sesje i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.transport.practice.compare-02.1.card",
      "front_md": "**Zgłoszenie I**\n\nAplikacja wysyła datagram UDP i nie widzi potwierdzenia transportowego, choć pakiet dotarł.\n\n**Zgłoszenie II**\n\nKlient otwiera HTTPS z 10.0.0.5:53000 do 192.0.2.10:443.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** UDP nie definiuje potwierdzeń i retransmisji takich jak TCP. Weryfikować odpowiedź aplikacji albo przechwycenie odbiorcy.\n\n**Sprawdzenie I:** Odbiorca widzi datagram, niezależnie od braku ACK transportowego.\n\n**Zgłoszenie II:** Port klienta identyfikuje konkretną lokalną sesję. Dla odpowiedzi oczekiwać źródła 443 i celu 53000 z odwróconymi adresami.\n\n**Sprawdzenie II:** Pakiet odpowiedzi ma 192.0.2.10:443 → 10.0.0.5:53000.\n\n**Zależności:** Dostarczenie datagramu UDP i potwierdzenie aplikacyjne to osobne kwestie. Kierunek odpowiedzi zamienia role adresów i portów w przepływie.",
      "example": "I — UDP nie definiuje potwierdzeń i retransmisji takich jak TCP.\n\nII — Port klienta identyfikuje konkretną lokalną sesję."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — rozpoznanie",
      "skills": [
        "ccna.transport.contrast",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — TCP i UDP — sesje i diagnostyka",
          "url": "https://www.cisco.com/en/US/docs/ios-xml/ios/ipapp/configuration/15-1sy/iap-tcp.html"
        },
        {
          "title": "Dokumentacja Cisco — TCP i UDP — sesje i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.transport.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nW przechwyceniu TCP ponownie wysyła zakres bajtów, którego nie potwierdzono.\n\n**Zgłoszenie II**\n\nOdbiorca TCP ogłasza window 0, a łącze ma wolną przepustowość.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Nadawca próbuje odzyskać dane uznane za utracone. Sprawdzić utraty, opóźnienia ACK i drogę w obu kierunkach.\n\n**Sprawdzenie I:** Po usunięciu problemu maleje liczba retransmisji przy podobnym obciążeniu.\n\n**Zgłoszenie II:** Odbiorca chwilowo nie udostępnia miejsca w buforze odbiorczym. Sprawdzić wydajność aplikacji odbiorczej i opróżnianie bufora.\n\n**Sprawdzenie II:** Odbiorca ogłasza dodatnie okno i transmisja danych wraca.\n\n**Zależności:** TCP zapewnia niezawodność przez numery sekwencji, potwierdzenia i retransmisje. Flow control chroni odbiorcę i nie jest tym samym co congestion control sieci.",
      "example": "I — Nadawca próbuje odzyskać dane uznane za utracone.\n\nII — Odbiorca chwilowo nie udostępnia miejsca w buforze odbiorczym."
    },
