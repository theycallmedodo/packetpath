      ],
      "id": "ccna.ipv4.practice.case-01.1.card",
      "front_md": "Host 192.168.10.63/26 nie może zostać poprawnie przydzielony jako zwykły adres stacji w podsieci 192.168.10.0/26.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Adres z samymi jedynkami w części hosta jest broadcastem zwykłej podsieci IPv4.\n\n**Rozpoznanie:** Wybrano adres rozgłoszeniowy podsieci /26.\n\n**Działanie:** Przydzielić wolny adres z zakresu 192.168.10.1–62 z maską /26.\n\n**Sprawdzenie:** Adres hosta mieści się między .1 i .62, a broadcast to .63.",
      "example": "Wybrano adres rozgłoszeniowy podsieci /26."
    },
    {
      "revision": 1,
      "title": "Zbyt szeroka maska — rozpoznanie",
      "skills": [
        "ccna.ipv4.case-02",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv4 i subnetting",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_config-ipv4-addr-0.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13790-8.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13788-3.html"
        }
      ],
      "id": "ccna.ipv4.practice.case-02.1.card",
      "front_md": "PC 10.10.1.10 ma /16 zamiast wymaganego /24. Dla zdalnego 10.10.2.20 wysyła ARP zamiast pakietu do bramy.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Maska hosta decyduje, czy cel jest osiągany bezpośrednio, czy przez bramę.\n\n**Rozpoznanie:** Host błędnie uznaje zdalną podsieć za lokalną.\n\n**Działanie:** Ustawić na PC maskę 255.255.255.0 zgodnie z projektem.\n\n**Sprawdzenie:** Przy próbie do 10.10.2.20 host rozwiązuje MAC bramy, nie tego zdalnego hosta.",
      "example": "Host błędnie uznaje zdalną podsieć za lokalną."
    },
    {
      "revision": 1,
      "title": "Brama poza siecią — rozpoznanie",
      "skills": [
        "ccna.ipv4.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv4 i subnetting",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_config-ipv4-addr-0.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13790-8.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13788-3.html"
        }
      ],
      "id": "ccna.ipv4.practice.case-03.1.card",
      "front_md": "PC 172.16.8.10/24 ma bramę 172.16.9.1. Właściwy interfejs routera LAN ma 172.16.8.1.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "W typowym LAN brama hosta musi być bezpośrednio osiągalna w jego podsieci.\n\n**Rozpoznanie:** Skonfigurowana brama nie leży w lokalnej podsieci hosta.\n\n**Działanie:** Zmienić bramę PC na 172.16.8.1.\n\n**Sprawdzenie:** Host rozwiązuje ARP 172.16.8.1 i przesyła do tej bramy ruch poza /24.",
      "example": "Skonfigurowana brama nie leży w lokalnej podsieci hosta."
    },
    {
      "revision": 1,
      "title": "Za mała podsieć — rozpoznanie",
      "skills": [
        "ccna.ipv4.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv4 i subnetting",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_config-ipv4-addr-0.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13790-8.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13788-3.html"
        }
      ],
      "id": "ccna.ipv4.practice.case-04.1.card",
      "front_md": "Nowy LAN potrzebuje 50 zwykłych adresów hostów. Projekt przydziela mu /27; nie używamy /31 ani specjalnych wyjątków.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Dla zwykłej podsieci liczba hostów wynosi 2 do liczby bitów hosta minus 2.\n\n**Rozpoznanie:** Podsieć /27 oferuje tylko 30 użytecznych adresów.\n\n**Działanie:** Przydzielić odpowiednio wyrównaną, wolną podsieć /26.\n\n**Sprawdzenie:** Plan adresacji zapewnia 62 użyteczne adresy, co wystarcza dla 50 urządzeń.",
      "example": "Podsieć /27 oferuje tylko 30 użytecznych adresów."
    },
    {
      "revision": 1,
      "title": "Nakładanie VLSM — rozpoznanie",
      "skills": [
        "ccna.ipv4.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv4 i subnetting",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_config-ipv4-addr-0.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13790-8.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13788-3.html"
        }
      ],
      "id": "ccna.ipv4.practice.case-05.1.card",
      "front_md": "W jednym planie przydzielono LAN-A 10.0.0.0/25 i LAN-B 10.0.0.64/26. LAN-B musi być odrębną podsiecią.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Podsieci VLSM w jednym planie muszą mieć rozłączne zakresy, nie tylko różne adresy sieci.\n\n**Rozpoznanie:** Zakres LAN-B zawiera się w LAN-A.\n\n**Działanie:** Przenieść LAN-B do wolnego 10.0.0.128/26, aktualizując jego hosty i bramę.\n\n**Sprawdzenie:** Zakresy A .0–.127 i B .128–.191 nie mają wspólnych adresów.",
      "example": "Zakres LAN-B zawiera się w LAN-A."
    },
    {
      "revision": 1,
      "title": "Duplikat adresu — rozpoznanie",
      "skills": [
        "ccna.ipv4.case-06",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — IPv4 i subnetting",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_config-ipv4-addr-0.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13790-8.html"
        },
        {
          "title": "Dokumentacja Cisco — IPv4 — VLSM i granice podsieci",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/routing-information-protocol-rip/13788-3.html"
        }
      ],
      "id": "ccna.ipv4.practice.case-06.1.card",
      "front_md": "Dwie stacje w tym samym VLAN mają statycznie 192.168.5.20. Wpis ARP dla .20 zmienia się między ich MAC.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "ARP wiąże IPv4 z MAC; konflikt adresów może powodować naprzemienne dostarczanie ruchu.\n\n**Rozpoznanie:** Dwa urządzenia używają tego samego adresu IPv4.\n\n**Działanie:** Nadać jednej stacji inny, zweryfikowany wolny adres.\n\n**Sprawdzenie:** Po odświeżeniu ARP adres .20 stabilnie wskazuje jeden MAC, a obie stacje działają osobno.",
      "example": "Dwa urządzenia używają tego samego adresu IPv4."
    }
  ],
