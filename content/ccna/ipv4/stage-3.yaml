          "id": "C",
          "text_md": "/26",
          "feedback_md": "/26 daje 62 hosty i jest najmniejszym pasującym blokiem."
        },
        {
          "id": "D",
          "text_md": "/25",
          "feedback_md": "/25 pomieści hosty, ale zużyje więcej adresów niż /26."
