      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "ccna.aaa.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — AAA — tożsamość, uprawnienia i audyt",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/sec_user_services/configuration/guide/convert/aaa/sec_cfg_authentifcn.html"
        },
        {
          "title": "Dokumentacja Cisco — AAA — tożsamość, uprawnienia i audyt",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_usr_aaa/configuration/xe-16/sec-usr-aaa-xe-16-book.pdf"
        }
      ],
      "id": "ccna.aaa.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nLista metod ma group tacacs+ local. Serwer działa i zwraca jawne odrzucenie hasła; konto local nie jest użyte.\n\n**Zgłoszenie II**\n\nUżytkownik loguje się, ale serwer odmawia wykonania konkretnej komendy.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Jawne odrzucenie nie jest niedostępnością serwera AAA. Poprawić dane lub politykę serwera, zamiast oczekiwać obejścia reject przez local.\n\n**Sprawdzenie I:** Poprawne konto zostaje zatwierdzone przez serwer; błędne nadal jest odrzucane.\n\n**Zgłoszenie II:** Authentication powiodło się, authorization odmówiło uprawnienia. Sprawdzić profil uprawnień i regułę autoryzacji tej komendy.\n\n**Sprawdzenie II:** Uprawniony użytkownik może wykonać właściwą komendę, bez zbędnego rozszerzenia praw.\n\n**Zależności:** Fallback lokalny zwykle dotyczy błędu dostępności metody, a nie jawnego deny. Uwierzytelnienie tożsamości nie jest równoznaczne z autoryzacją wszystkich działań.",
      "example": "I — Fallback lokalny zwykle dotyczy błędu dostępności metody, a nie jawnego deny.\n\nII — Uwierzytelnienie tożsamości nie jest równoznaczne z autoryzacją wszystkich działań."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.aaa.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — AAA — tożsamość, uprawnienia i audyt",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/sec_user_services/configuration/guide/convert/aaa/sec_cfg_authentifcn.html"
        },
        {
          "title": "Dokumentacja Cisco — AAA — tożsamość, uprawnienia i audyt",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_usr_aaa/configuration/xe-16/sec-usr-aaa-xe-16-book.pdf"
        }
      ],
      "id": "ccna.aaa.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nLogowanie i polecenia działają, lecz nie powstają wymagane rekordy rozliczeniowe.\n\n**Zgłoszenie II**\n\nRADIUS odbiera pakiety od znanego NAS, lecz odrzuca je z powodu niezgodnego współdzielonego sekretu.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Accounting nie został poprawnie włączony lub dostarczony. Sprawdzić listę accounting, jej zastosowanie i dostępność odbiorcy.\n\n**Sprawdzenie I:** Kontrolna sesja generuje oczekiwane rekordy start/stop lub komend.\n\n**Zgłoszenie II:** Sekret skonfigurowany po obu stronach nie jest zgodny. Uzgodnić sekret routera i odpowiadającego mu klienta na serwerze.\n\n**Sprawdzenie II:** Serwer poprawnie weryfikuje zapytania tego NAS.\n\n**Zależności:** Accounting rejestruje aktywność i jest oddzielną częścią AAA. Adres klienta AAA i jego shared secret są częścią zaufanej relacji serwer–urządzenie.",
      "example": "I — Accounting rejestruje aktywność i jest oddzielną częścią AAA.\n\nII — Adres klienta AAA i jego shared secret są częścią zaufanej relacji serwer–urządzenie."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "ccna.aaa.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — AAA — tożsamość, uprawnienia i audyt",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios/sec_user_services/configuration/guide/convert/aaa/sec_cfg_authentifcn.html"
        },
        {
          "title": "Dokumentacja Cisco — AAA — tożsamość, uprawnienia i audyt",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_usr_aaa/configuration/xe-16/sec-usr-aaa-xe-16-book.pdf"
        }
      ],
      "id": "ccna.aaa.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nPo zmianie routingu zapytania AAA wychodzą z innego adresu; serwer zgłasza unknown client.\n\n**Zgłoszenie II**\n\nOperator planuje zmienić jedyną metodę logowania przez tę samą sesję SSH, bez sprawdzonego dostępu awaryjnego.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Serwer nie rozpoznaje nowego adresu źródłowego NAS. Ustalić stabilne źródło i zgodny wpis klienta po stronie AAA.\n\n**Sprawdzenie I:** Serwer identyfikuje zapytania jako właściwy NAS po zaplanowanym adresie.\n\n**Zgłoszenie II:** Zmiana może odciąć możliwość dalszego zarządzania. Najpierw zapewnić i sprawdzić ścieżkę awaryjną, potem testować nową metodę osobną sesją.\n\n**Sprawdzenie II:** Nowa sesja przechodzi poprawnie, a dostęp awaryjny pozostaje dostępny.\n\n**Zależności:** Routing i wybór source interface wpływają na rozpoznanie klienta AAA. Zmiany AAA wymagają weryfikacji nowej sesji przed porzuceniem działającego dostępu.",
      "example": "I — Routing i wybór source interface wpływają na rozpoznanie klienta AAA.\n\nII — Zmiany AAA wymagają weryfikacji nowej sesji przed porzuceniem działającego dostępu."
    },
