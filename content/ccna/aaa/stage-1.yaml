      "type": "single_choice",
      "options": [
        {
          "text_md": "Kim jest podmiot próbujący uzyskać dostęp?",
          "feedback_md": "Authentication potwierdza tożsamość na podstawie przyjętej metody i poświadczeń.",
          "id": "A"
        },
        {
          "text_md": "Jakie dokładnie komendy wolno mu wykonać?",
          "feedback_md": "To zagadnienie autoryzacji.",
          "id": "B"
        },
        {
          "text_md": "Co zrobił podczas wczorajszej sesji?",
          "feedback_md": "To zagadnienie rejestrowania aktywności.",
          "id": "C"
        },
        {
          "text_md": "Która trasa ma najniższą metrykę?",
          "feedback_md": "To wybór trasy, nie AAA.",
          "id": "D"
        }
      ],
      "correct_option_id": "A"
    },
