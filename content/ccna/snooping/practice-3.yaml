  "cards": [
    {
      "revision": 1,
      "title": "Niezaufany serwer — weryfikacja",
      "skills": [
        "ccna.snooping.case-01",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.case-01.3.card",
      "front_md": "Legalny DHCP Offer wchodzi na port untrusted w VLAN z aktywnym snoopingiem i jest odrzucany.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Zaufanie DHCP snooping określa, skąd wolno przyjmować wiadomości serwera.\n\n**Rozpoznanie:** Odpowiedź serwera przychodzi przez niezaufany port.\n\n**Działanie:** Oznaczyć wyłącznie zweryfikowaną drogę do legalnego serwera jako trusted.\n\n**Sprawdzenie:** Offer z legalnej drogi przechodzi, a porty klientów pozostają untrusted.",
      "example": "Offer z legalnej drogi przechodzi, a porty klientów pozostają untrusted."
    },
    {
      "revision": 1,
      "title": "Rogue DHCP — weryfikacja",
      "skills": [
        "ccna.snooping.case-02",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.case-02.3.card",
      "front_md": "Nieautoryzowany serwer podłączono do zwykłego portu klienta; jego Offer jest blokowany.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Port klienta nie powinien być trusted tylko po to, aby przepuścić obcy Offer.\n\n**Rozpoznanie:** Snooping prawidłowo odrzuca wiadomości serwera na untrusted.\n\n**Działanie:** Pozostawić ochronę i usunąć nieautoryzowany serwer.\n\n**Sprawdzenie:** Klient otrzymuje ofertę tylko z legalnej infrastruktury DHCP.",
      "example": "Klient otrzymuje ofertę tylko z legalnej infrastruktury DHCP."
    },
    {
      "revision": 1,
      "title": "Brak VLAN — weryfikacja",
      "skills": [
        "ccna.snooping.case-03",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.case-03.3.card",
      "front_md": "Snooping jest włączony globalnie, ale lista chronionych VLAN nie zawiera VLAN 30.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Globalne włączenie i zakres VLAN są oddzielnymi elementami ochrony.\n\n**Rozpoznanie:** Ochrona nie obejmuje analizowanego VLAN.\n\n**Działanie:** Dodać VLAN 30 do konfiguracji DHCP snooping.\n\n**Sprawdzenie:** Show ip dhcp snooping wymienia VLAN 30 jako operacyjnie chroniony.",
      "example": "Show ip dhcp snooping wymienia VLAN 30 jako operacyjnie chroniony."
    },
    {
      "revision": 1,
      "title": "Brak binding statycznego — weryfikacja",
      "skills": [
        "ccna.snooping.case-04",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.case-04.3.card",
      "front_md": "Stacja ma statyczny IP. Nie pojawia się w tabeli dynamicznych bindingów DHCP snooping.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Brak dynamicznego bindingu statycznego hosta sam w sobie nie oznacza awarii DHCP.\n\n**Rozpoznanie:** Stacja nie uzyskała dzierżawy obserwowanej przez snooping.\n\n**Działanie:** Uwzględnić statyczny host w mechanizmach ochrony korzystających z bindingów.\n\n**Sprawdzenie:** Plan ochrony obejmuje ten host bez oczekiwania na nieistniejącą wymianę DHCP.",
      "example": "Plan ochrony obejmuje ten host bez oczekiwania na nieistniejącą wymianę DHCP."
    },
    {
      "revision": 1,
      "title": "Rate limit — weryfikacja",
      "skills": [
        "ccna.snooping.case-05",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.case-05.3.card",
      "front_md": "Port klienta przekracza ustawiony limit wiadomości DHCP i przechodzi do err-disabled z odpowiednim powodem.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Limit DHCP chroni zasoby, lecz wymaga dopasowania do liczby klientów i wzorca ruchu.\n\n**Rozpoznanie:** Zadziałał limit szybkości DHCP na porcie.\n\n**Działanie:** Sprawdzić źródło lawiny, dobrać uzasadniony limit i bezpiecznie odtworzyć port.\n\n**Sprawdzenie:** Normalne odnowienia działają bez przekroczeń limitu.",
      "example": "Normalne odnowienia działają bez przekroczeń limitu."
    },
    {
      "revision": 1,
      "title": "Option 82 — weryfikacja",
      "skills": [
        "ccna.snooping.case-06",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.case-06.3.card",
      "front_md": "Serwer jawnie odrzuca relayed Discover z Option 82 zgodnie ze swoją polityką; transport działa.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Dodatkowe informacje relay wymagają zgodnej polityki po obu stronach.\n\n**Rozpoznanie:** Polityka serwera nie akceptuje dostarczonych informacji relay.\n\n**Działanie:** Uzgodnić obsługę Option 82 między relay, snoopingiem i serwerem.\n\n**Sprawdzenie:** Serwer przyjmuje prawidłową wiadomość z uzgodnionymi informacjami relay.",
      "example": "Serwer przyjmuje prawidłową wiadomość z uzgodnionymi informacjami relay."
    }
  ],
