    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "ccna.snooping.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nLegalny DHCP Offer wchodzi na port untrusted w VLAN z aktywnym snoopingiem i jest odrzucany.\n\n**Zgłoszenie II**\n\nNieautoryzowany serwer podłączono do zwykłego portu klienta; jego Offer jest blokowany.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Odpowiedź serwera przychodzi przez niezaufany port. Oznaczyć wyłącznie zweryfikowaną drogę do legalnego serwera jako trusted.\n\n**Sprawdzenie I:** Offer z legalnej drogi przechodzi, a porty klientów pozostają untrusted.\n\n**Zgłoszenie II:** Snooping prawidłowo odrzuca wiadomości serwera na untrusted. Pozostawić ochronę i usunąć nieautoryzowany serwer.\n\n**Sprawdzenie II:** Klient otrzymuje ofertę tylko z legalnej infrastruktury DHCP.\n\n**Zależności:** Zaufanie DHCP snooping określa, skąd wolno przyjmować wiadomości serwera. Port klienta nie powinien być trusted tylko po to, aby przepuścić obcy Offer.",
      "example": "I — Zaufanie DHCP snooping określa, skąd wolno przyjmować wiadomości serwera.\n\nII — Port klienta nie powinien być trusted tylko po to, aby przepuścić obcy Offer."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.snooping.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nSnooping jest włączony globalnie, ale lista chronionych VLAN nie zawiera VLAN 30.\n\n**Zgłoszenie II**\n\nStacja ma statyczny IP. Nie pojawia się w tabeli dynamicznych bindingów DHCP snooping.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Ochrona nie obejmuje analizowanego VLAN. Dodać VLAN 30 do konfiguracji DHCP snooping.\n\n**Sprawdzenie I:** Show ip dhcp snooping wymienia VLAN 30 jako operacyjnie chroniony.\n\n**Zgłoszenie II:** Stacja nie uzyskała dzierżawy obserwowanej przez snooping. Uwzględnić statyczny host w mechanizmach ochrony korzystających z bindingów.\n\n**Sprawdzenie II:** Plan ochrony obejmuje ten host bez oczekiwania na nieistniejącą wymianę DHCP.\n\n**Zależności:** Globalne włączenie i zakres VLAN są oddzielnymi elementami ochrony. Brak dynamicznego bindingu statycznego hosta sam w sobie nie oznacza awarii DHCP.",
      "example": "I — Globalne włączenie i zakres VLAN są oddzielnymi elementami ochrony.\n\nII — Brak dynamicznego bindingu statycznego hosta sam w sobie nie oznacza awarii DHCP."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "ccna.snooping.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst4500/XE3-10-0E/configuration/guide/xe-310-cg/dhcp.html"
        },
        {
          "title": "Dokumentacja Cisco — DHCP Snooping",
          "url": "https://www.cisco.com/c/en/us/support/docs/switches/catalyst-3750-series-switches/72846-layer2-secftrs-catl3fixed.html"
        }
      ],
      "id": "ccna.snooping.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nPort klienta przekracza ustawiony limit wiadomości DHCP i przechodzi do err-disabled z odpowiednim powodem.\n\n**Zgłoszenie II**\n\nSerwer jawnie odrzuca relayed Discover z Option 82 zgodnie ze swoją polityką; transport działa.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Zadziałał limit szybkości DHCP na porcie. Sprawdzić źródło lawiny, dobrać uzasadniony limit i bezpiecznie odtworzyć port.\n\n**Sprawdzenie I:** Normalne odnowienia działają bez przekroczeń limitu.\n\n**Zgłoszenie II:** Polityka serwera nie akceptuje dostarczonych informacji relay. Uzgodnić obsługę Option 82 między relay, snoopingiem i serwerem.\n\n**Sprawdzenie II:** Serwer przyjmuje prawidłową wiadomość z uzgodnionymi informacjami relay.\n\n**Zależności:** Limit DHCP chroni zasoby, lecz wymaga dopasowania do liczby klientów i wzorca ruchu. Dodatkowe informacje relay wymagają zgodnej polityki po obu stronach.",
      "example": "I — Limit DHCP chroni zasoby, lecz wymaga dopasowania do liczby klientów i wzorca ruchu.\n\nII — Dodatkowe informacje relay wymagają zgodnej polityki po obu stronach."
    },
