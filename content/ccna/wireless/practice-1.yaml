      ],
      "id": "ccna.wireless.practice.case-02.1.card",
      "front_md": "Klient widzi SSID z dobrym sygnałem, ale odrzucane jest uwierzytelnienie z podanym PSK.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Widoczność SSID i siła sygnału nie dowodzą poprawnego uwierzytelnienia.\n\n**Rozpoznanie:** Dane uwierzytelnienia nie pasują do polityki SSID.\n\n**Działanie:** Wprowadzić prawidłowy klucz lub właściwy profil zabezpieczeń klienta.\n\n**Sprawdzenie:** Klient kończy uwierzytelnienie i przechodzi do uzyskania adresu IP.",
      "example": "Dane uwierzytelnienia nie pasują do polityki SSID."
    },
    {
      "revision": 1,
      "title": "SSID do złego VLAN — rozpoznanie",
      "skills": [
        "ccna.wireless.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
