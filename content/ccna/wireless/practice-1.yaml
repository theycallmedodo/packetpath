        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/config-guide/b_cg810/wlan_security.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/support/docs/wireless-mobility/80211/200527-Fundamentals-of-802-11-Wireless-Sniffing.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/flexconnect.html"
        }
      ],
      "id": "ccna.wireless.practice.case-04.1.card",
      "front_md": "RSSI wynosi -65 dBm, poziom szumu -68 dBm; występują retransmisje.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "SNR to różnica poziomu sygnału i szumu; tutaj wynosi tylko 3 dB.\n\n**Rozpoznanie:** Sygnał jest tylko nieznacznie wyższy od szumu.\n\n**Działanie:** Zlokalizować zakłócenia i poprawić warunki RF, nie oceniać samego RSSI.\n\n**Sprawdzenie:** SNR rośnie, a liczba retransmisji maleje przy podobnym obciążeniu.",
      "example": "Sygnał jest tylko nieznacznie wyższy od szumu."
    },
