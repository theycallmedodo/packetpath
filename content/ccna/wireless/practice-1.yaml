        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/config-guide/b_cg810/wlan_security.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/support/docs/wireless-mobility/80211/200527-Fundamentals-of-802-11-Wireless-Sniffing.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/flexconnect.html"
        }
      ],
      "id": "ccna.wireless.practice.case-03.1.card",
      "front_md": "Klient poprawnie się łączy, lecz dostaje adres z sieci gościnnej zamiast pracowniczej. Mapowanie SSID wskazuje guest VLAN.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "SSID jest logiczną usługą WLAN, której mapowanie określa segment użytkownika.\n\n**Rozpoznanie:** SSID przypisano do niewłaściwej sieci przewodowej.\n\n**Działanie:** Poprawić mapowanie WLAN/SSID na docelowy VLAN zgodnie z projektem.\n\n**Sprawdzenie:** Po ponownym przyłączeniu klient otrzymuje adres z właściwej puli pracowniczej.",
      "example": "SSID przypisano do niewłaściwej sieci przewodowej."
    },
    {
      "revision": 1,
      "title": "Słaby SNR — rozpoznanie",
      "skills": [
        "ccna.wireless.case-04",
