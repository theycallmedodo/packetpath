          "url": "https://www.cisco.com/c/en/us/support/docs/wireless-mobility/80211/200527-Fundamentals-of-802-11-Wireless-Sniffing.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/flexconnect.html"
        }
      ],
      "id": "ccna.wireless.practice.case-06.1.card",
      "front_md": "Klient przechodzi między AP tego samego WLAN w tej samej podsieci. Oczekuje się zachowania adresu IP.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Roaming radiowy i zmiana adresacji warstwy trzeciej są odrębnymi zdarzeniami.\n\n**Rozpoznanie:** Zmiana AP nie musi oznaczać zmiany podsieci klienta.\n\n**Działanie:** Sprawdzić spójność polityki WLAN, VLAN i obsługi roamingu.\n\n**Sprawdzenie:** Po przejściu między AP klient zachowuje właściwy adres i sesję w granicach możliwości roamingu.",
      "example": "Zmiana AP nie musi oznaczać zmiany podsieci klienta."
    }
