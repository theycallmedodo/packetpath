      "id": "ccna.wireless.practice.case-01.3.card",
      "front_md": "Dwa bliskie AP używają tego samego kanału i obsługują dużo klientów. Muszą dzielić czas dostępu do medium.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Wi-Fi jest medium współdzielonym; silny sygnał nie usuwa konkurencji o airtime.\n\n**Rozpoznanie:** Występuje konkurencja o airtime na wspólnym kanale.\n\n**Działanie:** Poprawić plan kanałów i rozmieszczenie zgodnie z pomiarem RF.\n\n**Sprawdzenie:** Spada zajętość wspólnego kanału, a przepustowość klientów poprawia się w porównywalnym teście.",
      "example": "Spada zajętość wspólnego kanału, a przepustowość klientów poprawia się w porównywalnym teście."
    },
