          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/flexconnect.html"
        }
      ],
      "id": "ccna.wireless.practice.case-02.3.card",
      "front_md": "Klient widzi SSID z dobrym sygnałem, ale odrzucane jest uwierzytelnienie z podanym PSK.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Widoczność SSID i siła sygnału nie dowodzą poprawnego uwierzytelnienia.\n\n**Rozpoznanie:** Dane uwierzytelnienia nie pasują do polityki SSID.\n\n**Działanie:** Wprowadzić prawidłowy klucz lub właściwy profil zabezpieczeń klienta.\n\n**Sprawdzenie:** Klient kończy uwierzytelnienie i przechodzi do uzyskania adresu IP.",
      "example": "Klient kończy uwierzytelnienie i przechodzi do uzyskania adresu IP."
    },
