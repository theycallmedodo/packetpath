          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/flexconnect.html"
        }
      ],
      "id": "ccna.wireless.practice.case-05.3.card",
      "front_md": "W gęstym biurze wszystkie AP używają szerokich kanałów, przez co trudno zaplanować niezależne komórki.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Szerszy kanał zwiększa potencjał pojedynczego połączenia kosztem zasobu widma.\n\n**Rozpoznanie:** Szerokość kanałów ogranicza dostępne możliwości ich ponownego użycia.\n\n**Działanie:** Dobrać węższe kanały na podstawie pomiarów i potrzeb pojemnościowych.\n\n**Sprawdzenie:** Plan RF zapewnia więcej rozdzielonych kanałów i mniejszą konkurencję.",
      "example": "Plan RF zapewnia więcej rozdzielonych kanałów i mniejszą konkurencję."
    },
