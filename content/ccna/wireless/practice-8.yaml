      "id": "ccna.wireless.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nDwa bliskie AP używają tego samego kanału i obsługują dużo klientów. Muszą dzielić czas dostępu do medium.\n\n**Zgłoszenie II**\n\nKlient widzi SSID z dobrym sygnałem, ale odrzucane jest uwierzytelnienie z podanym PSK.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Występuje konkurencja o airtime na wspólnym kanale. Poprawić plan kanałów i rozmieszczenie zgodnie z pomiarem RF.\n\n**Sprawdzenie I:** Spada zajętość wspólnego kanału, a przepustowość klientów poprawia się w porównywalnym teście.\n\n**Zgłoszenie II:** Dane uwierzytelnienia nie pasują do polityki SSID. Wprowadzić prawidłowy klucz lub właściwy profil zabezpieczeń klienta.\n\n**Sprawdzenie II:** Klient kończy uwierzytelnienie i przechodzi do uzyskania adresu IP.\n\n**Zależności:** Wi-Fi jest medium współdzielonym; silny sygnał nie usuwa konkurencji o airtime. Widoczność SSID i siła sygnału nie dowodzą poprawnego uwierzytelnienia.",
      "example": "I — Wi-Fi jest medium współdzielonym; silny sygnał nie usuwa konkurencji o airtime.\n\nII — Widoczność SSID i siła sygnału nie dowodzą poprawnego uwierzytelnienia."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.wireless.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/solutions/CVD/Campus/cisco-campus-lan-wlan-design-guide.html"
        },
        {
