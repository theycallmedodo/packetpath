          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/config-guide/b_cg810/wlan_security.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/support/docs/wireless-mobility/80211/200527-Fundamentals-of-802-11-Wireless-Sniffing.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/flexconnect.html"
        }
      ],
      "id": "ccna.wireless.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nW gęstym biurze wszystkie AP używają szerokich kanałów, przez co trudno zaplanować niezależne komórki.\n\n**Zgłoszenie II**\n\nKlient przechodzi między AP tego samego WLAN w tej samej podsieci. Oczekuje się zachowania adresu IP.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Szerokość kanałów ogranicza dostępne możliwości ich ponownego użycia. Dobrać węższe kanały na podstawie pomiarów i potrzeb pojemnościowych.\n\n**Sprawdzenie I:** Plan RF zapewnia więcej rozdzielonych kanałów i mniejszą konkurencję.\n\n**Zgłoszenie II:** Zmiana AP nie musi oznaczać zmiany podsieci klienta. Sprawdzić spójność polityki WLAN, VLAN i obsługi roamingu.\n\n**Sprawdzenie II:** Po przejściu między AP klient zachowuje właściwy adres i sesję w granicach możliwości roamingu.\n\n**Zależności:** Szerszy kanał zwiększa potencjał pojedynczego połączenia kosztem zasobu widma. Roaming radiowy i zmiana adresacji warstwy trzeciej są odrębnymi zdarzeniami.",
      "example": "I — Szerszy kanał zwiększa potencjał pojedynczego połączenia kosztem zasobu widma.\n\nII — Roaming radiowy i zmiana adresacji warstwy trzeciej są odrębnymi zdarzeniami."
    },
