      "back_md": "**Zgłoszenie I:** Dane uwierzytelnienia nie pasują do polityki SSID. Wprowadzić prawidłowy klucz lub właściwy profil zabezpieczeń klienta.\n\n**Sprawdzenie I:** Klient kończy uwierzytelnienie i przechodzi do uzyskania adresu IP.\n\n**Zgłoszenie II:** Sygnał jest tylko nieznacznie wyższy od szumu. Zlokalizować zakłócenia i poprawić warunki RF, nie oceniać samego RSSI.\n\n**Sprawdzenie II:** SNR rośnie, a liczba retransmisji maleje przy podobnym obciążeniu.\n\n**Zależności:** Widoczność SSID i siła sygnału nie dowodzą poprawnego uwierzytelnienia. SNR to różnica poziomu sygnału i szumu; tutaj wynosi tylko 3 dB.",
      "example": "I — Widoczność SSID i siła sygnału nie dowodzą poprawnego uwierzytelnienia.\n\nII — SNR to różnica poziomu sygnału i szumu; tutaj wynosi tylko 3 dB."
    },
