          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-10/config-guide/b_cg810/wlan_security.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/support/docs/wireless-mobility/80211/200527-Fundamentals-of-802-11-Wireless-Sniffing.html"
        },
        {
          "title": "Dokumentacja Cisco — WLAN — radio, architektura i bezpieczeństwo",
          "url": "https://www.cisco.com/c/en/us/td/docs/wireless/controller/8-5/config-guide/b_cg85/flexconnect.html"
        }
      ],
      "id": "ccna.wireless.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nKlient poprawnie się łączy, lecz dostaje adres z sieci gościnnej zamiast pracowniczej. Mapowanie SSID wskazuje guest VLAN.\n\n**Zgłoszenie II**\n\nRSSI wynosi -65 dBm, poziom szumu -68 dBm; występują retransmisje.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** SSID przypisano do niewłaściwej sieci przewodowej. Poprawić mapowanie WLAN/SSID na docelowy VLAN zgodnie z projektem.\n\n**Sprawdzenie I:** Po ponownym przyłączeniu klient otrzymuje adres z właściwej puli pracowniczej.\n\n**Zgłoszenie II:** Sygnał jest tylko nieznacznie wyższy od szumu. Zlokalizować zakłócenia i poprawić warunki RF, nie oceniać samego RSSI.\n\n**Sprawdzenie II:** SNR rośnie, a liczba retransmisji maleje przy podobnym obciążeniu.\n\n**Zależności:** SSID jest logiczną usługą WLAN, której mapowanie określa segment użytkownika. SNR to różnica poziomu sygnału i szumu; tutaj wynosi tylko 3 dB.",
      "example": "I — SSID jest logiczną usługą WLAN, której mapowanie określa segment użytkownika.\n\nII — SNR to różnica poziomu sygnału i szumu; tutaj wynosi tylko 3 dB."
    },
    {
