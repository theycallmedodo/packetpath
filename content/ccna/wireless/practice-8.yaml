      "id": "ccna.wireless.practice.compare-09.4.card",
      "front_md": "**Zgłoszenie I**\n\nKlient poprawnie się łączy, lecz dostaje adres z sieci gościnnej zamiast pracowniczej. Mapowanie SSID wskazuje guest VLAN.\n\n**Zgłoszenie II**\n\nW gęstym biurze wszystkie AP używają szerokich kanałów, przez co trudno zaplanować niezależne komórki.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** SSID przypisano do niewłaściwej sieci przewodowej. Poprawić mapowanie WLAN/SSID na docelowy VLAN zgodnie z projektem.\n\n**Sprawdzenie I:** Po ponownym przyłączeniu klient otrzymuje adres z właściwej puli pracowniczej.\n\n**Zgłoszenie II:** Szerokość kanałów ogranicza dostępne możliwości ich ponownego użycia. Dobrać węższe kanały na podstawie pomiarów i potrzeb pojemnościowych.\n\n**Sprawdzenie II:** Plan RF zapewnia więcej rozdzielonych kanałów i mniejszą konkurencję.\n\n**Zależności:** SSID jest logiczną usługą WLAN, której mapowanie określa segment użytkownika. Szerszy kanał zwiększa potencjał pojedynczego połączenia kosztem zasobu widma.",
      "example": "I — SSID jest logiczną usługą WLAN, której mapowanie określa segment użytkownika.\n\nII — Szerszy kanał zwiększa potencjał pojedynczego połączenia kosztem zasobu widma."
