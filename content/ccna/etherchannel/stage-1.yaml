      ],
      "difficulty": 1,
      "prompt_md": "Co tworzy poprawnie zestawiony EtherChannel z kilku zgodnych łączy fizycznych?",
      "hints": [
        "Oddziel pojęcie interfejsu logicznego od zachowania pojedynczego przepływu."
      ],
      "explanation_md": "EtherChannel łączy zgodne interfejsy w port logiczny. Wydajność jednego przepływu nie musi odpowiadać sumie przepustowości wszystkich członków.",
      "card_id": "ccna.etherchannel.01.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Jeden logiczny interfejs z wieloma członkami.",
          "feedback_md": "Port-channel jest logiczną reprezentacją agregacji."
        },
        {
          "id": "B",
          "text_md": "Jedną nową podsieć IPv4 bez konfiguracji.",
          "feedback_md": "Agregacja nie przydziela automatycznie adresacji."
        },
        {
          "id": "C",
          "text_md": "Osobny VLAN dla każdej ramki.",
          "feedback_md": "Nie tworzy VLAN-u per ramka."
        },
        {
          "id": "D",
          "text_md": "Zawsze jedną sesję TCP o sumarycznej prędkości wszystkich kabli.",
          "feedback_md": "Pojedynczy przepływ może być przypisany przez hash do jednego członka."
        }
      ],
      "correct_option_id": "A"
    },
