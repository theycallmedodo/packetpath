  "cards": [
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — działanie",
      "skills": [
        "ccna.etherchannel.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nOba końce LACP mają mode passive. Porty fizyczne są sprawne, ale nie powstaje kanał.\n\n**Zgłoszenie II**\n\nDwa lokalne porty planowanego kanału mają różne listy allowed VLAN. Jeden został suspended.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Żadna strona nie inicjuje negocjacji LACP. Ustawić active przynajmniej na jednym końcu.\n\n**Sprawdzenie I:** Show etherchannel summary pokazuje porty członkowskie w stanie bundled.\n\n**Zgłoszenie II:** Parametry warstwy drugiej członków kanału są niespójne. Ujednolicić parametry trunków członkowskich i Port-channel.\n\n**Sprawdzenie II:** Oba porty są bundled i przenoszą tę samą zamierzoną listę VLAN.\n\n**Zależności:** LACP wymaga strony active; passive odpowiada, ale nie rozpoczyna negocjacji. EtherChannel wymaga zgodnych parametrów swoich członków.",
      "example": "I — Ustawić active przynajmniej na jednym końcu.\n\nII — Ujednolicić parametry trunków członkowskich i Port-channel."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "ccna.etherchannel.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nKanał ma cztery łącza 1 Gb/s. Jeden przepływ TCP używa jednego członka i osiąga mniej niż 1 Gb/s.\n\n**Zgłoszenie II**\n\nLACP miał dwa aktywne porty. Jeden utracił link; drugi nadal jest bundled, a min-links nie blokuje kanału.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Hash przypisał pojedynczy przepływ do jednego łącza. Ocenić wykorzystanie kanału za pomocą wielu różnych przepływów.\n\n**Sprawdzenie I:** Wiele przepływów rozkłada obciążenie na członków, bez gwarancji idealnej równości.\n\n**Zgłoszenie II:** Kanał działa ze zmniejszoną przepustowością. Naprawić uszkodzony człon, monitorując obciążenie pozostałego.\n\n**Sprawdzenie II:** Port-channel pozostaje up, a po naprawie wracają dwa aktywne członki.\n\n**Zależności:** Agregacja nie oznacza, że pojedynczy strumień dostanie sumę przepustowości członków. Awaria pojedynczego członka nie musi wyłączyć całej agregacji.",
      "example": "I — Ocenić wykorzystanie kanału za pomocą wielu różnych przepływów.\n\nII — Naprawić uszkodzony człon, monitorując obciążenie pozostałego."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
      "skills": [
        "ccna.etherchannel.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nJedna strona ma channel-group mode active, druga desirable. Nie zestawia się negocjowany kanał.\n\n**Zgłoszenie II**\n\nDwa fizyczne łącza są poprawnie bundled w Po1. STP przedstawia Po1 jako jeden port logiczny.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** LACP i PAgP nie negocjują między sobą. Uzgodnić jeden protokół, np. LACP active po obu stronach.\n\n**Sprawdzenie I:** Oba końce pokazują LACP i zgodnego partnera.\n\n**Zgłoszenie II:** STP operuje na interfejsie logicznym agregacji. Analizować rolę i koszt Po1, nie wymuszać osobnych ról członków.\n\n**Sprawdzenie II:** Show spanning-tree wskazuje logiczny Po1 dla tej drogi.\n\n**Zależności:** Active/passive należą do LACP, desirable/auto do PAgP. Poprawny EtherChannel prezentuje STP pojedyncze połączenie logiczne.",
      "example": "I — Uzgodnić jeden protokół, np. LACP active po obu stronach.\n\nII — Analizować rolę i koszt Po1, nie wymuszać osobnych ról członków."
    },
