  "cards": [
    {
      "revision": 1,
      "title": "Dwa passive — zależności",
      "skills": [
        "ccna.etherchannel.case-01",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.case-01.4.card",
      "front_md": "Oba końce LACP mają mode passive. Porty fizyczne są sprawne, ale nie powstaje kanał.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "LACP wymaga strony active; passive odpowiada, ale nie rozpoczyna negocjacji.\n\n**Rozpoznanie:** Żadna strona nie inicjuje negocjacji LACP.\n\n**Działanie:** Ustawić active przynajmniej na jednym końcu.\n\n**Sprawdzenie:** Show etherchannel summary pokazuje porty członkowskie w stanie bundled.",
      "example": "LACP wymaga strony active; passive odpowiada, ale nie rozpoczyna negocjacji."
    },
    {
      "revision": 1,
      "title": "Różne VLAN-y — zależności",
      "skills": [
        "ccna.etherchannel.case-02",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.case-02.4.card",
      "front_md": "Dwa lokalne porty planowanego kanału mają różne listy allowed VLAN. Jeden został suspended.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "EtherChannel wymaga zgodnych parametrów swoich członków.\n\n**Rozpoznanie:** Parametry warstwy drugiej członków kanału są niespójne.\n\n**Działanie:** Ujednolicić parametry trunków członkowskich i Port-channel.\n\n**Sprawdzenie:** Oba porty są bundled i przenoszą tę samą zamierzoną listę VLAN.",
      "example": "EtherChannel wymaga zgodnych parametrów swoich członków."
    },
    {
      "revision": 1,
      "title": "Jeden duży przepływ — zależności",
      "skills": [
        "ccna.etherchannel.case-03",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.case-03.4.card",
      "front_md": "Kanał ma cztery łącza 1 Gb/s. Jeden przepływ TCP używa jednego członka i osiąga mniej niż 1 Gb/s.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Agregacja nie oznacza, że pojedynczy strumień dostanie sumę przepustowości członków.\n\n**Rozpoznanie:** Hash przypisał pojedynczy przepływ do jednego łącza.\n\n**Działanie:** Ocenić wykorzystanie kanału za pomocą wielu różnych przepływów.\n\n**Sprawdzenie:** Wiele przepływów rozkłada obciążenie na członków, bez gwarancji idealnej równości.",
      "example": "Agregacja nie oznacza, że pojedynczy strumień dostanie sumę przepustowości członków."
    },
    {
      "revision": 1,
      "title": "Awaria członka — zależności",
      "skills": [
        "ccna.etherchannel.case-04",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.case-04.4.card",
      "front_md": "LACP miał dwa aktywne porty. Jeden utracił link; drugi nadal jest bundled, a min-links nie blokuje kanału.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Awaria pojedynczego członka nie musi wyłączyć całej agregacji.\n\n**Rozpoznanie:** Kanał działa ze zmniejszoną przepustowością.\n\n**Działanie:** Naprawić uszkodzony człon, monitorując obciążenie pozostałego.\n\n**Sprawdzenie:** Port-channel pozostaje up, a po naprawie wracają dwa aktywne członki.",
      "example": "Awaria pojedynczego członka nie musi wyłączyć całej agregacji."
    },
    {
      "revision": 1,
      "title": "Różne protokoły — zależności",
      "skills": [
        "ccna.etherchannel.case-05",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.case-05.4.card",
      "front_md": "Jedna strona ma channel-group mode active, druga desirable. Nie zestawia się negocjowany kanał.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Active/passive należą do LACP, desirable/auto do PAgP.\n\n**Rozpoznanie:** LACP i PAgP nie negocjują między sobą.\n\n**Działanie:** Uzgodnić jeden protokół, np. LACP active po obu stronach.\n\n**Sprawdzenie:** Oba końce pokazują LACP i zgodnego partnera.",
      "example": "Active/passive należą do LACP, desirable/auto do PAgP."
    },
    {
      "revision": 1,
      "title": "Port-channel i STP — zależności",
      "skills": [
        "ccna.etherchannel.case-06",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — EtherChannel i LACP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/c9000/lyr2-fwd/etherchannel/etherchannel-configuration-guide/m_ethernetchannel.html"
        }
      ],
      "id": "ccna.etherchannel.practice.case-06.4.card",
      "front_md": "Dwa fizyczne łącza są poprawnie bundled w Po1. STP przedstawia Po1 jako jeden port logiczny.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Poprawny EtherChannel prezentuje STP pojedyncze połączenie logiczne.\n\n**Rozpoznanie:** STP operuje na interfejsie logicznym agregacji.\n\n**Działanie:** Analizować rolę i koszt Po1, nie wymuszać osobnych ról członków.\n\n**Sprawdzenie:** Show spanning-tree wskazuje logiczny Po1 dla tej drogi.",
      "example": "Poprawny EtherChannel prezentuje STP pojedyncze połączenie logiczne."
    }
  ],
