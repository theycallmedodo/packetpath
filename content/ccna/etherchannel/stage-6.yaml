      "type": "single_choice",
      "options": [
        {
          "text_md": "Doliczyć jego pełne pasmo do dostępnego",
          "feedback_md": "Skonfigurowany port nie musi być operacyjnym członkiem.",
          "id": "A"
        },
        {
          "text_md": "Usunąć wszystkie pozostałe porty",
          "feedback_md": "To nie celowana diagnoza.",
          "id": "B"
