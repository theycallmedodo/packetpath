        {
          "text_md": "Sprawdzić przyczynę zawieszenia, zgodność i negocjację",
          "feedback_md": "Oceniaj stan operacyjny oraz legendę konkretnego outputu, nie tylko obecność konfiguracji.",
          "id": "C"
        },
        {
          "text_md": "Uznać, że suspended oznacza idealny stan",
          "feedback_md": "Nazwa wskazuje stan wymagający interpretacji.",
          "id": "D"
        }
      ],
      "correct_option_id": "C"
    },
