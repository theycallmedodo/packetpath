      "difficulty": 3,
      "prompt_md": "Port jest w stanie learning RSTP. Co dzieje się z typowym ruchem użytkowym?",
      "hints": [
        "Stan portu rozdziela naukę źródeł od przekazywania ruchu."
      ],
      "explanation_md": "Stan portu rozdziela naukę źródeł od przekazywania ruchu.",
      "card_id": "ccna.stp.ext.13.theory",
      "type": "single_choice",
      "options": [
        {
          "text_md": "Cały ruch użytkowy już swobodnie przechodzi",
          "feedback_md": "To odpowiada forwarding.",
          "id": "A"
        },
        {
          "text_md": "MAC nie mogą być nigdy uczone",
          "feedback_md": "Stan właśnie umożliwia naukę.",
          "id": "B"
        },
        {
          "text_md": "MAC mogą być uczone, ale ramki użytkowe nie są jeszcze normalnie przekazywane",
          "feedback_md": "Stan portu rozdziela naukę źródeł od przekazywania ruchu.",
          "id": "C"
        },
        {
          "text_md": "Wszystkie ramki są routowane między VLAN-ami",
          "feedback_md": "STP nie jest routingiem L3.",
          "id": "D"
        }
      ],
      "correct_option_id": "C"
    },
