      "id": "ccna.stp.practice.case-04.2.card",
      "front_md": "Root jest ustalony. Dwa porty prowadzą do niego; łączny koszt przez Gi1 to 4, przez Gi2 to 19. Pozostałe warunki są prawidłowe.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Root port wybiera się według najlepszego wektora, zaczynając od kosztu drogi do roota.\n\n**Rozpoznanie:** Gi1 ma niższy całkowity koszt drogi do roota.\n\n**Działanie:** Zachować Gi1 jako root port, jeśli projekt nie wymaga innej ścieżki.\n\n**Sprawdzenie:** Gi1 ma rolę Root i koszt 4 w analizowanej instancji STP.",
      "example": "Zachować Gi1 jako root port, jeśli projekt nie wymaga innej ścieżki."
