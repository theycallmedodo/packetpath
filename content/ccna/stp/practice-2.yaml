      ],
      "id": "ccna.stp.practice.case-03.2.card",
      "front_md": "Port do stacji miał PortFast i BPDU Guard. Po podłączeniu switcha dostał BPDU i przeszedł w err-disabled.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "BPDU Guard chroni porty brzegowe przed dołączeniem urządzeń uczestniczących w STP.\n\n**Rozpoznanie:** BPDU Guard zareagował na BPDU na porcie brzegowym.\n\n**Działanie:** Usunąć nieautoryzowany switch, a następnie bezpiecznie przywrócić port.\n\n**Sprawdzenie:** Po usunięciu źródła BPDU port działa bez kolejnego zdarzenia BPDU Guard.",
      "example": "Usunąć nieautoryzowany switch, a następnie bezpiecznie przywrócić port."
    },
