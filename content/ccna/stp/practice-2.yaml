      "id": "ccna.stp.practice.case-05.2.card",
      "front_md": "Pojedynczy komputer jest podłączony do portu access bez PortFast. Przy aktywacji port czeka na przejścia klasycznego STP.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "PortFast przyspiesza start portu brzegowego, ale nie wyłącza całego STP.\n\n**Rozpoznanie:** Port hosta przechodzi zwykłe stany inicjalizacji STP.\n\n**Działanie:** Włączyć PortFast i właściwą ochronę BPDU na potwierdzonym porcie końcowym.\n\n**Sprawdzenie:** Port hosta szybko osiąga forwarding, nadal reagując zgodnie z polityką ochrony BPDU.",
      "example": "Włączyć PortFast i właściwą ochronę BPDU na potwierdzonym porcie końcowym."
