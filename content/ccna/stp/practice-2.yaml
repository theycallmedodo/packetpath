      "front_md": "Na porcie do podrzędnego switcha działa Root Guard. Lepsze BPDU spowodowało root-inconsistent.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Root Guard chroni położenie roota i różni się od reakcji BPDU Guard.\n\n**Rozpoznanie:** Root Guard blokuje próbę zmiany położenia roota przez ten port.\n\n**Działanie:** Poprawić priorytety lub topologię źródła lepszych BPDU zgodnie z projektem.\n\n**Sprawdzenie:** Po ustaniu superior BPDU port automatycznie wychodzi z root-inconsistent.",
