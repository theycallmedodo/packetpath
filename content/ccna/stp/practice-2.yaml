      "id": "ccna.stp.practice.case-01.2.card",
      "front_md": "Dla VLAN 10 switche mają priorytety 32768 i 24576. Przy obu aktywnych rootem jest drugi, choć projekt wskazuje pierwszy.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "W wyborze roota wygrywa najniższy Bridge ID; priorytet jest porównywany przed MAC.\n\n**Rozpoznanie:** Niższy bridge priority drugiego switcha decyduje o wyborze roota.\n\n**Działanie:** Nadać planowanemu rootowi niższy dozwolony priorytet, np. 16384 dla VLAN 10.\n\n**Sprawdzenie:** Root ID w show spanning-tree vlan 10 odpowiada planowanemu switchowi.",
      "example": "Nadać planowanemu rootowi niższy dozwolony priorytet, np. 16384 dla VLAN 10."
    },
