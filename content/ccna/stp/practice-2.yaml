        }
      ],
      "id": "ccna.stp.practice.case-02.2.card",
      "front_md": "W topologii z pętlą RSTP jeden uplink jest Alternate/Discarding; drugi Root/Forwarding. Nie ma utraty komunikacji.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Discarding na porcie alternatywnym może być prawidłowym stanem redundancji.\n\n**Rozpoznanie:** RSTP celowo blokuje nadmiarową ścieżkę L2.\n\n**Działanie:** Pozostawić ochronę przed pętlą i wykonać kontrolowany test awarii aktywnego łącza.\n\n**Sprawdzenie:** Po awarii ścieżki głównej odpowiedni port zapasowy przechodzi do forwarding.",
      "example": "Pozostawić ochronę przed pętlą i wykonać kontrolowany test awarii aktywnego łącza."
    },
