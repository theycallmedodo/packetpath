  "tasks": [
    {
      "id": "ccna.stp.01",
      "revision": 1,
      "title": "Rola STP",
      "skills": [
        "stp.purpose"
      ],
      "sources": [
        {
          "title": "Cisco — STP Configuration",
          "url": "https://www.cisco.com/c/dam/en/us/td/docs/switches/lan/catalyst9500/software/release/16-12/configuration_guide/lyr2/configuring_spanning_tree_protocol.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "2.5"
        }
      ],
      "difficulty": 1,
      "prompt_md": "Jaki problem rozwiązuje STP w redundantnej sieci przełączanej L2?",
      "hints": [
        "Pomyśl o krążących ramkach broadcast."
      ],
      "explanation_md": "Redundantne łącza L2 mogą tworzyć pętle. STP ogranicza aktywne ścieżki, aby ruch nie krążył bez końca.",
      "card_id": "ccna.stp.01.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Wybór najkrótszego prefiksu IPv4.",
          "feedback_md": "STP nie wybiera prefiksów routingu IPv4."
        },
        {
          "id": "B",
          "text_md": "Pętle warstwy drugiej.",
          "feedback_md": "STP wyznacza aktywną topologię L2 bez pętli."
        },
        {
          "id": "C",
          "text_md": "Automatyczne rozwiązywanie adresów IP na MAC.",
          "feedback_md": "Do rozwiązywania IPv4 na MAC służy ARP."
        },
        {
          "id": "D",
          "text_md": "Przydział adresów IP hostom.",
          "feedback_md": "Przydział adresów to np. zadanie DHCP, nie STP."
        }
      ],
      "correct_option_id": "B"
    },
    {
