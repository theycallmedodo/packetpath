      ],
      "front_md": "Wybierz Rapid PVST+",
      "back_md": "Rapid PVST+ utrzymuje instancję opartą na RSTP dla każdego VLAN-u. Nie jest tym samym co MST.",
      "example": "SW1(config)# spanning-tree mode rapid-pvst"
