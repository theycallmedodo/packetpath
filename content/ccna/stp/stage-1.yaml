      "difficulty": 1,
      "prompt_md": "Dla tego samego VLAN-u SW1 ma bazowy priority 4096, SW2 8192. Oba wymieniają BPDU. Który wygra, niezależnie od różnicy MAC?",
      "hints": [
        "W tym wyborze mniejsza wartość jest lepsza."
      ],
      "explanation_md": "Root wybierany jest według najniższego bridge ID. Przy tym samym VLAN-ie różny priorytet rozstrzyga przed adresem MAC.",
      "card_id": "ccna.stp.04.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "SW2, bo ma wyższy priorytet liczbowy.",
          "feedback_md": "W STP wygrywa mniejsza wartość bridge ID."
        },
        {
          "id": "B",
          "text_md": "Oba jednocześnie.",
          "feedback_md": "W jednej spójnej instancji wybierany jest jeden root."
        },
        {
          "id": "C",
          "text_md": "Ten z większą liczbą portów.",
          "feedback_md": "Liczba portów nie jest kryterium wyboru root."
        },
        {
          "id": "D",
          "text_md": "SW1, bo ma niższy bridge priority.",
          "feedback_md": "Niższy priority rozstrzyga przed porównaniem MAC."
        }
      ],
      "correct_option_id": "D"
    },
