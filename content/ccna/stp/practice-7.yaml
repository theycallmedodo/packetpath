        {
          "title": "Dokumentacja Cisco — STP — role, zabezpieczenia i pętle",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/12-2_53_se/configuration/guide/2960scg/swstpopt.html"
        },
        {
          "title": "Dokumentacja Cisco — STP — role, zabezpieczenia i pętle",
          "url": "https://www.cisco.com/c/en/us/support/docs/lan-switching/spanning-tree-protocol-stp-8021d/218321-configure-stp-with-loop-guard-and-bpdu-s.html"
        }
      ],
      "id": "ccna.stp.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nPojedynczy komputer jest podłączony do portu access bez PortFast. Przy aktywacji port czeka na przejścia klasycznego STP.\n\n**Zgłoszenie II**\n\nNa porcie do podrzędnego switcha działa Root Guard. Lepsze BPDU spowodowało root-inconsistent.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Port hosta przechodzi zwykłe stany inicjalizacji STP. Włączyć PortFast i właściwą ochronę BPDU na potwierdzonym porcie końcowym.\n\n**Sprawdzenie I:** Port hosta szybko osiąga forwarding, nadal reagując zgodnie z polityką ochrony BPDU.\n\n**Zgłoszenie II:** Root Guard blokuje próbę zmiany położenia roota przez ten port. Poprawić priorytety lub topologię źródła lepszych BPDU zgodnie z projektem.\n\n**Sprawdzenie II:** Po ustaniu superior BPDU port automatycznie wychodzi z root-inconsistent.\n\n**Zależności:** PortFast przyspiesza start portu brzegowego, ale nie wyłącza całego STP. Root Guard chroni położenie roota i różni się od reakcji BPDU Guard.",
      "example": "I — Port hosta szybko osiąga forwarding, nadal reagując zgodnie z polityką ochrony BPDU.\n\nII — Po ustaniu superior BPDU port automatycznie wychodzi z root-inconsistent."
    },
