      "id": "ccna.stp.practice.compare-08.3.card",
      "front_md": "**Zgłoszenie I**\n\nW topologii z pętlą RSTP jeden uplink jest Alternate/Discarding; drugi Root/Forwarding. Nie ma utraty komunikacji.\n\n**Zgłoszenie II**\n\nRoot jest ustalony. Dwa porty prowadzą do niego; łączny koszt przez Gi1 to 4, przez Gi2 to 19. Pozostałe warunki są prawidłowe.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** RSTP celowo blokuje nadmiarową ścieżkę L2. Pozostawić ochronę przed pętlą i wykonać kontrolowany test awarii aktywnego łącza.\n\n**Sprawdzenie I:** Po awarii ścieżki głównej odpowiedni port zapasowy przechodzi do forwarding.\n\n**Zgłoszenie II:** Gi1 ma niższy całkowity koszt drogi do roota. Zachować Gi1 jako root port, jeśli projekt nie wymaga innej ścieżki.\n\n**Sprawdzenie II:** Gi1 ma rolę Root i koszt 4 w analizowanej instancji STP.\n\n**Zależności:** Discarding na porcie alternatywnym może być prawidłowym stanem redundancji. Root port wybiera się według najlepszego wektora, zaczynając od kosztu drogi do roota.",
      "example": "I — Po awarii ścieżki głównej odpowiedni port zapasowy przechodzi do forwarding.\n\nII — Gi1 ma rolę Root i koszt 4 w analizowanej instancji STP."
