        {
          "title": "Dokumentacja Cisco — STP — role, zabezpieczenia i pętle",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/12-2_53_se/configuration/guide/2960scg/swstpopt.html"
        },
        {
          "title": "Dokumentacja Cisco — STP — role, zabezpieczenia i pętle",
          "url": "https://www.cisco.com/c/en/us/support/docs/lan-switching/spanning-tree-protocol-stp-8021d/218321-configure-stp-with-loop-guard-and-bpdu-s.html"
        }
      ],
      "id": "ccna.stp.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nDla VLAN 10 switche mają priorytety 32768 i 24576. Przy obu aktywnych rootem jest drugi, choć projekt wskazuje pierwszy.\n\n**Zgłoszenie II**\n\nW topologii z pętlą RSTP jeden uplink jest Alternate/Discarding; drugi Root/Forwarding. Nie ma utraty komunikacji.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Niższy bridge priority drugiego switcha decyduje o wyborze roota. Nadać planowanemu rootowi niższy dozwolony priorytet, np. 16384 dla VLAN 10.\n\n**Sprawdzenie I:** Root ID w show spanning-tree vlan 10 odpowiada planowanemu switchowi.\n\n**Zgłoszenie II:** RSTP celowo blokuje nadmiarową ścieżkę L2. Pozostawić ochronę przed pętlą i wykonać kontrolowany test awarii aktywnego łącza.\n\n**Sprawdzenie II:** Po awarii ścieżki głównej odpowiedni port zapasowy przechodzi do forwarding.\n\n**Zależności:** W wyborze roota wygrywa najniższy Bridge ID; priorytet jest porównywany przed MAC. Discarding na porcie alternatywnym może być prawidłowym stanem redundancji.",
      "example": "I — Root ID w show spanning-tree vlan 10 odpowiada planowanemu switchowi.\n\nII — Po awarii ścieżki głównej odpowiedni port zapasowy przechodzi do forwarding."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "ccna.stp.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco — STP Configuration",
          "url": "https://www.cisco.com/c/dam/en/us/td/docs/switches/lan/catalyst9500/software/release/16-12/configuration_guide/lyr2/configuring_spanning_tree_protocol.html"
        },
        {
          "title": "Cisco — STP i ochrona portów",
          "url": "https://www.cisco.com/c/en/us/support/docs/lan-switching/spanning-tree-protocol/10586-65.html"
        },
        {
          "title": "Cisco — Root Guard",
          "url": "https://www.cisco.com/c/en/us/support/docs/lan-switching/spanning-tree-protocol/10588-74.html"
        },
        {
          "title": "Dokumentacja Cisco — STP — role, zabezpieczenia i pętle",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/12-2_53_se/configuration/guide/2960scg/swstpopt.html"
        },
        {
          "title": "Dokumentacja Cisco — STP — role, zabezpieczenia i pętle",
          "url": "https://www.cisco.com/c/en/us/support/docs/lan-switching/spanning-tree-protocol-stp-8021d/218321-configure-stp-with-loop-guard-and-bpdu-s.html"
        }
      ],
      "id": "ccna.stp.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nPort do stacji miał PortFast i BPDU Guard. Po podłączeniu switcha dostał BPDU i przeszedł w err-disabled.\n\n**Zgłoszenie II**\n\nRoot jest ustalony. Dwa porty prowadzą do niego; łączny koszt przez Gi1 to 4, przez Gi2 to 19. Pozostałe warunki są prawidłowe.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** BPDU Guard zareagował na BPDU na porcie brzegowym. Usunąć nieautoryzowany switch, a następnie bezpiecznie przywrócić port.\n\n**Sprawdzenie I:** Po usunięciu źródła BPDU port działa bez kolejnego zdarzenia BPDU Guard.\n\n**Zgłoszenie II:** Gi1 ma niższy całkowity koszt drogi do roota. Zachować Gi1 jako root port, jeśli projekt nie wymaga innej ścieżki.\n\n**Sprawdzenie II:** Gi1 ma rolę Root i koszt 4 w analizowanej instancji STP.\n\n**Zależności:** BPDU Guard chroni porty brzegowe przed dołączeniem urządzeń uczestniczących w STP. Root port wybiera się według najlepszego wektora, zaczynając od kosztu drogi do roota.",
      "example": "I — Po usunięciu źródła BPDU port działa bez kolejnego zdarzenia BPDU Guard.\n\nII — Gi1 ma rolę Root i koszt 4 w analizowanej instancji STP."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
