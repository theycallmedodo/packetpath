      ],
      "explanation_md": "Instancje VLAN mogą mieć różne bridge priority. Ostateczny root zależy również od konfiguracji pozostałych switchy.",
      "card_id": "ccna.stp.14.theory",
      "type": "cli_fill_blank",
      "platform": "Cisco IOS / IOS XE — składnia wskazana w zadaniu",
      "template": "SW1(config)# spanning-tree mode {{mode}}\nSW1(config)# spanning-tree vlan 10 priority {{p10}}\nSW1(config)# spanning-tree vlan 20 priority {{p20}}",
      "blanks": [
        {
          "id": "mode",
          "label": "Tryb",
