      "template": "SW1(config)# interface GigabitEthernet1/0/12\nSW1(config-if)# spanning-tree guard {{guard}}\nSW1(config-if)# {{finish}}\nSW1# show spanning-tree {{view}}",
      "blanks": [
        {
