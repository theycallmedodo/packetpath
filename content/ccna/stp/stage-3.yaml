      "explanation_md": "Root Guard przeciwdziała przejęciu roli root przez chroniony kierunek. Odebranie superior BPDU może wywołać root-inconsistent, a nie mechanizm BPDU Guard.",
      "card_id": "ccna.stp.17.theory",
