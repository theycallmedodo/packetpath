  "tasks": [
    {
      "id": "ccna.stp.13",
      "revision": 1,
      "title": "Alternatywna ścieżka RSTP",
      "skills": [
        "stp.alternate-state"
      ],
      "sources": [
        {
          "title": "Cisco — STP Configuration",
          "url": "https://www.cisco.com/c/dam/en/us/td/docs/switches/lan/catalyst9500/software/release/16-12/configuration_guide/lyr2/configuring_spanning_tree_protocol.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "2.5"
        }
      ],
      "difficulty": 3,
      "prompt_md": "Port ma rolę alternate w RSTP, a podstawowy root port działa. Jaki jest typowy stan alternate portu?",
      "hints": [
        "Zapasowa ścieżka nie powinna tworzyć równoległej pętli."
      ],
      "explanation_md": "RSTP oddziela rolę portu od jego stanu. Alternate zazwyczaj pozostaje discarding, dopóki nie jest potrzebny do aktywnej topologii.",
      "card_id": "ccna.stp.13.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Forwarding, bo alternate wysyła kopię każdej ramki.",
          "feedback_md": "Duplikowanie transmisji podtrzymywałoby pętlę."
        },
        {
          "id": "B",
          "text_md": "Discarding, gotowy jako alternatywna ścieżka.",
          "feedback_md": "Alternate jest zapasową ścieżką i nie przekazuje normalnego ruchu w tym stanie."
        },
        {
          "id": "C",
          "text_md": "Administratively down z definicji.",
          "feedback_md": "Rola alternate nie oznacza administracyjnego shutdown."
        },
        {
          "id": "D",
          "text_md": "Err-disabled z definicji.",
          "feedback_md": "Nie oznacza też automatycznie naruszenia zabezpieczeń."
        }
      ],
      "correct_option_id": "B"
    },
    {
      "id": "ccna.stp.14",
