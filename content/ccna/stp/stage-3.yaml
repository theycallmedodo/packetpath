        }
      ],
      "front_md": "Rozdziel root dla VLAN-ów",
      "back_md": "Instancje VLAN mogą mieć różne bridge priority. Ostateczny root zależy również od konfiguracji pozostałych switchy.",
      "example": "SW1(config)# spanning-tree mode rapid-pvst\nSW1(config)# spanning-tree vlan 10 priority 4096\nSW1(config)# spanning-tree vlan 20 priority 8192"
