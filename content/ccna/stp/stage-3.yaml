    {
      "id": "ccna.stp.16",
      "revision": 1,
      "title": "Root port przy różnych kosztach",
      "skills": [
        "stp.root-port"
      ],
      "sources": [
        {
          "title": "Cisco — STP Configuration",
          "url": "https://www.cisco.com/c/dam/en/us/td/docs/switches/lan/catalyst9500/software/release/16-12/configuration_guide/lyr2/configuring_spanning_tree_protocol.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "2.5"
        }
      ],
      "difficulty": 3,
      "prompt_md": "Switch niebędący root ma dwie ścieżki do tego samego root. Całkowity koszt przez G1/0/1 wynosi 4, a przez G1/0/2 wynosi 19. Która ścieżka jest preferowana?",
      "hints": [
        "W tym przykładzie nie ma remisu kosztów."
      ],
      "explanation_md": "Porównuj całkowity root path cost. Dopiero przy remisie analizuj dalsze kryteria.",
      "card_id": "ccna.stp.16.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Przez G1/0/2, bo koszt jest większy.",
          "feedback_md": "Większy koszt nie jest preferowany."
        },
        {
          "id": "B",
          "text_md": "Obie jako root port tej samej instancji.",
          "feedback_md": "W tej instancji switch wybiera jeden root port."
        },
        {
          "id": "C",
          "text_md": "Zawsze port o wyższym numerze.",
          "feedback_md": "Numer portu nie wyprzedza różnicy kosztów."
        },
        {
          "id": "D",
          "text_md": "Przez G1/0/1, bo koszt jest niższy.",
          "feedback_md": "Niższy całkowity koszt do tego samego root rozstrzyga wybór."
        }
      ],
      "correct_option_id": "D"
    },
    {
      "id": "ccna.stp.17",
      "revision": 1,
      "title": "Root Guard na łączu w dół",
      "skills": [
        "stp.root-guard"
