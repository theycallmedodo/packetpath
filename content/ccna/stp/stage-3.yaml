      "template": "SW1(config)# interface GigabitEthernet1/0/7\nSW1(config-if)# switchport mode {{mode}}\nSW1(config-if)# switchport access vlan {{vlan}}\nSW1(config-if)# spanning-tree {{fast}}\nSW1(config-if)# spanning-tree {{guard}} enable",
      "blanks": [
