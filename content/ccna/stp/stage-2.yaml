  "tasks": [
    {
      "id": "ccna.stp.07",
      "revision": 1,
      "title": "STP czy MAC?",
      "skills": [
        "stp.mac-tiebreak"
      ],
      "sources": [
        {
          "title": "Cisco — STP Configuration",
          "url": "https://www.cisco.com/c/dam/en/us/td/docs/switches/lan/catalyst9500/software/release/16-12/configuration_guide/lyr2/configuring_spanning_tree_protocol.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "2.5"
        }
      ],
      "difficulty": 2,
      "prompt_md": "W tym samym VLAN-ie dwa switche mają identyczny priority. SW1 ma MAC 0000.0000.0010, SW2 0000.0000.0020. Kto ma niższy bridge ID?",
      "hints": [
        "Porównaj szesnastkowe końcówki 0010 i 0020."
      ],
      "explanation_md": "Po remisie priorytetu i rozszerzenia VLAN o wyborze decyduje MAC mostu.",
      "card_id": "ccna.stp.07.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "SW1",
          "feedback_md": "Przy równych pozostałych składnikach mniejszy MAC daje niższy bridge ID."
        },
        {
          "id": "B",
          "text_md": "SW2",
          "feedback_md": "MAC SW2 jest większy."
        },
        {
          "id": "C",
          "text_md": "Oba mają taki sam bridge ID",
          "feedback_md": "MAC jest częścią bridge ID, więc identyfikatory się różnią."
        },
        {
          "id": "D",
          "text_md": "Nie można porównać bez kosztu portu",
          "feedback_md": "Koszt ścieżki nie jest potrzebny do porównania tych bridge ID."
        }
      ],
      "correct_option_id": "A"
    },
