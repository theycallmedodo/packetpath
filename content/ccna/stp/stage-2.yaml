        "Ochrona ma odciąć nieoczekiwany most."
      ],
      "explanation_md": "Err-disabled jest skutkiem zadziałania ochrony. Przed przywróceniem portu należy ustalić i usunąć źródło BPDU.",
      "card_id": "ccna.stp.10.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Port zostanie tylko tymczasowo alternate.",
          "feedback_md": "BPDU Guard nie wybiera roli alternate jako reakcji ochronnej."
        },
        {
          "id": "B",
          "text_md": "Port przejdzie w root-inconsistent wyłącznie przy superior BPDU.",
          "feedback_md": "To opis innego mechanizmu: Root Guard."
        },
        {
          "id": "C",
          "text_md": "Port przejdzie w err-disabled.",
          "feedback_md": "BPDU Guard wyłącza ochronnie port po odebraniu BPDU."
        },
        {
          "id": "D",
          "text_md": "Port zignoruje BPDU i pozostanie forwarding.",
          "feedback_md": "BPDU Guard nie polega na ignorowaniu odebranego BPDU."
        }
      ],
      "correct_option_id": "C"
