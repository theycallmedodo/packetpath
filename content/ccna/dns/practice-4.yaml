      ],
      "id": "ccna.dns.practice.case-01.4.card",
      "front_md": "Połączenie do adresu usługi działa, ale zapytania do skonfigurowanego resolvera kończą się timeoutem.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Działanie usługi po IP pomaga oddzielić DNS od warstwy transportu usługi.\n\n**Rozpoznanie:** Problem leży na ścieżce rozwiązywania nazw, nie w samym dostępie po IP.\n\n**Działanie:** Sprawdzić osiągalność, konfigurację i odpowiedzi wybranego DNS.\n\n**Sprawdzenie:** Zapytanie do właściwego resolvera zwraca oczekiwany rekord.",
      "example": "Działanie usługi po IP pomaga oddzielić DNS od warstwy transportu usługi."
    },
