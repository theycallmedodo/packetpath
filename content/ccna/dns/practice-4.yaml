      "id": "ccna.dns.practice.case-04.4.card",
      "front_md": "Aplikacja potrzebuje adresu IPv6, lecz operator sprawdza wyłącznie rekord A.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "A mapuje nazwę na IPv4, AAAA na IPv6.\n\n**Rozpoznanie:** Wybrano typ rekordu dla IPv4 zamiast IPv6.\n\n**Działanie:** Zapytać o rekord AAAA właściwej nazwy.\n\n**Sprawdzenie:** Odpowiedź AAAA zawiera adres IPv6, jeśli taki rekord opublikowano.",
      "example": "A mapuje nazwę na IPv4, AAAA na IPv6."
