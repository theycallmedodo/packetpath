        }
      ],
      "id": "ccna.dns.practice.case-06.4.card",
      "front_md": "Odpowiedź UDP ma bit TC; klient próbuje TCP 53, które blokuje firewall.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "DNS nie ogranicza się wyłącznie do UDP 53.\n\n**Rozpoznanie:** Polityka blokuje potrzebne przejście DNS na TCP.\n\n**Działanie:** Dopuścić wymagany ruch DNS TCP do zatwierdzonego resolvera.\n\n**Sprawdzenie:** Po odpowiedzi TC klient uzyskuje pełną odpowiedź przez TCP.",
      "example": "DNS nie ogranicza się wyłącznie do UDP 53."
