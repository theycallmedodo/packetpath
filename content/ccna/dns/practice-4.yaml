        },
        {
          "title": "Dokumentacja Cisco — DNS — nazwy i rozwiązywanie problemów",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dns/configuration/xe-16-6/dns-xe-16-6-book/configuring_dns.html"
        }
      ],
      "id": "ccna.dns.practice.case-03.4.card",
      "front_md": "Resolver odpowiada NXDOMAIN dla nazwy, a komunikacja z nim działa.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "NXDOMAIN jest odpowiedzią DNS, a nie timeoutem transportowym.\n\n**Rozpoznanie:** DNS informuje o nieistnieniu wskazanej nazwy.\n\n**Działanie:** Zweryfikować pisownię, właściwą strefę i istnienie nazwy w autorytatywnym DNS.\n\n**Sprawdzenie:** Poprawna istniejąca nazwa otrzymuje odpowiedź zamiast NXDOMAIN.",
      "example": "NXDOMAIN jest odpowiedzią DNS, a nie timeoutem transportowym."
    },
