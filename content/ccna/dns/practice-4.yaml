      "id": "ccna.dns.practice.case-05.4.card",
      "front_md": "Nazwa app.example wskazuje CNAME na backend.example, a ten posiada rekord A.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "CNAME wskazuje inną nazwę i może wymagać dalszego rozwiązywania.\n\n**Rozpoznanie:** Pierwsza odpowiedź jest aliasem, nie końcowym adresem.\n\n**Działanie:** Rozwiązać nazwę docelową aliasu zgodnie z łańcuchem DNS.\n\n**Sprawdzenie:** Wynik końcowy zawiera adres backend.example.",
      "example": "CNAME wskazuje inną nazwę i może wymagać dalszego rozwiązywania."
