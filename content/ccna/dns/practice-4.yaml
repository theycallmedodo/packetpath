          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dns/configuration/xe-16-6/dns-xe-16-6-book/configuring_dns.html"
        }
      ],
      "id": "ccna.dns.practice.case-02.4.card",
      "front_md": "Rekord zmieniono na serwerze autorytatywnym, ale resolver nadal ma poprzednią odpowiedź z niewygasłym TTL.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Zmiana rekordu nie musi natychmiast usunąć wszystkich wcześniej zapisanych odpowiedzi.\n\n**Rozpoznanie:** Resolver przechowuje ważną jeszcze odpowiedź cache.\n\n**Działanie:** Uwzględnić pozostały TTL lub kontrolowanie odświeżyć właściwy cache.\n\n**Sprawdzenie:** Po wygaśnięciu cache resolver zwraca nową wartość z autorytatywnego źródła.",
      "example": "Zmiana rekordu nie musi natychmiast usunąć wszystkich wcześniej zapisanych odpowiedzi."
    },
