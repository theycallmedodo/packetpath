    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — weryfikacja",
      "skills": [
        "ccna.dns.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DNS — nazwy i rozwiązywanie problemów",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_configuring_dns.html"
        },
        {
          "title": "Dokumentacja Cisco — DNS — nazwy i rozwiązywanie problemów",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dns/configuration/xe-16-6/dns-xe-16-6-book/configuring_dns.html"
        }
      ],
      "id": "ccna.dns.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nPołączenie do adresu usługi działa, ale zapytania do skonfigurowanego resolvera kończą się timeoutem.\n\n**Zgłoszenie II**\n\nRekord zmieniono na serwerze autorytatywnym, ale resolver nadal ma poprzednią odpowiedź z niewygasłym TTL.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Problem leży na ścieżce rozwiązywania nazw, nie w samym dostępie po IP. Sprawdzić osiągalność, konfigurację i odpowiedzi wybranego DNS.\n\n**Sprawdzenie I:** Zapytanie do właściwego resolvera zwraca oczekiwany rekord.\n\n**Zgłoszenie II:** Resolver przechowuje ważną jeszcze odpowiedź cache. Uwzględnić pozostały TTL lub kontrolowanie odświeżyć właściwy cache.\n\n**Sprawdzenie II:** Po wygaśnięciu cache resolver zwraca nową wartość z autorytatywnego źródła.\n\n**Zależności:** Działanie usługi po IP pomaga oddzielić DNS od warstwy transportu usługi. Zmiana rekordu nie musi natychmiast usunąć wszystkich wcześniej zapisanych odpowiedzi.",
      "example": "I — Zapytanie do właściwego resolvera zwraca oczekiwany rekord.\n\nII — Po wygaśnięciu cache resolver zwraca nową wartość z autorytatywnego źródła."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
      "skills": [
        "ccna.dns.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DNS — nazwy i rozwiązywanie problemów",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_configuring_dns.html"
        },
        {
          "title": "Dokumentacja Cisco — DNS — nazwy i rozwiązywanie problemów",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dns/configuration/xe-16-6/dns-xe-16-6-book/configuring_dns.html"
        }
      ],
      "id": "ccna.dns.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nResolver odpowiada NXDOMAIN dla nazwy, a komunikacja z nim działa.\n\n**Zgłoszenie II**\n\nAplikacja potrzebuje adresu IPv6, lecz operator sprawdza wyłącznie rekord A.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** DNS informuje o nieistnieniu wskazanej nazwy. Zweryfikować pisownię, właściwą strefę i istnienie nazwy w autorytatywnym DNS.\n\n**Sprawdzenie I:** Poprawna istniejąca nazwa otrzymuje odpowiedź zamiast NXDOMAIN.\n\n**Zgłoszenie II:** Wybrano typ rekordu dla IPv4 zamiast IPv6. Zapytać o rekord AAAA właściwej nazwy.\n\n**Sprawdzenie II:** Odpowiedź AAAA zawiera adres IPv6, jeśli taki rekord opublikowano.\n\n**Zależności:** NXDOMAIN jest odpowiedzią DNS, a nie timeoutem transportowym. A mapuje nazwę na IPv4, AAAA na IPv6.",
      "example": "I — Poprawna istniejąca nazwa otrzymuje odpowiedź zamiast NXDOMAIN.\n\nII — Odpowiedź AAAA zawiera adres IPv6, jeśli taki rekord opublikowano."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "ccna.dns.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — DNS — nazwy i rozwiązywanie problemów",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios-xe/ip-addressing/ip-addressing/m_configuring_dns.html"
        },
        {
          "title": "Dokumentacja Cisco — DNS — nazwy i rozwiązywanie problemów",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/ipaddr_dns/configuration/xe-16-6/dns-xe-16-6-book/configuring_dns.html"
        }
      ],
      "id": "ccna.dns.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nNazwa app.example wskazuje CNAME na backend.example, a ten posiada rekord A.\n\n**Zgłoszenie II**\n\nOdpowiedź UDP ma bit TC; klient próbuje TCP 53, które blokuje firewall.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Pierwsza odpowiedź jest aliasem, nie końcowym adresem. Rozwiązać nazwę docelową aliasu zgodnie z łańcuchem DNS.\n\n**Sprawdzenie I:** Wynik końcowy zawiera adres backend.example.\n\n**Zgłoszenie II:** Polityka blokuje potrzebne przejście DNS na TCP. Dopuścić wymagany ruch DNS TCP do zatwierdzonego resolvera.\n\n**Sprawdzenie II:** Po odpowiedzi TC klient uzyskuje pełną odpowiedź przez TCP.\n\n**Zależności:** CNAME wskazuje inną nazwę i może wymagać dalszego rozwiązywania. DNS nie ogranicza się wyłącznie do UDP 53.",
      "example": "I — Wynik końcowy zawiera adres backend.example.\n\nII — Po odpowiedzi TC klient uzyskuje pełną odpowiedź przez TCP."
    },
