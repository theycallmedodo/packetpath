      "prompt_md": "**Zgłoszenie I**\n\nPołączenie do adresu usługi działa, ale zapytania do skonfigurowanego resolvera kończą się timeoutem.\n\n**Zgłoszenie II**\n\nRekord zmieniono na serwerze autorytatywnym, ale resolver nadal ma poprzednią odpowiedź z niewygasłym TTL.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
