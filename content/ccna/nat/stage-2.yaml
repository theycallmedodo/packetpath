      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "4.1"
        }
      ],
      "difficulty": 2,
      "prompt_md": "Dynamiczny NAT bez overload ma pulę dwóch adresów globalnych. Dwa różne hosty już mają aktywne mapowania. Trzeci host potrzebuje nowego mapowania, żaden wpis jeszcze nie wygasł. Co jest problemem?",
      "hints": [
        "Policz wolne adresy, nie tylko liczbę klientów."
      ],
      "explanation_md": "Dynamiczny NAT bez overload wiąże adresy lokalne z dostępnymi globalnymi. Pojemność puli ogranicza liczbę równoczesnych mapowań 1:1.",
      "card_id": "ccna.nat.10.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Zabrakło VLAN-ów na trunku.",
          "feedback_md": "Opis dotyczy puli NAT, nie trunku."
        },
        {
          "id": "B",
          "text_md": "NAT bez overload zawsze współdzieli jeden adres.",
          "feedback_md": "Współdzielenie wymaga odpowiedniego mechanizmu overload."
        },
        {
          "id": "C",
          "text_md": "Każdy host musi użyć identycznego inside local.",
          "feedback_md": "Hosty nie powinny mieć zduplikowanych adresów."
        },
        {
          "id": "D",
          "text_md": "Brak wolnego adresu globalnego w puli.",
          "feedback_md": "Bez zwolnienia wpisu lub zmiany projektu puli brakuje zasobu do nowego mapowania."
        }
      ],
      "correct_option_id": "D"
    },
