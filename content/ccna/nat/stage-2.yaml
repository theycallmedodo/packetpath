  "tasks": [
    {
      "id": "ccna.nat.07",
      "revision": 1,
      "title": "Deny w selektorze NAT",
      "skills": [
        "nat.nat-acl"
      ],
      "sources": [
        {
          "title": "Cisco — NAT i PAT",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13772-12.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "4.1"
        }
      ],
      "difficulty": 2,
      "prompt_md": "ACL 1 jest używana wyłącznie jako selektor NAT. Pakiet nie pasuje do żadnego permit tej ACL. Co można stwierdzić?",
      "hints": [
        "Oddziel selekcję translacji od blokowania ruchu."
      ],
      "explanation_md": "ACL przy NAT kwalifikuje ruch do translacji; nie zastępuje ACL interfejsowej. Dalszy los pakietu zależy m.in. od routingu i innych polityk.",
      "card_id": "ccna.nat.07.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Pakiet zostanie odrzucony przez implicit deny na porcie.",
          "feedback_md": "Implicit deny w selektorze NAT nie jest automatycznie filtrem interfejsowym."
        },
        {
          "id": "B",
          "text_md": "Ta reguła NAT nie przetłumaczy pakietu.",
          "feedback_md": "Pakiet nie kwalifikuje się do tej translacji."
        },
        {
          "id": "C",
          "text_md": "Pakiet zostanie przetłumaczony na pierwszy adres z puli.",
          "feedback_md": "Przydział z puli nie omija selektora."
        },
        {
          "id": "D",
          "text_md": "Pakiet zostanie przetłumaczony tylko po stronie destination.",
          "feedback_md": "Brak dopasowania nie przełącza automatycznie rodzaju translacji."
        }
      ],
      "correct_option_id": "B"
    },
    {
