        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13779-clear-nat-comments.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/218012-troubleshoot-network-address-translation.html"
        }
      ],
      "id": "ccna.nat.practice.case-06.1.card",
      "front_md": "SYN po DNAT dociera do serwera. Serwer ma błędną bramę i SYN-ACK nie wraca przez router NAT.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Dwukierunkowa sesja wymaga spójnej drogi powrotnej przez translator.\n\n**Rozpoznanie:** Droga powrotna z serwera omija właściwy punkt translacji.\n\n**Działanie:** Poprawić bramę lub routing serwera, zapewniając powrót przez urządzenie NAT.\n\n**Sprawdzenie:** SYN-ACK wraca przez router NAT i ma przetłumaczony adres źródłowy.",
      "example": "Droga powrotna z serwera omija właściwy punkt translacji."
    }
