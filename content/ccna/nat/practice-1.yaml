        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13779-clear-nat-comments.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/218012-troubleshoot-network-address-translation.html"
        }
      ],
      "id": "ccna.nat.practice.case-04.1.card",
      "front_md": "Translacja powstaje, lecz router nie ma żadnej pasującej trasy do 8.8.8.8. Łącze do ISP jest up.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "NAT zmienia adresację, ale nie zastępuje routingu.\n\n**Rozpoznanie:** NAT nie dostarcza trasy do celu.\n\n**Działanie:** Dodać poprawną trasę domyślną lub szczegółową zgodnie z projektem WAN.\n\n**Sprawdzenie:** RIB wskazuje osiągalny next hop do celu i pakiety opuszczają WAN.",
      "example": "NAT nie dostarcza trasy do celu."
    },
