        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/218012-troubleshoot-network-address-translation.html"
        }
      ],
      "id": "ccna.nat.practice.case-02.1.card",
      "front_md": "PAT wskazuje ACL 10 dopuszczającą tylko 10.1.0.0/24. Nowy LAN 10.2.0.0/24 ma poprawny routing, ale nie jest tłumaczony.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "ACL użyta do wyboru NAT klasyfikuje translację; nie jest automatycznie filtrem interfejsu.\n\n**Rozpoznanie:** Nowa podsieć nie pasuje do klasyfikatora NAT.\n\n**Działanie:** Dodać 10.2.0.0/24 do właściwej ACL NAT, zachowując stary LAN.\n\n**Sprawdzenie:** Translacje pojawiają się także dla źródeł 10.2.0.x.",
      "example": "Nowa podsieć nie pasuje do klasyfikatora NAT."
    },
