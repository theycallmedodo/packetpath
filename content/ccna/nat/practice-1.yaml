        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13779-clear-nat-comments.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/218012-troubleshoot-network-address-translation.html"
        }
      ],
      "id": "ccna.nat.practice.case-03.1.card",
      "front_md": "Wiele hostów ma korzystać z jednego adresu interfejsu WAN. Reguła nie zawiera overload.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "PAT identyfikuje wiele przepływów poprzez adresy i numery portów.\n\n**Rozpoznanie:** Konfiguracja nie włącza współdzielenia adresu przez PAT.\n\n**Działanie:** Włączyć overload we właściwej regule source NAT.\n\n**Sprawdzenie:** Różne inside local współdzielą inside global z rozróżnieniem portów.",
      "example": "Konfiguracja nie włącza współdzielenia adresu przez PAT."
    },
