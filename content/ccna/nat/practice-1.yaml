      ],
      "id": "ccna.nat.practice.case-05.1.card",
      "front_md": "Serwer 10.0.0.10:443 ma być dostępny pod 203.0.113.10:8443. Zwykły PAT wychodzący nie tworzy stałego mapowania dla nowych połączeń z Internetu.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Publikacja określonej usługi wymaga mapowania zgodnego z protokołem i portami.\n\n**Rozpoznanie:** Brakuje stałej translacji portu usługi.\n\n**Działanie:** Skonfigurować statyczną translację TCP 10.0.0.10:443 na 203.0.113.10:8443 i wymaganą politykę dostępu.\n\n**Sprawdzenie:** Nowe połączenie z zewnątrz na port 8443 dociera do serwera na port 443.",
      "example": "Brakuje stałej translacji portu usługi."
    },
