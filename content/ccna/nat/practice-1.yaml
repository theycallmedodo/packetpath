      "id": "ccna.nat.practice.case-01.1.card",
      "front_md": "Gi0/0 prowadzi do LAN, Gi0/1 do ISP. Reguła PAT i ACL są poprawne, ale Gi0/0 nie ma ip nat inside.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Reguła translacji oraz role interfejsów muszą razem wskazać właściwy przepływ.\n\n**Rozpoznanie:** Nie oznaczono wewnętrznego interfejsu NAT.\n\n**Działanie:** Dodać ip nat inside na Gi0/0.\n\n**Sprawdzenie:** Kontrolowany ruch z LAN tworzy translację i zwiększa statystyki NAT.",
      "example": "Nie oznaczono wewnętrznego interfejsu NAT."
    },
