          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/221481-8605-13.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13779-clear-nat-comments.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/218012-troubleshoot-network-address-translation.html"
        }
      ],
      "id": "ccna.nat.practice.compare-02.3.card",
      "front_md": "**Zgłoszenie I**\n\nWiele hostów ma korzystać z jednego adresu interfejsu WAN. Reguła nie zawiera overload.\n\n**Zgłoszenie II**\n\nTranslacja powstaje, lecz router nie ma żadnej pasującej trasy do 8.8.8.8. Łącze do ISP jest up.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Konfiguracja nie włącza współdzielenia adresu przez PAT. Włączyć overload we właściwej regule source NAT.\n\n**Sprawdzenie I:** Różne inside local współdzielą inside global z rozróżnieniem portów.\n\n**Zgłoszenie II:** NAT nie dostarcza trasy do celu. Dodać poprawną trasę domyślną lub szczegółową zgodnie z projektem WAN.\n\n**Sprawdzenie II:** RIB wskazuje osiągalny next hop do celu i pakiety opuszczają WAN.\n\n**Zależności:** PAT identyfikuje wiele przepływów poprzez adresy i numery portów. NAT zmienia adresację, ale nie zastępuje routingu.",
      "example": "I — Różne inside local współdzielą inside global z rozróżnieniem portów.\n\nII — RIB wskazuje osiągalny next hop do celu i pakiety opuszczają WAN."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — weryfikacja",
      "skills": [
        "ccna.nat.contrast",
        "practice.3"
      ],
      "sources": [
        {
          "title": "Cisco — NAT i PAT",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13772-12.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/221481-8605-13.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13779-clear-nat-comments.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/218012-troubleshoot-network-address-translation.html"
        }
      ],
      "id": "ccna.nat.practice.compare-03.3.card",
      "front_md": "**Zgłoszenie I**\n\nSerwer 10.0.0.10:443 ma być dostępny pod 203.0.113.10:8443. Zwykły PAT wychodzący nie tworzy stałego mapowania dla nowych połączeń z Internetu.\n\n**Zgłoszenie II**\n\nSYN po DNAT dociera do serwera. Serwer ma błędną bramę i SYN-ACK nie wraca przez router NAT.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Brakuje stałej translacji portu usługi. Skonfigurować statyczną translację TCP 10.0.0.10:443 na 203.0.113.10:8443 i wymaganą politykę dostępu.\n\n**Sprawdzenie I:** Nowe połączenie z zewnątrz na port 8443 dociera do serwera na port 443.\n\n**Zgłoszenie II:** Droga powrotna z serwera omija właściwy punkt translacji. Poprawić bramę lub routing serwera, zapewniając powrót przez urządzenie NAT.\n\n**Sprawdzenie II:** SYN-ACK wraca przez router NAT i ma przetłumaczony adres źródłowy.\n\n**Zależności:** Publikacja określonej usługi wymaga mapowania zgodnego z protokołem i portami. Dwukierunkowa sesja wymaga spójnej drogi powrotnej przez translator.",
      "example": "I — Nowe połączenie z zewnątrz na port 8443 dociera do serwera na port 443.\n\nII — SYN-ACK wraca przez router NAT i ma przetłumaczony adres źródłowy."
    },
