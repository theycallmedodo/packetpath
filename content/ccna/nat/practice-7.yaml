        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/13779-clear-nat-comments.html"
        },
        {
          "title": "Dokumentacja Cisco — NAT — translacje i droga powrotna",
          "url": "https://www.cisco.com/c/en/us/support/docs/ip/network-address-translation-nat/218012-troubleshoot-network-address-translation.html"
        }
      ],
      "id": "ccna.nat.practice.compare-01.3.card",
      "front_md": "**Zgłoszenie I**\n\nGi0/0 prowadzi do LAN, Gi0/1 do ISP. Reguła PAT i ACL są poprawne, ale Gi0/0 nie ma ip nat inside.\n\n**Zgłoszenie II**\n\nPAT wskazuje ACL 10 dopuszczającą tylko 10.1.0.0/24. Nowy LAN 10.2.0.0/24 ma poprawny routing, ale nie jest tłumaczony.\n\nOceń każde zgłoszenie oddzielnie. Który wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Nie oznaczono wewnętrznego interfejsu NAT. Dodać ip nat inside na Gi0/0.\n\n**Sprawdzenie I:** Kontrolowany ruch z LAN tworzy translację i zwiększa statystyki NAT.\n\n**Zgłoszenie II:** Nowa podsieć nie pasuje do klasyfikatora NAT. Dodać 10.2.0.0/24 do właściwej ACL NAT, zachowując stary LAN.\n\n**Sprawdzenie II:** Translacje pojawiają się także dla źródeł 10.2.0.x.\n\n**Zależności:** Reguła translacji oraz role interfejsów muszą razem wskazać właściwy przepływ. ACL użyta do wyboru NAT klasyfikuje translację; nie jest automatycznie filtrem interfejsu.",
      "example": "I — Kontrolowany ruch z LAN tworzy translację i zwiększa statystyki NAT.\n\nII — Translacje pojawiają się także dla źródeł 10.2.0.x."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — weryfikacja",
