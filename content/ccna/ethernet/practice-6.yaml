    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — działanie",
      "skills": [
        "ccna.ethernet.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.compare-01.2.card",
      "front_md": "**Zgłoszenie I**\n\nSwitch zna MAC źródłowy, ale nie zna docelowego w danym VLAN. Ramka jest unicast.\n\n**Zgłoszenie II**\n\nRamka od hosta A wchodzi przez Gi1/0/3. Switch nie miał wcześniej jego MAC.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Brakuje wpisu MAC dla celu w tej domenie L2. Oczekiwać floodingu na dozwolone porty forwarding tego VLAN poza wejściowym.\n\n**Sprawdzenie I:** Ramka nie jest rozsyłana do innych VLAN, lecz tylko w odpowiedniej domenie.\n\n**Zgłoszenie II:** Switch poznaje położenie hosta z MAC źródłowego. Sprawdzić wpis dla źródłowego MAC w tabeli właściwego VLAN.\n\n**Sprawdzenie II:** MAC hosta A wskazuje Gi1/0/3.\n\n**Zależności:** Unknown unicast jest floodowany w obrębie VLAN, nie całego switcha bez ograniczeń. Uczenie MAC opiera się na adresie źródłowym ramki przychodzącej.",
      "example": "I — Oczekiwać floodingu na dozwolone porty forwarding tego VLAN poza wejściowym.\n\nII — Sprawdzić wpis dla źródłowego MAC w tabeli właściwego VLAN."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — działanie",
      "skills": [
        "ccna.ethernet.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nHost przeniesiono z portu 3 na 5; nowa ramka tego hosta przychodzi przez port 5.\n\n**Zgłoszenie II**\n\nPod ruchem rośnie licznik CRC na odbiorczym porcie miedzianym; po wymianie uszkodzonego patchcordu przyrost ustaje.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Położenie źródła zmieniło się względem starego wpisu. Pozwolić switchowi zaktualizować dynamiczny wpis i sprawdzić port 5.\n\n**Sprawdzenie I:** MAC hosta wskazuje nowy port, bez ciągłego przeskakiwania.\n\n**Zgłoszenie II:** Warstwa fizyczna uszkadzała odbierane ramki. Wymienić wadliwy element toru i obserwować nowe przyrosty błędów.\n\n**Sprawdzenie II:** Przy podobnym ruchu CRC nie przybywa po naprawie kabla.\n\n**Zależności:** Dynamiczna tabela MAC może aktualizować położenie hosta na podstawie nowych ramek. CRC sygnalizuje uszkodzone ramki, a historyczny licznik nie zeruje się sam po naprawie.",
      "example": "I — Pozwolić switchowi zaktualizować dynamiczny wpis i sprawdzić port 5.\n\nII — Wymienić wadliwy element toru i obserwować nowe przyrosty błędów."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — działanie",
      "skills": [
        "ccna.ethernet.contrast",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.compare-03.2.card",
      "front_md": "**Zgłoszenie I**\n\nJeden koniec jest wymuszony half-duplex, drugi full-duplex. Ruch jest niestabilny i pojawiają się błędy.\n\n**Zgłoszenie II**\n\nHost wysyła pakiet IPv4 do innej podsieci przez router. Docelowy IP należy do serwera zdalnego.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Końce łącza używają niezgodnego duplexu. Uzgodnić poprawną autonegocjację lub zgodne parametry na obu końcach.\n\n**Sprawdzenie I:** Oba końce pokazują zgodny duplex i przestają przyrastać błędy związane z mismatch.\n\n**Zgłoszenie II:** Host potrzebuje adresu MAC lokalnej bramy, nie zdalnego serwera. Zbudować ramkę do MAC bramy przy zachowaniu docelowego IP serwera.\n\n**Sprawdzenie II:** Przechwycenie pokazuje docelowy MAC routera i docelowy IP serwera.\n\n**Zależności:** Zgodność ustawień fizycznych obu końców jest warunkiem poprawnej pracy Ethernet. Nagłówek L2 opisuje lokalny skok, a IP zachowuje adres docelowego hosta.",
      "example": "I — Uzgodnić poprawną autonegocjację lub zgodne parametry na obu końcach.\n\nII — Zbudować ramkę do MAC bramy przy zachowaniu docelowego IP serwera."
    },
