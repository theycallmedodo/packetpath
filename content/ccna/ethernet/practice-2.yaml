      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.case-01.2.card",
      "front_md": "Switch zna MAC źródłowy, ale nie zna docelowego w danym VLAN. Ramka jest unicast.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Unknown unicast jest floodowany w obrębie VLAN, nie całego switcha bez ograniczeń.\n\n**Rozpoznanie:** Brakuje wpisu MAC dla celu w tej domenie L2.\n\n**Działanie:** Oczekiwać floodingu na dozwolone porty forwarding tego VLAN poza wejściowym.\n\n**Sprawdzenie:** Ramka nie jest rozsyłana do innych VLAN, lecz tylko w odpowiedniej domenie.",
      "example": "Oczekiwać floodingu na dozwolone porty forwarding tego VLAN poza wejściowym."
    },
    {
      "revision": 1,
      "title": "Uczenie źródła — działanie",
      "skills": [
        "ccna.ethernet.case-02",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.case-02.2.card",
      "front_md": "Ramka od hosta A wchodzi przez Gi1/0/3. Switch nie miał wcześniej jego MAC.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Uczenie MAC opiera się na adresie źródłowym ramki przychodzącej.\n\n**Rozpoznanie:** Switch poznaje położenie hosta z MAC źródłowego.\n\n**Działanie:** Sprawdzić wpis dla źródłowego MAC w tabeli właściwego VLAN.\n\n**Sprawdzenie:** MAC hosta A wskazuje Gi1/0/3.",
      "example": "Sprawdzić wpis dla źródłowego MAC w tabeli właściwego VLAN."
    },
    {
      "revision": 1,
      "title": "Przemieszczenie MAC — działanie",
      "skills": [
        "ccna.ethernet.case-03",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.case-03.2.card",
      "front_md": "Host przeniesiono z portu 3 na 5; nowa ramka tego hosta przychodzi przez port 5.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Dynamiczna tabela MAC może aktualizować położenie hosta na podstawie nowych ramek.\n\n**Rozpoznanie:** Położenie źródła zmieniło się względem starego wpisu.\n\n**Działanie:** Pozwolić switchowi zaktualizować dynamiczny wpis i sprawdzić port 5.\n\n**Sprawdzenie:** MAC hosta wskazuje nowy port, bez ciągłego przeskakiwania.",
      "example": "Pozwolić switchowi zaktualizować dynamiczny wpis i sprawdzić port 5."
    },
    {
      "revision": 1,
      "title": "CRC rośnie — działanie",
      "skills": [
        "ccna.ethernet.case-04",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.case-04.2.card",
      "front_md": "Pod ruchem rośnie licznik CRC na odbiorczym porcie miedzianym; po wymianie uszkodzonego patchcordu przyrost ustaje.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "CRC sygnalizuje uszkodzone ramki, a historyczny licznik nie zeruje się sam po naprawie.\n\n**Rozpoznanie:** Warstwa fizyczna uszkadzała odbierane ramki.\n\n**Działanie:** Wymienić wadliwy element toru i obserwować nowe przyrosty błędów.\n\n**Sprawdzenie:** Przy podobnym ruchu CRC nie przybywa po naprawie kabla.",
      "example": "Wymienić wadliwy element toru i obserwować nowe przyrosty błędów."
    },
    {
      "revision": 1,
      "title": "Duplex mismatch — działanie",
      "skills": [
        "ccna.ethernet.case-05",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.case-05.2.card",
      "front_md": "Jeden koniec jest wymuszony half-duplex, drugi full-duplex. Ruch jest niestabilny i pojawiają się błędy.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Zgodność ustawień fizycznych obu końców jest warunkiem poprawnej pracy Ethernet.\n\n**Rozpoznanie:** Końce łącza używają niezgodnego duplexu.\n\n**Działanie:** Uzgodnić poprawną autonegocjację lub zgodne parametry na obu końcach.\n\n**Sprawdzenie:** Oba końce pokazują zgodny duplex i przestają przyrastać błędy związane z mismatch.",
      "example": "Uzgodnić poprawną autonegocjację lub zgodne parametry na obu końcach."
    },
    {
      "revision": 1,
      "title": "MAC bramy — działanie",
      "skills": [
        "ccna.ethernet.case-06",
        "practice.2"
      ],
      "sources": [
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst2960/software/release/15-2_2_e/configuration/guide/b_1522e_2960_2960c_2960s_2960sf_2960p_cg/b_1522e_2960_2960c_2960s_2960sf_2960p_cg_chapter_011.html"
        },
        {
          "title": "Dokumentacja Cisco — Ethernet, MAC i ARP",
          "url": "https://www.cisco.com/c/en/us/td/docs/switches/lan/catalyst3750x_3560x/software/release/15-0_2_se/configuration/guide/3750x_cg/swiprout.html"
        }
      ],
      "id": "ccna.ethernet.practice.case-06.2.card",
      "front_md": "Host wysyła pakiet IPv4 do innej podsieci przez router. Docelowy IP należy do serwera zdalnego.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Nagłówek L2 opisuje lokalny skok, a IP zachowuje adres docelowego hosta.\n\n**Rozpoznanie:** Host potrzebuje adresu MAC lokalnej bramy, nie zdalnego serwera.\n\n**Działanie:** Zbudować ramkę do MAC bramy przy zachowaniu docelowego IP serwera.\n\n**Sprawdzenie:** Przechwycenie pokazuje docelowy MAC routera i docelowy IP serwera.",
      "example": "Zbudować ramkę do MAC bramy przy zachowaniu docelowego IP serwera."
    }
  ],
