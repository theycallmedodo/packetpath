        }
      ],
      "id": "ccna.acl.practice.compare-03.1.card",
      "front_md": "**Zgłoszenie I**\n\nReguła ma permit tcp any eq 443 host 192.0.2.20, a klient wysyła SYN z portu 53000 do portu 443 serwera.\n\n**Zgłoszenie II**\n\nACL blokuje /24 wpisem seq 20. Tylko host 10.0.4.9 ma otrzymać wyjątek; reszta wpisów ma pozostać.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Warunek eq 443 został przypisany portowi źródłowemu. Umieścić eq 443 po adresie serwera docelowego.\n\n**Sprawdzenie I:** SYN 53000→443 zwiększa licznik poprawionego wpisu.\n\n**Zgłoszenie II:** Wyjątek dodany za deny nie zostałby osiągnięty. Dodać precyzyjne permit dla hosta z wolnym numerem mniejszym niż 20.\n\n**Sprawdzenie II:** Host .9 przechodzi, inny host z /24 nadal trafia w seq 20.\n\n**Zależności:** Położenie operatora portu w extended ACL rozróżnia port źródłowy i docelowy. Numery sekwencji pozwalają wstawić wyjątek bez kasowania całej ACL.",
      "example": "I — Warunek eq 443 został przypisany portowi źródłowemu.\n\nII — Wyjątek dodany za deny nie zostałby osiągnięty."
    },
