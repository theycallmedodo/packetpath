        },
        {
          "title": "Dokumentacja Cisco — ACL — kolejność, zakres i diagnostyka",
          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_data_acl/configuration/15-e/sec-data-acl-15-e-book/sec-acl-seq-num.html"
        }
      ],
      "id": "ccna.acl.practice.compare-01.1.card",
      "front_md": "**Zgłoszenie I**\n\nACL ma seq 10 permit ip any any i seq 20 deny tcp any host 10.1.1.10 eq 22. SSH nadal przechodzi.\n\n**Zgłoszenie II**\n\nACL na wyjściu ma tylko permit tcp any host 192.0.2.10 eq 443. ICMP i DNS przestały działać.\n\nOceń każde zgłoszenie oddzielnie. Które rozpoznanie najlepiej wyjaśnia podane obserwacje? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Pierwszy ogólny permit kończy dopasowanie przed deny. Przenieść precyzyjny deny przed ogólny permit, zachowując pozostałe reguły.\n\n**Sprawdzenie I:** Test SSH zwiększa licznik właściwego deny, a dozwolony ruch nadal przechodzi.\n\n**Zgłoszenie II:** Niedopasowany ruch trafia w niejawne deny na końcu ACL. Dodać konkretne wymagane zezwolenia przed końcem ACL zgodnie z polityką.\n\n**Sprawdzenie II:** Liczniki nowych zezwoleń rosną dla zatwierdzonych testów ICMP i DNS.\n\n**Zależności:** ACL stosuje pierwszą pasującą regułę, a nie najbardziej szczegółową. ACL wymaga jawnego dopuszczenia każdego rodzaju ruchu objętego polityką.",
      "example": "I — Pierwszy ogólny permit kończy dopasowanie przed deny.\n\nII — Niedopasowany ruch trafia w niejawne deny na końcu ACL."
    },
    {
