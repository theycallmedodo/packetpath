          "url": "https://www.cisco.com/c/en/us/td/docs/ios-xml/ios/sec_data_acl/configuration/15-e/sec-data-acl-15-e-book/sec-acl-seq-num.html"
        }
      ],
      "id": "ccna.acl.practice.compare-02.2.card",
      "front_md": "**Zgłoszenie I**\n\nKlienci wchodzą przez Gi0/0. ACL blokująca ich wyjście do WAN została przypięta out na Gi0/0.\n\n**Zgłoszenie II**\n\nWymagane jest dopasowanie tylko 10.1.2.3. Wpis 10.1.2.3 0.0.0.255 obejmuje również inne adresy /24.\n\nOceń każde zgłoszenie oddzielnie. Które działanie najlepiej odpowiada wymaganiom tego przypadku? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** ACL bada pakiety wracające do LAN zamiast wchodzących z LAN. Zastosować przygotowaną politykę na Gi0/0 w kierunku in.\n\n**Sprawdzenie I:** Show ip interface potwierdza inbound ACL, a jej liczniki rosną dla ruchu klientów.\n\n**Zgłoszenie II:** Wildcard ignoruje wszystkie bity ostatniego oktetu. Użyć host 10.1.2.3 albo wildcard 0.0.0.0.\n\n**Sprawdzenie II:** Test .3 pasuje do wpisu, a test .4 nie pasuje do tego konkretnego wpisu.\n\n**Zależności:** In i out określa kierunek pakietu względem interfejsu routera. Zero w wildcard oznacza bit wymagający porównania, jeden oznacza bit ignorowany.",
      "example": "I — Zastosować przygotowaną politykę na Gi0/0 w kierunku in.\n\nII — Użyć host 10.1.2.3 albo wildcard 0.0.0.0."
    },
