        {
          "text_md": "Tak, wyższy numer sekwencji ma priorytet",
          "feedback_md": "Niższy numer jest sprawdzany wcześniej.",
          "id": "C"
        },
        {
          "text_md": "Tylko jeśli host odpowiada pingiem",
          "feedback_md": "ICMP nie zmienia zasady pierwszego dopasowania.",
          "id": "D"
        }
