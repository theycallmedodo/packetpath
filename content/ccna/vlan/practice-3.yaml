      "id": "ccna.vlan.practice.case-09.2.card",
      "front_md": "Trunk dopuszcza VLAN 10 i 20. Dla VLAN 20 ten port jest blocking, dla 10 forwarding; istnieje inna poprawna droga 20.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
