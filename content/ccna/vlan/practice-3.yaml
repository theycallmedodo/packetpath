      "id": "ccna.vlan.practice.case-05.2.card",
      "front_md": "SW1 ma native VLAN 99, SW2 native 1. Zwykłe tagowanie native jest wyłączone; ruch untagged trafia do różnych VLAN.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Native VLAN definiuje domyślne przypisanie nietagowanego ruchu na trunku 802.1Q.\n\n**Rozpoznanie:** Końce trunku inaczej klasyfikują nietagowane ramki.\n\n**Działanie:** Ujednolicić native VLAN według projektu na obu końcach.\n\n**Sprawdzenie:** Oba końce pokazują ten sam native i znika niezgodna klasyfikacja untagged.",
      "example": "Ujednolicić native VLAN według projektu na obu końcach."
