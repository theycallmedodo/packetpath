      "front_md": "Switch ma dynamic auto, a firewall nie obsługuje DTP. Usługa wymaga tagowanych VLAN.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Trunk do urządzenia bez DTP trzeba skonfigurować jawnie.\n\n**Rozpoznanie:** Nie ma partnera inicjującego negocjację DTP.\n\n**Działanie:** Ustawić statyczny trunk i właściwe tagowanie po stronie firewalla.\n\n**Sprawdzenie:** Tagowany ruch wymaganych VLAN przechodzi przez połączenie.",
