      "id": "ccna.vlan.practice.case-01.2.card",
      "front_md": "Gi1/0/3 ma access VLAN 30, lecz VLAN 30 nie istnieje w lokalnej bazie; port nie przenosi ruchu użytkownika.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Samo przypisanie access VLAN nie zastępuje obecności aktywnego VLAN w bazie.\n\n**Rozpoznanie:** Przypisano port do nieistniejącego lokalnie VLAN.\n\n**Działanie:** Utworzyć VLAN 30 i sprawdzić jego aktywny stan.\n\n**Sprawdzenie:** Show vlan brief zawiera aktywny VLAN 30 i port klienta.",
      "example": "Utworzyć VLAN 30 i sprawdzić jego aktywny stan."
    },
