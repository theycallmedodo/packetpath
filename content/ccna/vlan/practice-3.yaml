      "id": "ccna.vlan.practice.case-03.2.card",
      "front_md": "Trunk SW1–SW2 jest up. VLAN 10 działa, VLAN 20 nie; SW1 dopuszcza 10,20, SW2 tylko 10.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
      "back_md": "Transport VLAN wymaga zgodnego dopuszczenia na całej ścieżce.\n\n**Rozpoznanie:** VLAN 20 jest wykluczony z listy allowed na SW2.\n\n**Działanie:** Dodać VLAN 20 do listy SW2 bez usuwania VLAN 10.\n\n**Sprawdzenie:** Oba końce trunku dopuszczają VLAN 20 i kontrolny ruch tego VLAN przechodzi.",
      "example": "Dodać VLAN 20 do listy SW2 bez usuwania VLAN 10."
    },
