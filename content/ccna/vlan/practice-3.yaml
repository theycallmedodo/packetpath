      "back_md": "Dwa dynamic auto nie zapewniają utworzenia trunku.\n\n**Rozpoznanie:** Żadna strona nie inicjuje negocjacji trunku.\n\n**Działanie:** Ustawić jawny trunk zgodnie z projektem po obu stronach.\n\n**Sprawdzenie:** Operational mode wskazuje trunk na obu końcach.",
