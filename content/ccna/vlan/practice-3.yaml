      "id": "ccna.vlan.practice.case-08.2.card",
      "front_md": "SW1 i SW3 mają VLAN 40, ale pośredni SW2 nie ma go w bazie. Listy allowed na łączach obejmują 40.\n\nKtóre działanie najlepiej odpowiada wymaganiom tego przypadku?",
