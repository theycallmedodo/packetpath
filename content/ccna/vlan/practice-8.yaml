      "id": "ccna.vlan.practice.case-16.4.card",
      "front_md": "Dwa hosty 192.168.1.10/24 i .20/24 są w różnych izolowanych VLAN bez mostkowania. Próbują ARP bez bramy.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Hosty tej samej podsieci zakładają bezpośrednią osiągalność L2.\n\n**Rozpoznanie:** Wspólna adresacja nie scala rozdzielonych domen L2.\n\n**Działanie:** Umieścić hosty w zamierzonym wspólnym VLAN albo rozdzielić podsieci i zapewnić routing.\n\n**Sprawdzenie:** Adresacja i podział VLAN są spójne z wymaganą drogą komunikacji.",
      "example": "Hosty tej samej podsieci zakładają bezpośrednią osiągalność L2."
