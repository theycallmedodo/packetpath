      "id": "ccna.vlan.practice.case-13.4.card",
      "front_md": "Subinterfejsy routera mają adresy i tagi, ale fizyczny interfejs rodzic jest administracyjnie wyłączony.\n\nKtóra zasada najbezpośredniej wyjaśnia opisany mechanizm?",
      "back_md": "Subinterfejsy zależą od fizycznego interfejsu nadrzędnego.\n\n**Rozpoznanie:** Wyłączony interfejs nadrzędny odcina wszystkie subinterfejsy.\n\n**Działanie:** Podnieść fizyczny interfejs po potwierdzeniu właściwego połączenia.\n\n**Sprawdzenie:** Rodzic i wymagane subinterfejsy osiągają stan operacyjny zgodny z linkiem.",
      "example": "Subinterfejsy zależą od fizycznego interfejsu nadrzędnego."
    },
