      "id": "ccna.vlan.practice.case-02.3.card",
      "front_md": "PC ma adresację VLAN 20, lecz jego port access jest w VLAN 10. Inne hosty VLAN 20 działają.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Adres IP hosta nie przypisuje automatycznie portu switcha do właściwego VLAN.\n\n**Rozpoznanie:** Port klienta należy do innej domeny L2 niż jego brama.\n\n**Działanie:** Przypisać port klienta do VLAN 20 zgodnie z dokumentacją.\n\n**Sprawdzenie:** MAC klienta pojawia się w VLAN 20 i klient rozwiązuje ARP swojej bramy.",
      "example": "MAC klienta pojawia się w VLAN 20 i klient rozwiązuje ARP swojej bramy."
    },
