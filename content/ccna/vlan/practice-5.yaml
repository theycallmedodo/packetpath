      "id": "ccna.vlan.practice.case-04.3.card",
      "front_md": "Na trunku były VLAN 10,20. Komenda switchport trunk allowed vlan 30 spowodowała utratę 10 i 20.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Allowed vlan bez add ustawia nową listę, co może usunąć dotychczasowe usługi.\n\n**Rozpoznanie:** Polecenie zastąpiło listę zamiast dopisać element.\n\n**Działanie:** Przywrócić zatwierdzoną listę 10,20,30 i używać add dla kolejnych dopisań.\n\n**Sprawdzenie:** Show interfaces trunk pokazuje wszystkie trzy zamierzone VLAN.",
