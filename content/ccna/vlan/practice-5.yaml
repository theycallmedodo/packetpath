      "id": "ccna.vlan.practice.case-09.3.card",
      "front_md": "Trunk dopuszcza VLAN 10 i 20. Dla VLAN 20 ten port jest blocking, dla 10 forwarding; istnieje inna poprawna droga 20.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Stan trunku nie oznacza identycznego stanu STP dla wszystkich VLAN.\n\n**Rozpoznanie:** STP wybiera różne ścieżki dla różnych instancji VLAN.\n\n**Działanie:** Sprawdzić aktywną drogę VLAN 20 zamiast wymuszać forwarding na blokowanym porcie.\n\n**Sprawdzenie:** VLAN 20 dociera po swojej aktywnej bezpętlowej ścieżce.",
