      "id": "ccna.vlan.practice.case-07.3.card",
      "front_md": "Switch ma dynamic auto, a firewall nie obsługuje DTP. Usługa wymaga tagowanych VLAN.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
