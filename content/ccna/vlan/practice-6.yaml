      ],
      "id": "ccna.vlan.practice.case-14.3.card",
      "front_md": "Telefon ma tagować głos VLAN 30, komputer za nim wysyła untagged dane VLAN 20. Port ma tylko access VLAN 20 bez konfiguracji voice.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Port access może obsługiwać oddzielny voice VLAN przy odpowiedniej konfiguracji.\n\n**Rozpoznanie:** Nie skonfigurowano wymaganej obsługi voice VLAN.\n\n**Działanie:** Ustawić właściwy voice VLAN oraz zachować data access VLAN.\n\n**Sprawdzenie:** MAC telefonu i komputera są obserwowane we właściwych segmentach voice i data.",
      "example": "MAC telefonu i komputera są obserwowane we właściwych segmentach voice i data."
    },
