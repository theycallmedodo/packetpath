      "id": "ccna.vlan.practice.case-17.3.card",
      "front_md": "SW1 jest trunk, SW2 access VLAN 10. Wymagany VLAN 20 nie działa między switchami.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Port access nie zastępuje trunku przenoszącego wiele tagowanych VLAN.\n\n**Rozpoznanie:** Końce łącza mają niezgodne role dla transportu wielu VLAN.\n\n**Działanie:** Skonfigurować zgodny trunk na SW2 z właściwą listą VLAN.\n\n**Sprawdzenie:** Oba końce pracują operacyjnie jako trunk.",
