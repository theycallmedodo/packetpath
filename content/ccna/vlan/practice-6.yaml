      "front_md": "Trzeba usunąć tylko VLAN 30 z trunku, zachowując 10,20,40. Operator proponuje ustawić listę na 30.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Add i remove pozwalają modyfikować członkostwo listy bez jej przypadkowego zastąpienia.\n\n**Rozpoznanie:** Proponowane polecenie zachowałoby tylko VLAN przeznaczony do usunięcia.\n\n**Działanie:** Użyć switchport trunk allowed vlan remove 30.\n\n**Sprawdzenie:** Po zmianie allowed zawiera 10,20,40, a nie 30.",
