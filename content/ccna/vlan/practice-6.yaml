      "front_md": "VLAN jest aktywny i allowed, ale w środowisku z VTP pruning został wycięty na badanym trunku.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Allowed nie oznacza automatycznie forwarding i not pruned.\n\n**Rozpoznanie:** Mechanizm pruning ograniczył zalewanie tego VLAN na łączu.\n\n**Działanie:** Zweryfikować rzeczywistą potrzebę VLAN i stan pruning na ścieżce.\n\n**Sprawdzenie:** Sekcja VLAN forwarding and not pruned odpowiada wymaganej usłudze.",
