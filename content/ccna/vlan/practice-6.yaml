      "id": "ccna.vlan.practice.case-15.3.card",
      "front_md": "Port i trunki VLAN 60 działają. Host 10.60.0.10/24 ma bramę 10.50.0.1, a SVI VLAN 60 ma 10.60.0.1.\n\nKtóry wynik najbezpośredniej potwierdza oczekiwany stan w tym przypadku?",
      "back_md": "Nie każda awaria przypominająca VLAN jest problemem tagowania.\n\n**Rozpoznanie:** Host wskazuje bramę innej podsieci mimo poprawnej warstwy drugiej.\n\n**Działanie:** Poprawić bramę hosta na 10.60.0.1.\n\n**Sprawdzenie:** Host rozwiązuje ARP właściwego SVI i osiąga cel routowany.",
      "example": "Host rozwiązuje ARP właściwego SVI i osiąga cel routowany."
