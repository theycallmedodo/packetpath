    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "ccna.ssh.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nSSH jest aktywne i osiągalne, ale linie VTY mają transport input telnet.\n\n**Zgłoszenie II**\n\nLokalny użytkownik istnieje, ale VTY używają login z hasłem linii zamiast lokalnej bazy; AAA nie jest włączone.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** VTY nie dopuszczają protokołu SSH. Ustawić transport input ssh na obsługiwanym zakresie VTY.\n\n**Sprawdzenie I:** Połączenie SSH trafia do logowania, a Telnet jest niedopuszczony.\n\n**Zgłoszenie II:** Wybrano niewłaściwe źródło uwierzytelniania VTY. Ustawić login local na właściwych liniach VTY.\n\n**Sprawdzenie II:** Logowanie korzysta z lokalnej nazwy użytkownika i jej sekretu.\n\n**Zależności:** Uruchomienie serwera SSH i dopuszczenie transportu VTY to osobne ustawienia. Bez AAA polecenie login local wybiera lokalną bazę kont.",
      "example": "I — Uruchomienie serwera SSH i dopuszczenie transportu VTY to osobne ustawienia.\n\nII — Bez AAA polecenie login local wybiera lokalną bazę kont."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.ssh.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nAccess-class VTY dopuszcza tylko 10.10.0.0/24. Administrator 10.20.0.5 ma routing, ale SSH jest odrzucane.\n\n**Zgłoszenie II**\n\nNa nowym urządzeniu brak kluczy RSA, a show ip ssh wskazuje nieaktywny serwer; konfiguracja tej wersji wymaga kluczy RSA.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Źródło administratora nie jest dozwolone w ACL VTY. Dodać precyzyjny wyjątek dla uprawnionego hosta zgodnie z polityką.\n\n**Sprawdzenie I:** SSH z 10.20.0.5 działa, a niedozwolone źródło nadal jest blokowane.\n\n**Zgłoszenie II:** Nie przygotowano kluczy hosta wymaganych przez serwer SSH. Utworzyć klucze RSA po ustawieniu wymaganej nazwy hosta i domeny.\n\n**Sprawdzenie II:** Show ip ssh potwierdza aktywny serwer SSHv2.\n\n**Zależności:** ACL VTY ogranicza dostęp do sesji zarządzania według źródła. Klucz hosta jest elementem ustanowienia bezpiecznej sesji SSH.",
      "example": "I — ACL VTY ogranicza dostęp do sesji zarządzania według źródła.\n\nII — Klucz hosta jest elementem ustanowienia bezpiecznej sesji SSH."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "ccna.ssh.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nTCP i negocjacja SSH działają, lecz log wskazuje authentication failed dla istniejącego lokalnego konta.\n\n**Zgłoszenie II**\n\nSSH działa z sąsiedniego hosta. Zdalny host nie ma trasy do podsieci management.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Uwierzytelnienie konta nie powiodło się po zestawieniu transportu. Zweryfikować nazwę konta i sekret, korzystając z bezpiecznego dostępu administracyjnego.\n\n**Sprawdzenie I:** Poprawne dane tego konta umożliwiają logowanie przez SSH.\n\n**Zgłoszenie II:** Brak drogi routowanej do adresu zarządzania. Przywrócić wymagany routing między siecią administratora a management.\n\n**Sprawdzenie II:** Lookup i test TCP do portu SSH przechodzą z właściwego źródła.\n\n**Zależności:** Nie każdy błąd SSH jest błędem routingu lub TCP; etapy sesji trzeba rozdzielać. Usługa zarządzania wymaga osiągalności IP niezależnie od ustawień uwierzytelniania.",
      "example": "I — Nie każdy błąd SSH jest błędem routingu lub TCP; etapy sesji trzeba rozdzielać.\n\nII — Usługa zarządzania wymaga osiągalności IP niezależnie od ustawień uwierzytelniania."
    },
