    {
      "revision": 1,
      "title": "Transport VTY — rozpoznanie",
      "skills": [
        "ccna.ssh.case-01",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.case-01.1.card",
      "front_md": "SSH jest aktywne i osiągalne, ale linie VTY mają transport input telnet.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Uruchomienie serwera SSH i dopuszczenie transportu VTY to osobne ustawienia.\n\n**Rozpoznanie:** VTY nie dopuszczają protokołu SSH.\n\n**Działanie:** Ustawić transport input ssh na obsługiwanym zakresie VTY.\n\n**Sprawdzenie:** Połączenie SSH trafia do logowania, a Telnet jest niedopuszczony.",
      "example": "VTY nie dopuszczają protokołu SSH."
    },
    {
      "revision": 1,
      "title": "Brak login local — rozpoznanie",
      "skills": [
        "ccna.ssh.case-02",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.case-02.1.card",
      "front_md": "Lokalny użytkownik istnieje, ale VTY używają login z hasłem linii zamiast lokalnej bazy; AAA nie jest włączone.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Bez AAA polecenie login local wybiera lokalną bazę kont.\n\n**Rozpoznanie:** Wybrano niewłaściwe źródło uwierzytelniania VTY.\n\n**Działanie:** Ustawić login local na właściwych liniach VTY.\n\n**Sprawdzenie:** Logowanie korzysta z lokalnej nazwy użytkownika i jej sekretu.",
      "example": "Wybrano niewłaściwe źródło uwierzytelniania VTY."
    },
    {
      "revision": 1,
      "title": "ACL zarządzania — rozpoznanie",
      "skills": [
        "ccna.ssh.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.case-03.1.card",
      "front_md": "Access-class VTY dopuszcza tylko 10.10.0.0/24. Administrator 10.20.0.5 ma routing, ale SSH jest odrzucane.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "ACL VTY ogranicza dostęp do sesji zarządzania według źródła.\n\n**Rozpoznanie:** Źródło administratora nie jest dozwolone w ACL VTY.\n\n**Działanie:** Dodać precyzyjny wyjątek dla uprawnionego hosta zgodnie z polityką.\n\n**Sprawdzenie:** SSH z 10.20.0.5 działa, a niedozwolone źródło nadal jest blokowane.",
      "example": "Źródło administratora nie jest dozwolone w ACL VTY."
    },
    {
      "revision": 1,
      "title": "Brak klucza serwera — rozpoznanie",
      "skills": [
        "ccna.ssh.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.case-04.1.card",
      "front_md": "Na nowym urządzeniu brak kluczy RSA, a show ip ssh wskazuje nieaktywny serwer; konfiguracja tej wersji wymaga kluczy RSA.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Klucz hosta jest elementem ustanowienia bezpiecznej sesji SSH.\n\n**Rozpoznanie:** Nie przygotowano kluczy hosta wymaganych przez serwer SSH.\n\n**Działanie:** Utworzyć klucze RSA po ustawieniu wymaganej nazwy hosta i domeny.\n\n**Sprawdzenie:** Show ip ssh potwierdza aktywny serwer SSHv2.",
      "example": "Nie przygotowano kluczy hosta wymaganych przez serwer SSH."
    },
    {
      "revision": 1,
      "title": "Niewłaściwy sekret — rozpoznanie",
      "skills": [
        "ccna.ssh.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.case-05.1.card",
      "front_md": "TCP i negocjacja SSH działają, lecz log wskazuje authentication failed dla istniejącego lokalnego konta.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Nie każdy błąd SSH jest błędem routingu lub TCP; etapy sesji trzeba rozdzielać.\n\n**Rozpoznanie:** Uwierzytelnienie konta nie powiodło się po zestawieniu transportu.\n\n**Działanie:** Zweryfikować nazwę konta i sekret, korzystając z bezpiecznego dostępu administracyjnego.\n\n**Sprawdzenie:** Poprawne dane tego konta umożliwiają logowanie przez SSH.",
      "example": "Uwierzytelnienie konta nie powiodło się po zestawieniu transportu."
    },
    {
      "revision": 1,
      "title": "Osiągalność management — rozpoznanie",
      "skills": [
        "ccna.ssh.case-06",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — SSH i dostęp administracyjny",
          "url": "https://www.cisco.com/c/en/us/support/docs/security-vpn/secure-shell-ssh/4145-ssh.html"
        }
      ],
      "id": "ccna.ssh.practice.case-06.1.card",
      "front_md": "SSH działa z sąsiedniego hosta. Zdalny host nie ma trasy do podsieci management.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Usługa zarządzania wymaga osiągalności IP niezależnie od ustawień uwierzytelniania.\n\n**Rozpoznanie:** Brak drogi routowanej do adresu zarządzania.\n\n**Działanie:** Przywrócić wymagany routing między siecią administratora a management.\n\n**Sprawdzenie:** Lookup i test TCP do portu SSH przechodzą z właściwego źródła.",
      "example": "Brak drogi routowanej do adresu zarządzania."
    }
  ],
