  "cards": [
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 1 — zależności",
      "skills": [
        "ccna.dhcp.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.compare-01.4.card",
      "front_md": "**Zgłoszenie I**\n\nSerwer DHCP jest za routerem. Klient wysyła Discover w LAN; na interfejsie LAN brak relay.\n\n**Zgłoszenie II**\n\nSerwer rejestruje Discover, ale wszystkie adresy właściwej puli są już wydzierżawione.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Broadcast klienta nie jest przekazywany do zdalnego serwera. Dodać ip helper-address właściwego serwera na interfejsie klienta.\n\n**Sprawdzenie I:** Serwer otrzymuje relayed Discover z adresem giaddr właściwego LAN.\n\n**Zgłoszenie II:** Brakuje wolnych adresów do zaoferowania. Zapewnić dodatkową poprawną przestrzeń adresową lub odzyskać rzeczywiście nieużywane dzierżawy.\n\n**Sprawdzenie II:** Serwer ma wolne adresy i przydziela nową dzierżawę.\n\n**Zależności:** Relay łączy broadcastowy segment klienta z serwerem w innej podsieci. Działający transport DHCP nie wystarcza, gdy pula jest wyczerpana.",
      "example": "I — Relay łączy broadcastowy segment klienta z serwerem w innej podsieci.\n\nII — Działający transport DHCP nie wystarcza, gdy pula jest wyczerpana."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 2 — zależności",
      "skills": [
        "ccna.dhcp.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.compare-02.4.card",
      "front_md": "**Zgłoszenie I**\n\nKlient dostał poprawny adres /24, lecz option 3 wskazuje nieistniejący router.\n\n**Zgłoszenie II**\n\nStatyczna drukarka .10 działa w puli .1–.100 bez wykluczenia lub rezerwacji. Serwer może przydzielić .10 klientowi.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Pula przekazuje błędną bramę domyślną. Poprawić default-router w puli i odnowić dzierżawę klienta.\n\n**Sprawdzenie I:** Odnowiona konfiguracja klienta wskazuje działającą bramę LAN.\n\n**Zgłoszenie II:** Adres statyczny nie jest chroniony przed dynamicznym przydziałem. Wykluczyć statyczny adres z dynamicznej puli i rozwiązać ewentualny konflikt.\n\n**Sprawdzenie II:** Nowe oferty nie zawierają .10, a drukarka zachowuje unikalny adres.\n\n**Zależności:** DHCP dostarcza również opcje; poprawny adres nie gwarantuje poprawnej bramy. Adresy infrastruktury należy uwzględnić przy projektowaniu zakresu DHCP.",
      "example": "I — DHCP dostarcza również opcje; poprawny adres nie gwarantuje poprawnej bramy.\n\nII — Adresy infrastruktury należy uwzględnić przy projektowaniu zakresu DHCP."
    },
    {
      "revision": 1,
      "title": "Dwa zgłoszenia 3 — zależności",
      "skills": [
        "ccna.dhcp.contrast",
        "practice.4"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.compare-03.4.card",
      "front_md": "**Zgłoszenie I**\n\nKlient ma poprawny IP i bramę; po IP dociera do serwera. DHCP przekazał nieczynny DNS.\n\n**Zgłoszenie II**\n\nRelay ustawia giaddr 10.20.0.1, ale serwer ma tylko pulę 10.10.0.0/24.\n\nOceń każde zgłoszenie oddzielnie. Która zasada najbezpośredniej wyjaśnia opisany mechanizm? Wybierz parę, w której **oba przypisania** są poprawne.",
      "back_md": "**Zgłoszenie I:** Błędna opcja DNS uniemożliwia rozwiązywanie nazw. Poprawić dns-server w puli i odnowić konfigurację klienta.\n\n**Sprawdzenie I:** Klient pyta właściwy resolver i rozwiązuje nazwę usługi.\n\n**Zgłoszenie II:** Serwer nie ma puli odpowiadającej sieci relay. Utworzyć właściwą pulę 10.20.0.0/24 z poprawnymi opcjami.\n\n**Sprawdzenie II:** Klient dostaje adres z 10.20.0.0/24, nie z sieci serwera.\n\n**Zależności:** Parametry DHCP trzeba sprawdzać oddzielnie: adres, maska, brama i DNS. Giaddr pozwala serwerowi wybrać pulę dla zdalnej podsieci klienta.",
      "example": "I — Parametry DHCP trzeba sprawdzać oddzielnie: adres, maska, brama i DNS.\n\nII — Giaddr pozwala serwerowi wybrać pulę dla zdalnej podsieci klienta."
    },
