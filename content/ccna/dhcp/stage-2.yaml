      "id": "ccna.dhcp.07",
      "revision": 1,
      "title": "Gdzie ip helper-address?",
      "skills": [
        "dhcp.relay-placement"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "4.6"
        }
      ],
      "difficulty": 2,
      "prompt_md": "Klienci są w VLAN 20 na SVI Vlan20. Serwer 10.0.0.10 jest za uplinkiem. Gdzie skonfigurować helper dla tych klientów?",
      "hints": [
        "Znajdź interfejs najbliżej broadcastowej domeny klientów."
      ],
      "explanation_md": "Helper umieszczasz na interfejsie L3 odbierającym broadcast klienta. Trasa do serwera i trasa powrotna także muszą działać.",
      "card_id": "ccna.dhcp.07.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Wyłącznie na interfejsie serwera Linux.",
          "feedback_md": "Router/switch L3 ma odebrać broadcast klientów i przekazać go dalej."
        },
        {
          "id": "B",
          "text_md": "Na dowolnym port-channel, niezależnie od klientów.",
          "feedback_md": "Interfejs musi odpowiadać sieci klientów."
        },
        {
          "id": "C",
          "text_md": "Na interfejsie Vlan20 od strony klientów.",
          "feedback_md": "To interfejs L3 przyjmujący ruch z tego segmentu."
        },
        {
          "id": "D",
          "text_md": "Wyłącznie w puli DHCP na kliencie.",
          "feedback_md": "Klient nie konfiguruje puli serwerowej."
        }
      ],
      "correct_option_id": "C"
    },
