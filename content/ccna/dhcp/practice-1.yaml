    {
      "revision": 1,
      "title": "Brak helpera — rozpoznanie",
      "skills": [
        "ccna.dhcp.case-01",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.case-01.1.card",
      "front_md": "Serwer DHCP jest za routerem. Klient wysyła Discover w LAN; na interfejsie LAN brak relay.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Relay łączy broadcastowy segment klienta z serwerem w innej podsieci.\n\n**Rozpoznanie:** Broadcast klienta nie jest przekazywany do zdalnego serwera.\n\n**Działanie:** Dodać ip helper-address właściwego serwera na interfejsie klienta.\n\n**Sprawdzenie:** Serwer otrzymuje relayed Discover z adresem giaddr właściwego LAN.",
      "example": "Broadcast klienta nie jest przekazywany do zdalnego serwera."
    },
    {
      "revision": 1,
      "title": "Wyczerpana pula — rozpoznanie",
      "skills": [
        "ccna.dhcp.case-02",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.case-02.1.card",
      "front_md": "Serwer rejestruje Discover, ale wszystkie adresy właściwej puli są już wydzierżawione.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Działający transport DHCP nie wystarcza, gdy pula jest wyczerpana.\n\n**Rozpoznanie:** Brakuje wolnych adresów do zaoferowania.\n\n**Działanie:** Zapewnić dodatkową poprawną przestrzeń adresową lub odzyskać rzeczywiście nieużywane dzierżawy.\n\n**Sprawdzenie:** Serwer ma wolne adresy i przydziela nową dzierżawę.",
      "example": "Brakuje wolnych adresów do zaoferowania."
    },
    {
      "revision": 1,
      "title": "Błędna brama DHCP — rozpoznanie",
      "skills": [
        "ccna.dhcp.case-03",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.case-03.1.card",
      "front_md": "Klient dostał poprawny adres /24, lecz option 3 wskazuje nieistniejący router.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "DHCP dostarcza również opcje; poprawny adres nie gwarantuje poprawnej bramy.\n\n**Rozpoznanie:** Pula przekazuje błędną bramę domyślną.\n\n**Działanie:** Poprawić default-router w puli i odnowić dzierżawę klienta.\n\n**Sprawdzenie:** Odnowiona konfiguracja klienta wskazuje działającą bramę LAN.",
      "example": "Pula przekazuje błędną bramę domyślną."
    },
    {
      "revision": 1,
      "title": "Adres infrastruktury — rozpoznanie",
      "skills": [
        "ccna.dhcp.case-04",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.case-04.1.card",
      "front_md": "Statyczna drukarka .10 działa w puli .1–.100 bez wykluczenia lub rezerwacji. Serwer może przydzielić .10 klientowi.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Adresy infrastruktury należy uwzględnić przy projektowaniu zakresu DHCP.\n\n**Rozpoznanie:** Adres statyczny nie jest chroniony przed dynamicznym przydziałem.\n\n**Działanie:** Wykluczyć statyczny adres z dynamicznej puli i rozwiązać ewentualny konflikt.\n\n**Sprawdzenie:** Nowe oferty nie zawierają .10, a drukarka zachowuje unikalny adres.",
      "example": "Adres statyczny nie jest chroniony przed dynamicznym przydziałem."
    },
    {
      "revision": 1,
      "title": "Niepoprawny DNS — rozpoznanie",
      "skills": [
        "ccna.dhcp.case-05",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.case-05.1.card",
      "front_md": "Klient ma poprawny IP i bramę; po IP dociera do serwera. DHCP przekazał nieczynny DNS.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Parametry DHCP trzeba sprawdzać oddzielnie: adres, maska, brama i DNS.\n\n**Rozpoznanie:** Błędna opcja DNS uniemożliwia rozwiązywanie nazw.\n\n**Działanie:** Poprawić dns-server w puli i odnowić konfigurację klienta.\n\n**Sprawdzenie:** Klient pyta właściwy resolver i rozwiązuje nazwę usługi.",
      "example": "Błędna opcja DNS uniemożliwia rozwiązywanie nazw."
    },
    {
      "revision": 1,
      "title": "Zła pula relay — rozpoznanie",
      "skills": [
        "ccna.dhcp.case-06",
        "practice.1"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "id": "ccna.dhcp.practice.case-06.1.card",
      "front_md": "Relay ustawia giaddr 10.20.0.1, ale serwer ma tylko pulę 10.10.0.0/24.\n\nKtóre rozpoznanie najlepiej wyjaśnia podane obserwacje?",
      "back_md": "Giaddr pozwala serwerowi wybrać pulę dla zdalnej podsieci klienta.\n\n**Rozpoznanie:** Serwer nie ma puli odpowiadającej sieci relay.\n\n**Działanie:** Utworzyć właściwą pulę 10.20.0.0/24 z poprawnymi opcjami.\n\n**Sprawdzenie:** Klient dostaje adres z 10.20.0.0/24, nie z sieci serwera.",
      "example": "Serwer nie ma puli odpowiadającej sieci relay."
    }
  ],
