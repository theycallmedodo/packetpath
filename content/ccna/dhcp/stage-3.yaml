      "difficulty": 3,
      "prompt_md": "Pula obejmuje 192.168.70.0/27. Wykluczono .1–.10. Poza tym nie ma rezerwacji, konfliktów ani zajętych dzierżaw. Ile adresów hostów pozostaje do przydziału?",
      "hints": [
        "Zakres .1–.10 zawiera dziesięć adresów."
      ],
      "explanation_md": "Dostępność puli licz z użytecznych adresów hostów, pomniejszonych o wykluczenia i inne zajęte pozycje.",
      "card_id": "ccna.dhcp.16.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "32",
          "feedback_md": "32 obejmuje także sieć i broadcast oraz nie uwzględnia wykluczeń."
        },
        {
          "id": "B",
          "text_md": "30",
          "feedback_md": "30 to hosty przed wykluczeniem dziesięciu adresów."
        },
        {
          "id": "C",
          "text_md": "20",
          "feedback_md": "30 adresów hostów minus 10 wykluczonych daje 20."
        },
        {
          "id": "D",
          "text_md": "22",
          "feedback_md": "22 odejmuje wykluczenia od wszystkich adresów, nie wykluczając sieci i broadcastu."
        }
      ],
      "correct_option_id": "C"
    },
