  "tasks": [
    {
      "id": "ccna.dhcp.13",
      "revision": 1,
      "title": "Dobór zakresu przez relay",
      "skills": [
        "dhcp.giaddr"
      ],
      "sources": [
        {
          "title": "Cisco — DHCP: klient, relay i pula",
          "url": "https://www.cisco.com/c/en/us/td/docs/routers/ios/config/17-x/ip-addressing/b-ip-addressing/m_config-dhcp-server-xe.html"
        }
      ],
      "blueprint_refs": [
        {
          "exam": "200-301",
          "version": "1.1",
          "objective": "4.6"
        }
      ],
      "difficulty": 3,
      "prompt_md": "Jakie pole klasycznego DHCPv4 relay pomaga serwerowi rozpoznać podsieć klientów?",
      "hints": [
        "Chodzi o adres bramki/pośrednika zawarty w komunikacie DHCP."
      ],
      "explanation_md": "Relay ustawia giaddr, co umożliwia serwerowi wybór właściwej puli. Opcja 82 może dostarczać dodatkowy kontekst.",
      "card_id": "ccna.dhcp.13.theory",
      "type": "single_choice",
      "options": [
        {
          "id": "A",
          "text_md": "Pole router ID OSPF.",
          "feedback_md": "OSPF router ID nie wybiera puli DHCP."
        },
        {
          "id": "B",
          "text_md": "Tag native VLAN przenoszony przez cały Internet.",
          "feedback_md": "Tag L2 nie jest uniwersalnym identyfikatorem zakresu po routingu."
        },
        {
          "id": "C",
          "text_md": "Port docelowy TCP 67.",
          "feedback_md": "DHCPv4 korzysta z UDP, a sam port nie rozróżnia podsieci."
        },
        {
          "id": "D",
          "text_md": "Pole giaddr zawierające adres relay w sieci klienta.",
          "feedback_md": "Giaddr jest podstawową informacją o sieci relay dla wyboru zakresu."
        }
      ],
      "correct_option_id": "D"
    },
    {
