      "difficulty": 3,
      "prompt_md": "Router jest już serwerem DHCP z aktywnym interfejsem 192.168.50.1/24. Wyklucz .1–.20, utwórz pulę LAN50, ustaw sieć /24 i bramę .1. Uzupełnij końcówkę wykluczenia, sieć i bramę.",
      "hints": [
        "Pilnuj trybów config i dhcp-config."
      ],
      "explanation_md": "Wykluczenia są globalne, a network i default-router należą do konfiguracji puli. Brama musi odpowiadać rzeczywistemu interfejsowi.",
      "card_id": "ccna.dhcp.14.theory",
      "type": "cli_fill_blank",
      "platform": "Cisco IOS / IOS XE — składnia wskazana w zadaniu",
      "template": "R1(config)# ip dhcp excluded-address 192.168.50.1 {{excluded_end}}\nR1(config)# ip dhcp pool LAN50\nR1(dhcp-config)# network {{network}} 255.255.255.0\nR1(dhcp-config)# default-router {{gateway}}",
      "blanks": [
        {
          "id": "excluded_end",
          "label": "Ostatni wykluczony adres",
          "answer_type": "ipv4",
          "accepted": [
            "192.168.50.20"
          ],
          "width": 16,
          "common_errors": {}
        },
        {
          "id": "network",
          "label": "Sieć LAN",
          "answer_type": "ipv4",
          "accepted": [
            "192.168.50.0"
          ],
          "width": 15,
          "common_errors": {}
        },
        {
          "id": "gateway",
          "label": "Brama",
          "answer_type": "ipv4",
          "accepted": [
            "192.168.50.1"
          ],
          "width": 15,
          "common_errors": {}
        }
      ]
    },
